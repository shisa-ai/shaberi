    "original": "以下の文章をもとに問いに答えなさい。\n### 文章\n第一条の二　厚生労働大臣は、法第八条の二第二項及び第四項の規定に基いて中央労働委員会の使用者を代表する特別調整委員又は労働者を代表する特別調整委員を任命しようとするときは、二以上の都道府県にわたつて組織を有する使用者団体又は労働組合に対して候補者の推薦を求め、その推薦があつた者の中から任命するものとする。\n②　厚生労働大臣は、法第八条の二第二項及び第四項の規定に基づき中央労働委員会の公益を代表する特別調整委員を任命しようとするときは、法第八条の三に規定する一般企業担当使用者委員及び一般企業担当労働者委員に、その任命しようとする特別調整委員の候補者の名簿を提示して同意を求め、その同意があつた者のうちから任命するものとする。\n(昭二七政三二三・追加、昭六三政二六三・平一二政三〇九・一部改正)\n第一条の三　中央労働委員会の特別調整委員の任期は、一年(厚生労働大臣が中央労働委員会の同意を得て、特別調整委員の全部又は一部について、一年に満たない期間を定めたときは、その特別調整委員についてはその期間)とする。但し、補欠の特別調整委員は、前任者の残任期間在任する。\n②　厚生労働大臣は、中央労働委員会の特別調整委員が心身の故障のために職務の執行ができないと認めたとき、又は特別調整委員に職務上の義務違反その他特別調整委員たるに適しない非行があると認めたときは、中央労働委員会の同意を得て、その特別調整委員を罷免することができる。\n(昭二七政三二三・追加、平一二政三〇九・一部改正)\n第一条の四　中央労働委員会の特別調整委員は、中央労働委員会の同意を得て中央労働委員会の会議(労働組合法(昭和二十四年法律第百七十四号)第二十四条第一項本文の規定により労働委員会の公益委員のみがその処理に参与すべき事件に関するものを除く。)において、意見を述べることができる。\n(昭二七政三二三・追加、昭六三政二六三・平一六政三七三・一部改正)\n第一条の五　法第八条の二第五項の規定により中央労働委員会の特別調整委員が弁償を受ける費用の種類及び金額は、一般職の職員の給与に関する法律(昭和二十五年法律第九十五号)第六条第一項第一号イに規定する行政職俸給表(一)(以下「行政職俸給表(一)」という。)の十級の職務にある者が国家公務員等の旅費に関する法律(昭和二十五年法律第百十四号。以下「旅費法」という。)の規定に基づいて受ける旅費の種類及び金額と同一とする。\n②　前項に定めるもののほか、同項の費用の支給については、旅費法の定めるところによる。\n### 問い\n中央労働委員会の特別調整委員が中央労働委員会の会議において、意見を述べることができないのはどのような規定で定められている事件の場合ですか",
    "translation_en": "According to Article 1, Paragraph 4, the Special Adjustment Commissioners of the Central Labor Commission may express their opinions at the meetings of the Central Labor Commission (with the consent of the Central Labor Commission) except in cases where, under Article 24, Paragraph 1, of the Labor Union Act (Act No. 174 of 1949), only the Public Interest Commissioners of the Labor Commission are to participate in the handling of the matter.  \n\n(Translation of the relevant portion for clarity in answering the question)  \n\n**Answer:**  \nThe Special Adjustment Commissioners of the Central Labor Commission are not permitted to express their opinions at the meetings of the Central Labor Commission in cases where, under Article 24, Paragraph 1, of the Labor Union Act, only the Public Interest Commissioners of the Labor Commission are to participate in the handling of the matter."
