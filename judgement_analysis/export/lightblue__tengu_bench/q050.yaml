    "original": "満月から次の満月まで ２９．５３日かかるものとします。ある【うるう年】の ９月３０日が満月であるとき、次の満月を１回目として、１００回目の満月となるのは何年後の何月何日ですか。ただし、【うるう年】は４年に１度、必ずあるものとします。",
    "translation_en": "**[Purpose: Question]**  \n\nAssume it takes 29.53 days from one full moon to the next. If September 30th of a leap year is a full moon, when will the 100th full moon from that date occur (counting the next full moon as the 1st)? Assume that a leap year occurs every 4 years without exception.  \n\n**What year and date will the 100th full moon fall on?**  \n\n*(Note: The translation preserves the original meaning, including the assumption about leap years and the counting method for full moons.)*"
  },
  "answer": {
    "gold_original": "満月から次の満月までに29.53日かかるので100回目の満月は29.53日 * 100 = 2953日後となります。今1年を常に365日とすると100回目の満月は2953 / 365 = 8 ... 33 であることから8年と33日後であることがわかります。今うるう年の9月30日の次の満月から数えて100回目の満月の日にちを知りたいため先に求めた8年の間に2回うるう年が含まれることがわかります。そのため、今回の場合8年と33日後ではなく、33 - 2 = 31 であることより8年と31日後に100回目の満月を迎えます。9月が30日までであること、10月が31日までであることを加味すると9月30日から8年と31日後は8年後の10月31日であるとわかります。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nSince it takes 29.53 days from one full moon to the next, the 100th full moon will occur 29.53 days * 100 = 2953 days later. Assuming a year is always 365 days, the 100th full moon will be 2953 / 365 = 8…33, meaning 8 years and 33 days later. However, since we are counting from the next full moon after September 30th of a leap year, there will be two leap years within those 8 years. Therefore, instead of 8 years and 33 days, it will be 8 years and 31 days later (33 - 2 = 31). Considering that September has 30 days and October has 31 days, 8 years and 31 days after September 30th will be October 31st, 8 years later.  \n\n*(Note: The translation preserves the original meaning and details while ensuring natural English phrasing for evaluation documentation.)*"
  },
