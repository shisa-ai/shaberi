      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "迷惑系YouTuber（めいわくけいユーチューバー）と呼ばれる配信者が行う企画は、主に**「炎上商法（批判を集めて再生数を稼ぐ）」**を目的としており、法に触れるものから、マナーやモラルを著しく欠くものまで多岐にわたります。\n\nこれらは社会問題化しており、実際に逮捕者が出たり、損害賠償請求に発展したりするケースも多いです。主なカテゴリーと具体的な企画例は以下の通りです。\n\n### 1. 犯罪・法令違反系\nこれらは明確に法律に違反する行為を撮影し、投稿するものです。\n\n*   **会計前の商品を食べる:** スーパーマーケットなどで、会計前の刺身やパンなどを店内で開封して食べる。\n*   **不法侵入:** 立ち入り禁止の工事現場、廃墟、他人の私有地、学校、線路内などに無断で侵入する。\n*   **窃盗・万引き:** 店舗の商品や他人の所有物を盗む様子を撮影する（あるいは盗んだふりをする）。\n*   **無賃乗車:** 電車やバスなどの公共交通機関で不正乗車を行う。\n\n### 2. 公共の場での妨害・騒音系\n多くの人が利用する場所で秩序を乱し、注目を集めようとする企画です。\n\n*   **大音量・奇声:** 図書館、電車内、静かな店舗などで突然大声を出したり、大音量で音楽を流したりする。\n*   **通行妨害:** 繁華街のスクランブル交差点にベッドを持ち込んで寝る、道路を封鎖する、駅のホームで通行人の邪魔をする。\n*   **レジ遅延:** コンビニのレジで小銭を大量に出したり、理不尽なクレームをつけて業務を妨害する（威力業務妨害）。\n\n### 3. 衛生テロ（バイトテロの客版）\n飲食店や小売店での不衛生な行為を行い、店側に多大な損害を与えるものです。\n\n*   **食器・調味料へのいたずら:** 回転寿司店などで、共用の醤油差しの注ぎ口を舐める、未使用の湯呑みを舐めて戻す。\n*   **商品への異物混入:** 陳列されている商品にいたずらをする、指でつつくなど。\n\n### 4. 私人逮捕・自警団系（世直し系）\n近年増加したジャンルで、「正義の執行」を名目にターゲットを追い回したり拘束したりする企画です。これらも行き過ぎた行為により、配信者自身が逮捕されるケースが増えています。\n\n*   **痴漢・盗撮犯の確保:** 駅などで不審な人物を「痴漢だ」と決めつけて取り押さえる。\n*   **転売ヤーへの突撃:** 人気商品の発売日に並んでいる転売屋と思われる人物に詰め寄り、恫喝したり妨害したりする。\n*   **覚醒剤所持疑惑者への突撃:** 薬物の売買現場と思われる場所に突撃し、相手を追い回す。\n    *   *問題点:* 証拠がない状態での拘束（監禁罪）、動画公開による名誉毀損、暴力行為などが問題視されています。\n\n### 5. 対人トラブル・嫌がらせ（凸系）\n特定の個人や有名人、あるいは無関係な一般人に絡む企画です。\n\n*   **有名人への突撃:** 芸能人や他のYouTuberの自宅や実家に押しかける、街中で執拗につきまとう。\n*   **一般人へのドッキリ:** 街中で突然人にぶつかる、偽の血糊を使って驚かせる、喧嘩を売るふりをする。\n*   **誹謗中傷・暴露:** 特定の人物や店舗に対する根拠のない悪口や、プライバシーを侵害する情報を拡散する。\n\n### 6. 虚偽・フェイク系\n実際には起きていないことを「起きた」として報告し、心配や注目を集めるものです。\n\n*   **虚偽の被害報告:** 「暴行を受けた」「病気になった」と嘘をつく。\n*   **警察への虚偽通報:** 動画のネタのために嘘の通報をして警察を出動させる（偽計業務妨害）。\n\n### 背景にある心理と仕組み\nこれらの企画が行われる主な理由は、YouTubeのアルゴリズムと収益化の仕組みにあります。\n*   **過激なサムネイルとタイトル:** 人はショッキングなものをついクリックしてしまう傾向があります。\n*   **コメント欄の荒れ:** 批判的なコメントが殺到しても、YouTube側は「エンゲージメント（反応）が高い動画」と判断し、さらにおすすめに表示してしまうことがあります（現在は規制が強化されています）。\n*   **知名度の獲得:** 悪名であっても知名度を上げ、その後別のビジネスや活動に繋げようとするケースもあります。\n\n現在、YouTube側も規約（コミュニティガイドライン）を厳格化しており、こうした「有害または危険なコンテンツ」は削除やアカウント停止（BAN）の対象となりますが、プラットフォームを変えたりアカウントを作り直したりして活動を続ける配信者も存在します。",
