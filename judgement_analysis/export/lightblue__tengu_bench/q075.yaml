    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "個人で自作イラストのTシャツを販売する場合、**「安売りして消耗しないこと」**と**「ファンが納得する価値の提供」**のバランスが最も重要です。\n\n以下に、具体的な値段設定のロジックと、販売形態（在庫を持つか、受注生産か）に応じた計算モデルを提示します。\n\n---\n\n### 1. 値段設定の基本公式\n\nまず、以下の要素を明確にする必要があります。\n\n$$販売価格 = (原価 + 諸経費) + 利益$$\n\n*   **原価:** Tシャツボディ代、プリント代\n*   **諸経費:** ECサイト手数料、決済手数料、梱包資材、送料（送料込みにする場合）、作業人件費\n*   **利益:** あなたの手元に残したい金額（ブランド価値）\n\n### 2. 市場の相場観（ベンチマーク）\n\n価格を決める前に、購入者が無意識に持っている「相場」を理解します。\n\n*   **ファストファッション（ユニクロUTなど）:** 1,500円〜1,990円\n    *   *ここには絶対に勝てないので、比較対象にしてはいけません。*\n*   **個人クリエイター（SUZURI、BOOTHなど）:** 2,500円〜4,500円\n    *   *ここが主戦場です。*\n*   **ストリートブランド・アパレルブランド:** 5,000円〜8,000円以上\n    *   *生地の質やブランド力（イラストの作家性）が高ければここを目指せます。*\n\n---\n\n### 3. 具体的な価格設定シミュレーション\n\n販売形態によって原価構造が全く異なるため、2つのパターンで考えます。\n\n#### パターンA：在庫リスクなし（SUZURI、pixivFACTORYなどのオンデマンド販売）\n\n注文が入ってから業者がプリント・発送する形式です。\n*   **メリット:** 在庫リスクゼロ、発送の手間なし。\n*   **デメリット:** 原価（ボディ＋プリント代）が高い。\n\n**【計算例】**\n*   **原価（業者設定）:** 約2,500円〜3,000円（ボディの質による）\n*   **目標利益:** 1枚あたり500円〜1,000円欲しいとする\n\n**推奨価格設定:** **3,500円 〜 4,200円**\n\n> **根拠:**\n> 原価がすでに高いため、安くしようとすると利益が数百円（ジュース2本分）になってしまいます。これではモチベーションが続きません。\n> 「イラスト作品としての価値」を重視し、**利益を最低でも800円〜1,000円乗せる**べきです。ファンは「Tシャツという布」ではなく「あなたのイラスト」にお金を払うため、相場より多少高くても購入します。\n\n---\n\n#### パターンB：在庫あり（印刷業者に発注し、BASE/STORES等で自分で発送）\n\n自分で業者に発注し、在庫を抱えて発送する形式です。\n*   **メリット:** 原価を安く抑えられる、梱包でブランディングできる、利益率が高い。\n*   **デメリット:** 在庫リスク、発送の手間、手数料計算が複雑。\n\n**【計算例】**\n*   **原価:** 1,500円（20枚程度まとめて発注した場合のボディ＋プリント代）\n*   **諸経費:**\n    *   EC手数料（約6%と仮定）: 販売価格の6%\n    *   梱包資材（OPP袋、封筒、サンキューカード）: 約100円\n    *   作業人件費（梱包・発送にかかる時間）: プライスレスだが意識する\n\n**推奨価格設定:** **3,800円 〜 4,500円**\n\n> **根拠（3,800円で販売した場合）:**\n> *   売上: 3,800円\n> *   手数料(6%): -228円\n> *   原価: -1,500円\n> *   梱包費: -100円\n> *   **粗利益: 約1,972円（利益率 約51%）**\n\nこのパターンでは、**利益率50%前後**を目指すのが健全です。なぜなら、売れ残った在庫のリスクヘッジ（損失補填）が必要だからです。\n\n---\n\n### 4. 最終的な価格決定へのアドバイス\n\n上記の計算を踏まえ、以下の戦略を取り入れて最終価格を決定してください。\n\n#### ① 松竹梅の法則（アンカリング効果）\nTシャツのボディ（生地）の質を変えて2パターン用意することをお勧めします。\n\n*   **スタンダード（普通の生地）:** 3,500円\n*   **プレミアム（ヘビーウェイト・厚手）:** 4,500円\n\nこうすると、多くの人は「せっかく好きなイラストなら、長く着たいから良い生地の方にしよう」と4,500円の方を選びやすくなります。また、4,500円を見せることで3,500円が安く感じられます。\n\n#### ② 送料の心理的ハードル\n*   **「送料別 3,500円（送料500円）」** = 合計4,000円\n*   **「送料無料 4,000円」**\n\n心理的には後者の方が購入されやすい傾向にあります。特に自社発送（パターンB）の場合は、送料を価格に転嫁して「送料無料」と謳うのも有効な戦略です。\n\n#### ③ 端数価格（心理的価格設定）\n*   4,000円 よりも **3,900円** や **3,980円**\n*   4,500円 よりも **4,400円**\n\n桁が変わるギリギリ手前の価格設定は、割安感を与えます。\n\n### 結論：いくらにすべきか？\n\nあなたのイラストレーターとしての知名度や活動歴にもよりますが、スタートアップとしての推奨は以下の通りです。\n\n**【推奨プライス】**\n**3,800円 〜 4,200円（税込）**\n\n**【その根拠】**\n1.  **利益確保:** 1枚売れた時に、最低でも1,000円以上の利益が出ないと、次の作品制作や活動資金に回せないため。\n2.  **ブランド保護:** 安すぎる価格（2,000円台）は、「安っぽいイラスト」という印象を与え、将来的に値上げしにくくなるため。\n3.  **持続可能性:** ECサイトの手数料や、見えないコスト（梱包作業、宣伝にかかる時間）をカバーするためには、この価格帯が最低ラインであるため。\n\n自信を持って、**「作品としての価格」**をつけてください。",
