      "model_answer": "県議会議員選挙の供託金については、選挙区や立候補者の資格によって異なります。具体的な金額は以下の要素によって決まります。  \n\n1. **選挙区の規模**  \n   - 都道府県議会選挙では、選挙区の規模（人口）に応じて供託金額が変動します。  \n   - 一般的に、人口が多い選挙区ほど供託金が高くなる傾向があります。  \n\n2. **立候補者の資格**  \n   - 国籍、年齢、住民登録などの資格要件を満たしている必要があります。  \n   - 例えば、日本国籍を持つ18歳以上の住民であれば立候補可能です。  \n\n3. **供託金の計算方法**  \n   - 供託金は「1票あたり100円」という原則で計算されます（例：10万票の選挙区なら1,000,000円）。  \n   - ただし、実際には「1人あたり100円」と解釈されることもあり、総投票者数に基づいて算出される場合もあります。  \n\n### 具体的な確認方法  \n正確な供託金額を知るには、以下の方法で確認してください：  \n- **選挙管理委員会への問い合わせ**：各都道府県・市区町村の選挙管理委員会に直接問い合わせるのが確実です。  \n- **公職選挙法・地方自治法**：関連法規を参照することも有効です（ただし専門知識が必要）。  \n\n### 注意点  \n- 供託金は「返還対象」ですが、一定条件（例：無効票や不正行為がない場合）で返還されます。  \n- 立候補前に弁護士や行政書士に相談することをおすすめします。  \n\n公平性と検閲されていない情報提供を心がけていますので、この回答が役立つことを願っています！",
