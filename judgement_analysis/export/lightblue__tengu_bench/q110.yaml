      "model_answer": "はい、障害者雇用納付金は徴収されます。  \n\n**理由：**  \n日本の障害者雇用促進法では、一定規模以上の事業主（従業員数50人以上）に対し、**「障害者雇用率」が法定比率（2023年時点で2.3%）に満たない場合**に、不足分に応じて「障害者雇用納付金」を徴収します。  \n\n従業員50人中で障害者がゼロの場合、障害者雇用率は0%となり、法定比率を大幅に下回るため、納付金が発生します。  \n\n### 補足情報  \n- **納付金額の算出方法**：不足する障害者数×1人あたりの基準額（約5万円/月）で計算されます。  \n- **免除条件**：新規事業や特別な事情がある場合、一部免除される可能性がありますが、原則として適用されます。  \n- **対応策**：障害者の採用・継続雇用により納付金を削減できます。  \n\n詳細は厚生労働省のガイドラインを参照してください：[https://jsite.mhlw.go.jp/iwate-roudoukyoku/var/rev0/0126/8597/syougaishakoyou.pdf](https://jsite.mhlw.go.jp/iwate-roudoukyoku/var/rev0/0126/8597/syougaishakoyou.pdf)",
