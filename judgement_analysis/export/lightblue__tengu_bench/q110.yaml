      "model_answer": "結論から申し上げますと、従業員数が50人の場合、障害者雇用納付金は**徴収されません**。\n\n理由は以下の通りですが、**「納付金は不要だが、雇用義務はある」**という点に注意が必要です。\n\n### 1. なぜ徴収されないのか（納付金の対象範囲）\n障害者雇用納付金の申告・納付義務があるのは、**「常時雇用している労働者数が100人を超える事業主」**です。\n従業員数が50人の場合はこの基準を下回っているため、たとえ障害者を一人も雇用していなくても、納付金を支払う必要はありません。\n\n### 2. ただし「雇用の義務」はあります\nお金（納付金）を取られないからといって、障害者を雇わなくて良いわけではありません。\n\n2024年（令和6年）4月から、障害者の法定雇用率が**2.5%**に引き上げられました。これにより、障害者を1人以上雇用しなければならない企業の範囲が、従業員「43.5人以上」から**「40.0人以上」**に拡大されました。\n\nあなたの会社は従業員が50人ですので、計算上は以下のようになります。\n*   $50人 \\times 2.5\\% = 1.25人$\n*   （1人未満は切り捨てですが、1以上の端数はどうあれ「1人」の雇用義務が発生します）\n\nつまり、**「法律上は1人以上の障害者を雇う義務がある状態だが、雇っていなくても罰金的な納付金は取られないサイズ」**という位置づけになります。\n\n### まとめ\n*   **納付金：** 払う必要はありません（対象は101人以上のため）。\n*   **法律上の義務：** 違反している状態です（対象は40人以上のため）。\n\n現状では金銭的なペナルティはありませんが、ハローワークからの指導対象になる可能性はありますので、今後の採用計画において留意しておくことをお勧めします。",
