    "gold_original": "2023年4月時点の情報によると、東京証券取引所（東証）は、以下の市場区分に再編されています。\n\n1. **プライム市場**\n    - 大企業を対象とし、国内外の投資家から高い評価を受けている企業が上場しています。東証1部市場に相当する企業が多く、グローバルに活躍するような企業や、業界をリードするような企業が多いです。\n\n2. **スタンダード市場**\n    - 中堅・中小企業を中心とした市場で、成長を続けている企業が多数上場しています。東証2部とマザーズ（成長企業向け市場）の一部企業が該当すると考えられます。\n\n3. **グロース市場**\n    - 成長性を持つ企業向けの市場で、革新的な技術やビジネスモデルを持つ企業が上場を目指します。以前の「マザーズ」市場に相当する部分がこの区分になります。\n\nこの再編は、2022年4月4日に行われ、東証は国内外の投資家からの信頼性向上と市場機能の強化を目的としています。再編後、各市場は上場基準が異なり、特にプライム市場に上場するにはより厳しい基準が設けられています。各市場への移行や上場にあたっては、企業の規模、財務健全性、成長性などが評価されます。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nAccording to information as of April 2023, the Tokyo Stock Exchange (TSE) has reorganized its market divisions as follows:  \n\n1. **Prime Market**  \n   - Targets large corporations with high evaluations from domestic and international investors. Many companies equivalent to the former TSE First Section (1部) are listed here, including globally active and industry-leading firms.  \n\n2. **Standard Market**  \n   - Focuses on mid-sized and smaller companies, with many growing businesses listed. It is believed to include some companies previously in the TSE Second Section (2部) and the Mothers (growth-oriented market).  \n\n3. **Growth Market**  \n   - Designed for high-growth companies, aiming to list firms with innovative technologies or business models. This division corresponds to a portion of the former \"Mothers\" market.  \n\nThis reorganization, implemented on April 4, 2022, aims to enhance the TSE’s credibility with investors and strengthen market functionality. After the reorganization, each market has different listing standards, with the Prime Market requiring particularly stringent criteria. When transitioning or listing in each market, a company’s size, financial health, and growth potential are evaluated."
  },
