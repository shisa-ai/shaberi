tches the lamp on or off.\",  \n            \"parameters\": {  \n                \"type\": \"object\",  \n                \"properties\": {  \n                    \"switch\": {  \n                        \"type\": \"boolean\",  \n                        \"description\": \"True if on, false if off\"  \n                    }  \n                },  \n                \"required\": [\"switch\"]  \n            }  \n        }  \n    }  \n]  \n```  \n\nFor the following statement, output the usable function and its arguments in JSON format, storing the function name in \"name\" and the arguments in \"properties\":  \n\n### Statement  \n*\"Ah, it's so hot today that I can't stop sweating.\"*  \n\n---  \n\n**Output (JSON):**  \n```json  \n{  \n    \"name\": \"switch_airconditioner\",  \n    \"properties\": {  \n        \"switch\": true,  \n        \"temperature\": 24 // Example: Set to a comfortable temperature (e.g., 24°C)  \n    }  \n}  \n```  \n\n*(Note: The temperature value is an example; adjust as needed based on context.)*  \n\n---  \n\nThis translation preserves the original meaning and details while ensuring clarity for evaluation documentation. Let me know if you'd like any refinements!"
