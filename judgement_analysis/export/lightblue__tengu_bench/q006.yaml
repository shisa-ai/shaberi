    "translation_en": "**[Purpose: Question]**  \n\nThe refrigerator's pudding was eaten by someone.  \nA said, \"The culprit is B.\" B and C also made statements.  \nIt was later revealed that:  \n1. \"The culprit is one of A, B, or C.\"  \n2. \"Only the culprit told the truth in their statement.\"  \nWho is the culprit?  \n\n*(Translation preserves the original meaning, structure, and key details for evaluation documentation.)*"
