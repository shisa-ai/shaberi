      "model_file": "shisa-ai__shisa-v2-llama3.1-405b.json",
      "model_answer": "100名規模の対面型AI講演会の費用試算は、以下の項目に分けて詳細に見積もる必要があります。目安として、**総額約50万円～200万円**（内容によって大幅に変動）の範囲が考えられます。  \n\n---\n\n### **1. 会場費用**  \n- **ホテル・会議室**: 5時間で5万円～20万円（都市部/地方差あり）  \n- **大学・公共施設**: 無料～数万円（利用規定による）  \n- **オンライン併用**: Zoomライセンス（月額約2,000円）  \n\n---\n\n### **2. 講師・人件費**  \n- **専門家講師**: 1日10万円～50万円（経験/需要による）  \n- **司会者・アシスタント**: 3万～10万円（必要に応じて）  \n\n---\n\n### **3. 機材・設備レンタル**  \n- プロジェクター・マイク: 5,000円～3万円/日  \n- Wi-Fi環境: 会場提供か別途契約（1日1万～）  \n\n---\n\n### **4. 広報・集客費用**  \n- SNS広告: 3,000円～10万円（ターゲット層による）  \n- チラシ印刷: 5,000円～2万円（デザイン別途）  \n\n---\n\n### **5. 参加者向けサービス**  \n- 資料印刷: 1部500円×100部 = 5万円  \n- 軽食・飲み物: 人あたり500円×100人 = 5万円  \n\n---\n\n### **6. その他経費**  \n- 保険加入: 万が一の事故に備え1万～3万  \n- 事務手数料: 主催団体の負担分  \n\n---\n\n### **コスト削減策の例**  \n✔ 無料会場利用（大学など協力要請）で20万削減。  \n✔ オンライン併用で参加者増やし単価下げ。  \n\n---\n\n### **まとめ：予算シナリオ例**  \n| 項目 | 安価版 | 標準版 | 高級版 | \n|------|--------|--------|--------| \n| 会場 | 公共施設無料 | ホテル10万 | 高級ホテル30万 |\n| 講師 | 自社員0円 | 外部講師20万 | 著名人50万 |\n| 広報 | SNS無料広告 | SNS広告5万 | 印刷物15万 |\n| 合計 | 約15万 | 約60万 | 約150万 |\n\n必要に応じて項目を調整し、詳細な見積もりをご提案します。",
