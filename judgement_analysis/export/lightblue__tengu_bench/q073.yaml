    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "100名規模の対面での「人工知能（AI）に関する講演会」を開催する場合、そのグレード（会場の質、講師の知名度、運営の手厚さ）によって費用は大きく変動します。\n\nここでは、**「①節約プラン（市民講座・社内勉強会レベル）」**、**「②標準プラン（一般的なビジネスセミナー）」**、**「③ハイエンドプラン（著名人を招く豪華なイベント）」**の3つのパターンに分けて試算します。\n\n---\n\n### 費用の内訳項目と概算\n\nまず、どのような項目に費用がかかるか整理します。\n\n1.  **会場費:** 部屋代、備品（プロジェクター、マイク、スクリーン）\n2.  **講師謝礼:** 登壇料、交通費、宿泊費\n3.  **人件費:** 受付、誘導、司会、音響・照明スタッフ\n4.  **広告宣伝費:** 集客のための広告、チラシ作成\n5.  **制作・消耗品費:** レジュメ印刷、ネームプレート、看板\n6.  **飲食費:** 参加者への飲み物、懇親会費用（ある場合）\n7.  **通信費:** **※AI講演会で特に重要（デモ用ネット回線）**\n\n---\n\n### パターン別 試算表\n\n#### ① 節約プラン（予算重視・コミュニティベース）\n公共施設を利用し、講師は知人の有識者や社内リソース、運営はボランティアで行う場合。\n\n*   **会場費:** 10,000円〜30,000円（区民会館や公民館の会議室）\n*   **講師謝礼:** 0円〜30,000円（薄謝または交通費のみ）\n*   **人件費:** 0円（自社スタッフやボランティア）\n*   **広告宣伝費:** 0円（SNS、Peatix/Connpass等の無料枠、口コミ）\n*   **制作・消耗品:** 5,000円（資料はPDF配布、名札はシール等）\n*   **飲食費:** 0円（持ち込み推奨）\n*   **通信費:** 0円（会場の無料Wi-Fiまたはテザリング）\n\n**【合計目安】 約 1.5万円 〜 7万円**\n\n---\n\n#### ② 標準プラン（一般的なビジネスセミナー）\n貸会議室を利用し、専門家を招き、ある程度のホスピタリティを提供する標準的な形。\n\n*   **会場費:** 150,000円〜250,000円（TKPなどの貸会議室 3〜4時間＋備品）\n*   **講師謝礼:** 50,000円〜150,000円（大学准教授、実務家レベル）\n*   **人件費:** 50,000円〜100,000円（アルバイト2〜3名、または運営委託の一部）\n*   **広告宣伝費:** 50,000円〜100,000円（Web広告、チラシ印刷）\n*   **制作・消耗品:** 20,000円（資料印刷、吊り下げ名札、案内掲示）\n*   **飲食費:** 15,000円（ペットボトルのお茶配布 @150円×100本）\n*   **通信費:** 30,000円（安定した有線LANや専用Wi-Fiのオプション追加）\n\n**【合計目安】 約 35万円 〜 65万円**\n\n---\n\n#### ③ ハイエンドプラン（著名人招聘・ホテル開催）\nホテルの宴会場などを利用し、メディア露出のある著名人を招き、懇親会までセットにする場合。\n\n*   **会場費:** 400,000円〜800,000円（ホテル宴会場、高品質な音響・映像機材）\n*   **講師謝礼:** 300,000円〜1,000,000円以上（著名なAI研究者、有名企業のCEO、タレント）\n*   **人件費:** 200,000円〜（イベント会社への運営委託、プロ司会者、専門PA）\n*   **広告宣伝費:** 300,000円〜（プレスリリース配信、メディア掲載、デザイン外注）\n*   **制作・消耗品:** 100,000円（高品質なパンフレット、ノベルティ）\n*   **飲食費:** 500,000円〜（講演後の立食パーティー @5,000円×100名）\n*   **通信費:** 100,000円〜（専用回線工事など、絶対に落ちない環境）\n\n**【合計目安】 約 200万円 〜 300万円以上**\n\n---\n\n### AI講演会特有の注意点（隠れコスト）\n\nAIに関する講演会の場合、以下の点に追加費用がかかる、あるいはトラブルになりやすいため注意が必要です。\n\n1.  **インターネット環境（最重要）**\n    *   ChatGPTや画像生成AIなどの「リアルタイムデモ」を行う場合、会場の無料Wi-Fiでは100名が一斉に接続すると回線がパンクし、デモが失敗するリスクが高いです。\n    *   **対策:** 講師専用の有線LANポートの確保（追加料金）や、ポケットWi-Fiの持参、あるいはデモ動画の事前用意が必要です。\n\n2.  **講師の選定と謝礼の高騰**\n    *   現在、生成AIブームにより、話せる専門家の需要が供給を上回っています。実績のある講師は謝礼が高騰している傾向があります。予算を抑えるなら、「著名人」ではなく「現場の実務担当者」を狙うのが良いでしょう。\n\n3.  **電源の確保**\n    *   「ハンズオン形式（参加者もPCを開いて一緒に操作する）」の場合、100名分の電源タップを用意するのは設備的に困難または高額になります。座学形式にするか、PC持参だが充電は各自で済ませてもらうか、事前にアナウンスが必要です。\n\n### 結論\n\n*   **最低限で開催するなら：5万円前後**\n*   **恥ずかしくない標準的な開催なら：50万円前後**\n*   **豪華に行うなら：200万円以上**\n\nまずは「誰を講師に呼びたいか」と「会場のグレード（公共施設か民間か）」を決めると、予算の大枠が固まります。",
