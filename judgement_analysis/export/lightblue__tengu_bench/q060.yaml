    "original": "以下の文章をもとに問題に答えよ\n### 文章\n狂犬病（Rabies）とは\n狂犬病は世界中で年間5万人以上が死亡する人獣共通感染症です。発症するとほぼ100%死亡します。狂犬病はほとんど全ての哺乳動物から感染する可能性があります。感染症法では4類に分類されています。\nどうやってうつる\nウイルスは感染動物の唾液に含まれます。哺乳動物に咬まれたり、傷口、目や口の粘膜をなめられたりすることで神経系の細胞に感染します。動物は前足をなめるので、ウイルスの付いたツメで引っかかれても感染する可能性があります。\n症状\nウイルスが直接中枢神経を侵した場合、10日目あたりから、発熱、頭痛、全身倦怠や嘔吐などを起こします。一方、末梢の神経線維に感染した場合には、ウイルスは非常にゆっくりと脳へ向かうので、発症まで一般的に1カ月～3カ月程度の期間を要します。極めてまれに発症までに数年の年月を要することもあります。発症後は、ものを飲み込みづらくなり、液体を飲もうとすると筋肉がけいれんするため、水を恐れるようになります(恐水症)。また、風をおそれるようになる恐風症状も特徴的です。やがて昏睡状態となり、呼吸が麻痺し死亡します。\n治療\n哺乳動物に咬まれたときには、できるだけ早く病院を受診してください。\n同時に、狂犬病のおそれのある動物に咬まれたら、傷口を石鹸と水（できれば流水）でよく洗い、消毒液で消毒します。環境中では直ぐに感染力が弱まるウイルスです。粘膜から感染する可能性があるので、決して傷口を口で吸いださないでください。\n医師はWHOが定めた基準に沿ってワクチンの必要性を判断します。咬まれたときの状況、咬まれた後の処置の仕方などをできるだけ詳しく説明してください。ワクチン接種が必要と判断されたときには、医師の指示に従ってワクチンを接種してください。接種は複数回を受ける必要があります。\n感染後の潜伏期間に感染を特定する検査法はなく、症状が発現したときの確立された治療法もありません。\n日本でも、2006年に狂犬病の輸入感染例がありました。しかし、その前の発生例は1970年です。日本に狂犬病を診た医師はほとんどいないので、診断と治療が遅れる可能性があります。そのためにもワクチン接種は大切です。\n狂犬病の発生がない日本では、常備されているワクチンは限られています。接種対象者が予めワクチン接種が可能であることを病院に確認し、病院の指示に従って受診してください。\n### 問題\n狂犬病の進行がどのようなものか説明してください。",
    "translation_en": "### Explanation of Rabies Progression  \n\nRabies is a zoonotic disease that causes over 50,000 deaths worldwide each year. Once symptoms appear, the fatality rate is nearly 100%. The virus can infect almost all mammals and is classified as a Category 4 infectious disease under the Infectious Diseases Control Law.  \n\n**Transmission:**  \nThe rabies virus is present in the saliva of infected animals. It spreads to nerve cells through bites, scratches, or contact with mucous membranes (eyes, mouth) of mammals. Even scratches from contaminated claws (e.g., an animal licking its paws) can transmit the virus.  \n\n**Symptoms:**  \n- If the virus directly invades the central nervous system, symptoms (fever, headache, fatigue, vomiting) appear around 10 days later.  \n- If it infects peripheral nerves, the virus slowly travels to the brain, with an incubation period of 1–3 months (rarely years).  \n- After onset, difficulty swallowing and muscle spasms when drinking liquids (hydrophobia) develop.  \n- A characteristic symptom is aerophobia (fear of air drafts).  \n- The disease progresses to coma, respiratory paralysis, and death.  \n\n**Treatment:**  \n- Seek medical attention immediately after a mammal bite.  \n- Wash the wound thoroughly with soap and water (preferably running water) and disinfect.  \n- The virus loses infectivity quickly in the environment, but mucosal contact is possible—never suck the wound.  \n- Doctors assess vaccine need based on WHO guidelines, considering bite circumstances and wound care.  \n- Multiple vaccine doses are required if administered.  \n- No tests detect infection during the incubation period, and no effective treatment exists after symptoms appear.  \n\n**Japan-Specific Notes:**  \n- Japan has no endemic rabies, but imported cases (e.g., 2006) occur. The last prior case was in 1970.  \n- Few Japanese doctors have seen rabies, risking delayed diagnosis/treatment—vaccination is crucial.  \n- Limited vaccine stockpiles exist; confirm hospital availability before travel.  \n\n**Summary:** Rabies progresses from incubation (1–3 months) to neurological symptoms (hydrophobia, aerophobia) and fatal paralysis. Early vaccination after exposure is the only effective prevention."
  },
