          "judge_output": "[該当する評価項目とその簡潔な理由]\n- 具体的な企画名を示している:0点  \n  - 「過激な挑戦企画」「炎上商法」などは一般的なカテゴリ名であり、固有の企画名（例：「○○してみた」などのタイトル）までは示していない。\n- 具体的な企画内容を示している:2点  \n  - 「公共の場で大声で騒ぐ」「不適切な場所での露出」「偽のニュースやデマを流布」など、内容の具体例が挙げられている。\n- 迷惑な理由を示している:3点  \n  - 「視聴者を不快にさせる」「混乱や誤解を招く」「誹謗中傷」「差別的な内容」など、なぜ迷惑かを明確に説明している。\n- 複数の企画を紹介している:2点  \n  - 1〜6まで複数のタイプの企画を列挙している。\n- 自然な日本語である:1点  \n  - 文法的にも内容的にも自然で読みやすい日本語で書かれている。\n\n[計算式]\n0 + 2 + 3 + 2 + 1 = 8\n\n[点数]\n8\n\nFINAL SCORE: 8",
