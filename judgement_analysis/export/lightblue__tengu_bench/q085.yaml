      "model_answer": "東京証券取引所（東証）は、上場企業の規模や流動性などに応じて、以下の市場区分に分かれています。2023年4月の市場再編により、従来の「第一部」「第二部」「JASDAQ」などの区分が廃止され、新たな市場区分が導入されました。\n\n### **1. プライム市場（Prime Market）**  \n   - **概要**: 大型・優良企業向け。高い情報開示水準とコーポレートガバナンスが求められます。  \n   - **特徴**:  \n     - 流動性が高く、機関投資家の参加も多い。  \n     - 上場基準は厳格（時価総額400億円以上など）。  \n\n### **2. スタンダード市場（Standard Market）**  \n   - **概要**: 中小型・成長企業向け。プライム市場より緩やかな基準で上場可能。  \n   - **特徴**:  \n     - 成長性や個別株主向けの投資機会が多い。  \n     - 上場基準はプライムより緩い（時価総額100億円以上など）。  \n\n### **3. グロース市場（Growth Market）**  \n   - **概要**: スタートアップやベンチャー企業向け。成長性を重視し、柔軟な資金調達を支援。  \n   - **特徴**:  \n     - 上場基準は最も緩やか（時価総額10億円以上など）。  \n     - 投資リスクは高いものの、高成長株を見つけやすい。  \n\n---\n\n### **その他のポイント**  \n- 2023年の再編後、従来の上場企業は「プライム」「スタンダード」「グロース」のいずれかに移行しました。例えば、旧第一部の大半は「プライム」へ移行しています。  \n- 市場区分によって上場審査や情報開示義務が異なるため、投資判断には注意が必要です。\n\n詳細については東証公式サイトをご確認ください: [https://www.jpx.co.jp/](https://www.jpx.co.jp/)",
