      "model_answer": "迷惑系YouTuberの企画は、視聴者を不快にさせるような内容や手法を用いて注目を集めることが多いです。以下にその例を挙げますが、注意点として、これらの動画は倫理的に問題がある場合もあるため、視聴には注意が必要です。\n\n1. **過激な挑戦企画**  \n   - 危険な行為や社会規範を無視する挑戦（例：公共の場で大声で騒ぐ、不適切な場所での露出）  \n   - 視聴者からの反発を誘うような挑戦（例：SNSで炎上を誘う投稿）\n\n2. **嘘や虚偽の情報拡散**  \n   - 偽のニュースやデマを流布し、混乱や誤解を招く  \n   - 他人のプライベート情報を無断で公開\n\n3. **過度な誹謗中傷**  \n   - 特定個人やグループに対する攻撃的なコメントや動画投稿  \n   - 他者の著作権侵害を行い、炎上させる\n\n4. **不適切なコンテンツ**  \n   - 暴力的な表現や差別的な内容（例：人種差別、性差別）  \n   - 18禁コンテンツの配信\n\n5. **炎上商法**  \n   - 視聴者からの反発を利用して注目を集める（例：意図的に議論を煽る）\n\n6. **過剰な自己顕示**  \n   - 不必要に自己主張が強く、他者への配慮がない動画  \n\nこれらの企画は一部の視聴者から共感されることもありますが、大多数の人々からは批判を受ける可能性があります。倫理的な観点からも問題があるため、注意が必要です。",
