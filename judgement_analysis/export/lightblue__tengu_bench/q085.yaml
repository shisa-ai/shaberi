      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "東京証券取引所（東証）は、2022年4月4日に市場区分を再編しました。それまでの「市場第一部」「市場第二部」「マザーズ」「JASDAQ（スタンダード・グロース）」という4つの区分を廃止し、現在は以下の**3つの新しい市場区分**で運営されています。\n\nそれぞれの特徴と上場基準の概要について解説します。\n\n### 1. プライム市場 (Prime Market)\n**「グローバルな投資家との建設的な対話を中心に据えた企業向け」**\n\n*   **対象:** グローバルな投資家（海外機関投資家など）の投資対象になりうる規模と質を持つ企業。\n*   **特徴:** 日本を代表する大企業が多く集まる最上位の市場です。\n*   **主な基準:**\n    *   **流動性:** 流通株式時価総額が**100億円以上**、流通株式比率が**35%以上**であること。\n    *   **ガバナンス:** 独立社外取締役を3分の1以上選任することや、気候変動リスク（TCFDなど）の開示、英文開示の充実など、非常に高いレベルの企業統治が求められます。\n\n### 2. スタンダード市場 (Standard Market)\n**「公開された市場における投資対象として十分な流動性とガバナンス水準を備えた企業向け」**\n\n*   **対象:** 持続的な成長と中長期的な企業価値向上を目指す、標準的な企業。\n*   **特徴:** 国内の一般投資家が安心して投資できる、一定の規模と実績を持つ中堅企業が中心です。\n*   **主な基準:**\n    *   **流動性:** 流通株式時価総額が**10億円以上**、流通株式比率が**25%以上**であること。\n    *   **ガバナンス:** 一般的な上場企業としての基本的なガバナンス水準が求められます。\n\n### 3. グロース市場 (Growth Market)\n**「高い成長可能性を実現するための事業計画及びその進捗の適時・適切な開示が行われる企業向け」**\n\n*   **対象:** 実績はまだ少なくても、将来的な高い成長が期待される新興企業（スタートアップなど）。\n*   **特徴:** リスクは高いものの、大きなリターンが狙える可能性がある企業が集まります。赤字であっても高い成長ストーリーがあれば上場可能です。\n*   **主な基準:**\n    *   **流動性:** 流通株式時価総額が**5億円以上**、流通株式比率が**25%以上**であること。\n    *   **事業計画:** 高い成長可能性を示す事業計画の開示が重視されます。\n\n---\n\n### なぜ再編されたのか？（背景）\n\n以前の市場区分（一部、二部、マザーズ、JASDAQ）には、以下の問題点がありました。\n\n1.  **区分の曖昧さ:** 「市場第二部」と「JASDAQスタンダード」の違いが分かりにくいなど、投資家にとって各市場のコンセプトが不明確でした。\n2.  **一部上場の質の低下:** マザーズなどから市場第一部へ昇格する基準が、新規に第一部へ上場する基準よりも緩かったため、時価総額が小さく流動性の低い企業も「一部上場企業」として混在していました。\n3.  **企業価値向上の動機付け不足:** 一度最上位（一部）に入ってしまうと、そこから降格するリスクが低かったため、企業が持続的に成長しようとするモチベーションが働きにくい構造でした。\n\n今回の再編により、**「各市場のコンセプトを明確化」**し、**「上場企業の質（特にガバナンスと流動性）を向上」**させ、国内外の投資家から魅力的な市場にすることを目指しています。\n\n### 旧市場との大まかな対応関係\n\n*   **旧 東証一部** → 大半が**プライム**へ移行（一部はスタンダードへ）\n*   **旧 東証二部** → 主に**スタンダード**へ\n*   **旧 JASDAQスタンダード** → 主に**スタンダード**へ\n*   **旧 マザーズ** → 主に**グロース**へ\n*   **旧 JASDAQグロース** → 主に**グロース**へ",
