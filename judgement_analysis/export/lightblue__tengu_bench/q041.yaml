      "model_answer": "中高生向けの機械学習入門イベント企画、素晴らしいですね！150人規模とのこと、成功に向けて段階的に計画を立てていきましょう。以下に具体的なステップを洗い出します。\n\n---\n\n### **【フェーズ1：企画設計（2～3ヶ月前）】**\n1. **目的とターゲットの明確化**  \n   - 参加者のレベル（プログラミング未経験/初心者）を想定し、「機械学習の基礎理解」と「興味喚起」を主軸に。  \n   - 例：「AIの仕組みを体験し、未来への可能性を感じてもらう」  \n\n2. **コンテンツ設計**  \n   - **講義部分**（60分）：  \n     - 機械学習の定義・応用例（画像認識、推薦システムなど）。  \n     - 代表的な手法（教師あり/なし学習）の分かりやすい説明。  \n   - **ハンズオン**（90分）：  \n     - 簡単なモデル作成（例：ScratchやGoogle Teachable Machineを使った画像分類）。  \n     - Python環境が必要な場合は、事前準備が必要なため注意。  \n\n3. **スケジュール案作成**  \n   | 時間帯 | 内容 | 備考 |  \n   |--------|------|------|  \n   | 10:00-10:30 | 受付・オリエンテーション | 参加者アンケート配布 |  \n   | 10:30-11:30 | 講義「機械学習って何？」| 資料配布/動画活用可 |  \n   | 11:30-12:00 | 質疑応答・休憩時間| AI関連展示ブース設置推奨|  \n   | 12:00-13:30 | ハンズオンワークショップ| グループワーク形式でサポート体制確保|  \n\n4. **予算策定**  \n   - 会場費、講師謝礼、教材印刷費、PCレンタル費（必要なら）、懇親会費など。\n\n---\n\n### 【フェーズ2：準備段階（1～2ヶ月前）】\n5. **講師選定とコンテンツ作成**  \n   - 大学生や研究者など、若手講師が望ましい。専門用語を避けた平易な説明が必須。  \n\n6. **会場確保と設備準備**  \n   - プロジェクター・マイク・Wi-Fi環境必須。PC不足時は参加者持ち込みも検討。  \n\n7. **広報活動開始**  \n   - 学校へのポスター掲示・SNS宣伝・教育委員会への協力依頼。参加申し込みフォームはGoogle Forms等で簡素化。\n\n8. **ハンズオン教材のテスト実施**  \n   - 事前にスタッフで動作確認し、予想される質問リストを作成。\n\n---\n\n### 【フェーズ3：本番運営】 \n9. **当日役割分担** \n    ```mermaid\n    graph LR\n    A[受付] --> B[案内]\n    B --> C[講師サポート]\n    C --> D[質疑応答対応]\n    D --> E[ハンズオンサポート]\n    ```\n   \n10. **参加者アンケート分析** \n    - イベント後すぐにフィードバック収集し、今後の改善点に活用。\n\n---\n\n### 【追加提案】\n- AI関連企業からのスポンサー獲得で予算増額可能。\n- 成果発表会を開催し、一部作品を展示することでモチベーション向上。\n- 参加証明書発行は必須ではないが、高評価であれば検討。\n\nこの流れで進めれば、中高生にもわかりやすく楽しいイベントになるはずです！何か具体的な部分でさらに詳しく知りたいことがあればお知らせください。",
