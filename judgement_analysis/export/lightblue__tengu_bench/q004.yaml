    "original": "以下の表はあるクラスの生徒50人を対象に、50点満点の数学と英語のテストを行った。 下表は、得点の組合せに分けて人数を表したものである。行名は英語の点数を、列名は数学の点数を示している。\n数学と英語の少なくとも一方の得点が15点以下の生徒は、何人から何人の間と考えられるか。\n### 表\n[\n {\n  \"＼\": \"0-9\",\n  \"0-9\": 0,\n  \"10-19\": 1,\n  \"20-29\": 0,\n  \"30-39\": 0,\n  \"40-50\": 0\n },\n {\n  \"＼\": \"10-19\",\n  \"0-9\": 0,\n  \"10-19\": 1,\n  \"20-29\": 2,\n  \"30-39\": 3,\n  \"40-50\": 0\n },\n {\n  \"＼\": \"20-29\",\n  \"0-9\": 2,\n  \"10-19\": 1,\n  \"20-29\": 4,\n  \"30-39\": 6,\n  \"40-50\": 3\n },\n {\n  \"＼\": \"30-39\",\n  \"0-9\": 0,\n  \"10-19\": 2,\n  \"20-29\": 5,\n  \"30-39\": 8,\n  \"40-50\": 4\n },\n {\n  \"＼\": \"40-50\",\n  \"0-9\": 0,\n  \"10-19\": 0,\n  \"20-29\": 3,\n  \"30-39\": 3,\n  \"40-50\": 2\n }\n]",
    "translation_en": "**[Purpose: Question]**  \n\nThe following table shows the results of a 50-point math and English test administered to 50 students in a class. The table below categorizes the number of students by their combined scores. The row headers represent English scores, and the column headers represent math scores.  \n\n**How many students are estimated to have scored 15 or below in at least one of the subjects (math or English)?**  \n\n### Table  \n```json\n[  \n {  \n  \"＼\": \"0-9\",  \n  \"0-9\": 0,  \n  \"10-19\": 1,  \n  \"20-29\": 0,  \n  \"30-39\": 0,  \n  \"40-50\": 0  \n },  \n {  \n  \"＼\": \"10-19\",  \n  \"0-9\": 0,  \n  \"10-19\": 1,  \n  \"20-29\": 2,  \n  \"30-39\": 3,  \n  \"40-50\": 0  \n },  \n {  \n  \"＼\": \"20-29\",  \n  \"0-9\": 2,  \n  \"10-19\": 1,  \n  \"20-29\": 4,  \n  \"30-39\": 6,  \n  \"40-50\": 3  \n },  \n {  \n  \"＼\": \"30-39\",  \n  \"0-9\": 0,  \n  \"10-19\": 2,  \n  \"20-29\": 5,  \n  \"30-39\": 8,  \n  \"40-50\": 4  \n },  \n {  \n  \"＼\": \"40-50\",  \n  \"0-9\": 0,  \n  \"10-19\": 0,  \n  \"20-29\": 3,  \n  \"30-39\": 3,  \n  \"40-50\": 2  \n }  \n]  \n```  \n\n*(Note: The translation preserves the original structure and details of the table while ensuring clarity in English.)*"
