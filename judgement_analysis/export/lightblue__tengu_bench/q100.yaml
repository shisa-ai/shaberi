      "model_answer": "積の微分公式から部分積分の公式を導出する証明をTeX形式で記述します。\n\n### 証明\n\n$f(x)$ と $g(x)$ を微分可能な関数とします。\n\nまず、積の微分公式（ライプニッツ則）より、以下の等式が成り立ちます。\n\n$$\n\\frac{d}{dx} \\{ f(x)g(x) \\} = f'(x)g(x) + f(x)g'(x)\n$$\n\nこの式の右辺にある $f(x)g'(x)$ について整理するために、項を移項します。\n\n$$\nf(x)g'(x) = \\frac{d}{dx} \\{ f(x)g(x) \\} - f'(x)g(x)\n$$\n\nこの両辺を $x$ について積分します。\n\n$$\n\\int f(x)g'(x) \\, dx = \\int \\left( \\frac{d}{dx} \\{ f(x)g(x) \\} - f'(x)g(x) \\right) \\, dx\n$$\n\n積分の線形性を用いて右辺を分割します。\n\n$$\n\\int f(x)g'(x) \\, dx = \\int \\frac{d}{dx} \\{ f(x)g(x) \\} \\, dx - \\int f'(x)g(x) \\, dx\n$$\n\nここで、微分の逆演算としての積分の性質 $\\int \\frac{d}{dx} F(x) \\, dx = F(x) + C$ （ここでは積分定数を省略して一般式として扱います）を用いると、第一項は $f(x)g(x)$ となります。\n\nしたがって、以下の部分積分の公式が得られます。\n\n$$\n\\int f(x)g'(x) \\, dx = f(x)g(x) - \\int f'(x)g(x) \\, dx\n$$\n\n（証明終）",
