      "model_answer": "部分積分の公式は、以下のように表されます：\n\n\\[\n\\int u \\, dv = uv - \\int v \\, du\n\\]\n\nこの公式を積の微分公式（\\( (uv)' = u'v + uv' \\)）を用いて証明します。まず、積 \\( uv \\) の微分を考えます：\n\n\\[\n(uv)' = u'v + uv'\n\\]\n\n両辺を \\( x \\) について積分します（不定積分）：\n\n\\[\n\\int (uv)' \\, dx = \\int (u'v + uv') \\, dx\n\\]\n\n左辺は直接積分できます：\n\n\\[\nuv = \\int u'v \\, dx + \\int uv' \\, dx\n\\]\n\nここで、\\( dv = v' dx \\) および \\( du = u' dx \\) と置くと、式は次のように変形されます：\n\n\\[\nuv = \\int v \\, du + \\int u \\, dv\n\\]\n\nしたがって、両辺から \\( int v du\\) を引くと：\n\n\\[\nuv - int v du = int u dv\n\\]\n\nこれが部分積分の公式です。したがって、TeX形式で証明は以下のようになります。\n\n```latex\n% 部分積分の公式の証明\n\nまず、積 $uv$ の微分を考えます：\n$$\n(uv)' = u'v + uv'\n$$\n\n両辺を $x$ について積分します（不定積分）：\n$$\n\\int (uv)' dx = int (u'v + uv') dx\n$$\n\n左辺は直接積分できます：\n$$\nuv = int u'v dx + int uv' dx\n$$\n\nここで、$dv = v'dx$ および $du = u'dx$ と置くと、式は次のように変形されます：\n$$\nuv = int v du + int u dv\n$$\n\nしたがって、両辺から $\\int v du$ を引くと：\n$$\nuv - int v du = int u dv\n$$\n\nこれが部分積分の公式です。\n```\n\nこの証明では、積の微分公式と不定積分の性質を用いて部分積分の公式を導き出しています。",
