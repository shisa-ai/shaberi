      "model_answer": "東京都北区で一軒家を建てる際の資金試算は、土地の購入費用、建築費用、その他関連費用（税金・手数料など）によって大きく変動します。以下に概算をまとめますが、実際の費用は設計内容や業者選びによって異なりますので、あくまで参考としてください。\n\n---\n\n### **1. 土地購入費用**\n- **平均地価（北区）**：  \n  - 住宅地：約**40～60万円/㎡**（2024年時点）  \n  - 用途地域や駅からの距離で変動（例：赤羽駅周辺は高騰傾向）\n- **必要な土地面積**：  \n  - 標準的な一軒家（3LDK程度）：約**100～150㎡**  \n  - 費用試算：約**4,000万円～9,000万円**\n\n---\n\n### **2. 建築費用**\n- **木造住宅（標準仕様）**：  \n  - 平米単価：約**30～50万円/㎡**  \n  - 延床面積100㎡の場合：約**3,000万円～5,000만원**\n- **鉄筋コンクリート造・RC造**:  \n  - 平米単価：約**50～80万円/㎡**  \n  - 延床面積100㎡の場合：約**5,000万円～8,000万円**\n\n---\n\n### **3. その他関連費用**\n- **税金・手数料**:  \n  - 不動産取得税・登録免許税等：土地価格の1%程度＋建築確認申請費用など\n- **設計・監理費**:  \n  - 建築費の10%程度（例: 建築費3,000万→300万）\n- **内装工事**:  \n  - 基本仕様に追加する場合、500万～1,500万程度\n- **間接費**:  \n  - 資材価格高騰時の調整や予期せぬ追加工事分\n\n---\n\n### **総額試算例**\n#### 【ケース1】木造住宅（100㎡）＋土地100㎡\n- 土地購入: 約4,000万〜6,000万\n- 建築: 約3,000万〜5,000万\n- その他: 約800万〜1,500万\n→ 合計: 約7,800万〜12,500万円\n\n#### 【ケース2】RC造住宅（100㎡）＋土地150㎡\n- 土地購入: 約6,000万〜9,000万\n- 建築: 約5,000万〜8,000万\n- その他: 約1億〜2億円\n→ 合計: 約1億2千万円〜2億円以上\n\n---\n\n### 注意点:\n1. 近年は資材価格高騰によりコストが上昇傾向。業者との契約時には「固定価格」か「変動価格」か確認が必要。\n2. 北区内の地域差が大きい（赤羽 vs 滝野川など）。\n3. 金融機関からの融資額は通常、総額の70%程度まで。\n\nより正確な見積もりには、不動産会社や建築業者への相談をおすすめします。",
