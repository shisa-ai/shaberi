          "judge_output": "[該当する評価項目とその簡潔な理由]\n- 設計等の段階の工程数が十分である:2点  \n  - 市場調査→機能/UI設計→収益モデル→開発・テスト→マーケティング→利益最大化→その他考慮事項と、多段階で整理されている。\n- 工程ごとの内容を示している:2点  \n  - 各ステップごとに具体的な作業内容（競合分析、多言語対応、MVP開発、SNS広告など）を詳しく説明している。\n- 外国人観光客に提案することを前提にしている:2点  \n  - 「外国人観光客向け」「多言語対応」「海外インフルエンサー」など、明確に外国人観光客を想定した内容になっている。\n- 説明が具体的でわかりやすい:2点  \n  - 具体例（TripAdvisor等の競合名、AR/VR、クーポン、予約手数料など）を挙げており、構成も段階的で理解しやすい。\n- 実現性の高い提案である:1点  \n  - 既存技術や一般的なビジネスモデル（広告、手数料、サブスク）に基づいており、現実的な内容。\n- 自然な日本語である:1点  \n  - 全体として自然で読みやすい日本語。ごく軽微な表記ゆれ（インフルエンサーマーチャリング等）はあるが減点するほどではない。\n\n[計算式]\n2 + 2 + 2 + 2 + 1 + 1 = 10\n\n[点数]\n10点\n\nFINAL SCORE: 10",
