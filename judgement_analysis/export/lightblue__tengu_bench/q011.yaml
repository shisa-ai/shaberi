          "judge_output": "[該当する評価項目とその簡潔な理由]\n- アイディアを複数挙げている:2点  \n  - 1〜7まで複数のキャンペーン案を提示している。\n- 具体的なアイディアの内容を示している:2点  \n  - 各キャンペーンごとに実施場所や内容（説明会、イベント、オンライン相談など）を具体的に記載。\n- 神奈川在住のシニア世代向けの保険マーケティングキャンペーンを作成することを踏まえている:2点  \n  - 湘南・鎌倉・神奈川県内の病院、公民館、祭りなど、神奈川の地域性とシニアのニーズ（健康・家族・地域）を意識している。\n- 実現性の高い提案である:1点  \n  - 地域イベント、健康診断との連携、オンライン相談会など、現実に行われている手法で構成されている。\n- 説明が具体的でわかりやすい:2点  \n  - 箇条書きと見出しで整理され、内容も簡潔かつ具体的。\n- 自然な日本語である:1点  \n  - 不自然な表現や誤用はなく、読みやすい日本語。\n\n[計算式]\n2 + 2 + 2 + 1 + 2 + 1 = 10\n\n[点数]\n10点\n\nFINAL SCORE: 10",
