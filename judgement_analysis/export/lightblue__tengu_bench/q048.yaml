      "model_answer": "兄が**120歩**歩いたところで追いつきます。\n\n以下のように順を追って計算すると分かりやすくなります。\n\n### 1. 歩幅（1歩の距離）の比を求める\n「兄が3歩で進む道のりを弟は5歩かかる」ことから、距離の比を計算します。\n計算しやすいように、最小公倍数を使って仮の距離を設定します。\n兄3歩 ＝ 弟5歩 ＝ 15（という距離）と仮定すると、1歩あたりの距離（歩幅）は以下のようになります。\n\n*   **兄の歩幅**：$15 \\div 3 = 5$\n*   **弟の歩幅**：$15 \\div 5 = 3$\n\n### 2. 速さの比を求める\n「兄が6歩歩く間に弟は5歩歩く」ことから、一定時間に進む距離（速さ）を計算します。\nある一定の時間（1セット）で進む距離は以下の通りです。\n\n*   **兄の速さ**：$6\\text{歩} \\times 5\\text{（歩幅）} = 30$\n*   **弟の速さ**：$5\\text{歩} \\times 3\\text{（歩幅）} = 15$\n\nつまり、兄は弟の2倍の速さ（$30:15$）で進みます。\n1セット（兄が6歩歩く時間）ごとに、兄は弟との差を $30 - 15 = 15$ ずつ縮めることができます。\n\n### 3. 弟のリード（ハンデ）を距離に換算する\n弟は先に100歩進んでいます。これを距離に換算します。\n\n*   **弟のリード**：$100\\text{歩} \\times 3\\text{（歩幅）} = 300$\n\n### 4. 追いつくまでの歩数を計算する\n兄は距離300の差を埋める必要があります。\n1セットごとに距離15ずつ差が縮まるので、追いつくのにかかるセット数は：\n\n*   $300 \\div 15 = 20\\text{セット}$\n\n1セットで兄は6歩歩くので、合計の歩数は：\n\n*   $20\\text{セット} \\times 6\\text{歩} = 120\\text{歩}$\n\n答え：**120歩**",
