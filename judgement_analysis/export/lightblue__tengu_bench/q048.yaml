    "original": "兄が6歩歩く間に弟は5歩歩きます。また兄が3歩で進む道のりを弟は5歩かかります。\n\n弟が100歩進んでから兄が後ろからおいかけると兄は何歩歩いたところでおいつきますか？",
    "translation_en": "[Purpose: question]\n\nWhen the older brother walks 6 steps, the younger brother walks 5 steps. Also, the distance the older brother covers in 3 steps takes the younger brother 5 steps to cover.\n\nIf the younger brother walks 100 steps and the older brother starts chasing from behind, how many steps will the older brother have taken when he catches up?  \n\n(Translation preserves the original meaning, details, and structure while ensuring natural English phrasing suitable for evaluation documentation.)"
  },
  "answer": {
    "gold_original": "兄が3歩で進む道のりを弟は5歩かかるため、2人の1歩あたりに進む距離は5:3である。\nそのため弟が初めに進んでいた距離を100歩*3 = 300 とおく。\n今2人の一定時間に進む距離の比は6歩*5 : 5歩*3 = 30 : 15 = 2 : 1 であるから300の距離を追いつく間に兄は 300 * 2/(2-1) = 600の距離を進む必要がある。これは600/5 = 120歩に相当するため、兄は120歩歩いたところで追いつく。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nSince the brother takes 5 steps to cover the distance the older brother covers in 3 steps, the distance covered per step for the two is in the ratio 5:3.  \n\nTherefore, let the initial distance the younger brother had covered be 100 steps * 3 = 300. Since the ratio of the distances they cover in the same time is 6 steps * 5 : 5 steps * 3 = 30 : 15 = 2 : 1, the older brother must cover a distance of 300 * 2/(2-1) = 600 to catch up. This corresponds to 600 / 5 = 120 steps, so the older brother catches up after walking 120 steps.  \n\n*(Note: The translation maintains the original mathematical reasoning and structure while ensuring clarity in English.)*"
  },
