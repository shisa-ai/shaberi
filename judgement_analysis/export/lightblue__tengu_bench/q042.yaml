      "model_answer": "日本の山地の清流を活用したワサビ栽培は、付加価値の高い農業として大きな可能性を秘めています。以下に、土地選びから収益最大化までの具体的なステップをまとめました。  \n\n---\n\n### **【ステップ1】土地選びと環境調査**  \n1. **水質・水温**  \n   - 清流（pH 6.5～7.5）で年間水温が10～18℃程度の場所が適しています。夏場の高温や冬場の凍結に注意。  \n   - 水源（湧き水、河川など）の安定性を確認し、汚染リスクがないか調査します。  \n\n2. **地形・日当たり**  \n   - 日陰（直射日光を避けられる）で湿度が保てる傾斜地が理想的です。急峻な場所は管理が難しいため、中程度の傾斜（20～40度）がおすすめ。  \n\n3. **法規制確認**  \n   - 農業振興地域や自然保護区など、栽培制限がないか自治体に確認します。  \n\n---\n\n### **【ステップ2】栽培方法と設備準備**  \n1. **栽培方式選択**  \n   - **畑ワサビ**: 比較的安価で初期投資が少ないですが、気候影響を受けやすい。  \n   - **水耕栽培**: 水槽やトレイを使い、温度管理が容易で高品質化可能（初期費用は高い）。  \n\n2. **設備導入例**  \n   - 水路・灌漑システム（自然流れを活用するかポンプ設置）。  \n   - 遮光ネットや防虫ネット（害虫対策）。  \n   - 温度管理装置（必要に応じて冷却システム）。  \n\n---\n\n### **【ステップ3】品種選定と育苗**  \n1. **品種選択**  \n   - 「真妻」や「長井」など、地域適性や市場需要に合わせた品種を選びます。高級志向なら「和歌山真妻」がおすすめ。  \n\n2. **育苗・植付け時期**  \n   - 春～秋に植付けし、生育期間約1年半～2年を見込む。初期は専門業者から苗を購入するのが効率的です。  \n\n---\n\n### **【ステップ4】収益化戦略**  \n1. **販売チャネル開拓**  \n   - 高級レストラン・寿司店への卸売り（直接交渉で価格交渉可能）。  \n   - 地域ブランド化（例：「〇〇山地ワサビ」）でプレミアム価格設定。  \n\n2. **付加価値商品開発**  \n   - ワサビパウダー・チューブワサビ加工販売（加工業者との提携も検討）。  \n\n3. **観光連携**  \n   - ワサビ畑見学ツアーを開催し、アグリツーリズム収入も確保可能です。  \n\n---\n\n### **【成功ポイント】**  \n- 初期投資：約500万円～2000万円（規模による）。補助金制度も活用しましょう（農林水産省の支援制度参照）。  \n- 労力：定期的な除草・害虫駆除・肥料管理が必要です。大規模なら自動化機械導入も検討しましょう。  \n\n清流と冷涼な気候があれば、高品質なワサビ栽培は可能です！ 市場ニーズとコストバランスを見ながら計画的に進めてください。",
