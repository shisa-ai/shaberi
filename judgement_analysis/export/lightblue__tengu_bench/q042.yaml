          "judge_output": "[該当する評価項目とその簡潔な理由]\n- 栽培の成功に向けて十分な数の工程を示している:2点  \n  - 市場調査、土地選定、栽培計画、資金調達、技術習得、販路開拓、持続可能性と多段階で示している。\n- 正しい順番で工程ごとの内容を示している:2点  \n  - 調査→土地選定→計画→資金→技術→販路→持続可能性と、概ね妥当な順序。\n- 日本の産地の綺麗な水を生かしたわさび栽培という前提を踏まえている:1点  \n  - 冒頭で「日本の山地の綺麗な水を活かして」と触れているが、その後の技術部分で「清流が安定供給される場所」程度で、わさび特有の「冷たく清浄な流水」「水温条件」などへの具体的な言及が弱い。\n- 土地の選び方を示している:1点  \n  - 水資源・日照・土壌・傾斜度など、選定条件を挙げている。\n- 説明が具体的でわかりやすい:1点  \n  - 各ステップに具体例や数値があり、全体として理解しやすい。\n- 実現性の高い提案である:0点  \n  - ワサビの品種例「山形ワサビ」や傾斜30度、1haあたり1トン・単価3,000円など、根拠が不明瞭・不正確な可能性が高い記述があり、実務的な信頼性に欠ける。\n- 自然な日本語である:1点  \n  - 日本語として自然で読みやすい。括弧前のハイフンの使い方にやや不自然さはあるが減点するほどではない。\n\n[計算式]\n2 + 2 + 1 + 1 + 1 + 0 + 1 = 8\n\n[点数]\n8点\n\nFINAL SCORE: 8",
