      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "日本の山地の清流を生かした「沢ワサビ（水ワサビ）」の栽培は、成功すれば非常に高い収益性が見込めるビジネスですが、同時に栽培難易度が高く、初期投資と専門知識が必要です。\n\n「より大きな利益」を追求するという観点から、土地選びから販売戦略まで、具体的かつ現実的なステップを順序立てて解説します。\n\n---\n\n### ステップ1：ビジネスモデルの策定（高収益化の鍵）\n\n土地を探す前に、「誰に」「どのように」売るかを決めます。市場に出荷するだけでは利益率は低くなります。\n\n1.  **ターゲットの明確化:**\n    *   **高級寿司店・料亭への直販:** 最高品質（真妻種など）を作り、高単価で契約する。\n    *   **海外輸出:** 欧米での日本食ブームにより、本物のワサビは「Green Gold」と呼ばれるほど高値で取引されます。\n    *   **6次産業化:** 根だけでなく、葉や茎を使った加工品（わさび漬け、ドレッシング、アヒージョ等）を自社製造し、廃棄ロスをなくして利益を最大化する。\n\n### ステップ2：土地選び（最重要・成否の8割が決まる）\n\nワサビ栽培は環境に極端に依存します。以下の条件を妥協せずに満たす土地を探してください。\n\n1.  **水質と水量（絶対条件）:**\n    *   **湧き水:** 川の水ではなく、**湧き水（地下水）**がベストです。川の水は雨で濁ったり、夏場に水温が上がりすぎたりするためリスクが高いです。\n    *   **水温:** 年間を通して**13℃前後（10〜15℃の範囲）**で安定していること。16℃を超えると病気が発生しやすくなり、成長が止まります。\n    *   **水量:** 豊富な水量が常に確保できること。渇水期でも枯れないか、近隣の古老やデータを確認してください。\n\n2.  **地形と日当たり:**\n    *   **北向きの斜面:** ワサビは直射日光を嫌います。北向きの谷間や、大きな落葉樹がある場所が適しています。\n    *   **傾斜:** 水を流し続ける必要があるため、適度な傾斜が必要です。\n\n3.  **アクセスとインフラ:**\n    *   重機が入れるか、収穫物の搬出が容易か。\n    *   電気・通信が通じるか（防犯カメラや水温管理システムの導入に必要）。\n\n### ステップ3：法的・行政的手続き（クリアすべきハードル）\n\n日本の山間部で勝手に水を引くことはできません。\n\n1.  **水利権の確認:** 河川や湧き水を利用する場合、都道府県や水利組合の許可が必要です。これが最もハードルが高い部分です。\n2.  **農地法・森林法:** 山林を開拓する場合、森林法の開発許可や、農地転用の手続きが必要になる場合があります。\n3.  **補助金の活用:** 新規就農、中山間地域活性化、高収益作物導入などの名目で、国や自治体から数百万〜数千万円規模の補助金が出る可能性があります。地元の役場や農協に相談しましょう。\n\n### ステップ4：ワサビ田の造成（畳石式の導入）\n\n高収益を目指すなら、品質が最も高くなる**「畳石式（たたみいししき）」**の造成をお勧めします（静岡県伊豆地方で主流）。\n\n*   **構造:** 下層に大きな石、上層に小さな砂利を敷き詰め、表面に水を流すだけでなく、**土壌内部にも水を浸透させる**構造です。\n*   **メリット:** 水中の酸素供給量が多くなり、不純物が濾過されるため、太くて辛味・甘味のバランスが良い最高級のワサビが育ちます。\n*   **コスト:** 造成コストは高いですが、長期的に見て最も「高く売れるワサビ」が作れます。\n\n### ステップ5：品種選定と栽培管理\n\n1.  **品種:**\n    *   **真妻（マズマ）:** 栽培期間が長い（1.5〜2年）が、粘り・辛味・甘味が最高で、市場価格が最も高い。利益最大化ならこれです。\n    *   **実生（ミショウ）:** 成長が早く（1年〜1.5年）、病気に強い。回転率重視ならこちら。\n    *   **戦略:** リスク分散のため、メインを真妻にしつつ、一部を実生にするのが賢明です。\n\n2.  **メリクロン苗の利用:**\n    *   親株から株分けするのではなく、バイオテクノロジーで培養した「ウイルスフリー苗（メリクロン苗）」を購入してください。初期コストはかかりますが、生存率と品質が段違いです。\n\n### ステップ6：収益最大化のための具体的戦術\n\n1.  **全草利用（捨てるところをなくす）:**\n    *   ワサビは根（芋）ができるまで時間がかかりますが、**葉や茎（花わさび、葉わさび）**は春先に収穫して販売できます。これをキャッシュフローの繋ぎにします。\n\n2.  **ブランディング:**\n    *   「〇〇山の湧き水育ち」「農薬不使用」などのストーリーを付加価値にします。\n    *   高級飲食店向けには、鮫皮おろしとセットで提案するなど、体験価値を売ります。\n\n3.  **防犯対策（重要）:**\n    *   近年、ワサビの盗難が相次いでいます。高収益作物は狙われます。\n    *   柵の設置、防犯カメラ（ソーラー式・SIMカード通信）、センサーライトの設置は必須経費と考えてください。\n\n### まとめ：最初の一歩\n\nまずは、**候補地となる地域の「水温調査」**から始めてください。\n夏場の最も暑い時期に水温計を持って山に入り、水温が15℃以下、かつ水量が豊富な場所を見つけることができれば、ビジネスの勝率はグッと上がります。\n\nまた、静岡県（伊豆）、長野県（安曇野）、島根県（匹見）などの先進地を視察し、畳石式の構造を実際に目で見ることを強くお勧めします。",
