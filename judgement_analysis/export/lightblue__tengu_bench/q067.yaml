      "model_answer": "東京都北区に一軒家を建てる際の資金試算は、土地の価格、建築費、設計費、工期費用など多くの要素によって大きく変動します。以下に一般的な見積もりをまとめますが、実際の費用は市場状況やご希望の規模によって異なりますので、専門家への相談をおすすめします。\n\n### 1. **土地購入費**\n   - **価格帯**: 北区の地価は高騰傾向にありますが、一軒家用地として適切な条件（広さ・立地）で約**5,000万円～10,000万円**程度が目安です。\n   - **例**: 50㎡程度の土地で5,500万円\n\n### 2. **建築費**\n   - **一般的な一軒家（100㎡前後）**: 約**3,000万円～5,000万円**\n     - 構造（RC造・S造など）、設備（浴室・トイレ数）、仕上げ材によって変動します。\n   - **高級仕様**: 5,000万円以上\n\n### 3. **設計・施工管理費**\n   - **設計費**: 約**300万円～500万円**（建築面積に応じて）\n   - **施工管理費**: 建築費の10%程度（約300万円～500万円）\n\n### 4. **その他諸経費**\n   - **固定資産税・都市計画税**: 年間約30万円～50万円\n   - **保険料**: 建物保険など約10万～20万円/年\n   - **工事中断損害保険**: 工期中の損害を補償\n\n### 5. **総額試算例**\n   - 土地購入: 6,000万円  \n   - 建築: 4,000万円  \n   - 設計・管理: 400万  \n   → 合計: 約10,400万円  \n\n### 注意点\n- 北区は都心近くで地価が高いですが、郊外や駅周辺と比べて価格差があります。\n- 工期は数ヶ月から1年以上かかるため、生活中断期間も考慮しましょう。\n- 資金調達方法としては、住宅ローンや自己資金を組み合わせるのが一般的です。\n\n### おすすめアクション\n1. 不動産会社と建築会社で相談し、詳細な見積もりを取得\n2. 都市計画課や税務署で補助制度（住宅取得控除など）の確認\n3. 貸出元との相談で最適なローンプランを検討\n\n具体的な条件があればさらに精度の高い試算が可能です。必要であれば専門家への相談をお勧めします。",
