      "model_answer": "隣地斜線制限が定められていない用途地域は、以下の通りです。ただし、地域によって条例で独自の制限が設けられている場合もあるため、必ず自治体の都市計画図や条例を確認する必要があります。  \n\n### **隣地斜線制限が原則として不要な用途地域**  \n1. **第一種低層住居専用地域**（※一部例外あり）  \n2. **第二種低層住居専用地域**（※一部例外あり）  \n3. **第一種中高層住居専用地域**  \n4. **第二種中高層住居専用地域**  \n5. **準住居地域**  \n6. **商業地域**（ただし、防火・準防火地域では斜線制限が適用される場合あり）  \n7. **準工業地域**（同上）  \n8. **工業地域**（同上）  \n\n### **注意点**  \n- **防火・準防火地域内では、隣地斜線制限が適用される場合があります。**（建築基準法第56条）  \n- 地域によっては「景観法」や「都市景観条例」で斜線制限に類似した規制が設けられていることがあります。  \n- 用途地域以外にも「地区計画」や「再開発地区」などで個別の規制が設けられる場合があります。  \n\n### 確認方法  \n自治体の都市計画課に問い合わせるか、[国土交通省 都市局のウェブサイト](https://www.mlit.go.jp/totikensangyo/const/sozoseido/) で詳細を確認できます。",
