    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "相手との関係性や、社内の雰囲気（フォーマルか、少しカジュアルか）に合わせていくつかパターンを用意しました。状況に合わせて使い分けてください。\n\n### パターン1：標準的・丁寧（最も無難な表現）\n社内の他部署へのメールとして、礼儀正しく標準的な表現です。\n\n**Subject: Investigation Report: Defective product returned by customer**\n\nDear Mr. Tanaka,\n\nI hope this email finds you well.\nThis is Suzuki from the Administration Department.\n\nI am writing to report the investigation results regarding the defective product returned by the customer. Please find the details below.\n\nI would appreciate it if you could review the report.\n\nBest regards,\n\nSuzuki\nAdministration Department\n\n---\n\n### パターン2：少しカジュアル・簡潔（親しい間柄やスピード重視）\n「お疲れ様です」を \"Hi\" や \"Hello\" で代用し、要件を端的に伝えます。\n\n**Subject: Investigation results regarding the returned defective item**\n\nHi Tanaka-san,\n\nThis is Suzuki from Admin.\n\nHere are the investigation results for the complaint item returned by the customer. Please see the details below.\n\nPlease review and verify the report.\n\nRegards,\n\nSuzuki\n\n---\n\n### 英語表現のポイント解説\n\n*   **件名 (Subject):**\n    *   \"Investigation Report\"（調査報告書）\n    *   \"Defective product\"（不良品、欠陥品）※「クレーム品」は和製英語に近いので、英語では *defective product*（欠陥品）や *complaint item*（苦情のあった品）とするのが自然です。\n*   **書き出し:**\n    *   \"I hope this email finds you well.\" は「お疲れ様です」の代わりによく使われるビジネス定型句です。\n*   **下記の通り:**\n    *   \"Please find the details below.\"（詳細は下記をご覧ください）\n    *   もしファイルが添付されている場合は、\"Please find the attached report.\"（添付の報告書をご覧ください）に変更してください。\n*   **ご検収ください:**\n    *   \"Please review\"（査収する、目を通す）\n    *   \"verify\"（内容が正しいか確認する）\n    *   これらを組み合わせて \"Please review and verify\" とすると「検収（確認して承認）」のニュアンスが出ます。",
