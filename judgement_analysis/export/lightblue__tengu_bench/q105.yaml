      "model_answer": "結論から申し上げますと、**原則として建築確認申請が必要**です。\n\n理由は以下の通りです。\n\n### 1. 基本的なルール（10㎡の壁）\n建築基準法では、増築する床面積が**10㎡（平方メートル）を超える場合**、建築確認申請が必要と定められています。\n今回のケースは**12㎡**ですので、この基準を超えており、申請が必要です。\n\n### 2. 防火地域・準防火地域の場合\nもし、その建物がある場所が「防火地域」または「準防火地域」に指定されている場合は、増築する面積が1㎡であっても（10㎡以下であっても）、必ず建築確認申請が必要です。\nしたがって、地域に関わらず12㎡であれば申請は必須となります。\n\n---\n\n### 例外（申請が不要になる稀なケース）\n極めて限定的ですが、以下の**すべての条件**を満たす場合のみ、申請が不要になる可能性があります。\n\n1.  **都市計画区域外**（および準都市計画区域外）であること。\n    *   いわゆる山間部や過疎地など、都市計画が定められていないエリアです。一般的な住宅街はほぼ「都市計画区域内」です。\n2.  **木造の小規模な建物**（4号建築物相当）であること。\n3.  **自治体の条例**で別途規制がないこと。\n\nもし、お住まいの地域が一般的な市街地や住宅地であれば、この例外には当てはまりません。\n\n### 注意点\n建築確認申請を行わずに12㎡の増築を行うと「違反建築物」となり、以下のリスクがあります。\n\n*   **融資が受けられない:** 将来、家の売却やリフォームローンを組む際に銀行の審査が通らなくなる可能性があります。\n*   **是正命令:** 行政から撤去や使用禁止を命じられる可能性があります。\n*   **建ぺい率・容積率:** 12㎡増えることで、敷地に対する建物の制限（建ぺい率・容積率）をオーバーしないか確認が必要です。\n\n### 推奨されるアクション\n12㎡の増築はDIYレベルではなく、法的な手続きが必要な工事です。\n*   **建築士（工務店やハウスメーカー）に相談する**\n*   **役所の建築指導課に問い合わせる**\n\nこれらを行い、正規の手順で進めることを強くお勧めします。",
