      "model_answer": "**建築確認申請の必要性について**  \n\n建物の増築面積が **12m²** の場合、建築確認申請が必要かどうかは以下の条件によって異なります。  \n\n### 1. **増築部分の面積が10m²を超える場合**  \n- 増築面積が **10m²を超える** 場合（今回は12m²）は、原則として **建築確認申請（または小規模建築確認申請）が必要** です。  \n- ただし、既存建物との接続方法や構造によっては例外があります。  \n\n### 2. **例外となるケース（建築確認申請不要）**  \n以下の条件をすべて満たす場合、申請が不要な場合があります。  \n- 増築部分が **既存建物と同一構造** であり、壁や柱などの主要構造部材に影響を与えない。  \n- 増築部分の高さや用途が既存建物と同一である。  \n- 地域の条例で特に定めがない。  \n\n### 3. **小規模建築確認申請（簡素手続き）の適用可否**  \n- 増築面積が30m²以下で、一定の要件を満たす場合は「小規模建築確認申請」で手続き可能です（通常より迅速・費用も安価）。  \n\n### 4. **注意点**  \n- 建築基準法や地域条例により要件が異なるため、必ず **自治体（市区町村）の建築担当部署に相談することを推奨します**。  \n- 特に耐震基準や防火に関する規制も考慮する必要があります。  \n\n### 結論  \n12m²の増築では原則として **建築確認申請または小規模建築確認申請が必要ですが**、詳細は自治体へ問い合わせるのが確実です。",
