    "original": "以下の文書を要約してください。\n### 文書\n私が保険会社で働いていることを知っている人から、「目の前にいる人がいつ死亡するかもわからないのに、死亡保険なんてどうして成り立つのか？」と聞かれたことがあります。予測できないことなのに、なぜ保険金の支払を約束できるのか、という問いです。\n\nたしかに、目の前の人がいつ死亡するか、わかるはずはありませんが、死亡保険が成り立つには、そのようなことを知る必要はありません。\n\n生命保険は、一定数の集団（被保険者の集団）が存在することが前提となっています。\nその集団のうちの「誰が死亡するか」ということは問題ではなく、その集団のうちの「何人が死亡するか」をある程度予測できれば、死亡保険は成立します。\n\n保険は大数の法則を基に成り立っているとよく言われます。\n「大数の法則」とは、数学の定理のひとつで、母集団の数が増えれば増えるほど、ある事柄（死亡保険の場合は死亡）の発生する割合は、 一定の値に近づき、その値は事柄の発生する確率に等しい。というものです。\n\nたとえば、死亡率が1000分の1の集団があったとします。\nこの集団の人数が、仮に1000人だったとすると、死亡する人数の期待値は1人ということになりますが、実際には、2人死亡するかも知れないし、誰も死なないかもしれません。\n前者の場合、死亡した人の割合は死亡率の倍の1000分の2で、後者の場合はゼロです。\nどちらも死亡率には一致しません。死亡者が1人のときだけ、割合が確率に一致します。\n\nこの集団が100万人になると死亡者の期待値は1000人になります。\nここまで人数が増えると死亡者が増えても減っても、その差はせいぜい数十人くらいにとどまり、よっぽどのことがない限り、実際の死亡者が倍の2000人になったり、ゼロだったりすることはないでしょう。つまり、人数が増えることによって、死亡する割合が死亡率である1000分の1に近づいていくことがわかります。\n\n逆に死亡率がわからないときでも、この大数の法則を利用すれば、死亡率を推定することができます。これが、保険は大数の法則を基に成り立っていると言われる理由です。\n\nところで、この「大数の法則」が成り立つには、いくつかの条件があります。\n(1) そもそも「死亡という事象」に確率があること\n(2) その集団内のどのメンバーも死亡する「確率」が等しい\n(3) あるメンバーの死亡と別のメンバーの死亡との間に何の関係もない（独立している）\n\n(1)については、そもそも「確率とは何ぞや」という哲学的な問いに発展してしまいそうですが、とりあえずは、（生命保険の歴史からみて）経験的に成り立っているのだ、というしかないと思います。\n\n(2)の条件については、年齢・性別ごとの死亡率を使用している上に、なるべく健康状態等の条件が均質になるように選択を行うことによって成立しているとみなされます。\n\n(3)は、伝染病や地震などの災害の場合は成り立たなくなってしまいますが、そういった場合を除けば、赤の他人同士の死亡には何の関係もないと思って問題ないでしょう。\n\nちなみに、「集団の規模がどれくらいになれば、大数の法則が働くのか？」というようなことをしばしば聞かれます。数学の定理が「働く」というのは、不思議な言葉の使い方です。この「大数の法則が働く」というのは、「集団の規模が大きくなれば、その割合は一定値に近いところに落ち着く（ばらつきが減る）」くらいの意味に使われていて、すでに慣用化してしまっているようです。\nもっとも、（投資の話でよく出てくる）「分散効果」が効いていると言っても同じはずなんですが。",
    "translation_en": "Here is the translation of the provided Japanese text into natural, clear English suitable for evaluation documentation:  \n\n---  \n\n**Summary of the Document**  \n\nI was once asked by someone who knew I worked for an insurance company: *\"How can death insurance even work when you can’t predict when the person in front of you will die?\"* The question was about how insurance companies can promise to pay out death benefits when death is unpredictable.  \n\nWhile it’s true that we can’t know when any specific individual will die, death insurance doesn’t require knowing that. Instead, it relies on the existence of a large group of insured individuals. The key isn’t *\"who\"* will die, but *\"how many\"* will die within that group—and we can predict that number to a reasonable degree.  \n\nInsurance is often said to be based on the **law of large numbers**. This mathematical theorem states that as the size of a population increases, the observed rate of an event (in this case, death) will converge toward its true probability.  \n\nFor example, if a group has a mortality rate of 1 in 1,000, and the group consists of 1,000 people, the expected number of deaths is one. However, in reality, two people might die, or no one might die. In the first case, the death rate would be 2/1,000, and in the second, it would be zero—neither matching the expected rate. Only when exactly one person dies does the observed rate align with the probability.  \n\nIf the group grows to 1 million people, the expected number of deaths becomes 1,000. At this scale, even if the actual number of deaths deviates slightly (e.g., 1,020 or 980), the difference is negligible, and the observed death rate will closely approximate 1 in 1,000. Thus, as the group size increases, the observed rate converges toward the expected probability.  \n\nConversely, even if the mortality rate is unknown, the law of large numbers allows us to estimate it. This is why insurance is said to be based on this principle.  \n\nHowever, the law of large numbers holds under certain conditions:  \n1. The event (death) must have a probability.  \n2. Each member of the group must have an equal probability of dying.  \n3. The deaths of different members must be independent (unrelated).  \n\nRegarding (1), while the philosophical question of *\"what is probability?\"* could arise, we can pragmatically assume it holds based on historical data in life insurance.  \n\nFor (2), insurers use mortality rates stratified by age and gender and select insured individuals with relatively homogeneous health conditions to ensure equal probabilities.  \n\nFor (3), the law may not hold in cases of epidemics or disasters where deaths are correlated, but for unrelated individuals, deaths are generally independent.  \n\nA common question is: *\"How large must a group be for the law of large numbers to apply?\"* The phrase *\"the law works\"* is a colloquial way of saying that as the group size increases, the observed rate stabilizes (variance decreases). This is essentially the same as the *\"diversification effect\"* often discussed in finance.  \n\n---  \n\nThis translation preserves the original meaning, technical details, and logical flow while ensuring clarity and natural English phrasing. Let me know if you'd like any refinements!"
