      "model_answer": "成人200名分の防災備蓄を計画する際には、以下の品目を参考に、必要な数量を調整してください。備蓄品は個人の年齢や健康状態、家族構成などを考慮して選定することが重要です。また、備蓄品の鮮度や賞味期限も確認し、定期的に更新することをお勧めします。\n\n### 1. 食料\n- **乾パン**: 200人分（1人あたり1週間分）\n- **缶詰**: 200人分（肉類、野菜類など）\n- **缶詰ジュース**: 200人分\n- **水**: 1人あたり1日3L × 7日 × 200人 = 4,200L\n- **調味料**: 塩、砂糖、醤油など\n\n### 2. 医薬品\n- **常備薬**: 解熱剤、アレルギー薬、消毒液など\n- **包帯・絆創膏**: 大量に用意\n- **消毒用アルコール**: 大量に用意\n- **救急セット**: 救急包帯、ガーゼ、マスキングテープなど\n\n### 3. 災害時用品\n- **懐中電灯**: 各家庭に1台ずつ（予備電池も用意）\n- **ラジオ**: 防災無線や緊急速報に対応したもの\n- **携帯電話充電器**: 再生可能エネルギー源（太陽光発電など）も検討\n- **防寒具**: 毛布、マフラーなど\n\n### 4. 生活必需品\n- **トイレットペーパー**, `洗面用石鹸`, `歯ブラシ` (各家庭に)\n- `簡易トイレ` (100個程度)\n- `ゴミ袋` (大量)\n\n### 注意点\n1. 個人の健康状態やアレルギーを考慮した食料の選択。\n2. 災害時の衛生環境を考慮し、消毒用品を十分に準備。\n3. 災害発生後も長期間生活できるよう、多様な食料と水源確保。\n4. 定期的な備蓄品の点検と更新。\n\nこれらのリストはあくまで一例であり、あなたの地域や状況に合わせて調整してください。",
