          "judge_output": "[該当する評価項目とその簡潔な理由]\n- 設定の人数、防災備蓄という点を考慮している:2点  \n  - 冒頭で「成人200名分の防災備蓄」と明記し、水も200人×7日で計算している。\n- 必要な項目を網羅できている:1点  \n  - 食料、水、医薬品、照明、情報手段、トイレ用品などはあるが、1人あたりの食料量・日数、衣類、カセットコンロ・燃料、衛生用品（生理用品等）、寝具などが不足・曖昧。\n- 項目ごとの数の試算に根拠がある:1点  \n  - 水のみ「1人1日3L×7日×200人」と根拠を示しているが、他は「200人分」「大量」「各家庭に」など根拠不明。\n- 項目ごとの数の試算が正しい:1点  \n  - 水の計算（3L×7日×200人=4,200L）は正しいが、他は数量が具体的でないか、200人に対して「簡易トイレ100個程度」など妥当性に疑問がある。\n- 自然な日本語である:1点  \n  - 全体として自然で読みやすい日本語。\n\n[計算式]\n2 + 1 + 1 + 1 + 1 = 6\n\n[点数]\n途中経過合計: 6点\n\nFINAL SCORE: 6",
