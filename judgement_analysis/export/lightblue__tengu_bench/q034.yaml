    "original": "以下の文章をもとに問題に答えよ\n### 文章\n条里制とは, わが国の古代に施行された土地区画制度であり, いわゆる条里地割として現在も歴然と認 められる条里の遺構や, 条里制特有の地名の残存などを通じて, 条里制が東北地方の一部を除き, 畿内を 中心に, 広 く日本全土の平野や盆地に行なわれたことは明らかである。 このように, 条里制は古代大和朝廷政権の成立発展と深く関連し, とくに大化改新による班田収授法と密接な関係を有するものとみなされ る。 それにも拘らず, 条里制については日本の通史にも, 律令の明文にも殆んど記載されていないため, 今日まで条里制について幾多の研究が進められてきたが, 条里制の起源をはじめ, 条里地割, 条里集落などについて, なお解明されていない多くの問題が残されている。\n著者は本論文を前篇と後篇とに分かち, 前篇では, 条理制に関する従来の諸研究について詳細な学説史 的考察を行ない, それによって, 現在の条里制研究に課せ られた問題点を明かにし, また後篇では, 主と して摂津国の地方条里を対象とし, 綿密な現地調査を基礎にして, これらの問題点の解明を試みている。 前篇 「条里制研究の系譜的考察」 は 4章より成る。 条里についての総括的記載は平安朝末の 「拾芥抄」をもって唱矢とするが, 第 1 章 「明治以前の諸研究」 では, 著者は条里制研究がすでに江戸時代に,伊藤 東涯の「制度通」 などにみられるように, 「拾芥抄」 の記載に基づく制度史研究にはじまることを指摘している。 次いで第 2章の 「明治 ・ 大正期の研究」 では, これまでの文献的制度史的研究 とな らんで, 明 治時代には新たに, 実証的歴史的研究がはじまり, とくに平城京の条坊制の研究と関連して, 大正時代には, 条里制研究においても, 地方条里の実証的研究の蓄積を通じて, 条里制自体を理解しようとする帰納的方法が確立され, 歴史学的研究の分野にめざましい発展がみられたと述べる。 さらに第 3・4章の 「昭 和期の研究動向」 では, 条里制研究は一段と進歩し, 昭和前期には, 歴史学の分野では, 従来の文献史的 ・実証的研究のほかに,/条里制が広く全国に実施されるに至った背景としての律令国家の社会経済史的研究が加わったこと, また歴史学的研究ばかりでなく, 新たに地理学の分野において, 地方条里の実態調査 を基礎にして, 条里制の分布や自然環境の問題が検討されるに至ったことを強調している。 \n### 問題\n文章中で述べられている章構成を教えてください。",
    "translation_en": "The chapter structure described in the text is as follows:  \n\n1. **Chapter 1: \"Pre-Meiji Studies\"** – Discusses how *Jōri* studies began in the Edo period, based on institutional history research derived from the *Shūkai-shō* (late Heian period).  \n2. **Chapter 2: \"Meiji and Taishō Period Research\"** – Examines the shift from textual/institutional history to empirical historical studies in the Meiji era, and the inductive approach to understanding *Jōri* through regional *Jōri* fieldwork in the Taishō period, particularly in relation to Heian-kyō’s *Jōbō* system.  \n3. **Chapters 3 & 4: \"Shōwa Period Research Trends\"** – Highlights advancements in *Jōri* studies, including socio-economic historical research on the Ritsuryō state (pre-WWII) and geographical studies of regional *Jōri* distribution and natural environments.  \n\nThe first part (\"Genealogical Consideration of *Jōri* Studies\") consists of these four chapters. The second part focuses on fieldwork in Settsu Province."
