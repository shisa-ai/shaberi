      "model_answer": "外国人アルバイトを雇用する際には、以下の点に注意することで、円滑な労働関係を築き、法的な問題を回避できます。  \n\n### **1. 法的な手続きと確認事項**  \n- **在留資格の確認**：アルバイトが可能な在留資格（例：学生ビザ、特定技能など）か確認し、労働時間や職種制限（特に学生ビザの場合）を遵守します。  \n- **就労許可証の有無**：必要な場合は就労許可証（「資格外活動許可」）の提示を受け、コピーを保管します。  \n- **社会保険・税金**：健康保険・厚生年金などの加入義務や源泉徴収の手続きが必要な場合があります。  \n\n### **2. 労働条件の明確化**  \n- **契約書作成**：雇用条件（時給、勤務時間、休日など）を日本語と母国語で記載し、双方で署名します。  \n- **最低賃金・労働時間管理**：法定最低賃金以上を支払い、残業や休憩時間に関する規定（労基法）を遵守します。  \n\n### **3. コミュニケーションとサポート**  \n- **言語対応**：指示や安全説明は分かりやすく伝え、日本語能力不足なら翻訳ツールや通訳サービスを活用します。  \n- **文化・宗教への配慮**：食事制限（ハラルなど）や祝祭日などに配慮し、差別的言動は厳禁です。  \n\n### **4. 安全衛生管理**  \n- **安全教育実施**：作業内容に応じた安全訓練を行い、日本語が不十分な場合は図解や動画で補います。  \n\n### **5. その他注意点**  \n- **不当な扱い禁止**：賃金未払いやパワハラは違法です。トラブル発生時は弁護士や行政機関へ相談しましょう。  \n- **情報提供**: 外国人向け相談窓口（例: 外国人総合相談センター）の情報を共有しておくと良いでしょう。  \n\n### 参考資料  \n- 出入国在留管理庁: [https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00145.html](https://www.moj.go.jp/isa/applications/procedures/nyuukokukanri07_00145.html)  \n- 厚生労働省: [https://jsite.mhlw.go.jp/iwate-roudoukyoku/var/rev0/0116/8597/koyou.pdf](https://jsite.mhlw.go.jp/iwate-roudoukyoku/var/rev0/0116/8597/koyou.pdf)  \n\nこれらの点に留意することで、外国人アルバイト本人も安心して働ける環境を作れます。",
