      "model_answer": "この状況では、次郎の遺産は主に次郎の親族（兄弟や親戚）が相続する可能性が高いです。ただし、具体的な相続権は以下の要素によって決まります：\n\n1. **法的規定**：日本の民法では、配偶者や子がいる場合に優先的に相続権が認められます。しかし、太郎と次郎は兄弟であり、太郎には妻と子供がいます。次郎には配偶者がいないため、配偶者や子による相続権はありません。\n\n2. **兄弟間の相続**：太郎と次郎は兄弟であり、両親を失った後も親族間で遺産を分割することが一般的です。ただし、太郎の妻と子供も相続権を持つため、その割合は調整されます。\n\n3. **遺言書**：次郎が遺言書を作成していた場合、その内容が優先されます。遺言書で特定の人に遺産を譲るよう指定している場合は、その人に相続権が移ります。\n\n4. **裁判所の判断**：もし遺言書がない場合や相続人が紛争がある場合は、裁判所が最終的な判断を下します。この場合でも、一般的には兄弟間で公平に分割される傾向があります。\n\nしたがって、次郎の遺産は主に太郎の妻と子供、および次郎自身の親族（例えば父方または母方の親戚）によって分割される可能性があります。具体的な割合は個別の状況によって異なります。",
