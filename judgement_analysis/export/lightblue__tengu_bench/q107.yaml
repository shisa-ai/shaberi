    "translation_en": "**[Purpose: Question]**  \n\nTaro and Jiro are brothers, and their parents have passed away. Taro has a wife and two children, while Jiro is unmarried. If Taro dies and then Jiro dies afterward, who will inherit Jiro’s estate?  \n\n(Translation preserves the original meaning, structure, and key details without adding commentary.)"
  },
  "answer": {
    "gold_original": "次郎の遺産の相続については、日本の民法に基づいて決定されます。太郎と次郎が兄弟であり、太郎が先に亡くなり、その後次郎が亡くなった場合、次郎の直接の法定相続人はいないことになります（次郎には配偶者も子もいないため）。この場合、民法の規定により、次郎の遺産は次のように相続されます。\n\n1. 直系尊属（親など）がいれば、彼らが相続人となりますが、太郎と次郎の両親はすでに他界しています。\n2. 兄弟姉妹が相続人となりますが、太郎もすでに亡くなっています。\n\nこの状況では、太郎の子供たちが次郎の遺産を相続することになります。太郎の子供たちは、次郎にとって甥または姪にあたります。日本の民法では、兄弟姉妹が亡くなった後は、その子供たち（甥や姪）が相続人となることが規定されています。\n\nしたがって、次郎の遺産は太郎の子供たちが相続します。太郎の子供が二人いる場合、彼らは遺産を等分に相続することになるでしょう。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nThe inheritance of Jiro’s estate will be determined according to Japanese Civil Law. If Taro and Jiro are brothers, and Taro predeceases Jiro, Jiro will have no direct legal heirs (as Jiro has no spouse or children). In this case, under the provisions of the Civil Law, Jiro’s estate will be inherited as follows:  \n\n1. If there are ascendants (such as parents), they would be the heirs, but Taro and Jiro’s parents have already passed away.  \n2. Siblings would be the heirs, but Taro has also already died.  \n\nIn this situation, Taro’s children will inherit Jiro’s estate. Taro’s children are Jiro’s nephews or nieces. Under Japanese Civil Law, when a sibling dies, their children (nephews or nieces) become the heirs.  \n\nTherefore, Jiro’s estate will be inherited by Taro’s children. If Taro has two children, they will inherit the estate equally.  \n\n---  \n*(Translation preserves the original meaning and legal details without adding commentary.)*"
