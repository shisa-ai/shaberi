      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "外国人アルバイトを雇用する際は、日本人を雇用する場合とは異なる法律や手続き、文化的な配慮が必要です。特に**「在留資格（ビザ）」の確認**を怠ると、知らなかったとしても雇用主が処罰される可能性があるため、非常に重要です。\n\n以下に、雇用主が気をつけるべき点をカテゴリー別に詳しく解説します。\n\n---\n\n### 1. 在留資格（ビザ）と就労制限の確認【最重要】\n\n最も重要なのが、その外国人が「日本で働ける資格を持っているか」の確認です。\n\n*   **在留カードの確認:**\n    *   必ず原本を確認してください（コピーは不可）。\n    *   **「就労制限の有無」**の欄を見ます。「就労不可」となっていても、裏面の資格外活動許可欄に許可印があればアルバイト可能です。\n*   **資格外活動許可（留学生・家族滞在など）:**\n    *   留学生や家族滞在ビザの外国人は、原則として就労できませんが、入国管理局から**「資格外活動許可」**を得ていれば働けます。\n    *   **時間の制限:** 原則として**週28時間以内**です。掛け持ちをしている場合、すべてのアルバイト先を合計して28時間以内である必要があります。\n    *   **長期休暇の特例:** 留学生の場合、学校の定める長期休業期間中（夏休みなど）は**1日8時間（週40時間）**まで働けます。\n*   **就労禁止業務:**\n    *   風俗営業（パチンコ店、麻雀店、ゲームセンター、キャバクラ、スナック、風俗店など）での勤務は、掃除や皿洗いなどの裏方業務であっても、留学生や家族滞在ビザの人は**全面的に禁止**されています。\n\n### 2. 行政手続きと労働法\n\n外国人であっても、日本の労働基準法が適用されます。\n\n*   **ハローワークへの届出:**\n    *   外国人を雇用する際（雇い入れ）と離職する際（離職）には、ハローワークへの届け出が**義務**付けられています。怠ると罰金が科される場合があります。\n*   **最低賃金と労働条件:**\n    *   日本人と同じ最低賃金以上を支払う必要があります。「外国人だから安く雇える」ということはありません。\n    *   労働条件通知書（雇用契約書）を交付し、労働条件を明確にします。可能であれば母国語ややさしい日本語で書かれたものを用意するとトラブルを防げます。\n*   **社会保険・税金:**\n    *   要件を満たせば、雇用保険や社会保険への加入が必要です。\n    *   所得税や住民税も発生します。帰国時に住民税の未払いが問題になることがあるため、退職時の徴収方法などを確認しておく必要があります。\n\n### 3. コミュニケーションと教育\n\n言葉の壁や文化の違いによるトラブルを防ぐための工夫が必要です。\n\n*   **「やさしい日本語」の使用:**\n    *   敬語や曖昧な表現（「適当にやっておいて」「いい感じで」など）は伝わりにくいです。「この線まで水を入れてください」のように具体的かつ短く伝えます。\n*   **マニュアルの整備:**\n    *   写真や図を多用したマニュアルや、ふりがな付きのマニュアルを用意します。\n*   **「報告・連絡・相談」の文化:**\n    *   日本特有の「ホウレンソウ」の概念がない国も多いです。なぜ報告が必要なのか、理由を含めて教育する必要があります。\n\n### 4. 文化・宗教への配慮\n\n多様な背景を持つスタッフへの理解が必要です。\n\n*   **宗教上のタブー:**\n    *   イスラム教徒の場合、豚肉やアルコールを扱えない、あるいは口にできない場合があります。また、勤務時間中に短時間の礼拝が必要な場合や、ラマダン（断食月）中に体力が落ちる可能性があります。事前に相談してルールを決めておくことが大切です。\n*   **時間の感覚:**\n    *   国によっては時間の感覚が日本より緩やかな場合があります。「5分前行動」や「遅刻時の連絡」の重要性を最初にしっかり説明する必要があります。\n\n### 5. 不法就労助長罪のリスク\n\nもし、在留カードの確認を怠ったり、週28時間を超えて働かせたりした場合、雇用主は**「不法就労助長罪」**に問われる可能性があります。\n\n*   **罰則:** 3年以下の懲役、または300万円以下の罰金（あるいはその両方）。\n*   **知らなかったでは済まされない:** 「偽造カードだと見抜けなかった」「本人が大丈夫だと言った」という言い訳は通用しないケースが多いため、在留カードの番号が有効かを入国管理局のウェブサイトで照会することをお勧めします。\n\n### まとめ\n\n外国人アルバイトの雇用は、人手不足の解消や職場の活性化につながる大きなメリットがあります。成功させるためのポイントは以下の3点です。\n\n1.  **在留カードと就労制限を徹底的に確認する。**\n2.  **日本人と同じ労働法を守り、ハローワークへ届け出る。**\n3.  **「暗黙の了解」を捨て、具体的でわかりやすい指示を出す。**\n\nこれらを遵守すれば、優秀な戦力として活躍してくれるはずです。",
