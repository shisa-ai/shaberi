  "question": {
    "original": "以下の文章の筆者の嫁姑問題についての意見を簡潔に述べて下さい。\n### 文章\n男性シニアブロガーさんの記事に80代の女性の\n悩みは嫁姑問題にある…\nを読みましたが本当にその通りだと思いました。\n\n60代の嫁が不機嫌で口も聞かない。\n夕食は作ってくれる。\n月に6万円払っているそうです。\n\nこじれる前に何とか解決出来なかったのかしらね。\n今の世の中では同居は無理だと思うの。\n\n愛があった夫婦関係だって怪しいのに、\nはじめから愛の無い嫁姑が、波風立てずに\n付き合うのは至難の業ですよ。\n\n別居していて年に1〜2度会うだけでも\n揉めてる人達もいるんでしょ？\n\n上手くやる方法は、会わない事が一番なのよ。\nそれを「上手くいってる」と言うのかは分\nからないけどね。\n\n兎に角、表面立ってもめたら終わりよね。\nシコリには治療法は無いんだもん。\nシコリは余命宣告した(された)のと同じだわ。\n\n娘でも同じよ。\n一人の人間として生き方を尊重してあげれば\n親の意見なんか言う必要は無いんじゃない。\n聞かれた時は別よ。\n\n「親子だから遠慮なく何でも言える」と言う人も\nいるけれど～\n私達親子は言葉には気を使うわよ。\n\n性格はお互いに良く知ってるので嫌がる事は言わないわ。\nあれは違う\nこれも違う\n服装が派手だ\n化粧が派手？\nなんて本人の自由じゃない？\n大人なんだもの。\n\n私には、嫁が二人居るけど本当の親のように\nなろうなんて無理だし無駄よ。\n\n嫁はそんなの求めてないもの。\nそもそも、私の嫁じゃないわ。\n忘れないでね、息子の嫁よ。\n\nニコニコと頷いて話を聞いてれば良いんだし、\n嫁が喋らない時は、無難な話で、息子の欠点を\n言いながら～\n「扱いが大変でしょ〜」と言ってればいいんじゃない？\n息子を褒め過ぎるのはダメよ。\nいずれにしても姑が夫婦の中を\nこじらせるような事をしたら最悪！\n\n嫁姑の中でなくても、不機嫌が顔に出る人ってどうなの？\n\n我が家は二世帯住宅と言っても、猫の出入りの為に\nドアが10センチほど開いてたり、\n私の玄関フロアに息子家の冷蔵庫があるので、\n時々嫁とも顔を合わせるけど、いつでもニコニコしてるわ。\n\nでも私、知ってるの。\n息子家に帰ると、私にニコニコする3倍も\nゲラゲラ笑って楽しそうなのを。\n\nいつでも明るい笑い声が聞こえてくるけど、\n私の家庭では無い事を肝に命じてるわ。",
    "translation_en": "**[Purpose: question]**  \n\nPlease concisely state the author's opinion on the mother-in-law/daughter-in-law (姑嫁) problem based on the following text.  \n\n### Text  \nI read an article by a male senior blogger that said the biggest worry for 80-year-old women is the mother-in-law/daughter-in-law problem… and I completely agree.  \n\nThe daughter-in-law (60s) is sullen and won’t even speak to her. She cooks dinner, though, and apparently pays 60,000 yen a month.  \n\nI wonder why they couldn’t resolve it before things got so bad. In today’s world, cohabitation is probably impossible anyway.  \n\nEven couples with love in their marriage are shaky these days, so it’s incredibly difficult for a mother-in-law and daughter-in-law without love to get along without conflict from the start.  \n\nEven if they live separately and only meet once or twice a year, there are still people who argue, right?  \n\nThe best way to handle it is to avoid seeing each other. Whether that’s what you’d call \"getting along\" is another question.  \n\nIn any case, if things come to a head and turn ugly, it’s over. A sore spot has no cure. A sore spot is like a death sentence.  \n\nThe same goes for daughters. If you respect their way of life as individuals, there’s no need for parents to impose their opinions—unless they’re asked, of course.  \n\nSome people say, \"As parents, we can say anything without holding back,\" but my family and I are careful with our words.  \n\nSince we know each other’s personalities well, we avoid saying things the other dislikes. \"That’s wrong,\" \"This is wrong,\" \"Your clothes are too flashy,\" \"Your makeup is too much?\"—isn’t that their choice? They’re adults, after all.  \n\nI have two daughters-in-law, but it’s impossible and pointless to try to become their real mother.  \n\nThey don’t want that anyway. Besides, they’re not *my* daughters-in-law. Remember, I’m the mother of their husbands.  \n\nIt’s enough to nod and listen with a smile. When the daughter-in-law is quiet, you can talk about safe topics—like pointing out your son’s flaws and saying, \"He must be hard to deal with!\" But don’t praise your son too much. Either way, it’s the worst if the mother-in-law does anything to disrupt the marriage.  \n\nWhat about people who show their displeasure on their faces, even outside of mother-in-law/daughter-in-law relationships?  \n\nIn our two-generation household, the door is always open a few inches for the cat, and my son’s family keeps their refrigerator in my entryway, so I occasionally see my daughter-in-law. But I always smile.  \n\nBut I know. When she’s at her husband’s house, she laughs three times as much and seems much happier.  \n\nI always hear cheerful laughter, but I remind myself that it’s not my home."
  },
