    "gold_original": "日本では、安楽死は「自殺」扱いとなるため刑法第202条によって嘱託（同意）殺人罪となります（「人を教唆し若しくは幇助して自殺させ，又は人をその嘱託を受け若しくはその承諾を得て殺した者は，6月以上7年以下の懲役又は禁錮に処する」）。「自殺」・「自死」は，刑法で禁止されていませんが，「自殺」企図者を幇助して死に至らしめた者は，第202条で処罰されます。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nIn Japan, assisted suicide is treated as \"suicide\" under the Penal Code Article 202, making it a crime of solicited (consented) homicide (\"Whoever solicits or assists another in committing suicide, or kills another upon their solicitation or with their consent, shall be punished by imprisonment with labor for not less than six months but not more than seven years\"). While \"suicide\" (*jisatsu*) and \"self-death\" (*jishi*) are not prohibited by the Penal Code, anyone who assists a person attempting suicide to the point of death is punishable under Article 202.  \n\n*(Note: The translation preserves the legal terminology and structure of the original while ensuring clarity in English.)*"
