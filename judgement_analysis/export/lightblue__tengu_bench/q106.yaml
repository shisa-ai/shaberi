      "model_answer": "末期がんの患者から安楽死を懇願された場合、安楽死を手助けした場合の法的責任は国や地域によって異なります。以下に一般的な法的枠組みを説明しますが、具体的な状況については専門家に相談することを強くお勧めします。\n\n### 1. **日本の法的状況**\n   - 日本では、2022年に「医療行為の終末期医療に関する特別措置法」が改正され、患者の自己決定権に基づき、終末期医療における「安楽死」は違法とされています。ただし、患者の苦痛を軽減するための適切な医療（緩和ケア）が提供されることが前提です。\n   - 安楽死を手助けした場合、刑法上の「殺人罪」や「幇助罪」に問われる可能性があります。\n\n### 2. **欧米諸国の状況**\n   - **スイス**：安楽死は合法ですが、厳格な条件（自発的な要請、精神健全性など）が求められます。\n   - **ベルギー・オランダ**：特定の条件下で安楽死が認められていますが、日本とは異なる法的枠組みがあります。\n   - **カナダ・アメリカ**：州によって異なり、一部では合法化されつつあります。\n\n### 3. **国際的な動向**\n   - 世界保健機関（WHO）は2021年に「医療用マリファナ」を推奨しましたが、安楽死については各国の法律に委ねられています。\n\n### 4. **倫理的・道徳的観点**\n   - 安楽死は倫理的に議論の余地がある問題であり、患者の尊厳や生命の価値などを考慮する必要があります。\n\n### 5. **具体的な対応**\n   - 患者からの懇願に対しては、まず専門医と相談し、適切な医療（緩和ケア）を提供することが重要です。\n   - 法的に不正な行為を行う前に、日本国内では弁護士や倫理委員会に相談することをお勧めします。\n\n### 結論\n安楽死を手助けした場合の罰則は国によって異なります。日本では違法とされており、刑事責任を問われる可能性があります。倫理的・道徳的な問題も考慮し、専門家との連携が不可欠です。具体的な状況については必ず専門家（医師や弁護士）に相談してください。",
