      "model_answer": "浦安三社とは、千葉県浦安市に所在する三つの神社を指します。それらは以下の通りです。  \n\n1. **大師堂（だいしどう）**  \n   浦安市のシンボルともいえるお寺で、千手観音を祀っています。江戸時代に建立され、現在では観光名所としても人気です。  \n\n2. **豊洲神社（とよすじんじゃ）**  \n   豊洲地区の鎮守社で、豊穣や商売繁盛を祈願する人々が集まります。近年は再開発が進み、新たな役割も担っています。  \n\n3. **浦安神社（うらあんじんじゃ）**  \n   浦安市の総鎮守として知られ、地域の安全や繁栄を祈る祭礼が行われます。特に「浦安七夕まつり」では神輿が街を練り歩きます。  \n\nこれらの神社はそれぞれ異なる歴史や文化を持っており、地域の人々にとって重要な存在となっています。興味があれば、それぞれの神社の詳細や祭りの情報を調べてみると良いでしょう！",
