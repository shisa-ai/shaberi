    "original": "以下の文章から以下の問いに答えなさい。\n### 文章\n〜物体検知・骨格推定によって重機オペレーターの死角を漏れなくカバーすることが可能に〜 株式会社Lightblue(以下Lightblue)は、清水建設株式会社（代表取締役社長：井上和幸、以下「清水建設」）および日本道路グループのエヌディーリース・システム株式会社（代表取締役社長：村井永典、以下「エヌディーリース・システム」）との共同開発により、重機用の車両搭載型安全監視カメラシステム「カワセミ」を商品化しました。Lightblueでは、このシステムの核となる物体検知・骨格推定のアルゴリズム開発を担当。従来の検知システムの制約を克服し、重機オペレータの死角を漏れなくカバーすることが可能になりました。本システムは、国土交通省の新技術情報提供システム「NETIS」に登録されています。\n◎プレスリリースの詳細はこちら\n車両搭載型安全監視カメラシステム「カワセミ」の概要 カワセミは、画像解析AIを活用して重機オペレータの死角となる後方危険区域内にいる人や車両を瞬時に検知し、警告音、ライト点灯、モニター表示等でアラートを発報するカメラ監視システムです。 建設現場で発生する災害の中で、重機接触災害は大きな問題です。狭い作業空間での重機と作業員の接触を防ぐことは、安全管理上の重要な課題となっています。「カワセミ」では、従来の検知システムの制約を克服し、より高度な安全監視を実現します。 システムは、重機オペレータの死角を監視する単眼カメラユニット、カメラユニットの撮影画像から人や車両の侵入を検知する画像解析AIサーバー、パトライト、監視モニターで構成されます。本システムの特徴は、画像解析AIに組み込んだ骨格推定アルゴリズムにより様々な作業姿勢に対応した人の検知機能を有すること、人が重機を認識しているかどうかをリアルタイムに判定できることです。また、カメラユニットは重機の種類を問わずマグネットで簡単に固定できます。\n本システムの開発にあたっては、検出アルゴリズムの開発を弊社及び清水建設が、販売計画の策定と販路開拓をエヌディーリース・システムが担当しています。\n◎お問い合わせはこちら◎\n「カワセミ」の画像解析AI（物体検知・骨格推定のアルゴリズムについて） カワセミの核となる画像解析AIは、様々な姿勢の骨格を機械学習しており、しゃがんだ状態や手荷物等に隠れて体の一部が画像に映っていない場合でも、人の存在を検知できます。また、骨格から推定した目・鼻・耳の位置関係を基に、当該人物が重機を視認しているかどうかを判断することもできます。これにより、アラートの発報レベルを「注意」から「警告」へと段階的に上げるといった運用が可能となり、危険な状況にある作業者をいち早くオペレータに知らせることができるようになります。（特許出願中）さらに、人物に加えて車両を検知する機能も備えており、重機と車両の衝突回避にも効果を発揮します。\n画像解析AIによる骨格推定 人の骨格を、右側（赤線）と左側（青線）を区別して認識することにより、様々な姿勢を推定可能 足元の推定位置（×印）により、常に安全側の評価（実際よりも重機に近い評価）となるように算定可能\n画像解析AIによる顔の向きの推定 骨格推定技術により、目・鼻・耳の位置関係から顔の向きを判定し、重機を視認しているかを確認可能\n### 問い\nこの文章中で述べられているシステムとはどのような災害に対応するものか、抜き出しなさい",
