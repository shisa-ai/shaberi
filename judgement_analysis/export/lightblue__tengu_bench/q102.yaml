    "original": "外国人アルバイトを雇用する際に気を付ける点はありますか？",
    "translation_en": "**[Purpose: Question]**  \n\nAre there any points to be aware of when hiring foreign part-time workers?  \n\n*(Note: The translation maintains the original meaning and formality while ensuring natural English phrasing suitable for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "外国人アルバイトを雇用する際には日本人を雇う際と異なる対応が必要な場合があります。具体的には以下の点に気をつけてください。\n1. 在留カードを持っているか\n在留カードを持っていない場合雇用することはできません。間違いなく本人の在留カードであるということ、有効期限が切れていないこと、「技術」「技能」「教授」など就労可能な在留資格であることなど、実質的な確認を行うようにしてください。\n2. 留学生の場合、週の勤務時間を28時間以内とする\n「留学」の在留資格の場合は資格外活動（アルバイト）の許可を受けている必要があります。また、資格外活動が許可されている留学生であっても、学校の夏休みなどの期間を除き、1週間に就労可能なのは28時間までです。この上限を超えて勤務させないように気を付けて下さい。\n3. ハローワークへの届出を行う\n外国人を雇用する場合であっても、原則としては日本人を雇用する場合と同様に、指定労働時間が一定時間を超える場合は社会保険や雇用保険に加入させる必要があります。留学生の場合は、週の勤務時間が20時間を超える場合でも、雇用保険の加入対象外となっていますが、留学生を含め、雇用保険の加入対象外となる外国人の方であっても、「外国人雇用状況届出書」によって、ハローワークへの届出が必要となっているため気をつけてください。\n\nこれ以外にも外国人との間には言語の壁や文化の違いがあるため適切な研修を予め施すことが大事だと考えられます。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nWhen hiring foreign part-time workers, different procedures may be required compared to hiring Japanese nationals. Specifically, please note the following:  \n\n1. **Residence Card Verification**  \n   You cannot employ someone without a valid residence card. Ensure the card belongs to the individual, is not expired, and has a permissible status for employment (e.g., \"Technical Intern,\" \"Skilled Labor,\" \"Professor\"). Conduct thorough verification.  \n\n2. **Student Workers (28-Hour Limit)**  \n   If the worker has a \"Student\" visa, they must have permission for \"activities outside of studies\" (part-time work). Even with permission, student workers are limited to **28 hours per week**, except during school breaks (e.g., summer vacation). Do not exceed this limit.  \n\n3. **Reporting to Hello Work (Public Employment Security Office)**  \n   Even when hiring foreigners, the same rules as hiring Japanese nationals apply: if working hours exceed a certain threshold, they must be enrolled in social and employment insurance. While student workers are exempt from employment insurance even if working over 20 hours per week, **all foreign workers (including students) who are not subject to employment insurance must still be reported to Hello Work via the \"Foreign Worker Employment Status Report.\"**  \n\nAdditionally, due to language barriers and cultural differences, it is advisable to provide appropriate training in advance.  \n\n(Translation preserves the original meaning, structure, and key details for evaluation documentation.)"
  },
