      "model_answer": "海岸に漂着しているゴミから、以下のことが分かります。  \n\n1. **プラスチックが主なゴミ成分である**：海岸のゴミの約7～8割がプラスチックで占められており（Derraik 2002）、陸上での不適切な管理や流出により海岸に漂着していることが明らかです。  \n2. **使い捨てプラスチックが多い**：年間生産量の約40%が使い捨てプラスチックであり、これらが海洋に流出しやすい傾向があります。  \n3. **特定のプラスチック素材が浮遊しやすい**：ポリエチレンやポリプロピレンなどの軽量なプラスチック（比重0.79～0.97）が海表面に浮遊しやすく、漂着量を増加させています。  \n4. **プラスチックは劣化する**：海洋環境下では光分解や熱酸化分解により微細化され、生態系への影響を引き起こす可能性があります（Andrady 2011）。  \n\nこれらの情報から、プラスチックの過剰生産と不適切な廃棄管理が海岸に大量のゴミをもたらし、特に軽量素材が問題となっていることが分かります。",
