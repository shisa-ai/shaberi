    "original": "以下の文章から問いに答えなさい。\n### 文章\nプラスチックは軽くて耐久性があるという性質から、 パソコンなどの電化製品や食品保存容器などに使われて おり私たちの身の回りに溢れている。プラスチックはセ ルロイドとして発明され、1930 年頃から世界的にプラス チックの生産が始まり、現在の世界生産量は年間 2 億 8 千万トンに達し増加傾向にある。一方で、プラスチック の年間生産量の約 40%が使い捨てのプラスチックである(Hopewell et al. 2009;PlasticsEurope 2013)。海岸を訪れる と、貝殻や海藻などと一緒に漁網や発泡スチレン、空き缶やビンなどのごみを目にする。これら海ゴミのうちプ ラスチックは 7 ~ 8 割を占めており(Derraik 2002)、こ のことから、陸上での不十分な管理によって流出したプ ラスチックの一部が海岸に漂着していることが分かる。  プラスチックの主要な素材はポリエチレン(29.6%)、 ポリプロピレン(18.9%)、ポリ塩化ビニル(10.4%)、ポ リスチレン(7.1%)である(PlasticsEurope 2013)。生産 量の多いポリエチレンやポリプロピレンは海水に対して 比重が軽く海表面に浮く(比重;ポリエチレン 0.79 ~ 0.97， ポリプロピレン 0.9 ~ 0.92)。プラスチックはポリマー重 合体として安定な構造をもっているが、海洋へ流出した プラスチックは主に光分解や熱酸化分解によって劣化し、 微細化していく(Andrady 2011)。\n### 問い\n海岸に漂着しているゴミからどのようなことが分かりますか",
