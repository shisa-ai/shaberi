    "original": "箸の扱いについてどのようなマナー違反があるか",
    "translation_en": "**[Purpose: Question]**  \n\n*What are the common etiquette violations when using chopsticks?*  \n\n(Alternatively, for a more natural phrasing: **\"What are the chopstick etiquette mistakes to avoid?\"**)  \n\n*(Note: The translation preserves the original meaning while ensuring clarity and natural English suitable for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "箸の扱いにおけるマナー違反にはいくつかの典型的な例があります。日本の食文化においては、箸の使い方には特に気を遣うべき礼儀があります。以下にいくつかの一般的なマナー違反を挙げます。\n\n1. **渡し箸（わたしばし）**\n   食事の途中で箸を食器の上に渡し置くことを指します。これは「もういりません」という意味になります。\n\n2. **迷い箸（まよいばし）**\n   食事の際に、食べ物を選ぶために箸で皿の上を行ったり来たりする行動です。これは非常に失礼とされ、また決断力のなさを示す行為とも考えられます。\n\n3. **空箸（からばし）**\n   箸を一度料理に付けたのに食べないで戻す所作を指します。\n4. **立て箸（たてばし）**\n   箸をご飯に突き刺して立てることを示します。仏式の葬儀で用いられる枕御前であり、忌み嫌われます。\n\n5. **指し箸（さしばし）**\n   人を箸で指すことです。これは非常に失礼とされる行為で、相手に対する軽蔑を示してしまいます。\n\n6. **寄せ箸（よせばし）**\n   自分の箸で皿を自分の方に引き寄せる行為です。これは食事のマナーにおいて良くない行為とされています。\n\n7. **舐り箸（ねぶりばし）**\n   お箸を口の中に深く入れて舐めたり、箸についたご飯などを舐めてとることを言います。他の人と同じ料理を共有している場合、特に避けるべき行為です。\n\n8. **銜え箸（くわえばし）**\n   箸を口にくわえる行為です。料理を盛り付けるなどの作業をしている最中に、手がふさがっている状況で見られがちですが、不衛生で不適切とされます。\n\nこれらは日本の食卓での一般的なマナー違反です。文化によってはこれらの行為が許容されることもありますが、日本においてはこれらの行為を避け、箸の正しい使い方を心がけることが大切です。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nThere are several typical examples of bad manners in chopstick etiquette. In Japanese dining culture, there are specific rules of politeness regarding chopstick use. Below are some common etiquette violations:  \n\n1. **Passing Chopsticks (渡し箸 / Watashi-bashi)**  \n   Placing chopsticks across a bowl or plate during a meal, which symbolizes \"I don’t need this anymore.\"  \n\n2. **Hesitant Chopsticks (迷い箸 / Mayoi-bashi)**  \n   Moving chopsticks back and forth over food without picking anything up, considered extremely rude and seen as indecisiveness.  \n\n3. **Empty Chopsticks (空箸 / Kara-bashi)**  \n   Picking up food with chopsticks and then putting it back without eating it.  \n\n4. **Sticking Chopsticks Upright (立て箸 / Tategashi)**  \n   Inserting chopsticks vertically into rice, resembling a funeral offering (kubizashi), which is taboo.  \n\n5. **Pointing with Chopsticks (指し箸 / Sashi-bashi)**  \n   Using chopsticks to point at people, a highly disrespectful act that conveys contempt.  \n\n6. **Pulling Food Closer (寄せ箸 / Yose-bashi)**  \n   Dragging food toward oneself with chopsticks instead of picking it up.  \n\n7. **Licking Chopsticks (舐り箸 / Neburi-bashi)**  \n   Sticking chopsticks deeply into the mouth or licking food off them. Especially inappropriate when sharing dishes.  \n\n8. **Holding Chopsticks in the Mouth (銜え箸 / Kuwaebashi)**  \n   Keeping chopsticks in the mouth while serving food, often seen when hands are occupied, but considered unhygienic and improper.  \n\nThese are common chopstick etiquette violations in Japanese dining. While some cultures may tolerate these behaviors, it is important to avoid them in Japan and practice proper chopstick use."
  },
