      "model_answer": "千葉県浦安市にある「浦安三社」とは、元町地域（昔からの漁師町エリア）にある以下の3つの神社のことを指します。\n\nこれら3つの神社は、4年に一度（オリンピックイヤー）の6月中旬に行われる**「浦安三社祭」**で合同でお祭りを行うことでも有名です。\n\n### 1. 豊受神社（とようけじんじゃ）\n*   **鎮座地:** 浦安市猫実（ねこざね）\n*   **概要:** 浦安で最も古い神社と言われています（1157年創建と伝えられています）。\n*   **御祭神:** 豊受姫大神（トヨウケヒメノオオカミ）など。衣食住の神様です。\n*   **特徴:** 境内にある大銀杏（オオイチョウ）が有名で、市の天然記念物に指定されています。\n\n### 2. 清瀧神社（せいりゅうじんじゃ）\n*   **鎮座地:** 浦安市堀江（ほりえ）\n*   **概要:** 堀江地区の鎮守様です。\n*   **御祭神:** 大綿積彦命（オオワタツミヒコノミコト）。海の神様です。\n*   **特徴:** 社殿は江戸時代の建築様式を残しており、龍の彫刻などが見事です。かつて海から龍神（女神）が現れたという伝説が名前の由来に関わっています。\n\n### 3. 稲荷神社（いなりじんじゃ）\n*   **鎮座地:** 浦安市当代島（とうだいじま）\n*   **概要:** 当代島地区の鎮守様です。\n*   **御祭神:** 豊受大神（トヨウケノオオカミ）。※一般的に稲荷神社は宇迦之御魂神を祀ることが多いですが、こちらは豊受大神を主祭神としています。\n*   **特徴:** 境内には「鯨（くじら）の塚」があり、かつて浦安が漁師町であった歴史を伝えています。厄除けの神社としても知られています。\n\n---\n\n**補足：浦安三社祭について**\nこの3つの神社が合同で行う「浦安三社祭」は、大小合わせて100基以上の神輿や山車が街を練り歩く、浦安市最大のお祭りです。「マエダ、マエダ」という独特の掛け声と、神輿を地面すれすれまで下げる「地すり」という担ぎ方が特徴的です。",
