      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "日本の食文化において、箸の使い方は非常に重要視されており、マナー違反とされる使い方は「**嫌い箸（きらいばし）**」や「**忌み箸（いみばし）**」と呼ばれます。\n\nこれらは単に行儀が悪いだけでなく、同席者を不快にさせたり、仏事（葬儀など）を連想させたりするためタブーとされています。\n\n主要なマナー違反をカテゴリー別に解説します。\n\n### 1. 絶対に避けるべきタブー（仏事に関連するもの）\nこれらは死や葬儀を連想させるため、最も縁起が悪いとされる行為です。\n\n*   **立て箸（たてばし）／仏箸**\n    ご飯の入った茶碗の真ん中に箸を垂直に突き刺すこと。死者の枕元に供える「枕飯」と同じ形になるため厳禁です。\n*   **箸渡し（はしわたし）／合わせ箸**\n    箸から箸へと食べ物を受け渡すこと。火葬後の遺骨を拾う時の動作と同じであるため、絶対に避けます。取り分ける際は皿を近づけるか、一度皿に置いてから取ってもらいます。\n\n### 2. 箸の動かし方・扱い方に関するマナー違反\n*   **刺し箸（さしばし）**\n    料理を箸で突き刺して食べること。火の通りを確認しているように見えたり、単純に行儀が悪いとされます。\n*   **迷い箸（まよいばし）**\n    「どれを食べようか」と迷って、箸を料理の上であちこち動かすこと。\n*   **探り箸（さぐりばし）**\n    汁物や盛り合わせ料理の中で、自分の好きな具材を探そうと箸でかき回すこと。\n*   **寄せ箸（よせばし）**\n    食器を箸で手元に引き寄せること。必ず手で器を持って動かします。\n*   **渡し箸（わたしばし）**\n    食事の途中で、器の上に箸を橋のように渡して置くこと。「もう食事はいりません（ごちそうさま）」という意味になるため、食事中は箸置きを使います。\n*   **指し箸（さしばし）**\n    箸で人や物を指差すこと。非常に失礼な行為とされます。\n\n### 3. 口元・衛生面に関するマナー違反\n*   **ねぶり箸**\n    箸の先を口に入れて舐めたり、箸についた汚れを舐めとること。\n*   **噛み箸（かみばし）**\n    箸の先を噛むこと。\n*   **涙箸（なみだばし）**\n    汁気のあるものを食べる際、汁をポタポタと垂らしながら口に運ぶこと。手皿（手を添えること）も実はマナー違反なので、小皿や取り皿を持ち上げて受けます。\n*   **込み箸（こみばし）**\n    口の中に大量の食べ物を箸で押し込むこと。\n*   **もぎ箸**\n    箸についた米粒などを口でもぎ取ること。\n\n### 4. その他の嫌い箸\n*   **握り箸（にぎりばし）**\n    箸を2本まとめて握りしめて持つこと。攻撃的な持ち方とされ、幼児のような印象を与えます。\n*   **叩き箸（たたきばし）**\n    箸で食器やテーブルを叩いて音を出すこと。「茶碗を叩くと餓鬼が来る」と言われ、行儀が悪いとされます。\n*   **移り箸（うつりばし）**\n    あるおかずを食べた後、ご飯を食べずに続けて別のおかずを食べること（本来は「ご飯→おかず→ご飯」のリズムが良いとされます）。\n*   **重ね箸（かさねばし）**\n    同じおかずばかり続けて食べること（「ばっかり食べ」とも言われます）。\n*   **ちぎり箸**\n    ナイフとフォークのように、両手に1本ずつ箸を持って料理をちぎること。\n*   **揃え箸（そろえばし）**\n    箸の先を揃えるために、食器やテーブルの上でトントンと突き立てること。手を使って揃えるのが正解です。\n\n### まとめ\n特に**「立て箸」「箸渡し」**は強いタブーですので注意が必要です。また、**「刺し箸」「迷い箸」「寄せ箸」**などは日常で無意識にやってしまいがちですが、同席者に不快感を与えるため控えるのが大人のマナーとされています。\n\nもし箸を休める場合は、器の上ではなく必ず「箸置き」に戻す（箸置きがない場合は箸袋で簡易的な箸置きを作るか、お盆の縁にかける）ようにするとスマートです。",
