    "original": "部分積分の公式を積の微分公式を用いてTeX形式で証明して下さい。",
    "translation_en": "**[Purpose: Question]**  \n\nProve the integration by parts formula using the product rule for differentiation in TeX format.  \n\n*(Note: The translation maintains the original intent and technical precision while ensuring natural English phrasing for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "\"部分積分の公式は以下のように表されます。\n\n\\[\\int f(x)g'(x) \\, dx=f(x)g(x)−\\int f'(x)g(x) \\, dx\\]\n\nこれを証明するために、積分の定義を用いて計算を行います。\n\n積の微分公式より\n\n\\[(f(x)g(x))'=f'(x)g(x)+f(x)g'(x)(f(x)g(x))'=f'(x)g(x)+f(x)g'(x)\\]\n\n両辺を \\(x\\) で積分すると\n\n\\[\\int (f(x)g(x))' \\, dx=\\int f'(x)g(x) \\, dx+\\int f(x)g'(x) \\, dx\\int (f(x)g(x))'dx=\\int f'(x)g(x)dx+\\int f(x)g'(x)dx\\]\n\n積分の定義より，左辺は，\n\n\\[f(x)g(x)+C（Cは積分定数）\\]\n\nである。これを移項すると，不定積分の場合の部分積分の公式を得る。\n\n\\[\\int f(x)g'(x) \\, dx=f(x)g(x)−\\int f'(x)g(x) \\, dx\\int f(x)g'(x) \\, dx=f(x)g(x)−\\int f'(x)g(x) \\, dx\\]\"",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nThe formula for integration by parts is expressed as follows:  \n\n\\[\\int f(x)g'(x) \\, dx = f(x)g(x) - \\int f'(x)g(x) \\, dx\\]  \n\nTo prove this, we use the definition of integration.  \n\nFrom the product rule of differentiation, we have:  \n\n\\[(f(x)g(x))' = f'(x)g(x) + f(x)g'(x)\\]  \n\nIntegrating both sides with respect to \\(x\\), we get:  \n\n\\[\\int (f(x)g(x))' \\, dx = \\int f'(x)g(x) \\, dx + \\int f(x)g'(x) \\, dx\\]  \n\nBy the definition of integration, the left side is:  \n\n\\[f(x)g(x) + C \\quad (\\text{where } C \\text{ is the constant of integration})\\]  \n\nRearranging this, we obtain the integration by parts formula for indefinite integrals:  \n\n\\[\\int f(x)g'(x) \\, dx = f(x)g(x) - \\int f'(x)g(x) \\, dx\\]"
  },
