    "original": "以下の文書を要約してください。\n### 文書\n2000 年の建築基準法改正に伴い性能的手法に基づ く避難安全検証手法が導入され，仕様規準に縛られな い設計を行うことが可能となった.しかし，現在の避 難安全検証手法では，排煙設備や防火設備は必ず作動 する確定論的なシナリオで評価をするが，自動消火設 備の効果は考慮しないのが一般的である.また，居室・ 階・全館と避難フェーズが進むにつれ，避難者の合流 や滞留，避難開始の遅れなど配慮すべき項目が複雑に なり，潜在的な危険性が高くなることが考えられるが，すべて一律のクライテリアの下で評価される傾向があ る.そのため，居室避難に多くの検証作業の時間を費 やす一方で，避難上重要な階避難や全館避難の検証が 疎かになる傾向があり，防火対策の重点が偏る場面が 見られる.この原因の 1 つとして現在の検証手法に火 災リスク(出火率や防災設備の作動率，避難不能者数 など)の観点が欠けていることが挙げられる.従来の 仕様規準では小規模な建物に対する規制は緩やかに， 大規模な建物は複数の対策が要求されるように(例え ば 3 階建て以上の物販店舗における階段幅はより厳し く制限されているなど)，経験的ながらも火災リスク に対する配慮が影響していたと考えられる.  そこで筆者らは，火災リスクの概念を採り入れた新 たな避難安全設計法(以後，リスクベース設計法とい う)を導入することで潜在的な危険性の大小に応じて 火災安全対策を講じることが可能な枠組みの構築を目 指している 1)~4).このリスクベース設計法では，出火 後に拡大する火災(以降，成長火災注 1 という)を対象としている.一方で，火災が小火に留まった要因を把握することは，初期消火対策に貢献する可能性があることから，防火対策上の意義がある.また，各用途の出火率や小火に至った火災の割合を定量的に把握することは，リスクベース設計法に応用することが出来るといった展望もある.\n そこで本報では，1995 年~2008 年の統計データを 用いて，建物用途別の小火特性について把握すること を目的とした.なお出火率や小火の要因は，使われ方， 出火原因や発火源，着火物，内装等の影響が考えられ る.このような出火率や小火の要因に関する一連の分 析は，今後検討する予定である.",
    "translation_en": "### Summary of the Document  \n\nWith the 2000 revision of the Building Standards Law, performance-based evacuation safety verification methods were introduced, allowing designs not bound by prescriptive standards. However, current evacuation safety verification typically evaluates smoke control and fire protection systems under deterministic scenarios where they are assumed to function perfectly, while the effectiveness of automatic fire suppression systems is often overlooked. Additionally, as evacuation progresses from individual rooms to floors and then the entire building, factors such as evacuee convergence, delays, and prolonged stays become more complex, increasing potential risks. Yet, these are often assessed under uniform criteria. Consequently, excessive verification efforts are spent on room-level evacuation, while critical floor- and building-wide evacuations are neglected, leading to imbalanced fire safety measures.  \n\nOne reason for this is the lack of fire risk perspectives (e.g., ignition rates, fire protection system reliability, and the number of individuals unable to evacuate) in current verification methods. Traditional prescriptive standards applied less stringent regulations to smaller buildings and stricter measures to larger ones (e.g., narrower stair widths in three-story or larger retail buildings), reflecting empirical considerations of fire risk.  \n\nTo address this, the authors propose a new risk-based evacuation safety design framework (hereafter, \"risk-based design\") that tailors fire safety measures to the severity of potential hazards (Refs. 1–4). This approach focuses on \"growth fires\" (fires that expand after ignition) but also recognizes the importance of understanding factors that prevent fires from escalating, which can inform initial fire suppression strategies. Quantifying ignition rates and the proportion of small, contained fires by building use could further refine risk-based design applications.  \n\nThis study analyzes statistical data from 1995–2008 to characterize small fire trends across different building uses. Factors influencing ignition rates and small fire containment—such as usage patterns, ignition sources, combustible materials, and interior finishes—will be examined in future research.  \n\n(Translation preserves technical details, logical flow, and key terms while ensuring natural English readability for evaluation documentation.)"
