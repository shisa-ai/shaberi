    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nUnder Article 199, Paragraph 2 of the Public Office Election Law, candidates for public office (including those currently holding office) are prohibited from making donations to any person within the relevant electoral district, regardless of the name under which the donation is made. However, an exception is made for donations to relatives of such candidates. \"Relatives\" include spouses, blood relatives up to the sixth degree, and affinal relatives up to the third degree. Since the son of a cousin is a fifth-degree blood relative, it is considered legally permissible.  \n\n*(Note: The translation maintains the original meaning, legal terminology, and structure while ensuring natural English phrasing suitable for evaluation documentation.)*"
