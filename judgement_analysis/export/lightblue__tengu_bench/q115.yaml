    "translation_en": "**[Purpose: Question]**  \n\nI am a politician. My cousin’s son, who lives in my constituency, is about to enter elementary school, and I would like to give him a congratulatory gift for his enrollment. Is this legally permissible?  \n\n*(Note: The translation maintains the original meaning, structure, and formal tone appropriate for a legal or official inquiry.)*"
