      "model_answer": "政治家として選挙区内の住民への支援は重要ですが、法律上問題がないか確認する必要があります。以下の点を考慮してください：\n\n1. **公務員の利益相反規定**  \n   - 政治家が個人的な関係（従兄弟の息子）を理由に特定の個人に不当な優遇措置を与えることは、利益相反とみなされる可能性があります。  \n   - 例：選挙区内で行う事業や公共事業への入札において、従兄弟の息子が関与している場合、公正性が疑われるリスクがあります。\n\n2. **政治資金規制法**  \n   - 選挙運動資金や公的資金（補助金など）を用いて個人的な贈与を行うことは違法です。  \n   - ただし、一般的な形で地域住民への支援策（例：全ての子ども向けの学用品配布）であれば問題ない場合があります。\n\n3. **倫理規定**  \n   - 多くの自治体や政党には「倫理規定」があり、公務と私生活の境界線を明確にしています。  \n   - 例：選挙区内の特定個人への特別な配慮は、他の住民との差別とみなされる可能性があります。\n\n### 推奨される対応\n- **一般的な支援策に限定**：全ての子ども向けに学用品を提供するなど、中立的な形で行うのが無難です。  \n- **記録の保持**：個人的な贈与ではなく「地域貢献」として記録し、透明性を確保します。  \n- **専門家への相談**：必要に応じて法律顧問や選挙管理委員会に確認しましょう。\n\n### 注意点\n- 過去には「親族への特別扱い」がスキャンダル化した事例もあります（例：2019年大阪府知事選での「親族優遇」問題）。  \n\n公平性と透明性を保ちつつ、地域住民全体への貢献を優先することが重要です。",
