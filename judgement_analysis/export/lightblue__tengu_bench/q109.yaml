      "model_answer": "会社を設立した際に就業規則を作成する必要性は、**従業員を雇うかどうか**によって大きく異なります。  \n\n### **1. 従業員を雇う場合（労働者が1人でもいる場合）**  \n- **法的義務があります**。労働基準法第89条に基づき、10人以上の従業員がいる事業所では就業規則を作成し、労働基準監督署に届け出る必要があります。  \n- **10人未満の場合でも**、労働条件（労働時間、賃金、休日など）を明確にするため、作成することが強く推奨されます（法的義務はありませんが、紛争防止のため重要）。  \n\n### **2. 従業員を雇わない場合（個人事業主や役員のみ）**  \n- 法的義務はありません。ただし、今後の事業拡大に備えてテンプレートを作成しておくと便利です。  \n\n### **作成時の注意点**  \n- 労働基準法やその他関連法令（例：育児・介護休業法）を遵守する必要があります。  \n- 従業員への周知・承諾が必要です（就業規則変更時も同様）。  \n\n### **参考情報**  \n- 厚生労働省「就業規則の作成・届出について」：[https://jsite.mhlw.go.jp/iwate-roudoukyoku/var/rev0/0116/7853/kisoku.pdf](https://jsite.mhlw.go.jp/iwate-roudoukyoku/var/rev0/0116/7853/kisoku.pdf)  \n\n会社設立後、早期に就業規則の有無を確認し、必要であれば専門家（社会保険労務士など）に相談することをおすすめします。",
