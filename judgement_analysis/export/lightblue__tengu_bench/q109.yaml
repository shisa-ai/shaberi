    "original": "Aさんは2023年の6月14日にはある発明についての研究を完成していたものの特許の出願方法について戸惑っていたところ2023年の6月18日にBさんがAさんに先立って同じ発明についての特許を出願しました。\nこの場合特許を受けるのはどちらの人ですか？",
    "translation_en": "**[Purpose: Question]**  \n\nA had completed research on an invention by June 14, 2023, but was unsure about the patent application process. On June 18, 2023, B filed a patent application for the same invention before A. In this case, who is entitled to the patent?  \n\n*(Note: The translation preserves the original meaning, details, and structure while ensuring natural and clear English suitable for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "特許を受けることができるのは、原則として最初に特許を出願した人です。この原則は「先願主義」と呼ばれています。したがって、このケースではBさんがAさんに先立って同じ発明について特許を出願したため、Bさんが特許を受けることができます。\n\n多くの国では、発明の公開や使用前に特許出願が行われる必要があります。もしAさんがその発明を公開していた場合、その公開が特許出願に影響を与える可能性がありますが、このケースではそのような情報は提供されていません。\n\n結論として、提供された情報に基づくと、Bさんが特許を受ける可能性が高いです。ただし、特許法は国や地域によって異なるため、具体的な状況に応じて専門家のアドバイスを求めることが重要です。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nThe principle of \"first-to-file\" generally grants patent rights to the person who first files a patent application. In this case, since B filed a patent application for the same invention before A, B is eligible to receive the patent.  \n\nIn many countries, a patent application must be filed before the invention is publicly disclosed or used. If A had publicly disclosed the invention, such disclosure could affect the patent application, but no such information is provided in this case.  \n\nIn conclusion, based on the information given, B is more likely to receive the patent. However, since patent laws vary by country and region, it is important to seek expert advice for specific circumstances."
  },
