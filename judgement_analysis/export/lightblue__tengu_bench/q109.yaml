      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "結論から申し上げますと、**「常時10人以上の従業員を使用する事業場」**であれば、法律上、就業規則の作成と労働基準監督署への届出が**義務**となります。\n\nしかし、従業員が10人未満であっても、会社を守るため、また助成金を受け取るために作成することが強く推奨されます。\n\n詳細を以下に整理しました。\n\n### 1. 法律上の義務（労働基準法第89条）\n\n*   **従業員が10人以上の場合：**\n    作成および労働基準監督署への届出が**必須**です。違反した場合は30万円以下の罰金が科される可能性があります。\n    *   ※ここでの「従業員」には、正社員だけでなく、**パートタイムやアルバイトも含みます**。\n    *   ※「常時10人以上」とは、一時的に10人未満になることがあっても、常態として10人以上が働いている状態を指します。\n\n*   **従業員が10人未満の場合：**\n    法律上の作成・届出義務はありません。\n\n### 2. 10人未満でも作成すべき理由（メリット）\n\n義務でなくとも、会社設立時（または最初の従業員を雇った時）に作成しておくべき実務的な理由は以下の通りです。\n\n*   **トラブルの防止（リスク管理）**\n    労働時間、残業代、休暇、解雇などのルールが曖昧だと、従業員との間で「言った・言わない」のトラブルになりがちです。特に、問題社員に対して懲戒処分（減給や解雇など）を行う場合、**就業規則にその根拠（懲戒規定）が明記されていないと、法的に処分が無効になる可能性が高い**です。\n*   **助成金の受給要件**\n    国（厚生労働省関連）の助成金（キャリアアップ助成金など）を申請する場合、多くのケースで**「就業規則を作成し、労働基準監督署に届け出ていること」**が要件となります。10人未満でも、助成金をもらうためには届出が必要です。\n*   **従業員の安心感**\n    ルールが明確であることは、従業員にとって「しっかりした会社である」という安心感につながり、採用や定着率に良い影響を与えます。\n\n### 3. 就業規則に記載すべき内容\n\n就業規則には必ず書かなければならない事項（絶対的必要記載事項）があります。\n\n1.  **始業・終業の時刻、休憩時間、休日、休暇**\n2.  **賃金の決定方法、計算方法、支払方法、締切日、支払日**\n3.  **退職に関する事項（解雇の事由を含む）**\n\nその他、賞与や退職金、食費などの手当がある場合は、それらについても記載する必要があります（相対的必要記載事項）。\n\n### 4. 作成・届出の流れ\n\n1.  **原案の作成**（厚生労働省のモデル就業規則などを参考にするか、社会保険労務士に依頼する）\n2.  **従業員代表の意見聴取**（過半数代表者の意見書をもらう。同意である必要はなく、反対意見でも提出は可能ですが、意見を聞くプロセスは必須です）\n3.  **労働基準監督署へ届出**（就業規則本体 + 意見書）\n4.  **従業員への周知**（ここが重要です。作成しても、従業員がいつでも見られる状態にしておかないと効力を持ちません）\n\n### まとめ\n\n*   **10人以上**なら、**絶対に必要**です。\n*   **10人未満**なら、法律上は不要ですが、**「トラブル回避」と「助成金」のために作成することを強くお勧めします**。\n\n設立当初はテンプレート（ひな形）をベースにしたシンプルなものでも構いませんので、早めに整備しておくのが経営上の安全策と言えます。",
