      "model_answer": "日本国籍の方が観光目的でチュニジアに渡航する場合、**ビザ（査証）は不要**です。\n\nただし、以下の条件を満たす必要があります。\n\n### 1. ビザ免除の条件\n*   **目的:** 観光\n*   **滞在期間:** 3ヶ月（90日）以内\n*   **パスポート:** チュニジア入国時に有効なパスポートを所持していること（滞在期間中有効であれば問題ありませんが、不測の事態に備えて有効期限に余裕があることが望ましいです）。\n\n### 2. 入国時に必要なもの・注意点\nビザは不要ですが、入国審査（イミグレーション）で以下の提示を求められる場合があります。\n*   **入国カード:** 機内または空港で配布されるカードに記入して提出します。\n*   **帰国用（または第三国への出国用）航空券:** 確実に出国することを示すため。\n*   **宿泊先の証明:** ホテルの予約確認書など。\n\n### 3. 滞在税（観光税）について\nホテルなどの宿泊施設に滞在する場合、チェックアウト時に「滞在税」の支払いが求められます（1泊あたり数ディナール程度。ホテルのランクによって異なります）。これはビザ代ではありませんが、旅行者が支払う必要がある費用です。\n\n### 注意事項\n*   **3ヶ月を超える滞在や、就労・留学目的の場合**は、事前に駐日チュニジア大使館で適切なビザを取得する必要があります。\n*   入国条件は予告なく変更される場合があります。渡航前には必ず**駐日チュニジア共和国大使館**や外務省の最新情報を確認することをお勧めします。",
