      "model_answer": "チュニジアへのビザ要件は、あなたの国籍によって異なります。以下に一般的な情報を提供しますが、最新の情報を得るために必ずチュニジア大使館や領事館、または公式政府ウェブサイトで確認してください。\n\n### 一般的なビザ要件\n1. **日本国籍**:\n   - 観光目的で90日以内の滞在の場合、ビザは不要です。\n   - 90日を超える滞在やその他の目的（就労、留学など）の場合は、事前にビザを取得する必要があります。\n\n2. **その他の国籍**:\n   - 多くの国々（特に欧米諸国）の市民は、観光目的で一定期間（通常90日以内）の滞在であればビザ免除または到着時にビザを取得できます。\n   - 一部の国々（特にアフリカやアジアの一部）は事前にビザを取得する必要があります。\n\n### 注意点\n- **到着時ビザ**: 一部の国籍は空港到着時にビザを購入できますが、その場合でも有効なパスポート（残存期間6ヶ月以上）が必要です。\n- **特別な状況**: 特定のイベントや国際会議参加者など、一部の人々には特別な手続きが必要な場合があります。\n- **最新情報**: ビザ要件は変更される可能性があるため、旅行前に必ず最新情報を確認してください。\n\n### 情報源\n- チュニジア大使館や領事館\n- チュニジア政府の公式ウェブサイト\n- 国際航空運輸協会（IATA）のTravel Centre\n\n安全で快適な旅行になるよう準備してください！",
