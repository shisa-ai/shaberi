      "model_answer": "百人一首の一字決まりは、和歌の題名や内容を一言で表す短い言葉で、歌のテーマや雰囲気を端的に伝えるものです。以下に、百人一首の代表的な一字決まりを挙げます。  \n\n1. **春**  \n   - 「春の野に花散る」  \n   - 「花見の情景」  \n\n2. **夏**  \n   - 「夏草に風過ぎて」  \n   - 「蝉時雨」  \n\n3. **秋**  \n   - 「秋の夕立に露」  \n   - 「紅葉舞う頃」  \n\n4. **冬**  \n   - 「冬枯れの木に雪」  \n   - 「雪国情緒」  \n\n5. **恋**  \n   - 「恋しき心は海底」  \n   - 「別れの悲しみ」  \n\n6. **別れ**  \n   - 「別れ道に月光」  \n   - 「永遠の別れ」  \n\n7. **旅**  \n   - 「旅路に道標なく」  \n   - 「遠くへ行く人々」  \n\n8. **山・川・海**  \n   - 「山隠す雲間より見るは平野尽きずとぞ思ふもあらずや」という歌（山）など。  \n\n9. **人生・無常観**  \n   - 「世の中は夢幻泡沫浮かび立つ」という歌（無常観）など。  \n\n10. **自然描写**  \n    - 「花鳥風月」といった自然を詠んだ歌（例：「花鳥風月　春暁　鶯鳴く　紅葉舞う　秋夜　月光　雪深し　冬朝」のような連歌）。  \n\nこれらの決まりには、季節感や感情、自然描写などが含まれており、和歌の世界観を理解するのに役立ちます。必要に応じてさらに詳しい解説や例を挙げることも可能です。",
