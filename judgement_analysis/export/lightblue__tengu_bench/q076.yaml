    "original": "百人一首の一字決まりを全て教えて下さい。",
    "translation_en": "**[Purpose: Question]**  \n\nPlease provide all the fixed opening characters (一字決まり) for the *Hyakunin Isshu* (百人一首).  \n\n*(Note: \"一字決まり\" refers to the specific opening character of each poem in the *Hyakunin Isshu* collection.)*"
  },
  "answer": {
    "gold_original": "一字決まりとは百人一首において一字（一音）を聞いただけで，下の句がわかり，札が取れるものを指します。\n具体的には以下の七つが挙げられます。\n1. む → き（むらさめの つゆもまだひぬ まきのはに きりたちのほる あきのゆふくれ）\n2. す → ゆめ（すみのえの きしによるなみ よるさえや ゆめのかよひち ひとめよくらむ）\n3. め → くもか（めぐりあいて みしやそれとも わかぬまに くもかくれにし よはのつきかな）\n4. ふ → むへ（ふくからに あきのくさきの しおるれば むへやまかせを あらしといふらむ）\n5. さ → いつこ（さびしさに やどをたちいでて ながむれば いつこもおなし あきのゆふくれ）\n6. ほ → たた（ほととぎす なきつるかたを ながむれば たたありあけの つきそのこれる）\n7. せ → われ（せをはやみ いわにせかるる たきがわの われてもすゑに あはむとそおもふ）",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nA *ichi-jiketari* (一字決まり) refers to a *Hyakunin Isshu* (百人一首) card that can be identified by hearing only the first *kana* (one mora) of the *sashi-ku* (下の句). Specifically, the following seven examples are recognized:  \n\n1. *mu* → *ki* (The dew on the autumn grass has not yet dried—*Murasame no tsuyu mo mada hinu / Makino ni kirita chi no horu / Akino yufu kure*.)  \n2. *su* → *yume* (Waves crash upon Suminoe’s shore—*Suminoe no kishi ni yoru nami / Yoru sae ya yume no kayoichi / Hitome kuramu*.)  \n3. *me* → *kumokaka* (Meeting again, or parting—*Meguriai te mi shi ya soredomo / Wakenu ma ni kumokaka kure ni shi / Yowa no tsuki kana*.)  \n4. *fu* → *muge* (In the autumn wind, the grasses wither—*Fukukara ni / Akino kusaki no / Shiorureba / Muge yama kase o / Arashi to iu ra*.)  \n5. *sa* → *itsuko* (Driven by loneliness, I leave my dwelling—*Sabishisa ni / Yado o tachi ide te / Nagamereba / Itsuko mo onashi / Akino yufu kure*.)  \n6. *ho* → *tata* (The cuckoo cries—*Hototogisu / Naku tsuru kata o / Nagamereba / Tata ari ake no / Tsuki sono koresu*.)  \n7. *se* → *ware* (The wind rushes down the mountain—*Se o hayami / Iwa ni sekaruru / Takigawa no / Warete mo sue ni / Ahamu to so omo fu*.)  \n\n*(Note: The translations preserve the original *kana* and poetic structure while ensuring clarity for evaluation documentation.)*"
  },
  "rubric": {
    "original": "- 一字決まりが何を指すかについて示している:2点\n- 一字決まりが具体的にどの句のことを示すかを示している:3点\n- 一字決まりが7種類あることを示している:2点\n- 存在する正しい句を示している:2点\n- 自然な日本語である:1点",
    "explanation_en": "**[Purpose: Rubric]**  \n\n- **Indicates what \"ichiji kettari\" refers to:** 2 points  \n- **Specifies which specific phrase \"ichiji kettari\" refers to:** 3 points  \n- **States that there are 7 types of \"ichiji kettari\":** 2 points  \n- **Lists the correct existing phrases:** 2 points  \n- **Written in natural Japanese:** 1 point  \n\n*(Note: \"Ichiji kettari\" (一字決まり) refers to a set phrase where only one character is fixed, and the rest can vary.)*"
