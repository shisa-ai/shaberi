      "model_answer": "赤玉4個、青玉2個、黄玉1個を用いて首飾りを作る方法（じゅず順列）の数を求めます。\n\n手順は以下の通りです。\n\n1.  **円順列**（回転して一致するものを同じとみなす）の数を求める。\n2.  **じゅず順列**（裏返して一致するものを同じとみなす）の数を求める。\n\n---\n\n### 1. 円順列の計算\n\nまず、すべての玉を一列に並べる場合の数（同じものを含む順列）を計算します。\n玉の合計は $4 + 2 + 1 = 7$ 個です。\n\n$$ \\frac{7!}{4! \\times 2! \\times 1!} = \\frac{5040}{24 \\times 2 \\times 1} = 105 \\text{ 通り} $$\n\n次に、これを円形に並べます。\n玉の総数は7個（素数）であり、黄玉が1個だけあるため、回転して元の並びと一致するような「繰り返しのパターン」は存在しません。したがって、単純に玉の総数 $7$ で割ります。\n\n$$ \\frac{105}{7} = 15 \\text{ 通り} $$\n\nこれが円順列の総数です。\n\n### 2. じゅず順列の計算\n\n首飾りは裏返すことができるため、線対称な配置を考慮する必要があります。\n公式としては以下のようになります。\n$$ \\text{首飾りの数} = \\frac{\\text{円順列の総数} + \\text{線対称な円順列の数}}{2} $$\n\n**線対称な配置の数を求める：**\n玉の総数が7個（奇数）なので、線対称になるためには、対称軸が「ある1つの玉」を通る必要があります。\n今回、黄玉は1個しかないので、対称軸は必ず**黄玉**を通らなければなりません（もし赤玉を通るとすると、反対側に黄玉のペアが必要になりますが、黄玉は1個しかないため不可能です）。\n\n黄玉を通る軸に対して左右対称になるには、残りの玉（赤4個、青2個）が左右に半分ずつ配置される必要があります。\nつまり、片側に「赤2個、青1個」が並ぶことになります。\n\n片側の3個（赤2、青1）の並べ方は以下の通りです。\n$$ \\frac{3!}{2! \\times 1!} = 3 \\text{ 通り} $$\n\nこれが線対称な円順列の数です。\n\n### 3. 最終計算\n\n先ほどの公式に当てはめます。\n\n$$ \\frac{15 + 3}{2} = \\frac{18}{2} = 9 $$\n\n### 答え\n首飾りの作り方は **9通り** です。",
