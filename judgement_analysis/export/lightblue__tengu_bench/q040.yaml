      "model_answer": "空が青い理由は3つあります。まず、太陽の光が大気の中を通るときに、空気の小さな粒子とぶつかり合って青く見えるようになるんです。そして、最後に説明しますが、私たちが人間だからという理由もあります。まずは太陽の光と大気の粒子の関係について見ていきましょう。\n\n昔は、空の青さは大気中の大きな塵や水滴が原因だと思われていました。しかし、それは間違いです。実際には、空を青くしているのは空気中の非常に小さな粒子、つまり酸素や窒素というガスの分子なんです。\n\n空気中には、光よりもずっと小さい酸素と窒素の分子がたくさんあります。これこそが空の本当の姿なんです。\n\n光は色々な長さを持つ波のようなもので、それをスペクトルと呼びます。最も長い波長を持つのは赤色で、一番短い波長を持つのは紫色です。青色は紫色よりも短い波長だから、大気中の粒子にぶつかる回数が多くなります。そのため、青色の光はあらゆる方向に散らばりやすくなります。\n\nこの現象を「レイリー散乱」と呼びます。この現象について数学的に証明した人がジョン・ウィリアム・ストラット（レイリー男爵）で、彼は1871年に発表しました。\n\nでも待ってください！紫色の方が一番短い波長だから、大気中でもっと散らばるはずじゃないですか？ それなら、なぜ空は紫色じゃなくて青色に見えるんでしょうか？ そこで重要なのが3つ目の理由、私たち人間であることなんです。人間の目は、光の中央にある青色をよく見るようにできています。\n\nだから、私たちは紫色よりも青色の方がずっと簡単に見ることができます。紫色の方がもっと散らばっているのに空が青く見えるのは、私たちの目が紫より青を捉えているからなんです。虹の中でも紫色を見づらいのも同じ理由ですね。",
