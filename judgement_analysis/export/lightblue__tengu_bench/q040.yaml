    "original": "以下の文章を小学生の生徒にわかりやすいように直してください。\n### 文章\n空が青い理由は3つあります。太陽光、大気中の粒子、そして見ている私たちが人間だからです。3つ目については最後に説明するとして、まずは太陽光と大気中の粒子の相互作用に注目してみましょう。\n\nかつて空の青さは、大気中の塵や水滴、そのほかの大きな粒子がつくりだしていると信じられていました。これは間違いです。空の青さをつくりだしているのは、空気中の非常に小さな粒子、空気分子そのものです。とくに酸素分子と窒素分子がカギとなります。\n光の波長よりも小さい超微小の酸素分子と窒素分子は、空気中に大量に存在しています。これこそが空の実態です。\n目に見える光は、長さの違う波長のスペクトルから成り立っています。最長の波長をもつのは赤い光で、最短の波長をもつのは青、もっと正確にいえば紫の光です。\n青の波長は短いので、大気中の酸素分子や窒素分子に、より頻繁に衝突します。その結果、衝突した青の波長はありとあらゆる方向へ散乱します。\nこれは“レイリー散乱”と呼ばれます。1871年、青い光の波長は赤い光の波長と比べて、空気中で16倍も散乱するということを数学的に証明し、それを発表したジョン・ウィリアム・ストラット、通称レイリー男爵が、この現象にはじめて言及したからです。\nでもちょっと待ってください。最短の波長をもつのは紫の光でしたよね？　紫の波長は青よりもさらに短いわけですから、空気分子との衝突もより頻繁になり、もっと散乱するはずですよね？　ではなぜ空は紫色ではないのでしょうか？そこで重要になってくるのが3つめの理由、私たちが人間である、という事実です。人間の目は、光のスペクトルの真ん中に位置する色をより鮮明に捉えられるようにできています。\nですから、紫よりも青の方が目でとらえるのがずっと簡単なのです。青の波長よりも紫の波長の方が空気中に多く散乱しているにも関わらず空が青く見えるのは、私たちの目が紫色よりも青色を捉えているからにすぎません。虹色の中で紫色がもっとも目で確認しづらいのも、同じ理由です。",
    "translation_en": "Here is the translation into natural, clear English suitable for evaluation documentation, preserving meaning and important details:  \n\n---  \n\n**[Purpose: Question]**  \n\nRevise the following text to make it easier for elementary school students to understand.  \n\n### Text  \nThere are three reasons why the sky is blue: sunlight, particles in the atmosphere, and the fact that we, the observers, are human. Let’s focus first on the interaction between sunlight and atmospheric particles, and explain the third reason later.  \n\nIn the past, it was believed that the sky’s blueness was caused by dust, water droplets, and other large particles in the atmosphere. This is incorrect. The sky’s blueness is actually created by very small particles in the air—air molecules themselves, especially oxygen and nitrogen molecules.  \n\nThese tiny oxygen and nitrogen molecules, smaller than the wavelength of light, exist in large quantities in the air. This is the true nature of the sky.  \n\nVisible light is made up of a spectrum of wavelengths of different lengths. Red light has the longest wavelength, while blue (or more precisely, violet) light has the shortest.  \n\nBecause blue wavelengths are shorter, they collide with oxygen and nitrogen molecules in the atmosphere more frequently. As a result, these blue wavelengths scatter in all directions.  \n\nThis phenomenon is called \"Rayleigh scattering.\" In 1871, John William Strutt, also known as Lord Rayleigh, mathematically proved and published that blue light scatters 16 times more in the atmosphere than red light, making him the first to describe this effect.  \n\nBut wait—didn’t we say that violet light has the shortest wavelength? Since violet wavelengths are even shorter than blue, they should collide with air molecules even more often and scatter even more. So why isn’t the sky violet? This is where the third reason comes in: the fact that we are human.  \n\nHuman eyes are better at perceiving colors in the middle of the light spectrum. Therefore, blue is easier for us to see than violet. Even though violet wavelengths scatter more in the air, the sky appears blue because our eyes pick up blue more strongly than violet. The same reason explains why violet is the hardest color to see in a rainbow.  \n\n---  \n\nThis translation maintains the original meaning while simplifying the language for clarity and accessibility. Let me know if you'd like any further refinements!"
  },
  "answer": {
    "gold_original": "空が青い理由は、太陽の光、空気の中の小さい物質、それから私たちが人間だから、の3つがあります。最初に太陽の光と空気の粒子について話しますね。\n\n昔、みんなは空の青さは空気中のホコリや水の粒などが作っていると考えていたんだけど、これは実は間違っていて、本当は、空気中にたくさんあるすごく小さい物質が空の青さを作っています。\n\n光は、実はいろんな長さの波からできていて、赤い光が一番長くて、青や紫の光が一番短いってことがわかっています。青い光は短いから、空気中にたくさんあるすごく小さい物質とぶつかりやすくて、色んな方向にバラバラになります。これを「レイリー男爵」という人が、青い光は赤い光より16倍も多くバラバラになるって証明したんだよ。\n\nでも、本当は紫の光が一番短いから、もっとバラバラになるはずだよね？じゃあ、なんで空が紫色じゃないの？それは、私たち人は、目で青を紫よりはっきり見ることができるから。虹を見るときも、紫が一番見つけにくいのは、このせいなんだよ。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nThe reason the sky is blue is due to three factors: sunlight, tiny particles in the air, and the fact that we are human. First, let’s talk about sunlight and air particles.  \n\nIn the past, people thought the sky’s blueness was caused by dust or water droplets in the air, but that was actually wrong. In reality, it’s the extremely small particles abundant in the air that create the blue sky.  \n\nLight is actually made up of waves of different lengths, with red light being the longest and blue and violet light being the shortest. Because blue light has a shorter wavelength, it collides more easily with the tiny particles in the air and scatters in many directions. Lord Rayleigh proved that blue light scatters 16 times more than red light.  \n\nBut if violet light is even shorter, shouldn’t it scatter even more? Why isn’t the sky violet, then? The reason is that human eyes perceive blue more vividly than violet. That’s also why violet is the hardest to see in a rainbow.  \n\n*(Note: The translation maintains the original tone and structure while ensuring clarity and natural English phrasing for evaluation documentation.)*"
