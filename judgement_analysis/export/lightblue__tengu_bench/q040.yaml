      "model_answer": "### 空が青い理由をわかりやすく説明しよう！  \n\n空が青く見える理由は、3つあります。1つ目は太陽の光、2つ目は空気の中にある小さな粒子、そして3つ目は「私たちが人間だから」です。最後の理由は後で説明します。まず、太陽の光と空気の粒子の関係から見ていきましょう。  \n\n昔は、空の青さは大きな塵や水滴が作っていると考えられていましたが、これは間違いです。本当の原因は、空気の中にたくさんある「超小さな酸素や窒素の粒子」です。これらの粒子は光よりもずっと小さいんです。  \n\n太陽から出る光には、いろいろな色（赤・オレンジ・黄・緑・青・藍・紫）が混ざっています。この中で、赤い光が一番長くてゆっくり進みます。一方、青や紫の光は短くて早く進みます。  \n\n青い光は波長が短いので、大気中の酸素や窒素とよくぶつかります。そのため、あらゆる方向に散らばってしまいます。これを「レイリー散乱」と呼びます。この現象を最初に解明したのがレイリー男爵という科学者でした。  \n\nでも…紫色も青よりさらに短い波長を持っているのに、なぜ空は紫色にならないのでしょう？ ここで大事なのが、私たち人間の目の特徴です。人間の目は、中間くらいの色（特に青）をよく見るようにできています。そのため、紫よりも青の方が目に入りやすいのです。虹を見ても紫色が薄く見えるのも同じ理由です！  \n\nだからこそ、私たちの目には空が青く見えるんですよ！",
