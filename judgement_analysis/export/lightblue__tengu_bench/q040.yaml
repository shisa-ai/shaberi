      "model_answer": "小学生のみなさんにもわかるように、言葉をかんたんにして説明しますね。\n\n***\n\n### 空はどうして青いの？\n\n空が青いのには、3つの理由があります。「太陽の光」、「空気」、そして「私たち人間の目」です。\nじゅんばんに見ていきましょう。\n\n**1. 空気には「小さなつぶ」がたくさんある**\n昔の人は、空にあるチリや水てきが空を青くしていると思っていました。でも実は、空気そのものを作っている「酸素（さんそ）」や「窒素（ちっそ）」という、目に見えないくらい**小さなつぶ**が理由なんです。\n\n**2. 太陽の光は「虹色（にじいろ）」のまざりもの**\n太陽の光は白っぽく見えますが、実は虹（にじ）のようにいろいろな色が混ざっています。\n光は「波」のように進むのですが、色によって波の大きさがちがいます。\n*   **赤い光**は、波が大きくてゆったりしています。\n*   **青や紫（むらさき）の光**は、波が小さくて細かいです。\n\n**3. 青い光はあちこちに散らばる**\n太陽の光が空気の中を通るとき、波の大きい「赤い光」は、空気の小さなつぶにぶつからずに通りぬけます。\nでも、波が細かい「青い光」は、空気のつぶにたくさんぶつかってしまいます。ぶつかった青い光は、空のあちこちに散らばります。\nこれを**「レイリー散乱（さんらん）」**と言います。\n空を見上げると、この散らばった青い光が目に入ってくるので、空が青く見えるのです。\n\n**4. どうして紫（むらさき）色じゃないの？**\nここでふしぎなことがあります。\n「青」よりも「紫」のほうが、もっと波が細かくて、もっとたくさん散らばっているはずです。それなら、空は紫色に見えるはずですよね？\n\nここで3つ目の理由、**「人間の目」**の登場です。\n実は、人間の目は「紫」よりも「青」のほうを感じやすいようにできています。\n空には紫の光もたくさん散らばっているのですが、私たちの目が青色を優先してキャッチしているため、空はきれいな青色に見えるのです。\n\n**まとめ**\n空が青いのは、\n1.  太陽の光の中で、**青い光がたくさん散らばっているから**。\n2.  その中でも、人間の目が**青色を見つけやすいから**。\n\nこの2つが重なって、空は青く見えているんですよ。",
