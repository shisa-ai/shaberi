      "model_answer": "Ａ君、Ｂ君、Ｃ君の速さをそれぞれ $v_A, v_B, v_C$ とします。\n距離 ＝ 速さ × 時間 の関係を使って式を立てていきます。\n\n**１．Ｃ君がＢ君に追いついた時の状況**\nＣ君は出発して５分後にＢ君に追いつきました。\nＡ君とＢ君が出発してからＣ君が出発するまでに５分の差があるので、それぞれの移動時間は以下のようになります。\n\n*   Ｃ君が走った時間：$5$ 分\n*   Ｂ君が歩いた時間：$5$（Ｃ君出発までの時間）$+$ $5$（Ｃ君が走った時間）$= 10$ 分\n\n追いついた地点までの距離は等しいので、以下の式が成り立ちます。\n$$v_B \\times 10 = v_C \\times 5$$\n両辺を５で割ると：\n$$2 \\times v_B = v_C$$\nよって、Ｂ君とＣ君の速さの比は\n$$v_B : v_C = 1 : 2 \\quad \\cdots \\text{①}$$\n\n**２．Ｃ君がＡ君に追いついた時の状況**\nＣ君はＢ君に追いついてから、さらに２０分後にＡ君に追いつきました。\nつまり、Ｃ君が出発してからＡ君に追いつくまでの合計時間は $5 + 20 = 25$ 分です。\n\n*   Ｃ君が走った時間：$25$ 分\n*   Ａ君が歩いた時間：$5$（Ｃ君出発までの時間）$+$ $25$（Ｃ君が走った時間）$= 30$ 分\n\n追いついた地点までの距離は等しいので、以下の式が成り立ちます。\n$$v_A \\times 30 = v_C \\times 25$$\n両辺を５で割ると：\n$$6 \\times v_A = 5 \\times v_C$$\nよって、Ａ君とＣ君の速さの比は\n$$v_A : v_C = 5 : 6 \\quad \\cdots \\text{②}$$\n\n**３．３人の速さの比を合わせる**\n①と②の式には共通してＣ君（$v_C$）が含まれています。\n①では $v_C$ が $2$ の割合、②では $v_C$ が $6$ の割合になっています。\nこれらを合わせるために、①の比を３倍にして $v_C$ を $6$ に揃えます。\n\n*   ①より、$v_B : v_C = 1 : 2 = 3 : 6$\n*   ②より、$v_A : v_C = 5 : 6$\n\nこれらをまとめると：\n$$v_A : v_B : v_C = 5 : 3 : 6$$\n\n**答え**\n**５ ： ３ ： ６**",
