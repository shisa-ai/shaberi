    "original": "Ａ君とＢ君がＸ地点を同時に出発して,Ｙ地点までそれぞれ一定の速さで歩\nき続けました。\nＣ君は２人が出発して５分後にＸ地点を出発し,一定の速さで走り続けて２人を追いかけました。\nＣ君は出発して５分後にＢ君に追いつき，その２０分後にＡ君に追いつきました。\n\n今、Ａ君,Ｂ君,Ｃ君の速さの比をできるだけ簡単な整数の比で表しなさい。",
    "translation_en": "**[Purpose: Question]**  \n\nA and B started walking from point X to point Y at the same time, maintaining constant speeds. C departed from point X 5 minutes after A and B, running at a constant speed to catch up with them. C caught up with B 5 minutes after starting, and then caught up with A 20 minutes after that.  \n\nExpress the ratio of A, B, and C's speeds in the simplest possible integer ratio.  \n\n---  \n*(Translation preserves the original meaning, structure, and details without adding commentary.)*"
  },
  "answer": {
    "gold_original": "まずB君とC君が出会ったタイミングを考える。2人が出会った時点でB君は 5+5 = 10分歩き続けている一方で、C君は5分走っている。2人が移動した距離が等しいことからB君とC君の速さの比は 5 : 10 = 1 : 2 であるとわかる。\n次にA君とC君が出会ったタイミングを考える。2人が出会った時点でA君は 5+5+20 = 30分歩き続けている一方で、C君は5+20 = 25分走っている。2人が移動した距離が等しいことからA君とC君の速さの比は 25 : 30 = 5 : 6 であるとわかる。\nよってB君とC君の速さの比である1 : 2 と、A君とC君の速さの比である5 : 6を総合するとB君とC君の速さの比の両辺を3倍して3 : 6とすることでB君とC君の速さの比のC君の速さとA君とC君の速さの比のC君の速さが等しくなるため、Ａ君,Ｂ君,Ｃ君の速さの比は5 : 3 : 6であるとわかる。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nFirst, consider the timing of when B and C met. At the moment they met, B had been walking for 5 + 5 = 10 minutes, while C had been running for 5 minutes. Since the distances they traveled were equal, the ratio of B's speed to C's speed is 5 : 10 = 1 : 2.  \n\nNext, consider the timing of when A and C met. At the moment they met, A had been walking for 5 + 5 + 20 = 30 minutes, while C had been running for 5 + 20 = 25 minutes. Since the distances they traveled were equal, the ratio of A's speed to C's speed is 25 : 30 = 5 : 6.  \n\nTherefore, combining the speed ratio of B to C (1 : 2) and the speed ratio of A to C (5 : 6), we can equalize C's speed by multiplying the ratio of B to C by 3, resulting in 3 : 6. This makes C's speed in both ratios equal, allowing us to determine that the speed ratio of A, B, and C is 5 : 3 : 6.  \n\n*(Note: The translation maintains the original structure and mathematical reasoning while ensuring clarity in English.)*"
  },
