      "model_answer": "A君、B君、C君の速さをそれぞれ \\( v_A \\)、\\( v_B \\)、\\( v_C \\) とします。距離は \\( d \\) とします。\n\n1. **A君とB君の関係**  \n   A君とB君は同時に出発し、一定の速さで歩き続けます。C君がB君に追いつくまでの時間を考えます。\n\n2. **C君がB君に追いつくまでの時間**  \n   - C君は5分遅れて出発し、さらに5分後にB君に追いつくので、C君が歩いた時間は10分（＝1/6時間）です。  \n   - B君はこの時点で15分（＝1/4時間）歩いています。  \n   - 距離は同じなので、\\( v_B \\times \\frac{1}{4} = v_C \\times \\frac{1}{6} \\) となり、\\( v_C = \\frac{3}{2}v_B \\) です。\n\n3. **C君がA君に追いつくまでの時間**  \n   - C君がB君に追いついた後20分後にA君に追いつきます。この時点でC君が歩いた総時間は30分（＝1/2時間）です。  \n   - A君はこの時点で35分（＝7/12時間）歩いています。  \n   - 距離は同じなので、\\( v_A \\times \\frac{7}{12} = v_C \\times \\frac{1}{2} \\) となり、\\( v_C = \\frac{7}{6}v_A \\) です。\n\n4. **比率を求める**  \n   上記から \\( v_C = \\frac{3}{2}v_B = \\frac{7}{6}v_A \\) が得られます。これを整理すると：  \n   \\( v_A : v_B : v_C = 6 : 7 : 9 \\)\n\nしたがって、A, B, Cの速さの比率は **6:7:9** です。",
