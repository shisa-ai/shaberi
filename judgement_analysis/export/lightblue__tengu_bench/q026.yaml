    "original": "以下の会話を要約してください。\n### 会話\n○田野瀬委員長　これより質疑に入ります。\n　質疑の申出がありますので、順次これを許します。柚木道義君。\n○柚木委員　よろしくお願いします。立憲民主党の柚木道義でございます。\n　ＪＡＸＡ法、十項目ぐらい通告させていただいておりますが、先ほど理事会でもちょっと御了解いただいて、この後、連合審査の決議も実はある中で、事実上、一般が二回飛ぶものですから、ちょっと先にそれ以外のところを質疑させていただいて法案に入りますので、よろしくお願いいたします。\n　まさに予算委員会でも、この文科委員会所管でもあるオリンピックのまさに官房機密費の問題で、非常に我々は理事会、理事懇の中でも、予算委員会同様に、当時の馳元文科大臣、自民党の推進本部長でいらっしゃったということで、一切もう口をつぐんでしまわれているわけですが、これは機密費といっても税金を使ってのことですから、是非この委員会でも招致させていただいて御説明をいただきたいということを理事会、理事懇の中でも申し上げているところです。\n　先にそちらから行きますと、資料の十八ページ目以降を御覧いただきたいんですね。いわゆる「はせ日記」、これが二〇一三年四月の一日に、この十八ページを御覧いただくと、十五時二十分に官邸に行って、そして、菅官房長官に五輪招致本部の活動方針を報告し、御理解をいただくと。その中身のメニューとして五ポツの、思い出アルバム作戦ということなんですね。そして、その次のページを御覧いただきますと、安倍総理も強く望んでいることだから、政府と党が連携をして、しっかりと招致をかち取れるようにお願いしますという、文脈でいえば、当然これは菅官房長官からハッパをかけられたんだと思いますが。\n　このやり取りを、これは文科大臣にも通告しているんですが、先に内閣官房の方に。今日、須藤審議官、お越しいただいています。当然、どういうやり取りがあったかということを記録をされていると思いますので、通告しておりますので、明確かつ簡潔に御答弁お願いします。\n○須藤政府参考人　お答えいたします。\n　内閣官房におきまして確認したところ、当時の事実関係を確認できる資料は残っておりませんでした。\n○柚木委員　当時の事実関係を確認できる資料はそろっていない。\n　一応、では、文部科学省、文科大臣にも伺いますが、当然、馳本部長は文科省、スポ庁にも報告をしながら進めていて、なおかつ、今回、今、十一月の十八日ですか、私も改めて、要は官房機密費で思い出アルバム作戦、しっかりやったんだ、しかしこれはないしょだぞという発言を拝見しましたが、どういう文脈で見てもこれは事実だなと思って見ておりましたが、当時、どういう報告を文科省、スポ庁にしながら思い出アルバム作戦を進めたのか。\n　また、併せて、今般の十一月十八日、機密費で思い出アルバム発言、これ以降のやり取り、これは文科省から何か指摘があって全面撤回というふうに馳氏は言われているわけですから、この二点を簡潔に御答弁をお願いします。\n○茂里政府参考人　お答え申し上げます。\n　まず、二点いただきました。\n　二〇一三年の話でございますが、御指摘の点、当時、こうした内容につきまして文部科学省に対して報告があった、そういう事実は確認されてございません。\n　もう一点、今回の馳知事の発言でございます。今月十七日の夜に、スポーツ庁の担当者から、石川県の東京大会招致に関する発言の有無などに関して問合せを行ったところでございます。その際、石川県から、今回の知事の発言は事実誤認であり、全面的に撤回するとの連絡がございました。\n　なお、スポーツ庁から発言の撤回を促すような指摘を行ったということはございません。\n○柚木委員　微妙に馳氏の発言というのが今の答弁と食い違っていますね。文科省から指摘があって、事実誤認、全面撤回。しかし、今の答弁だと、そういった指摘をした事実はないというのが答弁。ということは、結局、馳さん御本人の中で事実誤認そして全面撤回ということになっているわけですね。スポ庁としてそういう指摘をした事実がないということですからね。\n　文部科学大臣、こういう状況ですよ。これは本当に、機密費といえども税金ですから、オリンピック憲章、倫理規程違反、こういったものに使われていいはずもありませんが、今のそれぞれの、内閣官房、当時の菅官房長官への報告、記録が残っていない。そして、スポ庁の今の次長の御答弁でも、要は、指摘した事実はない、事実誤認。\n　こうすると、このことを分かるのは誰なんでしょうかね。文科大臣、お分かりになりますか、事実関係。\n○盛山国務大臣　先ほどスポーツ庁の方から御答弁申し上げたとおりで、我々の方から石川県側にコンタクトをしておりませんですし、まあコンタクトはしたんですけれども、発言について我々の方から撤回その他の指示をしたということもありませんですし、また石川県側からも、もうこの発言は撤回しておりますのでという表現であります。そしてまた、私どもの方にもそういうようなやり取りについての資料は残っておらないということで、当省としては全く分からないということで御理解賜りたいと思います。",
    "translation_en": "**Summary of the Conversation:**  \n\n**Yugiki (Member of the House of Representatives, Constitutional Democratic Party):**  \n- Requests to question the JAXA bill but first addresses the issue of the \"Office Secrets Fund\" (官房機密費) related to the Tokyo Olympics, which was discussed in the Budget Committee and the Science and Technology Committee.  \n- Refers to a document (page 18 onward) from 2013, where then-Chief Cabinet Secretary (菅官房長官) was briefed on the \"Memory Album Campaign\" (思い出アルバム作戦) for the Olympics bid, with Prime Minister Abe strongly supporting it.  \n- Asks Mr. Sudo (Government Referent) from the Cabinet Office if there are records of this briefing, but Sudo states no such records exist.  \n- Then questions Mr. Shiro (Government Referent) from the Ministry of Education, Culture, Sports, Science and Technology (MEXT) about whether the then-Chief Cabinet Secretary (馳) reported this to MEXT or the Sports Agency (スポ庁) and whether the \"Memory Album Campaign\" was conducted under the Office Secrets Fund.  \n- Also asks about the recent (November 18) statement by Mr. Ito (presumably referring to Mr. Ito, not Mr. Ito from the previous context) about the Office Secrets Fund, which was later retracted due to factual errors, and whether MEXT or the Sports Agency made any such retraction requests.  \n- Shiro states that no reports were made to MEXT in 2013 and that the Sports Agency did not request a retraction, only receiving confirmation from Ishikawa Prefecture that the statement was retracted due to factual errors.  \n\n**Minister Moriyama (MEXT):**  \n- Confirms that MEXT did not contact Ishikawa Prefecture regarding the statement, nor did it request a retraction.  \n- States that MEXT has no records of such interactions and is unaware of the details.  \n\n**Key Points:**  \n- No records exist of the 2013 briefing to the Chief Cabinet Secretary about the \"Memory Album Campaign.\"  \n- The recent statement about the Office Secrets Fund was retracted due to factual errors, but MEXT and the Sports Agency did not request the retraction.  \n- The Minister of MEXT is unaware of the full details and has no records of the interactions.  \n\n*(Note: The translation preserves the original meaning and details without adding commentary.)*"
