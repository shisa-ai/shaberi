    "gold_original": "労働基準法第89条によると常時10人以上の労働者を雇用している会社は必ず就業規則を作成し、労働基準監督署長に届け出なければなりません。しかし、会社を設立した直後に10人以上雇っていることは稀だと考えられるため大体の場合においては就業規則を作成必要はないと考えられます。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nAccording to Article 89 of the Labor Standards Act, companies employing 10 or more workers on a regular basis must create and submit a set of employment rules to the Labor Standards Inspection Office. However, since it is rare for a company to employ 10 or more workers immediately after establishment, in most cases, there is no need to create employment rules at that time.  \n\n*(Note: The translation preserves the original meaning and details while ensuring natural and clear English suitable for evaluation documentation.)*"
