    "original": "会社を設立した際に就業規則を作成する必要はありますか？",
    "translation_en": "[Purpose: Question]  \n\nIs it necessary to create a set of employment rules when establishing a company?  \n\n(Translation preserves the original meaning and formality while ensuring natural English phrasing suitable for evaluation documentation.)"
