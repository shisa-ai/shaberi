  "question": {
    "original": "以下の文章をもとに問題に答えよ\n### 文章\nアフリカ文学はナショナルなものたらんとして誕生し,批評,文学研究 はそれに呼応する形で自らの対象を生み出した。現在アフリカ文学として知られる,ヨ ーロッパ語による文学伝統の嚆矢となったのは,1930年代のパリで,サンゴール,セゼール らの手 によってフランス語で生み出されたネグリチュードという文学運動だった。それはフランスの 「われわれ」に回収され,統合されることを拒 み,別の「われわれ」を立ち上げようとする試みであり,黒人,アフリカ人としての 「われわれ」を主体として形 成し,西欧国民国家の文学という制度を通して,人々を 新たな 「われわれ」 に動員することによって,黒 人 あるいはアフリカ人 としての 「国民/民 族」 を形成 しようと する文学的ナショナリズムだった。そして,西 欧 によるアフリカ文学批評の嚆矢 と言 って もよいサルトルの 『黒いオルフェ』(1947)は,ネグリチュードを歴 史の弁証法の弱泊 と して位置づ ける,一 見冷静で俯瞰的な眼差しにもかかわらず,心 地よい自文化 の まどろみの中に突如立ち上 がってきた 「他者」の眼差しに戦標し,フランス語の 「われわれ」に回収し得ない 異質な 「われわれ」の存在を感じ取る,ネグリチュード のナショナリズムに敏感 に呼応す るものだった。\n英語圏において も,1950年 代 にチュチュオーラの 『ヤシ酒飲み』が 「プリミティブな文体」と「荒唐無稽な」物 語の ゆ えに イギ リス人読者の 間で物議 をか も した後, 1960年代から70年代にかけて,ユリ・ベイヤー,ジェラルド・ムーア,チャールズ ・ラーソンといった批評家 が, ヨーロッパ文学 とは異 なる,アフリカ文学 とい う独自の世界が存在するのだ,と いうことを論じ始めている。 こうした最初期の,ナショナリズムとしてのアフリカ 文学の誕生 に呼応す る形 で表 れた批評,研 究 は,し ば しばかなり性急なエッセンシャリズムの傾向を持っていた。 なかで もよく知 られてい るの は,生 まれつつ あったアフ リカ文学の本質 を,『ム ン トゥ』 などに よって当時流布 し ていたアフリカ哲学の諸価値に還元しようとした,ド イ ツ人批 評家ヤンハインツ ・ヤ ーンだろ う。ベル ギー人 リリアン・ケステロートの 『フランス語黒人作家たち』も 「黒人世界の価値」をネグリチュードに呼応する形で語るものだ った。\nこうした傾 向は,ア フリカ人作家 自身の主意主義的ナショナリズムとの共 犯関係 を構成 す るかの ように,そ の 後 も形 を さま ざまに変 えなが ら続 いてい った。 しきりに 口承文芸の影響 を語 り,チュチュオー ラヘの批評 の場合 に見られたように,ア フリカ人作家の英語やフランス語 の中に独自の アフ リカ的文体 を見いだそ うとす る傾向 も,こうした中か ら現れて きた もので ある。\n次 に現れて きたの は,ア フ リカ文学 を一連 のテーマ群に還元 しようとす る研究の スタイル である。これ はアフ リカ人作家たちが ネグ リチ ュー ドの人種的,大陸的語 り を離れ,個 別の アフ リカ人社会 とその 中の人間が直面する諸問題を主題とし始めたことに対応しているが,同 時 に,1970年代以降,英,米,仏 などのヨーロッパ諸国と 新 しいア フリカの独立諸 国の大学において,ア フリカ文 学 が学位論文の テーマ として取 り上げ られ るようになってか ら顕著 に見 られるようになってきたもので ある。 何よりも,欧 米のアカデミズムに大きく依存したまま とはいえ,ア フ リカ人 によ るア フリカ文学研究 が徐 々に 主要 な位置 を占め るよ うにな って きていた。ア フリカ人作家の作品の中に,伝 統と近代,農 村と都市という価値 対立の問題が読み込 まれ,さ らに独立 国家の矛盾 が,無 視 されて きたア フ リカ人女性の問題 が読 み込 まれてい っ た。アパルトヘイト下の南アフリカの黒人文学が,強 い 共感を持って迎えられたの もこの時代であった。しかし,ア フ リカ文学に現実の アフ リカ社会の諸問題 を読み込もうとするこうした傾向も,大 陸的,人 種的な 語りに呼応する本質還元主義とは異なった形で,ナ ショナルなものという大きな枠組みは共有しつづけていた。\n### 問題\nネグリチュードとはなんですか。",
    "translation_en": "**Negritude** was a literary movement that emerged in the 1930s in Paris, spearheaded by figures such as Senghor and Césaire, and written in French. It was a rejection of being subsumed and integrated into the French \"we,\" instead attempting to establish a different \"we\" centered on the identity of Black and African people. This literary nationalism sought to form a \"nation/ethnicity\" of Black or African individuals by mobilizing people through the institution of Western national literature, thereby creating a new collective identity.  \n\nSartre’s *Black Orpheus* (1947), often considered the beginning of Western African literary criticism, positioned Negritude as a moment of weakness in the dialectic of history. Despite its seemingly detached and panoramic perspective, it was sensitive to Negritude’s nationalism, reacting to the sudden emergence of the \"other\" from the comfortable slumber of self-culture and perceiving the existence of an alien \"we\" that could not be reclaimed by the French \"we.\"  \n\nIn the English-speaking world, Chinua Achebe’s *Things Fall Apart* (1958) sparked controversy among British readers due to its \"primitive style\" and \"absurd\" narrative. From the 1960s to the 1970s, critics like Yulie Beyer, Gerald Moore, and Charles Larson began arguing that African literature constituted a distinct world separate from European literature. These early critical and scholarly responses to the birth of African literature as nationalism often exhibited a tendency toward hasty essentialism. A well-known example is German critic Janheinz Jahn, who attempted to reduce the essence of emerging African literature to the values of African philosophy, as circulated at the time in works like *Muntu*. Belgian critic Léon Kesteloot’s *Black French Writers* also spoke of \"the values of the Black world\" in a manner resonant with Negritude.  \n\nThis trend continued in various forms, often in complicity with the self-centered nationalism of African writers themselves. The tendency to emphasize the influence of oral literature and to seek a unique African style in African writers’ English or French, as seen in Achebe’s criticism, also emerged from this context.  \n\nThe next phase involved studies that reduced African literature to a series of thematic groups. This corresponded to African writers moving away from Negritude’s racial and continental narratives to focus on the specific issues faced by individual African societies and their people. At the same time, as African literature became a topic for doctoral theses in European and newly independent African universities from the 1970s onward, this approach became more prominent. African scholars gradually began to occupy a more central role in African literary studies, despite remaining heavily reliant on Western academia. Themes of value conflicts—tradition vs. modernity, rural vs. urban—were read into African writers’ works, along with the contradictions of independent states and the previously overlooked issues of African women. Black South African literature under apartheid was warmly received during this period. However, this tendency to read real-world African social issues into African literature, while different from the essentialist reductionism of continental or racial narratives, continued to share the overarching framework of the \"national.\"  \n\n**Answer:**  \n**Negritude** was a 1930s French-language literary movement led by figures like Senghor and Césaire, rejecting assimilation into French identity and instead asserting a collective Black/African identity. It was a form of literary nationalism that sought to mobilize people through Western literary institutions to create a new \"nation/ethnicity\" of Black or African individuals. Sartre’s *Black Orpheus* (1947) positioned Negritude as a moment in the dialectic of history, reacting to the emergence of the \"other\" and perceiving an alien \"we\" that could not be reclaimed by the French \"we.\" The movement influenced early African literary criticism, which often exhibited essentialist tendencies, such as reducing African literature to African philosophical values. This trend continued in various forms, including the emphasis on oral literature and African stylistic elements in English or French writing. Later, African literature was studied thematically, reflecting the shift from Negritude’s broad narratives to specific societal issues, while still operating within a national framework."
