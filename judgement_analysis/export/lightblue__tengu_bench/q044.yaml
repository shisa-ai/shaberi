          "judge_output": "[該当する評価項目とその簡潔な理由]\n- 具体的な土地名を提案している:2点  \n  - 八王子、立川、府中、武蔵野、調布、島嶼部（大島など）と具体名を挙げている。\n- 実際に東京に存在する土地である:2点  \n  - いずれも東京都内の自治体・地域として実在する。\n- 激戦区でない東京の土地でラーメン屋を始めようとしているという前提を踏まえている:1点  \n  - 「多摩地域」「西東京地域」「物価が安く、新規参入しやすい」として都心の激戦区を避ける意図はあるが、八王子・立川・武蔵野（吉祥寺を含む）・調布などはラーメン的にはかなり競合も多く、「激戦区ではない」という前提への配慮がやや弱い。\n- 説明が具体的でわかりやすい:2点  \n  - 各エリアの特徴やターゲット、独自性、SNS活用、地域連携など具体的に述べられている。\n- 実現性の高い提案である:1点  \n  - 多摩・西東京を候補にし、ターゲット設定や差別化、SNS活用など現実的な戦略になっている。\n- 自然な日本語である:1点  \n  - 全体として自然で読みやすい日本語。ごく軽微な不自然さ（「人気を集えます」など）はあるが減点するほどではない。\n\n[計算式]\n2 + 2 + 1 + 2 + 1 + 1 = 9\n\n[点数]\n9\n\nFINAL SCORE: 9",
