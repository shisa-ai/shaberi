      "model_answer": "ご提示いただいた文書の要約は以下の通りです。\n\n**要約：子どもの「居場所」に関する動向と研究の課題**\n\n1.  **社会的背景と変遷**\n    1980年代の不登校増加を機に、フリースクールなど学校外の「居場所」が注目され、その後、文部省の方針により学校内や地域での「居場所づくり」が推進されるようになった。関心は「居場所がない」ことへの着目から、積極的に「居場所を作る」動きへと進展しているが、対象そのものを分析した研究はまだ少ない。\n\n2.  **定義の曖昧さ**\n    「居場所」という言葉は、本来の「物理的に人がいる場所」という意味に加え、現在では「安心できる」「自己存在感が得られる」といった**心理的な意味**を含んで使われている。しかし、その定義は統一されておらず、実証データに基づいたものでもない。\n\n3.  **研究アプローチの課題**\n    これまでの研究（地理学的な生活空間の調査や、学校への在籍調査など）は、物理的な所在を対象とすることが主流である。しかし、これらは「本人は行きたくないが仕方なくいる場所」なども含んでしまい、本人の主観的な感情が無視されるため、現代的な「心理的な意味を含む居場所」を捉えるには不十分である。",
