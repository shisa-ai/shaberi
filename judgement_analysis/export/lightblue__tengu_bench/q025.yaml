      "model_answer": "### 文書要約  \n\n1980年代の不登校問題増加を背景に、学校外の「居場所」（フリースクールなど）が注目され、1992年の文部省報告書で「心の居場所」づくりの必要性が指摘された。2003年には文部科学省が「子どもの居場所づくり新プラン」を発表し、計画的な居場所整備を推進した。こうして「居場所」への関心は、不足への意識から創出へと移行したが、その研究は未だ少ない。  \n\n「居場所」の定義は確立されておらず、物理的な意味（三省堂現代国語辞典）と心理的側面（安心感や自己存在感を得られる場所）が混在する。心理的側面を含む定義は統一されておらず、実証データに基づかないという課題がある。  \n\nこれまでの研究は大きく2つのアプローチに分かれる。  \n1. **地理学的アプローチ**：実際にいる場所を調査分析する方法（例：岩本1981、大西1998）。しかし寺本（2003）は、これらの研究が「知覚環境」としての子どもの生活空間全体を対象としており、「居場所」そのものの分析は少ないと指摘する。また海外研究（Hart1979など）も地理学的視点が主流で、日本独特の心理的意味での「居場所」研究はほとんどない。  \n2. **心理・教育学的アプローチ**：1990年代後半以降、学校を対象とした研究（深谷・永井・山田2001など）が出始めたが、物理的にいる場所全てを含むため、本人の主観（例：行きたくない学校）が反映されず、現代的な意味での「居場所」を捉えるには不十分である。  \n\nこのように、「居場所」の概念や研究方法には未解決の課題が多く、今後の発展が期待される。",
