    "original": "以下の文書を要約してください。\n### 文書\n1980年 代,不 登校問題の増加 により,フ リースクー ルを始め とした学校外の 「居場所」が注目され始 め,\n1992年 には,文 部省学校不適応対策調査研究協力者会 議が「登校拒否(不登校)問題について-児 童生徒の 『心 の居場所』づ くりを目指 して-」 という報告 を出 し, 学校内での「心の居場所」づくりの必要性が指摘され\nるに至 った。 これにより,子 どもの 「居場所」づ くり が学校の内外で盛んになり,実 践報告も数多 く出され る よ う に な る(例 えば小野,1993;小 野,1994;高 橋,1994)。 さらに,2003年 には文部科学省生涯学習政策局生涯学 習推進課が 「子どもの居場所づくり新プラン 地域子 ども教室推進事業」により,「3ヵ 年計画で計画的 に子 どもたちの居場所 を用意する」 ことを発表 した。 この ように,子 どもの 「居場所」への関心は,「 居場所」が ないことへの注 目から,「 居場所」を作 るという動 きに 進展 しつつある といえる。しか し,子 どもの「居場 所」 その もの を研究対象 として分析 した ものは,現 在 まだ 少ない状況であり,課 題も多い。\nまず,「 居場所」 という言葉 の定義 についてであ る\nが,い まだ確立 しているとはいえない。「居場所」の本\n来 の意 味 は,「 そ の人 のい る場 所 」(三省堂現代国語辞典, 1998)となってお り,人 がいる場所 という物理的な意味\nである。 しか し,先 行研究や関連書籍の中では,文 部\n省の 「児童生徒が存在感を実感することができ,精 神的 に安 心 してい る ことので きる場 所」(田 中,1992)と い う定義 に もあるように,「安心 して身を置 くことのでき る場所」(上野,1992),「 自己存在感が得 られ る場所」(坂 本,1993)と い う心理的な意味が含 まれているものが多 い。つまり,現 代においての 「居場所」という言葉に は,単 に人がいる所 という物理的な意味だ けではな く, 心理的側面が含まれているといえる。 しか し,こ の心 理的な側面を含めた 「居場所」の定義は,い まだ統一 してお らず,ま た,こ れ まで使用 されている定義 も実 証的なデータに基づいた定義ではないとい う問題点 を 有している。\nでは,そ のような中で 「居場所」研究は,ど のよう に行われ てきたのであろうか。 これまでの 「居場所」 研究は,大 き く2つ のアプローチに分けられる。まず 1つ 目のアプローチは,実 際 にいる場所 を調査分析す\nる方法で ある。このアプローチによる研究手法 は,地 理学の分野で,手 書 き地図など,独 自の方法 による研 究が進 め られ て いる(例 えば,岩 本,1981;大 西,1998)。 し かし,地 理学における 「居場所」研究の概観を行った 寺本(2003)は,こ れ までの研 究 は,「 居 場所 」とい う よ\nりは,子 どもの生活空間全体 を,知 覚環境 という視点 から,研 究 しているものが多い と指摘 している。また,\n海外 の研 究 も,Hart(1979)の 実証 研究 を始 め として, 地理学的 アプローチが主流 となっているが,日 本で現 在使用 され ているような,心 理的側面を含めた意味で の「居場所」は,言 葉の概念自体がないために,研 究 は行 われ て いな い状 態で あ る。心 理 ・教 育学 分野 にお いては,「 居場所」への注 目とともに,1990年 代後半以降,研 究が行われつつある。例えば,学 校を調査対象 とした研究(深 谷 ・永井 ・山田,2001)な どがあ り,心 理 的 な意味を含めない辞書通 りの 「居場所」研究 としては, 意義のあるものである。 しか し,確 かに物理的に居 る 場所ではあるが,「 居場所」とは感 じていないという場 所,例 えば,本 人は行きたくないが仕方なく行ってい る学校な ども含 まれて しまうため,本 人の主観が無視 されることとなる。現代の心理的な意味 を含んだ 「居 場所」を捉えてい くには問題があるアプローチ といえ\nる。",
    "translation_en": "**Summary of the Document**  \n\nIn the 1980s, the rise in school refusal issues led to increased attention on \"places of belonging\" outside of school, such as free schools. In 1992, the Ministry of Education's School Non-Adaptation Countermeasures Research Cooperative Council released a report titled *\"On School Refusal (Non-Attendance) – Aiming to Create a 'Place of Belonging' for Children and Students\"* (Tanaka, 1992), highlighting the need to foster \"places of belonging\" within schools. This spurred widespread efforts to create such spaces for children both inside and outside schools, resulting in numerous practical reports (e.g., Ono, 1993, 1994; Takahashi, 1994).  \n\nIn 2003, the Ministry of Education, Culture, Sports, Science and Technology (MEXT) announced the *\"Child Place of Belonging Creation New Plan – Community Children's Classroom Promotion Project,\"* which aimed to systematically provide \"places of belonging\" for children over a three-year plan. Thus, interest in children's \"places of belonging\" evolved from merely recognizing their absence to actively creating them. However, few studies have analyzed \"places of belonging\" as a research subject, and many challenges remain.  \n\nFirst, the definition of \"place of belonging\" is not yet established. Originally, it meant \"a place where a person is\" (Sanseido Modern Japanese Dictionary, 1998), referring to a physical location. However, in prior research and related literature, it often includes psychological aspects, such as \"a place where one feels secure\" (Ueno, 1992) or \"a place where one gains a sense of self\" (Sakamoto, 1993). Thus, the modern term encompasses both physical and psychological dimensions. Yet, this definition remains inconsistent, and previous definitions lack empirical support.  \n\nHow has \"place of belonging\" research been conducted? Existing studies fall into two main approaches. The first examines actual locations through methods like hand-drawn maps (e.g., Iwamoto, 1981; Onishi, 1998), often in geography. However, Teramoto (2003) noted that such studies tend to analyze children's entire living spaces from a perceptual environment perspective rather than focusing on \"places of belonging.\"  \n\nInternationally, Hart (1979) pioneered geographical approaches, but the psychological dimension of \"place of belonging\" (as used in Japan) is absent in foreign research. In psychology and education, studies emerged in the late 1990s, such as those examining schools (Fukaya, Nagai, & Yamada, 2001). While these studies are valuable, they often ignore subjective experiences—e.g., a school a child attends unwillingly may be physically present but not a \"place of belonging.\" Thus, this approach fails to capture the modern, psychologically-informed concept.  \n\n**Key Points:**  \n- The concept of \"place of belonging\" gained prominence in the 1980s due to school refusal issues.  \n- Definitions vary between physical locations and psychological spaces where one feels secure or has a sense of self.  \n- Research approaches include geographical studies of actual locations and psychological studies of school environments, but neither fully captures the subjective experience of \"place of belonging.\"  \n- The term remains under-researched, with inconsistent definitions and a lack of empirical grounding.  \n\n*(Note: The translation preserves the original meaning, structure, and key details without adding commentary.)*"
