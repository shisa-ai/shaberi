    "original": "以下の文書を要約してください。\n### 文書\nポーリン・ボスは，親密な関係において経験される 喪失のうち，存在と不在をめぐる不確実性が伴う喪失 であるあいまいな喪失に焦点をあて，自身の調査研究 やセラピストとしての実践経験をふまえながら議論し ている(Boss, 2005/1999, 2002a, 2015/2006, 2011)1)。  あいまいな喪失に関する議論は，ニューヨーク世界 貿易センタービルテロ事件の被害者家族支援の理論的 枠組みとなり(Boss, 2002b)，東日本大震災被災者支援 においても早くから着目されてきた経緯 2)がある。 親密な関係にある人の遺体が発見されない場合も少な くなく，家族は親密な関係にある人をいわば生と死の〈あいだ〉に置きながら，複雑化した悲嘆に向き合わ なければならないのである。  本論では，ボスが提唱した「あいまいな喪失」概念 に関する議論を俯瞰したうえで，あいまいな喪失を生 と死の〈あいだ〉をめぐる事象と位置づけながら議論 することとしよう。後述するように，あいまいな喪失 には，身体的に存在しているが心理的に不在であるタ イプと身体的には不在であるが心理的には存在してい るタイプに大別されるが，本論では，主として後者の タイプのあいまいな喪失に着目することとなる。  さて，「なぜわれわれはあいまいな喪失を受け入れ ることに困難を覚えるのか」という議論は，澤井が「死の諸次元」を設定する中で導出した「社会的死」 という視点(澤井，2005)3)を取り入れることではじ めて可能となる(水津，2015)。既に述べたように，本 論で主に焦点化するのは，遺体が発見されていないあ いまいな喪失である。このような喪失の場合，「死の 肉体的側面」についての確証が得られないため，一般 にその延長線上に位置しやすい「法的死」「儀礼的な 死」も容易には準備され難いことが考えられる。この ような状況下において，家族という社会関係の中で， あいまいな喪失は如何なる経験をもたらすのか注意深 く問う必要があるだろう。  また，近代化の進展や家族・地域社会の変容に伴 い，死別に伴う悲嘆が，社会的文脈から切り離され， 個人の心の問題として精神医学や心理学の管理下にお かれる事態がより，顕在化・常態化しているとする議 論(澤井，2005; 澤井・有末，2015)がある。こうした 事態との関わりをふまえた場合，ボスは，「明確な喪 失」とは異なる「あいまいな喪失」にかかわるセラピ ストや研究者がどのようなことに留意する必要がある としているのだろうか。この問題を，あいまいな喪失 を経験している人々とセラピスト・研究者との〈あい だ〉に関わることとして検討していくこととしたい。",
    "translation_en": "### Summary of the Document  \n\nPauline Boss focuses on ambiguous loss—losses in intimate relationships marked by uncertainty surrounding presence and absence—drawing on her research and therapeutic practice (Boss, 2005/1999, 2002a, 2015/2006, 2011). Discussions of ambiguous loss have served as a theoretical framework for supporting families of victims of the 9/11 terrorist attacks (Boss, 2002b) and were also early recognized in post-disaster support for the 2011 Great East Japan Earthquake.  \n\nIn many cases, the bodies of loved ones are never found, leaving families to grapple with complex grief while holding their loved ones in a state between life and death. This paper will overview Boss’s concept of ambiguous loss, positioning it as an event surrounding the boundary between life and death. As discussed later, ambiguous loss can be broadly categorized into two types: (1) physically present but psychologically absent, and (2) physically absent but psychologically present. This paper will primarily focus on the latter type.  \n\nThe question of why we struggle to accept ambiguous loss becomes addressable only by incorporating Sawai’s (2005) perspective of \"social death\" within his framework of \"dimensions of death\" (Mizutani, 2015). As previously mentioned, this paper will mainly focus on ambiguous loss where the body is not found. In such cases, the lack of confirmation of the \"physical aspect of death\" makes it difficult to prepare for the subsequent \"legal death\" and \"ritual death.\" Under these circumstances, it is crucial to carefully examine what experiences ambiguous loss brings within the social relationship of the family.  \n\nFurthermore, with the advancement of modernization and changes in family and community structures, grief associated with bereavement has become increasingly detached from its social context, being treated as an individual psychological issue under the management of psychiatry and psychology (Sawai, 2005; Sawai & Arisuto, 2015). Considering this situation, what should therapists and researchers working with ambiguous loss—distinct from \"clear loss\"—be mindful of? This paper will explore this issue by examining the relationship between those experiencing ambiguous loss and therapists/researchers.  \n\n---  \n*(Note: The translation preserves the original meaning, structure, and key details while ensuring natural and clear English suitable for evaluation documentation.)*"
