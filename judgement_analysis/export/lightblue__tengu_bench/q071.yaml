      "model_answer": "成人200名が3日間（災害発生から公的支援が届くまでの標準的な期間）自力で生活するために必要な防災備蓄のリストを作成しました。\n\n企業、自治会、避難所運営などを想定し、**「生命維持（必須）」「衛生・感染症対策」「居住環境」「管理・救助」**の4つのカテゴリーに分けて算出しています。\n\n### 前提条件\n*   **対象:** 成人200名（男女半々と仮定）\n*   **期間:** 3日間（72時間）\n*   **ライフライン:** 電気・ガス・水道が停止している状態\n\n---\n\n### 1. 生命維持（最優先・必須）\n\n水と食料は絶対に欠かせません。特に水は生命維持だけでなく、精神的な安定にも寄与します。\n\n| 品目 | 計算式・目安 | 必要数量 | 備考 |\n| :--- | :--- | :--- | :--- |\n| **飲料水** | 1人 3L × 3日 | **1,800リットル** | 2Lペットボトルなら900本。500mlボトルも混ぜると配布しやすい。 |\n| **主食** | 1人 3食 × 3日 | **1,800食** | アルファ米（水が必要）、パンの缶詰、クラッカーなど。調理不要なものを推奨。 |\n| **非常用トイレ** | 1人 5回 × 3日 | **3,000回分** | **最重要項目です。**凝固剤と汚物袋のセット。水洗トイレは使えません。 |\n| **トイレットペーパー** | 予備含め多めに | **約60〜80ロール** | 普段の倍消費すると想定。ティッシュ代わりにもなるため。 |\n\n**アドバイス:**\n*   アルファ米は水（またはお湯）が必要なため、調理用水として飲料水とは別に水を確保するか、調理不要なパンやクッキーの比率を高めることをお勧めします。\n\n---\n\n### 2. 衛生・感染症対策（健康維持）\n\n集団生活では感染症（インフルエンザ、ノロウイルス、COVID-19等）のリスクが跳ね上がります。\n\n| 品目 | 計算式・目安 | 必要数量 | 備考 |\n| :--- | :--- | :--- | :--- |\n| **マスク** | 1人 1日2枚 × 3日 | **1,200枚** | 予備を含めた枚数。不織布推奨。 |\n| **手指消毒液** | 10人に1本 | **20本** | ポンプ式アルコール消毒液。 |\n| **ウェットティッシュ** | 1人 1パック | **200パック** | 入浴できないため、体を拭く大判タイプが望ましい。 |\n| **生理用品** | 女性100名想定 | **300〜400枚** | 昼用・夜用ミックス。ストレスで周期がずれるため必須。 |\n| **ゴミ袋（大）** | 45L〜70L | **200枚** | 汚物、食べ残し、容器の処理用。臭い対策で厚手のものが良い。 |\n| **使い捨て手袋** | 運営・配膳・清掃用 | **300枚以上** | ビニールまたはニトリル手袋。 |\n\n---\n\n### 3. 居住環境・睡眠（低体温症対策）\n\n床に直接寝ることは体力を奪い、特に冬場は命に関わります。\n\n| 品目 | 計算式・目安 | 必要数量 | 備考 |\n| :--- | :--- | :--- | :--- |\n| **毛布・寝袋** | 1人 1枚 | **200枚** | 真空パックされた備蓄用毛布（フリース等）が省スペース。 |\n| **エアーマット** | 1人 1枚 | **200枚** | 床からの冷気遮断と固さ対策。アルミマットでも可だがエアーが優秀。 |\n| **アルミブランケット** | 1人 1枚 | **200枚** | 防寒・保温用。ポケットサイズで場所を取らない。 |\n| **目隠しパーティション** | 4〜5人に1区画 | **40〜50セット** | プライバシー確保用。ダンボール製が一般的。 |\n\n---\n\n### 4. 管理・救助・情報収集（運営用）\n\n200名を統率し、安全を確保するための資機材です。\n\n| 品目 | 数量目安 | 備考 |\n| :--- | :--- | :--- |\n| **発電機・蓄電池** | 2〜3台 | スマホ充電、投光器用。カセットボンベ式が燃料管理しやすい。 |\n| **スマホ充電ケーブル** | 20本以上 | 各種端子（Lightning, USB-C, Micro-USB）を用意。 |\n| **乾電池** | 各種50本〜 | 単1、単3、単4など。長期保存タイプを推奨。 |\n| **懐中電灯・ランタン** | 10〜20個 | 夜間のトイレ移動や管理用。 |\n| **ラジオ** | 2〜3台 | 情報収集用。手回し充電機能付きが良い。 |\n| **救急セット** | 2〜3セット | 絆創膏、包帯、消毒液、常備薬（鎮痛剤、胃薬）など。 |\n| **カセットコンロ** | 5台 | お湯を沸かすため（アルファ米や粉ミルク用）。 |\n| **カセットボンベ** | 30〜50本 | コンロ1台につき1日3〜4本消費目安。 |\n| **バール・ジャッキ** | 1〜2セット | 閉じ込め救助、瓦礫撤去用。 |\n| **ブルーシート** | 10枚 | 雨漏り対策、敷物、目隠しなど多用途。 |\n| **ガムテープ・油性ペン** | 複数個 | 掲示板作成、補修、名札代わりなど。 |\n\n---\n\n### 重要なポイントと注意点\n\n1.  **保管スペースの確保:**\n    これだけの量を保管するには、およそ**「6〜8平方メートル（約2〜2.5坪）」**程度のスペースが必要です（積み上げ方による）。分散備蓄（各フロアに置くなど）も検討してください。\n2.  **アレルギー・多様性への配慮:**\n    食料の一部（2割程度）をアレルギー対応食（特定原材料等28品目不使用）やハラール対応にしておくと、多様なメンバーに対応できます。\n3.  **水を使わない工夫:**\n    断水時は手が洗えません。ウェットティッシュを多めに用意するか、食品用ラップ（食器に敷いて使い捨てる）を用意すると、洗い物が出ず衛生的です。\n4.  **ローリングストック:**\n    水や食料は賞味期限があります。一気に買い換えるのはコストがかかるため、期限が近づいたものから消費し、買い足すサイクルを作ってください。\n\nこのリストは「3日間」の基準ですが、大規模災害（南海トラフ地震など）では物流回復に1週間以上かかる可能性があります。予算とスペースが許す限り、**「7日分」**を目指して増量することをお勧めします。",
