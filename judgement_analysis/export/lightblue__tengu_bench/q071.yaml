      "model_answer": "はい、チュニジアを訪問する際には、国籍によってビザの要否が異なります。以下に一般的な情報をまとめますが、最新の情報は外務省や入国管理局の公式サイトでご確認ください。\n\n### **ビザ要否の概要（2023年時点）**\n1. **日本人**  \n   - ビザが必要です。事前に「観光ビザ（Type C）」を取得する必要があります。  \n   - ビザ申請はチュニジア大使館またはオンラインで可能です。\n\n2. **EU加盟国・米国・カナダなど**  \n   - ビザ免除（90日以内の観光目的）が適用される場合があります。ただし、滞在期間や目的によって条件が異なるため、事前に確認が必要です。\n\n3. **その他の国籍**  \n   - ビザが必要な場合がほとんどですが、査証免除対象国もあります。詳細は入国管理局の公式サイトを参照してください。\n\n### **注意点**\n- ビザ申請には通常1～2週間かかるため、早めに手続きしましょう。  \n- チュニジアに入国後、パスポートにスタンプを受け取ることが必須です。  \n\n### **最新情報の確認方法**\n- [チュニジア入国管理局公式サイト](https://www.dgip.tn/)  \n- [日本外務省海外安全ホームページ](https://www.anzen.mofa.go.jp/)  \n\n旅行前に必ず最新情報を確認し、必要な手続きを行ってください。",
