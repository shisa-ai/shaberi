      "model_answer": "成人200名分の防災備蓄品を準備する際は、**「生活に必要な物資」「安全確保のための物資」「情報収集・連絡手段」**の3つのカテゴリーで考えるのが効果的です。以下に具体的な品目と数量を示します（※1人あたりの目安を200人分に換算）。\n\n---\n\n### **【1. 生活に必要な物資】**\n#### **① 食料・飲料**\n- **非常食（レトルト食品・乾パンなど）**  \n  - 1人あたり3日分（約2kg） → **合計400kg**  \n  - 備考：保存期間が長いもの（5年以上）を選ぶ。\n- **飲料水**  \n  - 1人あたり3日分（約9L） → **合計1800L**  \n  - 備考：ペットボトルやタンクで保管。\n- **調味料・食器**  \n  - 塩・砂糖・粉末スープなど → **各10袋～20袋**  \n  -使い捨てカトラリー → **1000セット**\n\n#### **② 衛生用品**\n- **トイレットペーパー**  \n  - 1人あたり3日分（約6ロール） → **合計1200ロール**  \n- **ウェットティッシュ・マスク**  \n  - 各1000枚～2000枚\n- **生理用品（女性用）**  \n  - 約100人分 → サニタリーショーツやナプキン\n\n#### **③ 暖房・照明**\n- **懐中電灯・LEDライト**  \n  - 各50台～100台\n- **暖房用具（カイロ・毛布）**  \n  - カイロ500個、毛布100枚\n\n---\n\n### 【2. 安全確保のための物資】\n#### **① 救急用品**\n- バンソウコバン、包帯、消毒液 → 各50個～100個\n- 常備薬（鎮痛剤・アレルギー薬など） → 各500錠\n\n#### 【3. 情報収集・連絡手段】\n- ラジオ（手回し式または乾電池式） → 約20台\n- 携帯充電器（モバイルバッテリー） → 約50台\n\n---\n\n### 【注意点】\n1. 実際の備蓄量は地域の災害リスクや避難場所の条件で調整が必要です。特に水は重量がかかるため、浄水器やポータブル浄水タブレットも検討しましょう。\n2. 定期的な点検と賞味期限切れ対策が必須です。食品は「先入れ先出し」を徹底し、半年ごとに確認しましょう。\n\nこのリストは一般的な目安であり、自治体の防災ガイドラインも参照してください。",
