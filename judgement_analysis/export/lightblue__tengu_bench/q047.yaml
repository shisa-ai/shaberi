    "gold_original": "問題を解くために、方程式を立てることができます。みかんの個数を \\(x\\)、りんごの個数を \\(y\\) とします。\n\nまず、全体で40個買っていることから、\n\\[x + y = 40\\]\n\n次に、みかんが80円、りんごが120円で合計3800円使ったということから、\n\\[80x + 120y = 3800\\]\n\nこれらの方程式を解きます。一方の方程式から変数\\(x\\)または\\(y\\)を求めて、他方に代入する方法が一般的です。\n\nまず、第一の方程式から\\(x = 40 - y\\)と表されることがわかります。この式を第二の方程式に代入します：\n\n\\[80(40 - y) + 120y = 3800\\]\n\nこれを展開すると、\n\\[3200 - 80y + 120y = 3800\\]\n\nつまり、\n\\[40y = 600\\]\n\nこれを解くと、\n\\[y = 15\\]\n\nよって、買ったりんごの数は15個です。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nTo solve the problem, we can set up equations. Let \\( x \\) be the number of mandarin oranges and \\( y \\) be the number of apples.  \n\nFirst, since a total of 40 fruits were bought, we have:  \n\\[ x + y = 40 \\]  \n\nNext, given that mandarin oranges cost 80 yen each, apples cost 120 yen each, and the total cost was 3800 yen, we have:  \n\\[ 80x + 120y = 3800 \\]  \n\nWe solve these equations. A common method is to solve for one variable (\\( x \\) or \\( y \\)) in one equation and substitute it into the other.  \n\nFirst, from the first equation, we find that \\( x = 40 - y \\). Substituting this into the second equation:  \n\\[ 80(40 - y) + 120y = 3800 \\]  \n\nExpanding this, we get:  \n\\[ 3200 - 80y + 120y = 3800 \\]  \n\nWhich simplifies to:  \n\\[ 40y = 600 \\]  \n\nSolving for \\( y \\), we find:  \n\\[ y = 15 \\]  \n\nTherefore, the number of apples bought is 15."
