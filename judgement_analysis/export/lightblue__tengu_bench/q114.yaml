      "model_answer": "結論から申し上げますと、原則として**Bさんが特許を受けることになります。**\n\nその理由は、日本の特許法が**「先願主義（せんがんしゅぎ）」**というルールを採用しているからです。\n\n### 解説\n\n**1. 先願主義とは？**\n日本の特許法（第39条）では、「誰が一番早く発明を完成させたか（先発明主義）」ではなく、**「誰が一番早く特許庁に出願書類を提出したか」**によって特許権を与える人を決めます。これを先願主義といいます。\n\n**2. 今回のケースへの当てはめ**\n*   **Aさん：** 6月14日に発明を完成（一番早かった）\n*   **Bさん：** 6月18日に特許を出願（一番早かった）\n\nAさんの方が先に発明を完成させていますが、特許庁への手続き（出願）を行ったのはBさんが先です。したがって、法的にはBさんが優先され、Bさんが特許権者となります。\n\n### 例外的なケース（注意点）\nもしBさんが独自に発明したのではなく、**Aさんの研究データを盗んだり、Aさんから話を聞いて勝手に出願していた場合**は話が別です。これを「冒認出願（ぼうにんしゅつがん）」といいます。\nこの事実をAさんが証明できれば、Bさんの特許を拒絶・無効にしたり、特許を受ける権利をAさんに取り戻したりすることが可能です。\n\nしかし、Bさんも独自に同じ発明をしていて、単に手続きが早かっただけであれば、残念ながらAさんは特許を取得することはできません。",
