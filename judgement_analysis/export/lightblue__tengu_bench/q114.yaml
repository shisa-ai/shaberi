    "translation_en": "**[Purpose: Question]**  \n\nOn election day, I spread online content encouraging people to vote for the candidate I support.  \nIs this action permissible? If not, what penalties could be imposed?  \n\n*(Translation preserves the original meaning, structure, and formal tone suitable for evaluation documentation.)*"
