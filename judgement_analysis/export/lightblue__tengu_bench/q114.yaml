    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nIn Japan, election campaigns during the election period are strictly regulated under the Public Office Election Law, and campaigning on election day itself is prohibited. This includes online activities, such as calls for votes for specific candidates on social media, blogs, or websites, which may also constitute election campaigning. Violators may be subject to imprisonment for up to one year or a fine of up to ¥300,000 (Public Office Election Law Article 239, Paragraph 1, Item 1), and their right to vote and stand for election will be suspended (Public Office Election Law Article 252, Paragraphs 1 and 2).  \n\n(Translation preserves the legal details and structure of the original Japanese text while ensuring natural English phrasing for evaluation documentation.)"
