    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nAccording to Article 38 of the Road Traffic Act:  \n- \"When the presence of pedestrians cannot be confirmed, vehicles must travel at a speed that allows them to stop before a crosswalk.\"  \n- \"Vehicles must come to a complete stop when pedestrians are attempting to cross or are already crossing.\"  \n- \"Overtaking or passing is prohibited within 30 meters before and at crosswalks.\"  \n\nViolating these provisions is subject to penalties, including:  \n- Imprisonment for up to 3 months or a fine of up to ¥50,000,  \n- 2 penalty points, and  \n- A surcharge of ¥9,000 for regular vehicles.  \n\n(Translation preserves legal terminology and penalty details for evaluation documentation.)"
