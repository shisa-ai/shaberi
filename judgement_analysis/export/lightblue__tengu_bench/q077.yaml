      "model_answer": "年収837万円の場合の所得税額は、**約130万円～150万円**程度と推測されます。  \n\n### 計算のポイント  \n1. **課税所得の計算**  \n   - 雑所得や副業収入がない場合、給与所得として計算します。  \n   - 給与所得控除（例：年収800万円超～1000万円未満で約35万5,000円）を差し引きます。  \n\n2. **累進課税率**  \n   - 課税所得が800万円超～900万円未満の場合、下記のように課税されます。  \n     - 330万（800万超分）× 33% = 108.9万  \n     - 残り（837万－給与控除後）に応じて調整。  \n\n3. **その他控除**  \n   - 基礎控除（48万）、社会保険料控除などを差し引くと、最終的な税額が変動します。  \n\n### 正確な計算方法  \n- 確定申告や会社経由で源泉徴収されるため、実際は以下の要素も影響します。  \n  - 住民税（地方税）との合算申告・分離申告の有無。  \n  - 配偶者控除や扶養家族の有無。  \n\n### おすすめツール  \n- 国税庁「給与所得者の所得税・住民税を計算する」（[リンク](https://www.e-tax.nta.go.jp/kyohi/kyohi01.htm))で詳細なシミュレーション可能です。  \n\n※上記は概算であり、個別状況によって異なるため、確定申告時には専門家（税理士等）に相談することをお勧めします。",
