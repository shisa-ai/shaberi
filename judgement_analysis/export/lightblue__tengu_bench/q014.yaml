      "model_answer": "保育園で園児に「赤ちゃんはどうやって生まれるの？」と聞かれた場合、年齢や理解度に合わせて、以下のような段階的な説明が考えられます。  \n\n### **1. 幼い年齢（3～4歳）向け：シンプルな比喩を使う**  \n「ママのお腹の中で、赤ちゃんがゆっくり育って大きくなって、出産のときに生まれてくるんだよ。まるで花が種から咲くようにね」  \n（絵本や動物の例えも有効）  \n\n### **2. 少し年長（5～6歳）向け：具体的なプロセスを簡潔に**  \n「パパとママが大好き合ったとき、ママのお腹の中に赤ちゃんの種が届いて、9ヶ月かけて大きくなって生まれるんだ。出産は病院で助産師さんや医者さんが手伝ってくれるよ」  \n\n### **3. 質問の意図を確認する**  \n「どうして知りたいのかな？ 赤ちゃんが可愛いから気になる？ それとも…？」と話を広げながら、本人の興味に合わせて深掘りする。  \n\n### **4. 図鑑や絵本を活用**  \n『赤ちゃんはどこからくるの？』（評論社）など、科学的で子ども向けの解説書を一緒に見るのも効果的です。  \n\n### **5. 保護者との連携**  \n「家でも聞いてみよう」と促し、一貫性を持たせるため、園と家庭で話し合うことも大切です。  \n\n### **NGポイント**  \n- 過剰な性教育的表現（例：「愛情表現」など抽象的な言葉は避ける）  \n- 不安を煽る表現（例：「痛い」「怖い」など否定的なイメージ）  \n\n子どもの反応を見ながら、「不思議だね」「成長するんだよ」と前向きなメッセージを添えると、自然な理解につながります。",
