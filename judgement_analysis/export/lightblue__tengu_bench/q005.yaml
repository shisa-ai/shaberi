  "question": {
    "original": "下表は、Ｐ県の耕地面積と、その使用内訳を割合を表したものです。\nＰ県の果樹地の耕地面積が9800haのとき、Ｐ県の田の耕地面積の割合は何%になるか？\n### 表\n耕地面積 | 35000ha\n-- | --\n田 | ?\n果樹園 | ? \n牧草地 | 22％\nその他 | 24％",
    "translation_en": "**[Purpose: Question]**  \n\nThe table below shows the cultivated land area in P Prefecture and the breakdown of its usage by percentage.  \n\nWhen the cultivated land area for orchards in P Prefecture is 9,800 ha, what percentage of the cultivated land area is rice paddies?  \n\n### Table  \n| Cultivated Land Area | 35,000 ha |  \n|----------------------|-----------|  \n| Rice Paddies         | ?         |  \n| Orchards             | ?         |  \n| Pastureland          | 22%       |  \n| Others               | 24%       |  \n\n*(Note: The translation preserves the original structure and details while ensuring natural English phrasing for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "Ｐ県の果樹地の耕地面積が9800haであることが分かっています。まずはその割合を求めましょう。\n\n全体の耕地面積は35000haです。果樹地の割合を求めます。\n\n$$\n\\text{果樹園の割合} = \\frac{\\text{果樹園の面積}}{\\text{全体の耕地面積}} \\times 100 = \\frac{9800}{35000} \\times 100\n$$\n\nこれを計算すると、\n\n$$\n= \\frac{9800}{35000} \\times 100 = 28\\%\n$$\n\nとなります。したがって、果樹園の割合は28%です。\n\n既に牧草地の割合が22%、その他の割合が24%と与えられていますので、これらの割合を加えた合計を求めます。\n\n$$\n22\\% + 24\\% + 28\\% = 74\\%\n$$\n\nこれらを合わせると、これまでの割合の合計は74%です。つまり、残りは田の耕地面積の割合です。\n\n$$\n100\\% - 74\\% = 26\\%\n$$\n\nよって、Ｐ県の田の耕地面積の割合は26%になります。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\nIt is known that the cultivated area of fruit orchards in P Prefecture is 9,800 hectares. First, let's determine its proportion.  \n\nThe total cultivated area is 35,000 hectares. We will calculate the proportion of fruit orchards.  \n\n$$  \n\\text{Proportion of fruit orchards} = \\frac{\\text{Area of fruit orchards}}{\\text{Total cultivated area}} \\times 100 = \\frac{9800}{35000} \\times 100  \n$$  \n\nCalculating this gives:  \n\n$$  \n= \\frac{9800}{35000} \\times 100 = 28\\%  \n$$  \n\nTherefore, the proportion of fruit orchards is 28%.  \n\nSince the proportion of pastureland is already given as 22% and the proportion of other land is 24%, we will sum these proportions.  \n\n$$  \n22\\% + 24\\% + 28\\% = 74\\%  \n$$  \n\nAdding these together, the total proportion so far is 74%. This means the remaining proportion is that of rice paddies.  \n\n$$  \n100\\% - 74\\% = 26\\%  \n$$  \n\nThus, the proportion of rice paddy cultivated area in P Prefecture is 26%."
  },
