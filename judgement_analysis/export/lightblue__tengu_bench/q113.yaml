    "original": "Aさん(16歳)は最寄駅で見かけた選挙運動の様子を面白いと感じ、SNSを通じてその様子を収めた動画を拡散しました。\n未成年の選挙運動は禁止されていますが、この行為は許容されるでしょうか。",
    "translation_en": "**[Purpose: Question]**  \n\nA (16 years old) found the election campaign activities they saw at the nearest train station amusing and shared a video of the scene on social media. While election campaigning by minors is prohibited, would this action be permissible?  \n\n*(Note: The translation maintains the original meaning, structure, and legal context while ensuring natural English phrasing for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "公職選挙法第137条の2において未成年の選挙運動は禁止されています。選挙運動とは特定の選挙で特定の候補者の当選を目的として投票をしてもらうために有利な活動のことを示します。今、Aさんは未成年であるため動画が単に選挙運動の様子を記録したものであり、特定の候補者や政党を支持・推奨する意図がなく、選挙の公平を害するような内容でなければ、選挙運動とはみなされない可能性があります。一方で、動画が特定の候補者や政党への支持を呼びかける内容であったり、選挙の公平を害する恐れがある場合は、問題視される可能性があります。\n許容される可能性はありますが念の為にも動画を拡散する行為は避けるべきだと考えられます。",
    "gold_backtranslation_en": "**[Purpose: gold_answer]**  \n\nUnder Article 137-2 of the Public Office Election Law, election campaigning by minors is prohibited. \"Election campaigning\" refers to activities intended to solicit votes for a specific candidate in a particular election. In this case, since A is a minor, if the video merely records the scene of election campaigning without any intent to support or endorse a specific candidate or party, and does not contain content that could harm the fairness of the election, it may not be considered election campaigning. However, if the video contains content that calls for support of a specific candidate or party, or poses a risk of harming the fairness of the election, it could be problematic.  \n\nWhile there is a possibility it may be permissible, it is advisable to avoid disseminating the video as a precaution.  \n\n(Translation preserves the original meaning, legal context, and nuanced considerations regarding the video's content and potential implications.)"
  },
