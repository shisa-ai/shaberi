    "original": "150平方メートルの敷地に対し、1階の床面積が70平方メートル、2階が50平方メートルの時容積率はどれほどですか。",
    "translation_en": "**[Purpose: Question]**  \n\nWhat is the floor area ratio (FAR) when the site area is 150 square meters, with the first floor having a floor area of 70 square meters and the second floor having a floor area of 50 square meters?  \n\n*(Note: The translation maintains the original meaning and details while ensuring natural and clear English suitable for evaluation documentation.)*"
  },
  "answer": {
    "gold_original": "容積率（ようせきりつ）は、敷地面積に対する建築物の延べ床面積の比率を示す指標です。計算式は以下の通りです。\n\n\\[ 容積率（\\%） = \\left( \\frac{延べ床面積}{敷地面積} \\right) \\times 100 \\]\n\n問題の条件に基づいて計算します。\n\n- 敷地面積: 150平方メートル\n- 1階の床面積: 70平方メートル\n- 2階の床面積: 50平方メートル\n\n延べ床面積は、1階と2階の床面積を合計したものです。\n\n\\[ 延べ床面積 = 70平方メートル + 50平方メートル = 120平方メートル \\]\n\nこれを使って容積率を計算します。\n\n\\[ 容積率 = \\left( \\frac{120}{150} \\right) \\times 100 = 0.8 \\times 100 = 80\\% \\]\n\nしたがって、この建物の容積率は80%です。",
    "gold_backtranslation_en": "[Purpose: gold_answer]  \n\n**Floor Area Ratio (FAR)** is an indicator that shows the ratio of a building's total floor area to the land area. The calculation formula is as follows:  \n\n\\[ \\text{Floor Area Ratio (\\%)} = \\left( \\frac{\\text{Total Floor Area}}{\\text{Land Area}} \\right) \\times 100 \\]  \n\nBased on the given conditions, we calculate as follows:  \n\n- **Land Area:** 150 square meters  \n- **1st Floor Area:** 70 square meters  \n- **2nd Floor Area:** 50 square meters  \n\nThe **total floor area** is the sum of the 1st and 2nd floor areas.  \n\n\\[ \\text{Total Floor Area} = 70 \\, \\text{m}^2 + 50 \\, \\text{m}^2 = 120 \\, \\text{m}^2 \\]  \n\nUsing this, we calculate the floor area ratio:  \n\n\\[ \\text{Floor Area Ratio} = \\left( \\frac{120}{150} \\right) \\times 100 = 0.8 \\times 100 = 80\\% \\]  \n\nTherefore, the floor area ratio of this building is **80%**."
  },
