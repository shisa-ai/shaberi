    "original": "以下の文書を要約してください。\n### 文書\n第一条　この法律は、情報通信技術の進展に伴い取引デジタルプラットフォームが国民の消費生活にとって重要な基盤となっていることに鑑み、取引デジタルプラットフォーム提供者による消費者の利益の保護に資する自主的な取組の促進、内閣総理大臣による取引デジタルプラットフォームの利用の停止等に係る要請及び消費者による販売業者等情報の開示の請求に係る措置並びに官民協議会の設置について定めることにより、取引デジタルプラットフォームを利用して行われる通信販売（特定商取引に関する法律（昭和五十一年法律第五十七号）第二条第二項に規定する通信販売をいう。以下同じ。）に係る取引の適正化及び紛争の解決の促進に関し取引デジタルプラットフォーム提供者の協力を確保し、もって取引デジタルプラットフォームを利用する消費者の利益を保護することを目的とする。\n（定義）\n第二条　この法律において「取引デジタルプラットフォーム」とは、特定デジタルプラットフォームの透明性及び公正性の向上に関する法律（令和二年法律第三十八号）第二条第一項に規定するデジタルプラットフォームのうち、当該デジタルプラットフォームにより提供される場が次の各号のいずれかの機能を有するものをいう。\n一　当該デジタルプラットフォームを利用する消費者が、その使用に係る電子計算機の映像面に表示される手続に従って当該電子計算機を用いて送信することによって、販売業者等に対し、通信販売に係る売買契約又は役務を有償で提供する契約（以下「役務提供契約」という。）の申込みの意思表示を行うことができる機能\n二　当該デジタルプラットフォームを利用する消費者が、その使用に係る電子計算機の映像面に表示される手続に従って当該電子計算機を用いて送信することによって、競りその他の政令で定める方法により販売業者等の通信販売に係る売買契約又は役務提供契約の相手方となるべき消費者を決定する手続に参加することができる機能（前号に該当するものを除く。）\n２　この法律において「取引デジタルプラットフォーム提供者」とは、事業として、取引デジタルプラットフォームを単独で又は共同して提供する者をいう。\n３　この法律において「消費者」とは、個人（商業、工業、金融業その他の事業を行う場合におけるものを除く。）をいう。\n４　この法律において「販売業者等」とは、販売業者又は役務の提供の事業を営む者（自らが提供する取引デジタルプラットフォームを利用して商品若しくは特定権利（特定商取引に関する法律第二条第四項に規定する特定権利をいう。次条第一項第二号及び第四条第一項において同じ。）の販売又は役務の提供を行う場合におけるものを除く。）をいう。",
    "translation_en": "### Summary of the Document  \n\n**Article 1 (Purpose)**  \nThis Act aims to ensure the proper conduct of transactions and promote dispute resolution in e-commerce conducted through transaction digital platforms, recognizing their importance in consumers' daily lives due to advancements in information and communication technology. It seeks to:  \n1. Encourage voluntary measures by transaction digital platform providers to protect consumer interests.  \n2. Empower the Prime Minister to request the suspension of platform use when necessary.  \n3. Establish procedures for consumers to request disclosure of seller information.  \n4. Create a public-private council to oversee these measures.  \n\n**Article 2 (Definitions)**  \n1. **\"Transaction Digital Platform\"** refers to a digital platform (as defined in the Act on Improving Transparency and Fairness of Specific Digital Platforms) that provides a space with one or more of the following functions:  \n   - Allowing consumers to express intent to enter a sales or service contract via electronic means.  \n   - Enabling consumers to participate in processes (e.g., auctions) to determine counterparties for sales or service contracts.  \n2. **\"Transaction Digital Platform Provider\"** means an entity that offers such platforms as a business, either independently or jointly.  \n3. **\"Consumer\"** refers to an individual (excluding those acting in a business capacity).  \n4. **\"Seller\"** refers to a business entity selling goods or services (excluding those using their own platforms to sell their own products or services).  \n\n*(Note: The summary retains key legal definitions and objectives without commentary.)*"
