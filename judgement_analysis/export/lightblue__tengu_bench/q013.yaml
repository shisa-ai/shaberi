    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "大学での留学生向け日本文化イベント、素晴らしい企画ですね。\n留学生は「日本について知りたい」という意欲がある一方で、言語の壁や「堅苦しいのではないか」という不安も抱えています。\n\nイベントを成功させるための鍵は、**「座学（聞くだけ）」ではなく「体験（やってみる）」**に重点を置き、**「日本人学生との交流」**をセットにすることです。\n\n以下に、企画から運営まで、成功に導くための具体的なステップとアイデアを提案します。\n\n---\n\n### 1. コンセプト設計：五感で楽しむ「体験型」にする\nただ説明を聞くだけのイベントは退屈されがちです。五感（視覚、聴覚、味覚、触覚、嗅覚）を使うコンテンツを選びましょう。\n\n*   **味覚（食文化）：** 最も集客力が高いです。\n    *   **手巻き寿司パーティー:** 宗教上の理由（ハラル、ベジタリアン）がある学生でも、具材を自分で選べるため満足度が高いです。\n    *   **たこ焼き/お好み焼き:** 「焼く」プロセス自体がエンターテインメントです。\n    *   **和菓子作り:** 練り切りなど、粘土細工感覚で楽しめるものは写真映えも良く人気です。\n    *   **利き茶・利き出汁:** 抹茶や煎茶、あるいは出汁の味比べをするゲーム形式。\n\n*   **触覚・視覚（着付け・遊び）：**\n    *   **浴衣・着物の着付け:** 圧倒的に人気です。大学の演劇部や地域のボランティア団体に協力を仰ぐと衣装を借りられることがあります。\n    *   **書道（自分の名前を漢字で書く）:** 当て字で名前を書いてあげて、それを自分で書かせると非常に喜ばれます（例: Mike → 舞空）。\n    *   **昔遊び:** けん玉、コマ、福笑いなど。ルールが単純で言葉がわからなくても盛り上がります。\n\n*   **聴覚（音）：**\n    *   **和太鼓体験:** ストレス発散になり、リズムだけで通じ合えるので一体感が生まれます。\n\n### 2. 運営の工夫：ハードルを下げる\n留学生が参加しやすくするための工夫です。\n\n*   **「やさしい日本語」と英語の併用:**\n    *   流暢な英語である必要はありませんが、スライドや説明書きには英語を併記しましょう。\n    *   口頭説明は「やさしい日本語（ハサミ、ツカウ、キル）」を意識します。\n*   **宗教・アレルギーへの配慮（超重要）:**\n    *   **食事を出す場合は、必ず成分表示（豚肉、アルコール、ゼラチンなど）を英語とイラストで明示してください。** これがあるだけで安心感が段違いです。\n*   **途中入退室OKにする:**\n    *   「授業の合間にちょっと寄る」ことができるカジュアルな雰囲気が人を呼びます。\n\n### 3. 日本人学生を巻き込む（交流の促進）\n留学生は「日本人の友達」を欲しがっています。\n\n*   **バディ制度/グループ分け:**\n    *   留学生だけで固まらないよう、1つのテーブルに必ず日本人学生（サポーター）を1〜2名配置します。\n*   **アイスブレイク:**\n    *   自己紹介の時間を最初に設けます。「好きな日本食は？」「行ってみたい場所は？」など簡単なテーマを与えます。\n\n### 4. 広報戦略：SNSとビジュアル重視\n掲示板のチラシだけでは人は来ません。\n\n*   **SNS活用:** InstagramやTikTokで、準備風景や過去のイベントの様子（楽しそうな写真）をアップします。\n*   **キーワードは「Free Food」と「Photo Spot」:**\n    *   「お菓子あります」「写真撮れます」は強力なフックになります。\n*   **国際交流センターや語学教員との連携:**\n    *   大学の事務局や、日本語クラスの先生にお願いして、授業の前後で宣伝してもらうのが最も効果的です。\n\n### 5. 低予算で実現するアイデア（予算が少ない場合）\n*   **100円ショップの活用:** 書道道具、折り紙、けん玉、簡単な和雑貨はすべて100円ショップで揃います。\n*   **折り紙建築・手裏剣:** 紙だけでできますが、複雑な多面体や、実際に投げられる手裏剣作りは男子学生にも人気です。\n*   **箸使い競争:** 豆を箸で皿から皿へ移すタイムトライアル。単純ですが燃えます。\n\n### 6. イベント当日のタイムスケジュール例（90分）\n長すぎず、集中力が続く時間がベストです。\n\n*   **00-10分:** オープニング・アイスブレイク（グループ内で自己紹介）\n*   **10-20分:** 文化の簡単な説明（クイズ形式にすると盛り上がる）\n*   **20-70分:** **メイン体験タイム**（制作、調理、試食など）\n    *   ※ここで日本人学生が積極的にサポートに入り会話を促す\n*   **70-80分:** 写真撮影タイム（作ったものを持って集合写真）\n*   **80-90分:** クロージング・アンケート・連絡先交換タイム\n\n### 成功のためのチェックリスト\n*   [ ] 宗教的配慮（食事）はできているか？\n*   [ ] 英語または「やさしい日本語」の資料はあるか？\n*   [ ] 写真映えするスポットや瞬間を用意しているか？\n*   [ ] 日本人学生と留学生が話す仕掛けはあるか？\n\nまずは、主催者であるあなた自身が楽しむことが、参加者に伝わる一番の成功要因です。応援しています。",
