          "judge_output": "[該当する評価項目とその簡潔な理由]\n- アイディアを複数挙げている:2点  \n  - 体験型ワークショップ、講演会・パネル、パフォーマンス、交流会、地域連携など多数提示。\n- 具体的なアイディアの内容を示している:2点  \n  - 茶道・華道・書道・着物・武道など、各体験内容を具体的に説明。\n- 大学で留学生に向けて日本の伝統文化を伝えるイベントを開催することを踏まえている:2点  \n  - 「留学生向け」「大学内の施設」「留学生向けメールマガジン」など、大学・留学生を前提にした記述がある。\n- 実現性の高い提案である:1点  \n  - 大学施設利用、講師招へい、広報、通訳など、現実的な運営方法が示されている。\n- 説明が具体的でわかりやすい:2点  \n  - 構成が整理され、箇条書きで段階的に説明されている。\n- 自然な日本語である:1点  \n  - 文法的に自然で読みやすい日本語。\n\n[計算式]\n2 + 2 + 2 + 1 + 2 + 1 = 10\n\n[点数]\n10点\n\nFINAL SCORE: 10",
