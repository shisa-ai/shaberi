    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "化学における「エネルギーの放出反応（一般的には**発熱反応**）」と「エネルギーの吸収反応（一般的には**吸熱反応**）」の違いについて、その判断基準と実例を交えて説明します。\n\n### 1. 基本的な違いと判断基準\n\nこれらを区別するために使用される主な基準は、**「系（反応が起きている物質）」と「外界（周囲の環境）」の間におけるエネルギーの移動方向**です。\n\n化学反応では、原子間の結合を切断するためにエネルギーが必要であり、新しい結合が形成される際にエネルギーが放出されます。この収支によって反応の種類が決まります。\n\n| 基準 | 放出反応（発熱反応） | 吸収反応（吸熱反応） |\n| :--- | :--- | :--- |\n| **エネルギーの移動** | 系から外界へ**放出**される | 外界から系へ**吸収**される |\n| **周囲の温度変化** | 周囲の温度が**上がる** | 周囲の温度が**下がる**（または加熱が必要） |\n| **エネルギー収支** | 生成物のエネルギーが反応物より**低い** | 生成物のエネルギーが反応物より**高い** |\n| **エンタルピー変化 ($\\Delta H$)** | 負（マイナス） | 正（プラス） |\n\n---\n\n### 2. 放出反応（発熱反応 / Exothermic Reaction）\n\n**説明:**\n反応物が生成物に変化する際、余分なエネルギーを熱や光として周囲に放出する反応です。\n化学結合の観点から言うと、「結合を切るのに必要なエネルギー」よりも「新しい結合ができる時に放出されるエネルギー」の方が**大きい**場合、その差分が熱として外に出ます。\n\n**実際の例:**\n\n1.  **燃焼（火）:**\n    *   木材、ガソリン、天然ガスなどが酸素と反応して燃える現象です。激しい熱と光を放出します。\n    *   *反応式例（メタンの燃焼）:* $CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O + \\text{熱エネルギー}$\n\n2.  **使い捨てカイロ:**\n    *   カイロの中にある鉄粉が空気中の酸素と反応して酸化鉄になる際、熱を放出します。\n    *   *反応:* 鉄の酸化反応\n\n3.  **細胞呼吸:**\n    *   私たちの体内で、グルコース（糖分）と酸素が反応してエネルギー（ATP）と熱を生み出します。これが体温維持に使われています。\n\n---\n\n### 3. 吸収反応（吸熱反応 / Endothermic Reaction）\n\n**説明:**\n反応が進むために、周囲から熱や光などのエネルギーを取り込む必要がある反応です。\n「結合を切るのに必要なエネルギー」の方が「新しい結合ができる時に放出されるエネルギー」よりも**大きい**ため、不足分のエネルギーを周囲から奪います。その結果、周囲の温度は下がります（あるいは、反応を続けるために加熱し続ける必要があります）。\n\n**実際の例:**\n\n1.  **光合成:**\n    *   植物が太陽光（エネルギー）を吸収し、二酸化炭素と水からグルコースと酸素を作り出します。光エネルギーがないと反応が進みません。\n    *   *反応式:* $6CO_2 + 6H_2O + \\text{光エネルギー} \\rightarrow C_6H_{12}O_6 + 6O_2$\n\n2.  **冷却パック（瞬間冷却剤）:**\n    *   袋を叩くと中の水と薬剤（硝酸アンモニウムや尿素など）が混ざり、急激に冷たくなる製品です。薬剤が水に溶ける際に周囲の熱を奪う性質を利用しています。\n\n3.  **調理（例：卵を焼く、パンを焼く）:**\n    *   食材に熱エネルギーを与え続けることで化学変化（タンパク質の変性やメイラード反応など）を起こします。火（熱源）を止めると、反応も止まります。\n\n### まとめ\n\n*   **熱くなるなら「放出（発熱）反応」**：エネルギーが余って外に出ている。\n*   **冷たくなる（または加熱が必要）なら「吸収（吸熱）反応」**：エネルギーが足りなくて外から奪っている。\n\nこのように、エネルギーが「出る」か「入る」かという基準で区別することができます。",
