      "model_answer": "放出反応と吸収反応は、化学反応においてエネルギーの移動を伴う2つの主要なタイプです。主な違いは、エネルギーの移動方向と、その反応の性質にあります。\n\n**放出反応（発熱反応）**  \n- **エネルギーの移動**: 外界へエネルギーが放出される。  \n- **性質**: 熱が発生し、周囲に伝わる。  \n- **例**: 炭素（C）と酸素（O₂）の燃焼（C + O₂ → CO₂ + 熱）。  \n\n**吸収反応（吸熱反応）**  \n- **エネルギーの移動**: 外界からエネルギーを受け取る。  \n- **性質**: 熱を消費し、周囲から冷却される。  \n- **例**: 水と氷の融解（H₂O（固） → H₂O（液） + 熱）。  \n\n### 区別基準  \n1. **熱の生成/消費**  \n   - 放出反応：熱を生成する。  \n   - 吸収反応：熱を消費する。  \n\n2. **ΔHの符号**  \n   - 放出反応：ΔHが正（発熱）。  \n   - 吸収反応：ΔHが負（吸熱）。  \n\n3. **実験室での観察**  \n   - 放出反応：温度上昇や煙の発生。  \n   - 吸収反応：温度低下や冷却水の使用。  \n\n### 実際の例比較  \n| 反応                 | エネルギー移動 | 性質           | 例                     |\n|----------------------|----------------|----------------|------------------------|\n| 燃焼 (C + O₂ → CO₂) | 放出           | 発熱           | キャンドル燃焼         |\n| 融解 (H₂O → 液体)  | 吸収           | 吸熱           | 冷凍庫で氷を溶かす     |\n\nこれらの違いは、化学平衡や触媒作用など、他の化学現象にも影響します。例えば、放出反応では触媒が速度を上げつつ発熱量を変えずに済みます。一方、吸収反応では外部からの冷却が必要になる場合があります。",
      "judgements": [
        {
          "judge_id": "judge_gpt-5.1-2025-11-13",
          "score": 4,
          "judge_output": "説明は概ねわかりやすく、日本語も自然で、放出反応（発熱反応）と吸収反応（吸熱反応）の基本的な違いを押さえています。エネルギーの移動方向や、実際の例（燃焼・融解）を挙げている点も評価できます。\n\nしかし、いくつか重大な誤りがあります。\n\n1. **ΔHの符号が逆**  \n   - 発熱反応（放出反応）は「系から外界へ熱が出ていく」ので、系のエンタルピーは減少し、**ΔH < 0（負）** です。  \n   - 吸熱反応（吸収反応）は「外界から系へ熱が入る」ので、系のエンタルピーは増加し、**ΔH > 0（正）** です。  \n   回答ではこれが逆に書かれており、熱化学の基本としては致命的な誤りです。\n\n2. **例の扱いがやや不正確・紛らわしい**  \n   - 「水と氷の融解（H₂O（固） → H₂O（液） + 熱）」という書き方は、あたかも熱が生成されているように見えますが、融解は周囲から熱を**吸収**する吸熱過程です。正しくは「H₂O（固） + 熱 → H₂O（液）」のように書くべきです。  \n   - 「冷凍庫で氷を溶かす」という例も、冷凍庫は本来「凍らせる」装置であり、そこで「氷を溶かす」という表現は直感的に混乱を招きます（室温で氷が溶ける、手の上で氷が溶ける、などの方が適切）。\n\n3. **用語の整理が不十分**  \n   - 「放出反応（発熱反応）」と「吸収反応（吸熱反応）」を対応させている点はよいですが、途中で「ΔHが正（発熱）」と書いてしまっているため、用語と符号の対応が崩れています。  \n   - 「放出反応」「吸収反応」という表現自体は文脈上「熱」に限定しているように見えますが、エネルギー一般（光、電気など）との関係に一言触れておくと、より正確になります。\n\n4. **観察例の精度**  \n   - 「放出反応：温度上昇や煙の発生」とありますが、煙の発生は物質の分解や燃焼に特有であり、発熱反応一般の特徴ではありません。温度変化に絞った方が基準としては明確です。  \n   - 「吸収反応：温度低下や冷却水の使用」も、冷却水の使用はむしろ強い発熱反応で温度上昇を抑えるために使うことが多く、説明としては不適切です。\n\n全体として、構成や説明のスタイルは良いものの、熱化学の根本的な符号の誤りと、例の書き方の不正確さが大きな減点要因になります。\n\nFINAL SCORE: 4",
