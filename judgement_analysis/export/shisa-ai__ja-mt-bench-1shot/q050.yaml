    "original": "保護者たちは、休み時間中のいじめについて校長に苦情を申し立てました。校長はこの問題を速やかに解決したいと考え、休憩補助員に警戒するよう指示しました。補助員が校長に報告すべき状況はどれでしょうか？\na) 関心を示さない少女が一人でベンチに座り、本に夢中で、仲間との交流を全く見せていません。\nb) 一対一のバスケットボールゲームに参加している2人の男の子が、最後に得点したバスケットについて激しく議論しています。\nc) 4人の女の子が別の女の子を囲み、彼女のバックパックを持っているようです。\nd) 3人の男の子がハンドヘルドのビデオゲームに集中しており、これはルールに違反しており、学校内での使用は許可されていません。",
    "translation_en": "**[Purpose: Question]**  \n\nParents have filed a complaint with the principal regarding bullying during recess. The principal wants to resolve the issue promptly and has instructed the recess aides to be vigilant. Which of the following situations should the aides report to the principal?  \n\na) A girl sitting alone on a bench, engrossed in a book, showing no interest in interacting with her peers.  \nb) Two boys engaged in a one-on-one basketball game, arguing heatedly over the last basket scored.  \nc) Four girls surrounding another girl and seemingly taking her backpack.  \nd) Three boys playing handheld video games, which is against school rules and not permitted on campus.  \n\n*(Note: The correct answer is **c**, as it directly indicates potential bullying behavior—surrounding a peer and taking her backpack. The other options describe either non-interactive behavior, a normal argument, or a rule violation unrelated to bullying.)*"
