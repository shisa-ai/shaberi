    "original": "以下の映画のレビューを1から5のスケールで評価してください。1は非常に否定的、3は中立、5は非常に肯定的とします：\n1. 2019年11月18日に公開されたこの映画は素晴らしい。撮影、演技、プロット、すべてが一流でした。\n2. 映画にこんなに失望したことは今までにない。ストーリーは予測可能で、キャラクターは一次元的だった。私の意見では、この映画は2022年に公開された映画の中で最悪の一つだ。\n3. 映画はまあまあだった。楽しめた部分もあったが、物足りないと感じた部分もあった。これは2018年2月に公開された、かなり平凡な映画のようだ。\n答えを整数のJSON配列として返してください。",
    "translation_en": "Here is the translation:  \n\n**[Purpose: question]**  \n\nRate the following movie reviews on a scale of 1 to 5, where 1 is very negative, 3 is neutral, and 5 is very positive:  \n1. This movie, released on November 18, 2019, was fantastic. The cinematography, acting, and plot were all top-notch.  \n2. I have never been so disappointed in a movie. The story was predictable, and the characters were one-dimensional. In my opinion, this is one of the worst movies released in 2022.  \n3. The movie was so-so. There were parts I enjoyed, but also parts that felt lacking. It seems like a rather mediocre film released in February 2018.  \n\nReturn the answer as a JSON array of integers.  \n\n---  \n**JSON Output:**  \n```json  \n[5, 1, 3]  \n```"
  },
