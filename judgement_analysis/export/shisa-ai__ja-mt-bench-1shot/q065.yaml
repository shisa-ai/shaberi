      "model_answer": "炭酸カルシウム (CaCO₃) が塩酸 (HCl) と反応する反応は、**中和反応**の一種であり、より具体的には**酸と炭酸塩の反応**です。この反応では、炭酸カルシウムが塩酸によって分解され、水和物の塩化カルシウム (CaCl₂·nH₂O)、二酸化炭素 (CO₂)、および水 (H₂O) が生成されます。\n\n**バランス化学方程式:**\n\nCaCO₃ + 2HCl → CaCl₂ + CO₂ + H₂O\n\n（ただし、生成される水和物の数（n）は環境条件によって異なります。一般的に、無水物として記述されることが多いですが、実際には水和物として存在することが多いです。）\n\n**反応の種類:**\n\n*   **中和反応:** 酸（塩酸）と塩基性物質（炭酸カルシウム）が結合して、中性の塩（塩化カルシウム）と水を生成します。\n*   **気体発生反応:** 二酸化炭素が気体として発生します。\n\n**観察結果:**\n\nこの反応が起こっていることを示す観察結果は以下の通りです。\n\n1.  **気泡の発生:** 反応容器内で活発に気泡が発生します。これは、二酸化炭素ガスが生成されている証拠です。\n2.  **白色沈殿物の消失:** 炭酸カルシウムは白色沈殿物ですが、反応が進むにつれて溶解していきます。\n3.  **容器内の圧力上昇:** 二酸化炭素ガスの発生により、容器内の圧力が上昇します。\n4.  **温度変化:** 反応は吸熱的または放熱的である可能性があります。温度計で温度変化を測定できます。\n5.  **pH変化:** 塩酸は強い酸ですが、炭酸カルシウムとの反応によりpHが上昇し、中性に近づきます。\n\nこれらの観察結果から、この反応が進行していることを確認できます。",
