      "model_answer": "光合成は、植物や藻類などの光合成生物が太陽エネルギーを利用して二酸化炭素（CO₂）と水（H₂O）から有機物（主にグルコース）を合成するプロセスです。クロロプラスト内で行われ、地球上の生命にとって不可欠なエネルギー源と物質循環の基盤を提供しています。以下に、光合成の2つの主要な段階とそれぞれの入力・出力を説明します。\n\n### 1. 光化学反応（明反応）\n**場所**: クロロプラストのチラコイド膜\n**入力**:\n- **太陽光エネルギー**: 光化学系II（PSII）が吸収\n- **水（H₂O）**: 電子供与体として\n- **二酸化炭素（CO₂）**: 低濃度で参加\n\n**出力**:\n- **ATP（アデノシン三リン酸）**: エネルギー通貨として\n- **NADPH（還元型ニコチンアミドアデニンジヌクレオチドリン酸）**: 電子供与体として\n- **酸素（O₂）**: 発生物質として\n\n### 2. カルビン回路（暗反応）\n**場所**: クロロプラストのストロマ\n- **CO₂**: 主要な入力物質\n- **ATPとNADPH**: 光化学反応から供給されるエネルギーと電子キャリア\n\n**出力**:\n- **グルコース（C₆H₁₂O₆）**: 有機物として生成\n- **ADPとNADP⁺**: ATPとNADPHの再生形\n\n### まとめ\n光合成は、太陽エネルギーを利用してCO₂とH₂Oから有機物を生成し、同時に酸素を放出するプロセスです。光化学反応ではATPとNADPHが生成され、これらがカルビン回路でCO₂を固定しグルコースを合成するためのエネルギー源となります。このプロセスは地球上の生命維持に不可欠であり、食物連鎖の基盤となっています。",
