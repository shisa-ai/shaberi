      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "光合成は、植物や藻類などが光エネルギーを利用して化学エネルギー（糖）を合成する、地球上の生命維持に不可欠なプロセスです。\n\nこのプロセスは細胞内の**葉緑体（クロロプラスト）**で行われ、大きく分けて以下の2つの主要な段階で構成されています。\n\n### 1. 光化学反応（明反応）\n**Light-Dependent Reactions**\n\nこの段階は、葉緑体内部の**チラコイド膜**で行われます。名前の通り、光エネルギーを直接必要とする反応です。太陽光のエネルギーを捕らえ、それを化学エネルギー（ATPとNADPH）に変換します。\n\n*   **主な入力（Inputs）:**\n    *   **光エネルギー**（太陽光）\n    *   **水 ($H_2O$)**\n    *   $NADP^+$（電子受容体）\n    *   ADP（アデノシン二リン酸）とリン酸\n*   **主な出力（Outputs）:**\n    *   **酸素 ($O_2$)**：副産物として大気中に放出されます。\n    *   **ATP**（アデノシン三リン酸）：エネルギー分子。\n    *   **NADPH**：高エネルギー電子運搬体。\n\n---\n\n### 2. カルビン回路（暗反応 / 炭酸固定）\n**The Calvin Cycle (Light-Independent Reactions)**\n\nこの段階は、葉緑体内部の液体部分である**ストロマ**で行われます。光を直接必要としませんが、光化学反応で作られたエネルギー（ATPとNADPH）を使用して反応を進めます。ここで二酸化炭素が固定され、糖が合成されます。\n\n*   **主な入力（Inputs）:**\n    *   **二酸化炭素 ($CO_2$)**：気孔から取り込まれます。\n    *   **ATP**（光化学反応から供給）\n    *   **NADPH**（光化学反応から供給）\n*   **主な出力（Outputs）:**\n    *   **糖（グルコース/G3P）**：植物のエネルギー源や構造材となります。\n    *   ADP（再び光化学反応で使用されるために戻ります）\n    *   $NADP^+$（再び光化学反応で使用されるために戻ります）\n\n---\n\n**まとめ**\n光合成全体としては、光化学反応で「光エネルギーを使って水から酸素を作り、エネルギー（ATP/NADPH）を蓄える」プロセスが行われ、カルビン回路で「そのエネルギーを使って二酸化炭素から糖を作る」プロセスが行われています。これらは密接に連携して機能しています。",
