      "model_answer": "田中さんが非常に健康でありながら毎日病院に行かなければならない理由は、いくつかの可能性があります。以下に考えられる理由を挙げます。  \n\n1. **研究参加者**  \n   - 医学研究や臨床試験に参加しており、定期的な健康チェックやデータ収集が必要な場合があります。  \n   - 例：新薬の効果検証や健康増進プログラムの研究対象者。  \n\n2. **医療従事者（医師・看護師など）**  \n   - 病院で働いているため、勤務の一環として定期的な健康診断を受けている可能性があります。  \n\n3. **公的役職（医療関係者）**  \n   - 医療機関の責任者や管理職として、自身の健康状態を常に把握する必要がある場合があります。  \n\n4. **特別な健康管理が必要な場合**  \n   - 例えば、高血圧や糖尿病などの慢性疾患を発症しないように予防的に管理している場合もあります。  \n\n5. **誤解またはジョーク**  \n   - もし「毎日病院に行かされる」という表現が比喩的または冗談である場合は、具体的な状況が不明です。  \n\n具体的な状況が分かれば、より正確な回答が可能です。もし田中さんの職業や生活習慣について追加情報があれば教えてください！",
