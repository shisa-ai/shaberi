    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "住宅建築のための太陽熱温水システム（ソーラーウォーターヒーター）の設計は、エネルギーコストの削減と環境負荷の低減を実現する優れたプロジェクトです。\n\n以下に、このシステムを設計するための主要コンポーネント、重要な考慮事項、そして設計を進めるための5ステップのワークフローを提案します。\n\n---\n\n### 1. 主要コンポーネント (Key Components)\n\nシステムを構成する物理的な部品です。これらを適切に選定・組み合わせることが機能的なシステムの基礎となります。\n\n1.  **集熱器（ソーラーコレクター）**:\n    *   **平板型（Flat Plate）**: 最も一般的で耐久性が高い。コストパフォーマンスが良い。\n    *   **真空管型（Evacuated Tube）**: 断熱性が高く、寒冷地や曇天時でも効率が良いが、コストが高く割れやすい場合がある。\n2.  **貯湯タンク（Storage Tank）**:\n    *   集めた熱を保存するための断熱されたタンク。内部に熱交換器（コイル）を内蔵しているタイプが一般的です。\n3.  **熱交換器（Heat Exchanger）**:\n    *   集熱器を循環する不凍液（熱媒体）と、家庭で使用する水道水を分離し、熱だけを移動させる装置。タンク内蔵型と外部設置型があります。\n4.  **循環ポンプとコントローラー（Pump & Controller）**:\n    *   **差温サーモスタット**: 集熱器の温度がタンク内の水温より高い場合のみポンプを作動させる制御装置。\n    *   **循環ポンプ**: 熱媒体を循環させるためのポンプ。\n5.  **膨張タンクと安全弁**:\n    *   温度変化による液体の体積変化や圧力上昇を吸収し、配管の破裂を防ぐ安全装置。\n6.  **補助熱源（バックアップヒーター）**:\n    *   雨天や夜間、需要過多の際に不足分を補うためのガス給湯器や電気ヒーター。\n\n---\n\n### 2. 重要な考慮事項 (Key Considerations)\n\n設計段階で検討すべき技術的・環境的要因です。\n\n*   **設置場所と方位**: 北半球では「真南」に向け、その土地の緯度に近い角度（日本では約30度〜45度）で設置するのが理想的です。日陰にならない場所を選ぶ必要があります。\n*   **凍結対策**: 冬季に配管内の水が凍結して破損するのを防ぐため、不凍液（プロピレングリコールなど）を使用する「間接加熱式」か、使用しない時に水を抜く「ドレインバック方式」を採用する必要があります。\n*   **過熱対策（スタグネーション）**: 夏場に長期間旅行などで湯を使用しない場合、システムが高温になりすぎることがあります。これを逃がすための放熱機能や設計が必要です。\n*   **屋根の耐荷重**: 満水時のタンクやパネルの重量に屋根が耐えられるか、構造計算を確認する必要があります。\n*   **給湯需要のバランス**: 住人の数と使用量に対してシステムが大きすぎるとコストと過熱の無駄が生じ、小さすぎると補助熱源への依存度が高まりメリットが薄れます。\n\n---\n\n### 3. 設計のための5ステップ・ワークフロー\n\n効率的かつ論理的に設計を進めるための手順です。\n\n#### ステップ1：需要分析と現地調査 (Assessment & Analysis)\n*   **需要算定**: 居住人数、1日あたりの想定給湯量（例：1人あたり1日約50〜80リットル）、使用パターン（朝型か夜型か）を決定します。\n*   **現地調査**: 屋根の方位、傾斜角、面積、影の影響（周囲の建物や樹木）、配管ルート、貯湯タンクの設置スペース（屋内か屋外か）を確認します。\n\n#### ステップ2：システムタイプの選定 (System Selection)\n*   **循環方式の決定**:\n    *   *強制循環式（アクティブ）*: ポンプを使用。自由な配置が可能で効率が高い。一般的。\n    *   *自然循環式（パッシブ/サーモサイフォン）*: タンクをパネルより上に設置し、重力を利用。安価だが屋根への荷重が重く、デザイン上の制約がある。\n*   **熱交換方式の決定**: 寒冷地であれば不凍液を使う「間接式」、温暖地であれば「直接式」も検討可能ですが、現代の住宅では耐久性の観点から間接式が推奨されます。\n\n#### ステップ3：サイジング（規模計算） (Sizing)\n*   **コレクター面積の計算**: 必要な熱量を得るために必要なパネルの枚数や面積を計算します。（一般家庭では4〜6平方メートル程度が目安）。\n*   **タンク容量の決定**: コレクター面積に対して適切な容量を選びます（一般的にコレクター1平方メートルあたり50〜70リットル）。\n*   **太陽熱依存率（ソーラーフラクション）の目標設定**: 年間給湯エネルギーの何％を太陽熱で賄うか（通常40〜60％を目指す）を設定し、シミュレーションを行います。\n\n#### ステップ4：詳細設計と統合 (Detailed Design & Integration)\n*   **配管設計**: 屋根からタンクまでの配管ルート、断熱材の厚さ、センサー配線のルートを設計します。\n*   **補助熱源との接続**: 既存または新規の給湯器（ガス・電気）とどのように接続するか（直列接続が一般的）を決定します。太陽熱で温まった水が設定温度以下の時だけバックアップが稼働する仕組みを作ります。\n*   **安全装置の配置**: 逃し弁、逆流防止弁、膨張タンクの配置を図面に落とし込みます。\n\n#### ステップ5：設置・試運転・メンテナンス計画 (Installation & Commissioning)\n*   **施工**: 屋根への防水処理を確実に行いながら設置します。\n*   **試運転**: 圧力テスト（漏れがないか）、ポンプの動作確認、コントローラーの設定（温度差設定など）を行います。\n*   **ユーザー教育とメンテナンス**: 住人に対し、システムの状態確認方法（圧力計の見方など）や、数年に一度の不凍液交換などのメンテナンススケジュールを伝えます。",
