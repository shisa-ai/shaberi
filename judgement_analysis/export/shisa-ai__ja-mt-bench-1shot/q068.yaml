    "original": "住宅建築のための太陽熱温水システムを設計する任務を与えられました。あなたの設計に含める主要なコンポーネントと考慮事項を説明してください。5ステップのワークフローを設計してください。",
    "translation_en": "**[Purpose: Question]**  \n\nYou have been tasked with designing a solar thermal water heating system for residential construction. Explain the key components and considerations to be included in your design. Develop a 5-step workflow for the design process.  \n\n*(Translation preserves the original meaning, structure, and technical details while ensuring natural English phrasing suitable for evaluation documentation.)*"
