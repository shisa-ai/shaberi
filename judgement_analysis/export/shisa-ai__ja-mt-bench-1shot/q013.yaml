    "original": "提示されたテキストから次の情報を抽出してください：本の名前、著者、主人公、出版年。出力形式は \"主人公、本、著者、出版年\" で、一行に一冊の本を記述してください。\na) マーダーミステリーの分野では、東野圭吾の作品が特に印象に残る。彼の作品の中でも特に記憶に残るのは「容疑者Xの献身」である。このアイコニックな物語は2005年に発表され、数学者の石神と料理店の女主人、彼女の娘についての物語である。\nb) 日本の児童文学の一つである宮沢賢治の「銀河鉄道の夜」は1927年に発表され、物語は二人の少年ジョバンニとカムパネルラを中心に展開されます。\nc) 戦後の日本を背景にした小説として、1933年からさまざまな雑誌に分載された川端康成の「雪国」があります。主人公・島村は雪国に向かう汽車の中で、病人の男に付き添う恋人らしき若い娘に興味を惹かれたことから展開されます。",
