      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "日本のビジネスシーンにおけるマナーは、単なる形式的なルールではなく、**「相手への敬意」と「信頼関係の構築」**を目的とした文化的な儀式のような側面があります。\n\n海外のビジネス習慣とは異なる独自のルールが多く存在するため、主要なポイントをカテゴリー別に分かりやすく解説します。\n\n### 1. 名刺交換（Meishi Koukan）\n日本のビジネスにおいて、名刺交換は最初の最も重要な儀式です。\n\n*   **準備:** 名刺入れから出し、すぐに渡せる状態にしておきます（ポケットや財布から直接出すのはNG）。\n*   **渡し方:** 両手で持ち、自分の名前が相手から見て読める向きにして差し出します。「〇〇会社の[氏名]と申します」と名乗りながら渡します。\n*   **受け取り方:** 必ず両手で受け取ります。「頂戴いたします」と言います。相手のロゴや名前に指を置かないように注意してください。\n*   **その後:** 受け取った名刺はすぐにしまわず、テーブルの自分の左側（自分から見て左上）に置きます。複数人いる場合は、役職順または座席順に並べます。\n\n### 2. 時間厳守（Punctuality）\n日本において「時間は信頼」です。\n\n*   **5分前行動:** 約束の時間の5分〜10分前には到着しているのが基本です。\n*   **遅刻:** 電車の遅延などやむを得ない理由であっても、1分でも遅れる可能性がある場合は、**必ず約束の時間の前に**電話で連絡を入れます。事後報告は信頼を大きく損ないます。\n\n### 3. 席次（Sekiji）ー 上座と下座\n会議室、エレベーター、タクシー、飲み会など、あらゆる場面で座る位置に序列があります。\n\n*   **上座（Kamiza）:** 目上の人や来客が座る席。基本的には**「入り口から最も遠い席」**です。\n*   **下座（Shimoza）:** 目下の人やホスト側が座る席。**「入り口に最も近い席」**です。雑用や注文、ドアの開閉を行いやすい場所です。\n*   **迷った場合:** 自分がホスト側（または目下）であれば、とりあえず入り口近くに立つか座るのが無難です。\n\n### 4. 言葉遣いとコミュニケーション\n*   **敬語:** 「尊敬語」「謙譲語」「丁寧語」の使い分けが求められますが、外国人や新人の場合は、完璧でなくとも「丁寧な言葉（です・ます）」を一貫して使えば好意的に受け取られます。\n*   **本音と建前:** 日本人は対立を避けるため、直接的な「No」を言わない傾向があります。「検討します（I will consider it）」や「善処します」と言われた場合、それは「Yes」ではなく、遠回しな「No」である可能性が高いことを理解しておく必要があります。\n*   **沈黙:** 会話の間の沈黙は、思考中であることを意味する場合が多く、必ずしもネガティブではありません。焦って喋りすぎないようにしましょう。\n\n### 5. 報・連・相（Hou-Ren-So）\n日本の組織で働く、あるいはチームで動く際の基本原則です。\n\n*   **報告（Houkoku）:** 業務の進捗や結果を上司に知らせる。\n*   **連絡（Renraku）:** 事実や情報を関係者に共有する。\n*   **相談（Soudan）:** 判断に迷ったときやトラブル時に上司や先輩にアドバイスを求める。\n*   **ポイント:** 悪いニュースほど早く報告することが鉄則です。\n\n### 6. 身だしなみ（Minari）\n「清潔感」と「調和」が重視されます。\n\n*   **服装:** 基本はダークカラー（紺やグレー）のスーツです。派手な色や柄、過度なアクセサリーは避けるのが無難です。\n*   **靴と髪:** 靴は磨かれているか、髪は整っているかなど、細部が見られます。\n\n### 7. 飲み会・接待（Nomikai / Settai）\n仕事の延長線上にあるコミュニケーションの場です。\n\n*   **お酌:** 相手のグラスが空きそうになったら、ビールやワインなどを注ぎます。自分のグラスには手酌（自分で注ぐこと）をせず、相手に注いでもらうのを待ちます。\n*   **無礼講（Bureikou）:** 「今日は無礼講で（地位を忘れて楽しもう）」と言われることがありますが、**これを真に受けてはいけません。** 最低限の礼儀は保ち続ける必要があります。\n\n### 8. 根回し（Nemawashi）\n重要な会議で決定を下す前に、関係者個別に話を通しておき、合意形成をしておくプロセスです。\n日本の会議は「議論して決める場」ではなく、「すでに決まっていることを形式的に承認する場」であることが多いため、事前の根回しがないと提案が通らないことがあります。\n\n---\n\n**アドバイス:**\nこれら全てを完璧にこなすのは日本人でも難しいことです。もしあなたが外国人であったり、その業界の新人であれば、多少の間違いは許容されます。\n最も大切なのは、**「日本の文化を尊重し、学ぼうとしている姿勢」**を見せることです。それが伝われば、多くのビジネスパートナーは好意的に接してくれます。",
