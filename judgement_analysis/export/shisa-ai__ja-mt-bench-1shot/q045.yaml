    "original": "以下の文を注意深く読み、説明を含む質問に答えてください：\n小さな会社では、駐車スペースはトップエグゼクティブ：CEO、社長、副社長、秘書、財務官が予約しています。駐車場のガードは、車の色を見るだけで車が正しく駐車されているかどうかを一目で確認できます。車の色は黄色、緑、紫、赤、青で、エグゼクティブの名前は和也、明、桃子、健一、恵です。\n\n最初のスペースには赤い車があります。\n青い車は赤い車と緑の車の間に駐車されています。\n最後のスペースには紫色の車があります。\n秘書は黄色の車を運転しています。\n和也の車は健一の隣に駐車されています。\n恵は緑の車を運転しています。\n明の車は桃子と恵の間に駐車されています。\n健一の車は最後のスペースに駐車されています。\n質問：秘書の名前は何ですか？",
    "translation_en": "**[Purpose: Question]**  \n\nRead the following passage carefully and answer the question with an explanation:  \n\nIn a small company, parking spaces are reserved for top executives: the CEO, President, Vice President, Secretary, and Treasurer. The parking attendant can instantly verify whether a car is parked correctly by simply looking at its color. The car colors are yellow, green, purple, red, and blue, and the executives' names are Kazuya, Aki, Momoko, Kenichi, and Megumi.  \n\n- The first space has a red car.  \n- The blue car is parked between the red and green cars.  \n- The last space has a purple car.  \n- The Secretary drives a yellow car.  \n- Kazuya's car is parked next to Kenichi's.  \n- Megumi drives a green car.  \n- Aki's car is parked between Momoko and Megumi.  \n- Kenichi's car is parked in the last space.  \n\n**Question:** What is the Secretary's name?  \n\n---  \n\n**Answer:** The Secretary's name is **Momoko**.  \n\n**Explanation:**  \n1. The last space has a purple car (Kenichi's car is in the last space, so it must be purple).  \n2. The first space has a red car.  \n3. The blue car is between the red and green cars, so the order is: Red, Blue, Green.  \n4. Megumi drives the green car, so the order is: Red, Blue, Green (Megumi).  \n5. Aki's car is between Momoko and Megumi, so the order is: Momoko, Aki, Megumi (Green).  \n6. Kazuya's car is next to Kenichi's (purple), so Kazuya's car must be yellow (since the Secretary drives the yellow car).  \n7. The only remaining name is **Momoko**, who must be the Secretary.  \n\nThus, the Secretary's name is **Momoko**."
  },
