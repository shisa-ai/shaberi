      "model_answer": "将来の映画製作者が学ぶべき受賞歴のあるドキュメンタリー映画を5作品選び、それぞれの背景や学びを解説します。  \n\n### 1. **『スーパーサイズ・ミー』（2004）**  \n   - **監督**: モーガン・スパーロック  \n   - **背景**: スパーロックが30日間マクドナルドの食事のみで生活し、健康への影響を記録。低予算で社会問題に切り込んだ手法が話題に。  \n   - **学び**: 個人的な実験を通じて社会的メッセージを伝える方法、エンターテイメント性と啓発性の融合。  \n\n### 2. **『アクト・オブ・キリング』（2012）**  \n   - **監督**: ジョシュア・オッペンハイマー  \n   - **背景**: インドネシア大虐殺に関与した元死刑執行人が「殺人」をハリウッド映画風に再現するという衝撃的な構成。  \n   - **学び**: 犯罪者側の視点から真実を暴く逆説的な手法、倫理的ジレンマへの挑戦。  \n\n### 3. **『ブラックフィッシュ』（2013）**  \n   - **監督**: ガブリエラ・コーワン  \n   - **背景**: シーワールドで飼育されたシャチ「ティルクム」の悲劇を通じて、動物園産業の闇を告発。公開後、シーワールドはショー中止に追い込まれた。  \n   - **学び**: ドキュメンタリーが社会変革を起こす力、証言とアーカイブ映像の効果的な活用。  \n\n### 4. **『フリーソロ』（2008）**  \n   - **監督**: ジミー・チン＆エリザベス・チャイ・ヴァサルヘリィ  \n   - **背景**: アレックス・ホノルドがロープなしでエルキャピタン（ヨセミテ国立公園）登頂に挑む過程を追った作品。技術的困難と人間ドラマが融合。  \n   - **学び**: 極限状況での撮影技術、アスリートとの信頼関係構築、ストーリーテリングにおける緊張感の演出。  \n\n### 5. **『ホットコップ』（2020）**  \n   - **監督**: トニー・ヴィダーナ＆ジェニファー・マクダウェル（プロデューサー：ジェニファー・マクダウェル）  \n   - **背景**: ニューヨーク市警官として活躍する男性がSNSで「ホットコップ」として話題になり、その光と影を描く。当事者本人によるナレーションも特徴的。  \n   - **学び**: 現代社会におけるSNSとアイデンティティの関係性、インタビュー技法による心理描写、短編ドキュメンタリーの可能性（アカデミー短編ドキュメンタリー賞受賞）。  \n\nこれらの作品は、それぞれ異なるテーマや手法で観客に強い印象を残しており、ドキュメンタリー制作における多角的なアプローチを学ぶことができます。また、いずれも社会的影響力を持つため、「映画は単なる記録ではなく、アクションにつながる」という教訓も得られます。",
