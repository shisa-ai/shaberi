      "model_key": "shisa-v2-405b",
      "model_file": "shisa-ai__shisa-v2-llama3.1-405b.json",
      "model_answer": "**基準率の無視（Base Rate Neglect）**とは、統計的な判断を行う際に、特定の事例や個別情報に過度に注目し、その事象が発生する確率を示す「基準率（ベースレート）」を無視してしまう認知バイアスです。簡単に言うと、「全体の傾向」を考慮せず、個別の情報だけで結論を出してしまう誤りです。  \n\n---\n\n### **政治家がキャンペーンで基準率の無視を利用する具体例**  \n1. **「犯罪増加」の強調**  \n   - **事例**: 「最近、この街で強盗事件が3件発生した！治安が悪化している」と主張する。  \n   - **基準率の無視**: 実際には、過去10年間で年間平均5件発生しており、今回はむしろ減少している可能性がある。個別事件に焦点を当て、全体的な犯罪率（基準率）を隠すことで不安を煽る。  \n\n2. **「政策成功」の歪曲**  \n   - **事例**: 「私たちの就労支援プログラムを受けた100人のうち80人が就職した！」と宣伝する。  \n   - **基準率の無視**: プログラムを受けなかった場合でも、自然就職率は70%だったため、プログラムの効果はわずか10%しかない。しかし、絶対数だけ強調して成果を誇張する。  \n\n3. **「医療制度」の危機演出**  \n   - **事例**: 「この病院では先月、新型ウイルスの重症患者が5人入院した！医療崩壊寸前だ」と警告する。  \n   - **基準率の無視**: 実際には、その病院では毎月平均7人の重症患者が入院しており、今回はむしろ減少している。しかし、「5人」という数字だけを提示して危機感を作り出す。  \n\n4. **「移民問題」の扇動**  \n   - **事例**: 「最近、この国に入国した移民の中には犯罪者がいた！移民受け入れは危険だ」と主張する。  \n   - **基準率の無視**: 移民全体の中で犯罪者は0.1%であり、自国民と比べても低い割合だが、「犯罪者がいた」という個別事例だけを強調して偏見を助長する。  \n\n5. **「経済成長」の誇張**  \n   - **事例**: 「私たちの政策により、先月GDP成長率が2%上昇した！」とアピールする。  \n   - **基準率の無視**: 他の大多数の国でも同期間に平均3%成長しており、今回の上昇はむしろ低い。しかし、「2%上昇」という数字だけを提示して成功と主張する。  \n\n---\n\n### なぜ政治家がこの手法を使うのか？  \n- 人々は具体的なエピソード（個別情報）よりも影響を受けやすく、抽象的な統計（基準率）は理解しにくいため、感情的に訴えかける効果があるからです。また、一部真実（個別データ）を使うことで信憑性を持たせつつ、本質的なデータ（全体傾向）を隠すことが可能になります。  \n\nこのバイアスを見抜くためには、「全体像」を意識し、「比較対象」や「過去データ」を確認することが重要です。",
