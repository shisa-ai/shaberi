    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "**基準率の無視（Base Rate Neglect）**とは、ある事象の確率を判断する際に、その事象が発生する全体的な確率（基準率/事前確率）を無視し、目の前にある特定の情報（個別情報）だけに注目してしまう認知バイアス（思考の誤り）のことです。\n\n簡単に言えば、**「統計的な事実よりも、印象的なエピソードや特定の事例を優先して判断してしまうこと」**です。\n\n### 政治キャンペーンにおける利用\n\n政治家は、有権者の感情（恐怖、怒り、同情など）を揺さぶるためにこの誤謬を頻繁に利用します。統計データは退屈で直感的に理解しにくい一方、個別のストーリーは強力で記憶に残りやすいためです。\n\n以下に、政治家がキャンペーンで「基準率の無視」をどのように利用するかの具体的な例を5つ挙げます。\n\n---\n\n### 1. 移民と犯罪の関連付け\n**シナリオ:**\nある政治家が、不法移民によって行われた残忍な殺人事件のニュースを繰り返し取り上げ、被害者遺族をキャンペーンのステージに上げます。「彼らが国境を越えてこなければ、この悲劇は起きなかった」と主張し、移民全体の危険性を訴えます。\n\n*   **基準率の無視:**\n    *   **無視された基準率:** 統計的に見ると、移民（不法移民を含む）の犯罪率は、その国で生まれた国民の犯罪率よりも低い場合が多いです。\n    *   **強調された個別情報:** 「ある一人の移民が凶悪犯罪を犯した」という衝撃的な事実。\n*   **効果:** 有権者は「移民＝危険」という誤った確率を見積もり、厳格な国境管理や排斥政策を支持するようになります。\n\n### 2. 生活保護不正受給の「福祉の女王」\n**シナリオ:**\n財政保守派の候補者が、生活保護を受けながら高級車に乗り、不正に贅沢な暮らしをしている特定の人物（いわゆる「福祉の女王」的な事例）を激しく非難します。「我々の税金がこのように浪費されている」と訴えます。\n\n*   **基準率の無視:**\n    *   **無視された基準率:** 生活保護受給者全体の中で、不正受給が行われている割合（基準率）は通常極めて低く（数パーセント以下など）、大半は本当に困窮している人々です。\n    *   **強調された個別情報:** 悪質な不正受給者の具体的なエピソード。\n*   **効果:** 有権者は福祉制度全体が腐敗していると錯覚し、福祉予算の削減や受給要件の厳格化を正当なものとして受け入れます。\n\n### 3. テロリズムと監視社会の強化\n**シナリオ:**\n現職の政府高官が、過去に起きた特定のテロ事件の映像をキャンペーン広告に使用し、「あなたの家族の安全が脅かされている」と警告します。そして、通信傍受や監視カメラの増設などの権限強化を求めます。\n\n*   **基準率の無視:**\n    *   **無視された基準率:** 一般市民がテロに巻き込まれて死亡する確率は、交通事故や家庭内の事故、あるいは落雷に遭う確率よりもはるかに低いです（極めて低い基準率）。\n    *   **強調された個別情報:** テロ攻撃の視覚的な恐怖と悲劇性。\n*   **効果:** 有権者はテロのリスクを過大評価し、プライバシーの権利を放棄してでも治安対策を強化する政策を支持してしまいます。\n\n### 4. ワクチンや医療政策への反対\n**シナリオ:**\nある候補者が、特定のワクチンの接種後に重篤な障害を負った子供の親をインタビューし、「この健康被害を見てください。政府はこれを強制しようとしている」と訴えます。\n\n*   **基準率の無視:**\n    *   **無視された基準率:** そのワクチンによって重篤な副作用が出る確率は数百万分の一であり、逆にワクチンを打たずに感染症にかかって重症化・死亡する確率の方がはるかに高いという統計的事実。\n    *   **強調された個別情報:** ワクチン接種後に起きた悲劇的な（しかし極めて稀な）事例。\n*   **効果:** 有権者はワクチンの危険性を過大に見積もり、公衆衛生政策への反対や「医療の自由」を掲げる候補者を支持するようになります。\n\n### 5. 富裕層増税への反対（農場・中小企業の例）\n**シナリオ:**\n相続税の増税に反対する政治家が、「親から受け継いだ小さな家族経営の農場を、相続税を払うために売り払わなければならなかった一家」の話を感情的に語ります。「増税はこのような勤勉な家族を破壊する」と主張します。\n\n*   **基準率の無視:**\n    *   **無視された基準率:** 実際に相続税の対象となるのは上位数パーセントの超富裕層だけであり、小規模な農家や中小企業が相続税のために廃業に追い込まれるケースは統計的にほぼ皆無に近いという事実。\n    *   **強調された個別情報:** 同情を誘う、稀有な（あるいは理論上の）「被害者」のストーリー。\n*   **効果:** 本来は増税の影響を受けない中流階級の有権者までが、「自分たちも被害を受けるかもしれない」と誤認し、富裕層向けの減税政策を支持してしまいます。\n\n---\n\n### まとめ\nこれらの例に共通するのは、**「分母（全体数）」を隠して「分子（特定の事例）」だけを強調する**という手法です。政治家は、人間が数字よりも物語（ナラティブ）に反応する生き物であることを熟知しており、基準率の無視を利用して、論理ではなく感情に基づいた投票行動を促そうとします。",
