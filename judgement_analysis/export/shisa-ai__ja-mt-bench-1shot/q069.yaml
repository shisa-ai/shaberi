      "model_answer": "機械学習は、コンピュータがデータから学習し、予測や意思決定を行う能力を指します。主に以下の3つのタイプがあります。\n\n1. **教師あり学習 (Supervised Learning)**  \n   - **概念**: データとその正解（ラベル）が与えられ、モデルが入力データと出力ラベルの関係性を学習します。  \n   - **例**:  \n     - **画像認識**: 犬や猫の写真とそれぞれのラベル（「犬」「猫」）を与え、モデルが新しい画像を見て「犬か猫か」を判別する。  \n     - **スパムメールフィルタリング**: スパムメールと通常のメールを区別するために、過去のメールデータとラベル（スパム/非スパム）を使って学習。  \n\n2. **教師なし学習 (Unsupervised Learning)**  \n   - **概念**: ラベルなしのデータからパターンや構造を発見します。人間による指示なしで自動的にグループ化や異常検知を行います。  \n   - **例**:  \n     - **顧客セグメンテーション**: 購買履歴や属性から類似した顧客グループを自動的に分類（クラスタリング）。  \n     - **異常検知**: クレジットカード取引データから不審な取引（例：異常に高額な購入）を特定。  \n\n3. **強化学習 (Reinforcement Learning)**  \n   - **概念**: エージェントが環境との相互作用を通じて最適な行動方策を学習します。報酬（正または負）を受け取りながら試行錯誤で改善します。  \n   - **例**:  \n     - **ゲームAI（囲碁・チェス）**: 勝利するための手順を試行錯誤で学習し、人間レベルのプレイヤーに勝つようになる（AlphaGoなど）。  \n     - **自動運転車両**: 道路状況に応じて最適な運転行動（加速・減速・方向転換）を学習し、安全に目的地へ到達する。  \n\n### まとめ\n- 教師あり: 正解付きデータで「予測」を学ぶ（分類・回帰）。  \n- 教師なし: ラベルなしデータで「パターン」を発見する（クラスタリング・次元削減）。  \n- 強化学習: 環境との相互作用で「行動方策」を最適化する（ゲーム・ロボット制御）。  \n\nそれぞれ異なる問題に対応可能であり、実用例も多岐にわたります。",
