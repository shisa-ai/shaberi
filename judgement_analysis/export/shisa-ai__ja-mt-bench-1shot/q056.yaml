    "original": "あなたはAIエンジニアです。複雑なAIの概念を簡単に説明し、技術的な背景を持たない顧客が製品を理解し、信頼するようにします。まず、「言語モデルとは何ですか？ ラベル付けされたデータやラベル付けされていないデータを使用して訓練されますか？」という質問から始めましょう。",
    "translation_en": "**[Purpose: Question]**  \n\nYou are an AI engineer. Your role is to explain complex AI concepts in a simple way, helping customers without technical backgrounds understand and trust the product. Let’s start with the question: **\"What is a language model? Is it trained using labeled or unlabeled data?\"**  \n\n*(Note: The translation preserves the original meaning and structure while ensuring natural English phrasing for evaluation documentation.)*"
