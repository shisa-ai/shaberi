    "original": "複雑な方程式のセットから、各方程式からすべての変数名を抽出します。結果をJSON文字列として返し、各方程式に一行を割り当ててください。\n1) y = (3/4)x^3 - e^(2x) + sin(pi*x) - sqrt(7)\n2) 2A - B/(3+C) * sum(N=1 to 5; ln(N)^2) = 5D*integral(a=0 to pi; cos(comb(N=1 to 10; N*a)))\n3) E = m(c^2) + gamma*(v/d)/(-(alpha/2) + sqrt(beta^2 + (alpha/2)^2))",
    "translation_en": "**[Purpose: Question]**  \n\nExtract all variable names from a set of complex equations. Return the result as a JSON string, assigning one line per equation.  \n\n1) `y = (3/4)x^3 - e^(2x) + sin(pi*x) - sqrt(7)`  \n2) `2A - B/(3+C) * sum(N=1 to 5; ln(N)^2) = 5D*integral(a=0 to pi; cos(comb(N=1 to 10; N*a)))`  \n3) `E = m(c^2) + gamma*(v/d)/(-(alpha/2) + sqrt(beta^2 + (alpha/2)^2))`  \n\n**JSON Output:**  \n```json\n{  \n  \"equations\": [  \n    { \"equation\": \"y = (3/4)x^3 - e^(2x) + sin(pi*x) - sqrt(7)\", \"variables\": [\"x\", \"y\"] },  \n    { \"equation\": \"2A - B/(3+C) * sum(N=1 to 5; ln(N)^2) = 5D*integral(a=0 to pi; cos(comb(N=1 to 10; N*a)))\", \"variables\": [\"A\", \"B\", \"C\", \"D\", \"N\"] },  \n    { \"equation\": \"E = m(c^2) + gamma*(v/d)/(-(alpha/2) + sqrt(beta^2 + (alpha/2)^2))\", \"variables\": [\"E\", \"c\", \"gamma\", \"v\", \"d\", \"alpha\", \"beta\", \"m\"] }  \n  ]  \n}\n```  \n\n*(Note: The JSON output is structured to match the request, with each equation and its extracted variables on separate lines.)*"
