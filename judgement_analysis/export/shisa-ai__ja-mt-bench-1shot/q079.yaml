      "model_answer": "最新の日本の太陽光発電技術に関する記事のために、科学的な正確さと読者の関心を両立させた見出しを4つ提案します。\n\nそれぞれの見出しは、現在日本が世界をリードしている特定の技術分野（ペロブスカイト、タンデム型、宇宙太陽光発電、人工光合成）に焦点を当てています。\n\n### 1. ペロブスカイト太陽電池（次世代の主役）\n**「塗るだけ」で発電？日本発「ペロブスカイト」が切り拓く、曲がる太陽電池の未来と実用化への壁**\n> **解説:** 日本で発明された「ペロブスカイト太陽電池」の最大の特徴である「溶液塗布プロセス（塗る）」と「フレキシブル性（曲がる）」を強調しつつ、実用化に向けた課題（耐久性など）にも触れることで、誇張のない信頼性の高い記事であることを示唆します。\n\n### 2. タンデム型太陽電池（変換効率の追求）\n**シリコンの物理的限界を突破せよ：変換効率30%超えを狙う「タンデム型」技術と日本の材料科学**\n> **解説:** 従来のシリコン単体では理論的限界（約29%）がある中、異なる素材を重ね合わせる「タンデム構造」によってその壁を破ろうとする日本の最新研究に焦点を当てます。「30%超え」という具体的な数字が科学的な興味を引きます。\n\n### 3. 宇宙太陽光発電（JAXAの研究）\n**SFが現実に：宇宙から地上へ電力を送る「宇宙太陽光発電(SSPS)」とJAXAのマイクロ波伝送実験**\n> **解説:** 天候に左右されない宇宙空間での発電と、それをマイクロ波で地上に送るというJAXA（宇宙航空研究開発機構）の野心的なプロジェクトを取り上げます。夢のある技術ですが、マイクロ波伝送という具体的な科学用語を入れることで現実味を持たせます。\n\n### 4. 人工光合成（エネルギー貯蔵の視点）\n**太陽光で水から水素を：世界をリードする日本の「人工光合成」技術と、脱炭素社会を支えるソーラー水素の可能性**\n> **解説:** 単に電気を作るだけでなく、太陽光エネルギーを「水素」という化学エネルギーに変換・貯蔵する技術（人工光合成）に焦点を当てます。日本はこの分野でトップクラスの研究実績を持っており、エネルギー問題の根本的解決策として注目度が高いテーマです。",
