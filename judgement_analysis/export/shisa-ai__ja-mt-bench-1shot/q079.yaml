      "model_answer": "以下に、科学的に正確かつ読者の興味を引く日本の最新太陽光発電技術に関する見出しを4つ提案します。  \n\n1. **「ペロブスカイト太陽電池の新時代：日本の研究チームが変換効率22%突破」**  \n   - 科学的根拠：ペロブスカイト太陽電池は有機・無機ハイブリッド材料で、シリコン系よりも低コスト・高効率化が期待される次世代技術。  \n   - 興味喚起ポイント：具体的な数値（22%）で成果を強調し、革新性をアピール。  \n\n2. **「薄膜シリコン＋量子ドットで光吸収率最大化：日本企業が開発した複合型ソーラーパネル」**  \n   - 科学的根拠：量子ドットは特定波長の光を効率的に吸収し、薄膜シリコンと組み合わせることでコスト削減と性能向上が可能。  \n   - 興味喚起ポイント：「複合型」というキーワードで技術の進化を示唆。  \n\n3. **「建物一体型BIPV（ビル・インテグレーテッド・フォトボルタイクス）の進化：日本の建築材メーカーが透明ソーラーパネル実用化」**  \n   - 科学的根拠：BIPVは建物の外壁や窓に太陽光パネルを統合する技術で、省エネとデザイン性両立が可能。  \n   - 興味喚起ポイント：「透明ソーラーパネル」という未来的な要素に注目。  \n\n4. **「AI最適化された追尾型太陽光システム：日本のスタートアップが発電量15%増加に成功」**  \n   - 科学的根拠：AIアルゴリズムにより日射角や気象条件に応じてパネルの角度を自動調整し、発電効率向上。  \n   - 興味喚起ポイント：「AI」というトレンドワードと具体的な効果（15%増）で実用性を強調。  \n\nこれらの見出しは、日本の太陽光発電分野における最新動向（材料開発・応用技術・AI活用）を反映し、専門家だけでなく一般読者にも興味を持ってもらえる内容になっています。必要に応じてさらに調整可能です！",
