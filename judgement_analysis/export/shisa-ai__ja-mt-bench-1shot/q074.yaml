      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "ご友人との関係性に合わせて、少しカジュアルで温かみのある文面を作成しました。相手の不安（人前で話すことへの苦手意識）に寄り添いつつ、ハードルを下げるような構成にしています。\n\n件名や細かいニュアンスは、ご友人との距離感に合わせて調整して使ってください。\n\n***\n\n**件名：** 今度の日曜、ちょっと付き合ってくれない？（「ことばの会」の話）\n\n**本文：**\n\n〇〇、お疲れ様！\n最近どう？元気にしてるかな。\n\n実は今日メールしたのは、地元の「ことばの会」のボランティアに、〇〇を誘いたいなと思って。\n\nあ、今「えっ、人前で話すなんて絶対無理！」って顔したでしょ？（笑）\n〇〇が大勢の前で話したり、注目されたりするのが苦手なのは、昔からよーく知ってるよ。だからこそ、声をかけたんだ。\n\n「ことばの会」って名前だけ聞くと、何か立派なスピーチをしなきゃいけないみたいに感じるかもしれないけど、実際は全然違うんだよ。\n主な活動は、子供たちに絵本を読んであげたり、地域のお年寄りとゆっくりお喋りしたりすることなの。\n\n大勢の前でマイクを持って話すんじゃなくて、少人数の輪の中で、静かにお話しするようなアットホームな雰囲気なんだ。\n\n私が〇〇を誘いたいと思った一番の理由は、〇〇が「聞き上手」で、とても優しい雰囲気を持ってるからなんだよね。\n流暢にペラペラ喋る人よりも、〇〇みたいに相手のペースに合わせて、丁寧に言葉を選べる人のほうが、実はこのボランティアには向いていると思うんだ。〇〇の声や話し方って、相手を安心させる力があるから。\n\nもちろん、いきなり「やってみて」とは言わないよ！\nまずは私と一緒に、どんな雰囲気か覗きに行くだけでもどうかな？私が横についてるから、何かあったら全部私に振ってくれて大丈夫（笑）。\n\nもし「ちょっとだけなら…」って思ってくれたら嬉しいな。\nもちろん、気が進まなかったら断ってくれて全然OKだからね！\n\nまた近いうちにご飯でも行こう！\n\n（あなたの名前）より",
