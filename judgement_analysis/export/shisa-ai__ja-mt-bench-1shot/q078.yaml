      "model_answer": "**序章：影の目覚め**  \n\n朝日が窓から差し込み、部屋を淡い光で満たした。カナは目を覚ますと、いつものようにベッドの傍らに置いてある猫のぬいぐるみを見つけた。しかし、その瞬間、世界が歪んだ。  \n\n「うわっ！」  \n\n床から突然現れた影が、彼女を襲った。冷たい触感が腕にまとわりつき、次の瞬間には部屋の中央に立っていた。影はゆっくりと形を変え、やがて黒い忍装束に身を包んだ男へと姿を変えた。  \n\n「…お前は誰だ？」  \n\n男は低い声で問いかけた。その目は鋭く、まるで獲物を定める獣のように光っていた。カナは恐怖で息を呑むが、なぜかその男を見つめていると、自分も何かを感じ始める――背筋に走る力強さ、指先に宿る鋭い感覚。そして、何より…自分も忍者なのだと確信する衝撃。  \n\n「私は…カナだ」  \n「ふむ。お前には特別な力があるようだな」  \n男――忍者長・影丸（かげまる）――はそう言うと、彼女の手から小さな紙切れを取り出した。それには古代文字で書かれた呪文のようなものが記されていた。  \n\n「これは…？」  \n「お前の血に宿る『影の力』だ」  \n影丸はニヤリと笑う。「今からお前も俺たちの仲間入りだ」  \n\nカナの頭の中で、何かが変わった気がした。普通の高校生だった自分が、今や忍者の世界へと足を踏み入れる予感だった――そして、その先にはどんな冒険が待っているのか？",
