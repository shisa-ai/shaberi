      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "タイトル：**「影を纏（まと）う朝」**\n\nジリリリリリリ……。\n\nスマートフォンの無機質なアラーム音が、鼓膜を不快に震わせた。午前六時半。いつもの、憂鬱で気だるい朝のはずだった。\n\n佐藤健太（さとう けんた）は、重たい瞼をこすりながら、条件反射でサイドテーブルのスマホに手を伸ばした——つもりだった。\n\n「……え？」\n\n指先がスマホに触れる感触がない。それどころか、背中に感じるはずのベッドの感触も消え失せていた。視界が奇妙に高い。そして、逆さまだ。\n\n健太は瞬きをした。目の前には、見慣れた安アパートのフローリングが広がっている。埃の一つ一つ、板目の溝に詰まった微細なゴミまでもが、まるで顕微鏡で覗いたかのように鮮明に見えた。\n\n恐る恐る視線を上げると（実際には下を見ると）、自分のベッドが遥か下方にあった。\n\n「嘘だろ……」\n\n声を出そうとしたが、喉から漏れたのは言葉ではなく、風のような微かな呼気だけだった。\n彼は天井に張り付いていた。手足に吸盤がついているわけでもない。ただ、掌と足の裏に意識を集中させるだけで、重力を無視してそこに「在る」ことができた。\n\nパニックになるはずだった。叫び声を上げ、手足をバタつかせて落下し、腰を強打するのが、昨日までの佐藤健太という人間だったはずだ。\nだが、今の彼は違った。\n\n心臓の鼓動は、驚くほど静かで一定のリズムを刻んでいる。\n全身の血管を巡る血液の温度、筋肉の繊維一本一本の収縮、そして丹田の奥底から湧き上がる、熱く、それでいて冷徹なエネルギーの奔流——「チャクラ」と呼ぶべき何かが、体内で渦巻いているのを理解してしまった。\n\n（気配がする）\n\n思考よりも早く、身体が反応した。\n窓の外、電線に止まっていたカラスが飛び立つ羽音。隣の部屋の住人があくびをする音。階下の道路を走る新聞配達のバイクのエンジン音。それら全ての情報が、立体的な地図となって脳内に展開される。\n\n健太は音もなく天井から離れ、空中で一回転すると、猫よりも静かに床へと着地した。体重を感じさせない、羽毛のような着地だった。\n\n洗面所の鏡の前に立つ。\nそこには、昨日と同じ、冴えない中肉中背のサラリーマンの顔があった。だが、瞳だけが違っていた。黒目の奥に、底知れぬ闇と、鋭利な刃物のような光が宿っている。\n\n無意識のうちに、彼はパジャマの襟を引き上げ、口元を隠した。その瞬間、世界が「標的」と「隠れ場所」の二色に塗り分けられたような感覚に襲われる。\n\n「遅刻だ」\n\n時計を見ると、アラームを止めてからまだ十秒も経っていない。\nだが、彼は知っていた。今の自分なら、満員電車に揺られる必要はない。ビルの谷間を飛び、影から影へと渡り歩けば、会社の始業時間まであと三千回は呼吸ができる。\n\n健太はニヤリと笑った——いや、その表情はマスクの下で誰にも見えなかったが——窓の鍵を音もなく開けた。\n\n平凡なサラリーマン、佐藤健太の日常は終わった。\n今日から、彼の「任務」が始まるのだ。",
