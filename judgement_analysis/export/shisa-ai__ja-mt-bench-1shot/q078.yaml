      "model_answer": "**序章：目覚めの刻**  \n\n朝日がカーテンの隙間から差し込み、埃舞う光の中で、俺は目を覚ました。いつものように、ベッドの端に転がり落ちそうになりながらも、何かがおかしいと気付く。  \n\nまず、手足の感覚が違う。普段は鈍いはずの指先に、まるで刃物を握るように鋭い感覚が走る。そして視界――窓枠の影まで鮮明に見える。まるで夜でも昼でもない、奇妙な明瞭さだ。  \n\n「一体……？」  \n\n起き上がろうとした瞬間、布団から黒い布が滑り落ちた。それは見慣れない忍装束だった。胸元には赤い紐が結ばれ、腰には木刀のようなものが帯に通されている。  \n\n「何だ、これ……？」  \n\n鏡を見ると、そこに映ったのは俺ではなかった。顔立ちは同じだが、その目は研ぎ澄まされ、肌は日に焼かれたように浅黒く輝いている。そして額には、小さな傷跡があった。  \n\n記憶を辿る。昨夜は会社からの帰り道でコンビニでコーヒーを買い、一人暮らしのアパートへ戻ったはずだ。しかし、その後の記憶は途切れている。夢か？ それとも……？  \n\nふと窓の外を見ると、アパートの庭に不自然な足跡があった。それは壁を駆け上がったような軌跡で、一瞬にして屋根の上へと消えている。  \n\n「……忍者？」  \n\n馬鹿げている。しかし、この身体の変化と目の前の忍装束は嘘をつかない。この現実を受け入れるしかないのか？ それとも、何者かの悪戯だと考えるべきか？  \n\n俺はゆっくりと立ち上がり、木刀を握った。その重みと冷たさが、今の自分にぴったりだと感じた瞬間――背筋を駆け上がるような予感に襲われる。  \n\n「これから、何が始まるんだ……？」",
