      "model_answer": "**新入社員向け ビジネスメールエチケット指導書**  \n\n### **1. 基本原則**  \n- **簡潔かつ丁寧な表現**：冗長な文は避け、要点を明確に伝えます。  \n- **誤字脱字のチェック**：送信前に必ず確認し、信頼性を損なわないようにします。  \n- **件名の明確化**：内容が一目で分かるように具体的に記載（例：「〇月〇日会議資料の共有」）。  \n\n---\n\n### **2. 敬語の正しい使い方**  \n#### **(1) 基本的な敬語表現**  \n| 表現 | 例文 |  \n|------|------|  \n| 謙譲語（自分・同僚の行動） | 「～させていただきます」「～いたします」 |  \n| 尊敬語（相手・上司の行動） | 「～ください」「～いただく」 |  \n| 丁寧語（全体に適用） | 「です」「ます」調を維持 |  \n\n#### **(2) 実務での注意点**  \n- 自己紹介時：「〇〇と申します。よろしくお願いいたします。」（謙譲語＋丁寧語）  \n- 依頼時：「ご確認いただけますと幸いです。」（尊敬語＋丁寧語）  \n\n---\n\n### **3. 日本のビジネス文化での注意点**  \n#### **(1) 相手への配慮**  \n- 時候の挨拶や寒暑の問い合わせを冒頭に入れる（特に初回や長期間連絡がない場合）。  \n- 「お世話になっております」の使用は、取引先や上司に対して適切。  \n\n#### **(2) 書き出しと締めくくり**  \n- 書き出し：「平素より大変お世話になっております。」（定型文として可）。  \n- 締めくくり：「何卒よろしくお願い申し上げます。」または「恐れ入りますがよろしくお願いいたします。」  \n\n#### **(3) 署名ルール**  \n```\n[会社名] [部署名] [氏名] [連絡先] [メールアドレス] [電話番号]\n```\n\n---\n\n### **4. 具体的なメール例文**  \n\n#### 【例1】資料送付時（上司・取引先へ）  \n```\n件名：〇月〇日会議資料の共有  \n\n〇〇様  \n\n平素より大変お世話になっております。[会社名]の[氏名]でございます。  \n\nこの度は、〇月〇日の会議に向けて資料をご用意いたしましたので、ご共有申し上げます。ご確認いただけましたら幸いです。  \n\n何か不明点がございましたら、お気軽にお知らせください。何卒よろしくお願い申し上げます。  \n\n[署名]\n```\n\n#### 【例2】質問・確認時（同僚へ）  \n```\n件名：○○プロジェクトについてご相談  \n\n○○さん  \n\nいつも大変お世話になっております。[氏名]です。  \n\n○○プロジェクトについて、△△部分につきましてご教示いただけないでしょうか？恐れ入りますが、何卒よろしくお願いいたします。  \n\n[署名]\n```\n\n---\n\n### **5. 禁止事項**  \n- 絵文字やカジュアルな表現は避ける（「〜です/〜ます」調を徹底）。  \n- CC/BCC機能は、本人許可なく使用しない（特にBCCは非推奨）。  \n\n---\n\n### **6. 最後に…**  \nビジネスメールは「相手への敬意」を第一に考えましょう。不安な場合は、上司や先輩に見てもらうことを推奨します。この指導書が、新入社員のみなさまの一助となれば幸いです。",
