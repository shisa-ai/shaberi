    "original": "下記の段落を読み、\"アマゾン\"、\"川\"、そして\"生物\"が何回出現するか数えてください。結果は\"単語、出現回数\"の形式で、各単語を別々の行にしてください。出現回数の多い順に行を並べてください。\nアマゾンは自然の驚異が広がる魅惑的な地域で、そこには伝説的なアマゾン川が流れています。アマゾンの熱帯雨林をはじめとする壮大な風景を通り、川はブラジル、コロンビア、ペルーを経由し、無数の生物に生命を与えています。アマゾンのジャングルをうろつく強大なジャガーから、樹冠上空を飛び回る鮮やかなマカウまで、この驚くべき地域は生物多様性に溢れています。川の流れの中深くには、壮観なピンクの川のイルカが、ピラニアやエレクトリックイールと共に優雅に泳いでいます。川岸には、都市と自然が交錯するマナウスのような活気ある都市や、アマゾン熱帯雨林の中心への入口となるイキトスがあります。さらに進むと、アマゾン川はアナヴィリアナス諸島という魅力的な秘境を明らかにします。ここは稀有な種類が溢れる島々のモザイクです。冒険に乗り出し、魅力的なアマゾン川を探検し、生命と自然美に満ちた世界に身を浸してみてください。",
