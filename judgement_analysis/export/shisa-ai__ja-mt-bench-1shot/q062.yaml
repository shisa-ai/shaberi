      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "地球を周回する衛星の速度が（逆噴射や大気抵抗などで）減少した場合、結果として**軌道半径は小さくなり、公転周期は短くなります**。\n\n一見すると「速度が遅くなれば、一周するのに時間がかかる（周期が長くなる）」と直感的に思うかもしれませんが、軌道力学では逆のことが起こります。\n\n物理学の原則を用いた詳細な正当化は以下の通りです。\n\n### 1. 力のバランス（万有引力と向心力）\n衛星が安定した円軌道を維持しているとき、地球による「万有引力」と、円運動に必要な「向心力」が釣り合っています。\n\n$$ \\frac{GMm}{r^2} = \\frac{mv^2}{r} $$\n\n*   $G$: 万有引力定数\n*   $M$: 地球の質量\n*   $m$: 衛星の質量\n*   $r$: 軌道半径\n*   $v$: 衛星の速度\n\nここで衛星の速度 $v$ が強制的に減少したとします。すると、その瞬間の高度（半径 $r$）において、円運動を維持するために必要な遠心力（慣性）が不足し、重力の方が勝ってしまいます。\n$$ \\frac{GMm}{r^2} > \\frac{mv_{new}^2}{r} $$\nこの結果、衛星は地球に向かって落下し始めます。つまり、**軌道半径（または楕円軌道の長半径）は減少します**。\n\n### 2. 力学的エネルギーの保存\n衛星の総力学的エネルギー $E$ は、運動エネルギー $K$ と重力ポテンシャルエネルギー $U$ の和です。\n\n$$ E = K + U = \\frac{1}{2}mv^2 - \\frac{GMm}{r} $$\n\nまた、円軌道（または楕円軌道）における総エネルギーは、軌道長半径 $a$ （円軌道の場合は $r$）に依存し、以下の式で表されます。\n\n$$ E = -\\frac{GMm}{2a} $$\n\n速度 $v$ が減少すると、運動エネルギー $\\frac{1}{2}mv^2$ が減少するため、総エネルギー $E$ はより小さな値（より大きな負の値）になります。\n上記の式 $E = -\\frac{GMm}{2a}$ からわかるように、エネルギー $E$ が減少（よりマイナスになる）すれば、分母にある**軌道半径 $a$ も必ず減少しなければなりません**。\n\n### 3. ケプラーの第3法則（公転周期の変化）\n軌道半径がどうなるかが分かれば、公転周期 $T$ の変化はケプラーの第3法則によって導かれます。\n\n$$ T^2 \\propto a^3 $$\n\nこれは「公転周期の2乗は、軌道長半径の3乗に比例する」という法則です。\n先ほどのエネルギーの議論により、軌道半径（長半径 $a$）が減少することがわかっています。したがって、**公転周期 $T$ も減少（短くなる）します**。\n\n### 結論と「パラドックス」の解説\nここには「衛星のパラドックス」と呼ばれる興味深い現象があります。\n\n1.  衛星にブレーキをかけて**速度を落とす**。\n2.  衛星は低い軌道へ落ちる（半径が小さくなる）。\n3.  低い軌道では重力が強いため、落下によって位置エネルギーが運動エネルギーに変換され、結果として衛星は**以前よりも速い速度**で地球を周回することになる。\n4.  「距離が短くなる」かつ「速度が上がる」ため、**公転周期は短くなる**。\n\nつまり、**「速度を落とすと、結果として（低い軌道で）より速く回るようになる」**というのが物理学的な結論です。",
