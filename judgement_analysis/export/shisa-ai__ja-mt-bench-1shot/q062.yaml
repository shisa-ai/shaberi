      "model_answer": "衛星の速度が減少すると、その軌道は徐々に低い軌道（より小さな軌道半径）に変化します。以下にその理由を物理学の原則に基づいて説明します。\n\n### 1. **ケプラーの第3法則**  \n   衛星の公転周期 \\( T \\) と軌道半径 \\( r \\) の関係は、ケプラーの第3法則で表されます：  \n   \\[\n   T^2 \\propto r^3\n   \\]  \n   つまり、\\( T \\) が一定であれば \\( r \\) は一定ですが、\\( T \\) が変化すると \\( r \\) も変化します。速度が減少すると、衛星はより低い軌道（\\( r \\) が小さくなる）に落ち込む方向に加速されます。\n\n### 2. **エネルギー保存則**  \n   衛星の運動エネルギー \\( KE = \\frac{1}{2}mv^2 \\) と位置エネルギー \\( PE = -\\frac{GMm}{r} \\) の合計が一定です（\\( G, M, m \\) は重力定数、地球質量、衛星質量）。速度が減少すると、\\( KE \\) が減少し、その分を補う形で \\( PE = -\\frac{GMm}{r} \\) が増加し、結果として \\( r \\) が小さくなります。\n\n### 3. **具体的な変化**  \n   - **軌道半径**: 減速すると軌道は下降し、\\( r \\) は小さくなります。  \n   - **公転周期**: 軌道が低くなるにつれて地球への引力が強まるため、\\( T^2/r^3 = const. に従い \\( T\\) も短縮されます。  \n\n### 例:  \n- 衛星の速度が10%減少した場合、その軌道半径は約4%減少し（ケプラーの第3法則より）、公転周期も約1%短縮されます。\n\n### 結論:  \n衛星の速度が減少すると、その軌道は低くなる（半径縮小）傾向があり、同時に公転周期も短縮されます。これは重力ポテンシャルエネルギーの変化と運動エネルギーのバランスによって説明されます。",
