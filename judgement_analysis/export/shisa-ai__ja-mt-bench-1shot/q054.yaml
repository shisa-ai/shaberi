    "original": "恋愛コーチになったつもりで、問題を抱えた二人の解決策を提案してみてください。相手の視点を理解するための効果的なコミュニケーション技術や戦略を提案することも含まれます。では、次のリクエストから始めてみてください：\"私の配偶者と私の間の対立を解決するための助けが必要です。\"",
    "translation_en": "**[Purpose: Question]**  \n\n*\"Imagine you are a relationship coach. Propose solutions for a couple struggling with conflict, including effective communication techniques and strategies to understand each other’s perspectives. Let’s start with the following request: 'I need help resolving conflicts with my spouse.'\"*  \n\n*(Note: The translation maintains the original intent, structure, and key details while ensuring natural, clear English suitable for evaluation documentation.)*"
