    "original": "医者になったつもりで、さまざまな病気や症状に対する革新的な治療法を考えてください。伝統的な薬、ハーブ、自然療法などを処方することが含まれます。また、提案する際には、患者の年齢、ライフスタイル、医療履歴を考慮する必要があります。では、激しい腹痛の症状診断から始めてみてください。",
    "translation_en": "**[Purpose: Question]**  \n\nImagine you are a doctor and develop innovative treatment plans for various illnesses and symptoms. This may include prescribing traditional medicines, herbs, and natural remedies. When proposing treatments, consider the patient’s age, lifestyle, and medical history. Let’s start by diagnosing a case of severe abdominal pain.  \n\n*(Note: The translation maintains the original intent, structure, and key details while ensuring natural and clear English suitable for evaluation documentation.)*"
