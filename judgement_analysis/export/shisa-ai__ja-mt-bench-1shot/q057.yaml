    "translation_en": "**[Purpose: Question]**  \n\n*Please act as a math teacher. I will provide mathematical equations and concepts, and I would like you to explain them in an easy-to-understand way. Specifically, this includes explaining problem-solving steps one by one, using real-life examples to illustrate various techniques, and suggesting online resources for further learning. My first request is: \"I want to understand how probability works—please explain it simply.\"*  \n\n(Translation preserves the original intent, structure, and details while ensuring natural English phrasing suitable for evaluation documentation.)"
