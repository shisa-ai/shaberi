      "model_answer": "**主人公：源太郎（げんたろう）**  \n\n**外見**  \n源太郎は30代半ばの武士で、身長は170cmほど。黒髪を短く刈り込んでおり、額には深い皺が刻まれている。常に無表情だが、その瞳の奥には鋭い光が宿っている。鎧は磨き上げられた黒漆塗りの「黒漆鉄兜」を被り、袖からは白い絹の袖が覗いている。腰には「龍神（りゅうじん）」と名付けられた太刀を差し、柄には小さな龍の彫刻が施されている。  \n\n**性格**  \n源太郎は冷静沈着で、戦場では冷酷な一面を見せるが、民衆に対しては優しさを示す。過去に家族を失った悲しみから、人生への執着を強く持つ。しかし、その内面には繊細な感受性があり、詩や茶道にも興味を持つ。武士としての義務と個人の感情との間で揺れ動く複雑な心境を抱えている。  \n\n**特技**  \n1. **剣術：流派「風神流」**  \n   風のように軽やかな動きと鋭い斬撃が特徴で、敵の攻撃を紙一重でかわし、一瞬の隙をついて決め手を入れる。特に雨天時や夜間でも視界を確保するための特殊な剣術を使う。  \n\n2. **茶道：侘び茶の達人**  \n   戦乱の中でも静寂を求める源太郎は、茶道師範から学んだ「侘び茶」を嗜む。その作法は完璧であり、お茶碗一つを見つめながらも心境が変化することを知っている。  \n\n3. **漢詩：和歌にも通じる才気**  \n   戦後の休息時に漢詩や和歌を作成し、その言葉選びには深い哲学が込められている。「戦場では言葉より刃が正義」という信念を持つため、これらの芸術活動は秘密裏に行われることが多い。  \n\n**生き様**  \n源太郎は主君への忠誠心と個人の自由との間で葛藤する日々を送る。一方で、戦場では敵対者に対しても容赦なく戦う。その行動原理は「正義」というより、「生きる意味」を探す旅である。夜になると月を見上げ、「この星もまた剣と同じだ」と呟きながら刀に手を添えることがある。この矛盾した生き方こそが、彼の魅力となっている。  \n\n（※この人物設定は架空であり、歴史的事実とは異なる場合があります）",
      "judgements": [
