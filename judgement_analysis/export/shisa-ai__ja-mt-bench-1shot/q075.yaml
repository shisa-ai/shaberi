      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "江戸時代を舞台にした短編小説の主人公として、以下の人物を提案します。読者がその息遣いを感じられるよう、鮮やかに描写します。\n\n---\n\n### 氏名：黒木 源十郎（くろき げんじゅうろう）\n\n**年齢：** 三十代後半\n**身分：** 浪人（元・某藩の剣術指南役補佐）\n**住処：** 江戸・深川の裏長屋\n\n#### 【外見：錆びついた名刀のような男】\n\n源十郎の風貌は、一見すると「枯れた古木」のようですが、近づけば肌が粟立つような鋭さを秘めています。\n\n*   **顔立ち：** 頬はこけ、無精髭が顎を覆っていますが、その奥にある眼光は異様に鋭く、猛禽類を思わせます。左の眉からこめかみにかけて、古傷が白く走っており、怒りや殺気を感じるとその傷が赤く浮き上がるように見えます。\n*   **体格：** 長身で痩せ型ですが、着物の下は鋼のように引き締まった筋肉で覆われています。猫背気味に歩く癖がありますが、それはいつでも抜刀できる重心の低さを維持しているためです。\n*   **装い：** 常に着古した藍色の着流しを纏い、裾は擦り切れています。しかし、腰に差した大小の刀だけは手入れが行き届いています。特に大刀は、装飾を削ぎ落とした「同田貫（どうたぬき）」のような、実用一点張りの重厚で無骨な業物です。\n*   **手：** 指は長く、節くれ立っており、掌は剣だこで硬化しています。しかし、壊れた子供の玩具を直してやる時などは、驚くほど繊細な動きを見せます。\n\n#### 【性格：冷笑的な現実主義者と、隠された義侠心】\n\n源十郎は、武士道という建前を嫌い、人間の本音と欲望が渦巻く江戸の闇に馴染んでいます。\n\n*   **皮肉屋：** 「武士は食わねど高楊枝」という言葉を最も嫌い、「腹が減っては戦もできぬし、情けもかけられぬ」と公言します。権力者や役人の偽善を鼻で笑い、長いものに巻かれることを拒絶します。\n*   **静寂と孤独：** 基本的に無口で、必要以上のことは語りません。酒を好みますが、決して泥酔せず、常に周囲を警戒する癖が抜けていません。\n*   **隠された情熱：** 表向きは金で動く用心棒のように振る舞いますが、弱者が理不尽に踏みにじられる場面に遭遇すると、採算度外視で介入してしまう「損な性分」を持っています。その際、彼は「俺の昼寝を邪魔したからだ」などと、照れ隠しの嘘をつきます。\n\n#### 【特技：一撃必殺の「泥臭い」剣術】\n\n彼の剣に、道場で教えるような華麗な型はありません。戦場で生き残るために磨かれた、実戦本位の殺人剣です。\n\n*   **流派：** 無外流を基礎としていますが、長年の放浪生活で我流に変質しています。\n*   **必殺技「岩砕（いわくだ）き」：** 相手の太刀筋を見切って受けるのではなく、相手の刀ごと叩き斬るような、体重を乗せた強烈な袈裟斬りです。刀の重さと腕力を利用し、相手の防御（鍔迫り合い）ごと粉砕します。\n*   **環境利用：** 狭い路地、雨でぬかるんだ地面、砂利、あるいは手近にある桶や梯子など、周囲の環境すべてを武器として利用する機転の良さがあります。\n*   **特異な感覚：** 視覚よりも聴覚と嗅覚が鋭く、暗闇の中でも相手の殺気や位置を正確に把握することができます。これはかつて、藩の密命で夜間の警護や暗殺に関わっていた過去に由来します。\n\n#### 【生き様：流れ雲の如く、しかし芯は折れず】\n\n源十郎の生き様は、**「濁り水に咲く蓮」**のようです。\n\n*   **過去の傷：** かつて仕えた藩で、主君の不正を諌めた親友が切腹させられ、自身もその不正の隠蔽に加担させられそうになった過去を持ちます。彼はその理不尽に絶望し、武士の身分を捨てて出奔しました。それ以来、「忠義」という言葉を信じていません。\n*   **現在の信条：** 「己の刀は、己が正しいと信じた時のみ抜く」。彼は誰の命令も受けず、金のためだけでも動かず、ただ自分の魂が納得した時だけ、その重い腰を上げます。\n*   **死生観：** いつ野垂れ死んでも構わないという虚無感を抱えつつも、死に場所を探している節があります。しかし、それは「無駄死に」ではなく、何かを守るために命を燃やし尽くす瞬間を求めているのです。\n\n---\n\n**小説の冒頭イメージ：**\n\n> 驟雨（しゅうう）が深川の路地を叩いていた。\n> 軒下で雨宿りをする野良犬の隣に、黒木源十郎は立っていた。濡れた藍色の着物が、痩せた体に張り付いている。\n> 彼は懐から手拭いを取り出し、愛刀の柄（つか）を丁寧に拭った。その目は、雨の向こうから近づいてくる六つの足音を、正確に数えていた。\n> 「……やれやれ。今日も安い酒が不味くなる」\n> 源十郎は低く呟くと、雷鳴に合わせて、ゆっくりと鯉口を切った。",
