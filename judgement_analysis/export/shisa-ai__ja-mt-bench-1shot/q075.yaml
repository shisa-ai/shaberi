      "model_answer": "**短編小説『夕闇の刃』の登場人物：黒木 巌（くろき いわお）**  \n\n### **外見**  \n黒木巌は、江戸時代後期の武士として、質実剛健な風貌を持ちながらもどこか孤独を漂わせる男。  \n- **年齢**：36歳。長年の戦いと修行で顔には深い皺が刻まれている。  \n- **体格**：中背だが筋肉質で、左肩には過去の戦いで負った刀傷が残る。  \n- **髪型**：武家髷を結い、常に整えられた髭が厳格さを増す。  \n- **服装**：黒地に家紋入りの着物に、磨き抜かれた黒塗りの鎧兜を身につける。腰には愛刀「夕闇（ゆうやみ）」を携える。  \n\n### **性格と生き様**  \n- **冷徹な現実主義者**：感情を表に出すことは少なく、任務遂行のみに集中する。しかし、その根底には強い正義感と弱者への憐憫が隠されている。  \n- **無言の忠義者**：主君への忠誠は絶対だが、形式主義や権威主義には反発する傾向がある。そのため、一部からは「扱いにくい侍」と評されることも。  \n- **孤独な修行者**：幼少期から剣術のみに没頭し、人間関係よりも刀との対話を選んできた。そのため、女性との縁は薄く、一人旅が多い。  \n\n### **特技と武器術**  \n- **剣術流派**：「無明流（むみょうりゅう）」という独自の剣術を使う。これは敵の動きを見極め、一瞬で致命傷を与えることを重視する危険な技法である。  \n- **隠密行動**: 侍としてだけでなく、必要時には忍びのような身軽さで敵陣に潜入する能力を持つ。これは過去の諜報任務で培われたものだ。  \n- **刀「夕闇」**: 刃文が漆黒く染まった異形の刀。この刀は夜間でも光沢が出ず、暗殺任務に最適化されているという噂がある。  \n\n### **生き様の一例**  \nある夜、巌は領主から密かに命じられた暗殺任務を受ける。しかし標的が無実の人々であることを知り、彼は命令に背いて真犯人を追うことを決意する。この選択により、彼は組織からの追放と死闘を強いられることになる……。  \n\nこのように、「黒木巌」は一見冷酷に見えて内面では熱く揺れる侍として描かれます。その矛盾した存在感こそが物語の核心となるでしょう。",
