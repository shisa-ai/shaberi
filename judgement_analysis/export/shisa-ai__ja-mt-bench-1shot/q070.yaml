      "model_answer": "日本の三大都市圏（首都圏、近畿圏、中京圏）が人口分布や経済に与える主な3つの影響は以下の通りです。\n\n1. **人口の過度な偏在と地方の衰退（東京一極集中）**\n    日本の総人口の約半数以上がこれら三大都市圏に居住しており、特に首都圏（東京）への「一極集中」が顕著です。これにより、都市部では過密による住宅不足や通勤混雑、インフラへの負荷が生じる一方で、地方圏では若年層の流出による深刻な過疎化、労働力不足、地域経済の縮小が加速しています。この人口の偏りは、地方自治体の存続を危ぶませる「消滅可能性都市」の問題を引き起こしています。\n\n2. **経済機能の集積と産業の役割分担**\n    三大都市圏は日本のGDPの約7割を生み出す巨大な経済エンジンとして機能しています。それぞれの圏域には明確な役割分担（産業の特化）が見られます。\n    *   **首都圏（東京）:** 政治、金融、IT、大企業の本社機能が集中し、意思決定とサービス産業の中心。\n    *   **中京圏（名古屋）:** 自動車産業を中心とした世界的な「モノづくり」の拠点。\n    *   **近畿圏（大阪）:** 商業、中小企業の技術力、および医薬品やバイオ産業などの西日本の経済ハブ。\n    この集積効果は日本の国際競争力を支える一方で、都市圏以外の地域との経済格差（所得格差）を拡大させる要因ともなっています。\n\n3. **物流・インフラの効率化と災害リスクの脆弱性**\n    これら3つの都市圏を結ぶ「東海道メガロポリス」ベルト地帯に、新幹線、高速道路、港湾、空港などの重要インフラが集中しています。これにより、人・モノ・カネの移動が極めて効率的に行われ、経済活動のスピードが維持されています。しかし、この狭いベルト地帯に日本の機能が集中しているため、首都直下地震や南海トラフ地震などの大規模災害が発生した場合、日本の国家機能やサプライチェーンが瞬時に麻痺し、日本全体の経済が壊滅的な打撃を受けるリスク（脆弱性）を抱えています。",
