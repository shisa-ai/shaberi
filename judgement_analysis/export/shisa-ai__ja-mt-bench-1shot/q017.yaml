  "question": {
    "original": "以下のニュース記事で言及されている固有名詞（人、組織、場所）を特定してください。それらの固有名詞をエンティティタイプ別に3つのグループに分けてJSON辞書を作成してください。キーはエンティティのタイプで、値は文字列のリストとします。\n昨日、ファラデーのCEOである中島雄一郎氏とダイムラーAGのCEOである斎藤昭二氏は、ベルリンに新たなギガファクトリーを建設する計画を発表しました。この施設はファラデーとダイムラーの合弁事業で、両社の電気自動車とバッテリーパックを生産し、地域の雇用を何千も創出します。中島氏と斎藤氏は、ベルリンの戦略的な位置、熟練した労働力、強固なインフラが拡大に適していると述べました。新たなギガファクトリーは、ヨーロッパでの電気自動車への需要の増加に対応し、持続可能な未来に貢献することを目指しています。フォルクスワーゲンのCEOである田村健一郎氏はこのニュースを歓迎し、自動車産業の電動化への移行にはより大きな協力が有益だと述べました。",
    "translation_en": "Here is the translation of the provided text into natural, clear English suitable for evaluation documentation:  \n\n---  \n\n**[Purpose: Question]**  \n\nIdentify the proper nouns (people, organizations, places) mentioned in the following news article. Create a JSON dictionary grouping these proper nouns into three categories based on entity type. The key should be the entity type, and the value should be a list of strings.  \n\nYesterday, Yūichirō Nakajima, CEO of Faraday, and Akihiko Saitō, CEO of Daimler AG, announced plans to build a new gigafactory in Berlin. The facility will be a joint venture between Faraday and Daimler, producing electric vehicles and battery packs, and is expected to create thousands of jobs in the region. Nakajima and Saitō stated that Berlin’s strategic location, skilled workforce, and robust infrastructure make it ideal for expansion. The new gigafactory aims to meet the growing demand for electric vehicles in Europe and contribute to a sustainable future. Kōichirō Tamura, CEO of Volkswagen, welcomed the news, stating that greater cooperation would be beneficial in the automotive industry’s transition to electrification.  \n\n---  \n\n### **JSON Dictionary (Entity Type Grouping):**  \n```json\n{  \n  \"People\": [\"Yūichirō Nakajima\", \"Akihiko Saitō\", \"Kōichirō Tamura\"],  \n  \"Organizations\": [\"Faraday\", \"Daimler AG\", \"Volkswagen\"],  \n  \"Places\": [\"Berlin\"]  \n}  \n```  \n\nThis translation preserves the original meaning and details while ensuring clarity and natural English phrasing. The JSON dictionary categorizes the proper nouns as requested."
  },
