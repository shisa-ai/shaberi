      "model_answer": "**「桜の下の日記」**  \n\nある晴れた日、公園の桜の木の下で、一冊の古い日記が見つかった。  \n\nそれは、薄茶色の表紙に「2023年」とだけ書かれた小さなノートだった。ページをめくると、淡いインクで書かれた文字が目に飛び込んできた。  \n\n**「今日も雨が降っている。窓から見える公園は、いつもより寂しげだ。」**  \n\n最初は誰かの子供のお遊びかと思ったが、その後数ページ読み進めると、日記の筆者は女性らしくなった。名前は「美咲」というようだ。彼女は公園で働く清掃員で、毎日同じ桜の木を見ていたらしい。  \n\n**「あの桜は、私にとって唯一の友達みたいだ。」**  \n\nしかし、読み進めるほどに美咲の日記には不穏な空気が漂ってきた。彼女は最近、何かに怯えているようだった。  \n\n**「誰かに見られている気がする…。」**  \n\nそして最後の一行が胸を締め付けた。  \n\n**「明日、私はもうここにはいない。」**  \n\n翌日、美咲がいなくなるというニュースが報道された。しかし、公園にはいつも通り桜が咲き誇り、その下には一冊だけ残された日記があった——誰も気づかないうちに、新しいページに一行書き足されていたのだ。  \n\n**「私はまだここにいるよ。」**  \n\nそして、その日の夜から、公園では奇妙な噂が広まっていった。「夜になると、桜の木の上から何かが見える」というのだ。そして誰もその目撃者を信じなかった——ただ一人、この手でその事実を知っている者だけが、それを確信していたからだ。",
      "judgements": [
