      "model_answer": "**黒船来航と開国をテーマにした歴史授業計画（3日間・45分×3）**  \n\n### **授業のねらい**  \n- 黒船来航の背景と開国への道程を理解する。  \n- 劇やパントマイムを通じて、歴史的出来事を体験的に学ぶ。  \n- 多角的な視点（日本・アメリカ・幕府・民衆）から考察する。  \n\n---\n\n### **【1日目】 黒船来航の衝撃！ パントマイムで再現**  \n#### **1. 導入（5分）**  \n- 写真や絵図で「黒船」の威容を見せる。  \n  - 「この船を見た日本人はどんな気持ちになったでしょうか？」と問いかける。  \n\n#### **2. パントマイム演習（15分）**  \n- 生徒を4グループに分け、それぞれ「ペリー提督」「幕府役人」「漁師」「町人」役割を割り当てる。  \n  - 黒船到着時の様子をパントマイムで表現させる（例：ペリーは望遠鏡で見つめ、幕府役人は慌てふためく）。  \n\n#### **3. 歴史的背景説明（15分）**  \n- 幕末の鎖国政策とアメリカの開国要求の理由を解説。  \n  - 地図を使い、アメリカの太平洋進出や日本への関心が高まった経緯を説明。  \n\n#### **4. 総括（10分）**  \n- パントマイムで表現した内容と歴史的事実を照らし合わせる。  \n\n---\n\n### **【2日目】 開国交渉劇場！ 役割演技で理解深める**  \n#### **1. 導入（5分）**  \n- 前回のパントマイム振り返り。「ペリーはなぜ開国を求めたのか？」と問いかける。  \n\n#### **2. 短編劇制作・練習（20分）**  \n- 生徒に「下田条約締結」の場面を短編劇として作成させる。  \n  - 役割：ペリー、ハリス、井伊直弼、通訳など。台本は簡易版でも可。  \n\n#### **3. 劇上演＆観客評価（15分）**  \n- 各グループが劇を行い、他の生徒が観客として反応する（拍手・質問）。  \n\n#### **4. 反省会（5分）**  \n- 「もし自分が幕府だったらどうするか？」と意見交換させる。  \n\n---\n\n### **【3日目】 開国の影響！ 多角的視点で考えるパフォーマンス発表会**  \n#### **1. 導入（5分）**  \n- 前回の上演振り返り。「開国は誰にとってメリット・デメリットがあったか？」と問いかける。  \n\n#### **2. グループ発表準備（20分）**  \n- 生徒に以下のテーマから選び、自由形式での発表準備させる：  \n  - テーマ例：①外国の技術導入による変化、②貿易開始後の経済効果、③攘夷運動の発生など。  \n\n#### **3. 発表会＆質疑応答（15分）**  \n- 各グループが発表し、他の生徒からの質問を受ける。（例：スケッチブックを使った絵解き形式も可）。  \n\n#### **4. 総括・まとめ（5分）**  \n- 「黒船来航から開国へ」という流れを振り返り、「歴史は今につながっている」と強調する。  \n\n---\n\n### **評価方法例**  \n1. 参加度合い・積極性 (パントマイム・劇への参加) 40%   \n2. 発表内容の正確性 (歴史的事実との整合性) 30%   \n3. グループワークでの協力度 (役割配分や台本作成) 30%",
