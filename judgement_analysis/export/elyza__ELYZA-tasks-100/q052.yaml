    "original": "架空の言語「エクル語」と日本語の関係をいくつか示します。\n1.\nエクル語: ダスインガ ウタ\n日本語: 彼が水を飲む\n2.\nエクル語: ダストン ウタ\n日本語: 彼は水を運んだ\n3.\nエクル語: ダスデル\n日本語: 彼は走った\n4.\nエクル語: クルデル クルインガ ウタ\n日本語: 子供が走って水を飲んだ\n\nここから推測して以下のエクル語を日本語に直してください。\n5.\nエクル語: クルデル クルトン",
