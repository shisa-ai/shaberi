      "model_answer": "**海辺の友情**  \n\n森の奥深くに住むクマのコロは、いつもと違う冒険を夢見ていた。ある日、ふと海を見たいという衝動に駆られ、木々を抜けて砂浜へと足を運んだ。  \n\n波音が心地よく響く中、コロは初めて見るアザラシの群れに目を奪われた。その中でも一匹、アザラシのミオが好奇心旺盛に近づいてきた。  \n\n「こんにちは！あなたは…森から来たの？」  \nミオの声は波のように軽やかで、コロは戸惑いながらも頷いた。「うん…海って初めてなんだ」  \n\n二人はすぐに打ち解け、砂浜で転がり合い、潮風を浴びながら語り合った。ミオは魚の獲り方を教え、コロは山で見つけた美しい石をプレゼントした。  \n\nしかし夕暮れ時、空が茜色に染まる頃、コロは胸騒ぎを覚えた。「そろそろ帰らないと…」  \nミオも寂しそうな目をしたが、「また来てね」と笑顔で手を振った。  \n\n森へ戻る道すがら、コロは心の中で誓った。『また必ず会いに行く』  \nそして彼らの友情は、この小さな冒険から始まったのだ。  \n\n（完）",
