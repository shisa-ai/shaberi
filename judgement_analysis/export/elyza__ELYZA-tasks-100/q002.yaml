      "model_answer": "**「海と森の友情」**  \n\nある日、森の奥深くで暮らすクマのトラップは、いつもと違う匂いに気づいた。潮風と塩辛い空気が混ざり合い、彼の鼻を誘惑した。好奇心に駆られたトラップは、海へと足を踏み入れた。  \n\n砂浜に足を踏み入れた瞬間、彼は驚いた。広大な青い海が彼の目を奪い、アザラシたちが波打ち際で遊んでいる姿に目を奪われた。中でも一匹のアザラシ、サンが彼に近づいてきた。  \n\n「こんにちは！ ここは初めて？」サンは笑顔で話しかけた。  \n\nトラップは戸惑いながらも、サンと仲良くなっていった。アザラシたちは彼に泳ぎ方を教え、波打ち際で貝殻を探す楽しみを分かち合った。一方で、トラップもアザラシたちの生活に興味津々で、彼らの世界を探検した。  \n\nしかし、日が暮れるにつれ、トラップは自分の家への帰り道を思い出した。「もうすぐ冬になる」とサンに告げると、アザラシたちは彼の旅路を見送ることにした。  \n\n「また会おうね！」サンは波打ち際で手を振りながら叫んだ。  \n\nトラップは感謝の気持ちを込めて頷き、アザラシたちの故郷から別れを告げた。そして、彼は再び森へと戻っていった。この出会いが、彼にとって忘れられない思い出となったのだから。  \n\n（完）",
