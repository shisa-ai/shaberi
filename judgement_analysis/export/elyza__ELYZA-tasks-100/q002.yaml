      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "ある夏の日のこと、深い森の奥に住む一頭の若いヒグマ、名前を「ゴロー」といいました。\n\n今年の夏はとりわけ暑く、森の木陰でさえも蒸し風呂のようでした。ゴローは分厚い毛皮を揺らしながら、ふと鼻をひくつかせました。風に乗って、いつもの土や草の匂いとは違う、しょっぱくて爽やかな香りが漂ってきたのです。\n\n「これは……海だな」\n\nゴローは決心しました。涼しさを求めて、海へ行ってみようと。\n\n長い道のりを歩き、森を抜け、丘を越えると、目の前に真っ青な世界が広がりました。太陽の光を反射してキラキラと輝く水面、そして寄せては返す白い波。ゴローは初めて見る海に圧倒されながらも、熱い砂浜へと足を踏み入れました。\n\n波打ち際まで行くと、冷たい水が足元を洗い、ゴローは「ほう」と気持ちよさそうな声を上げました。その時です。\n\n「バシャッ！」\n\nすぐ近くの岩場から、何かが飛び出しました。ツルツルとした灰色の体、大きな黒い目、そして愛嬌のあるヒゲ。それは一頭のアザラシでした。\n\nゴローは驚いて後ずさりしました。森の動物たちなら、クマを見れば一目散に逃げ出すはずです。しかし、そのアザラシは逃げるどころか、興味深そうに首を傾げてゴローを見つめています。\n\n「やあ、大きな毛むくじゃらさん。迷子かい？」\n\nアザラシは、まるで歌うような声で鳴きました（もちろん、動物同士の言葉で）。\n\n「いや、涼みに来たんだ。俺はゴローだ。お前は？」\n\n「あたしはミミ。海へようこそ、ゴロー！」\n\nミミはヒレをパタパタと叩いて歓迎しました。\n\nそれからというもの、奇妙な二人の遊びが始まりました。ミミはゴローに、波に乗って体を浮かべる方法を教えました。ゴローは最初、不器用に水をかいてばかりでしたが、ミミが周りをくるくると泳ぎながら応援してくれるおかげで、次第に水に慣れていきました。\n\nゴローは、森で採れる甘い木の実の話をし、ミミは、海の底にある色とりどりのサンゴ礁の話をしました。\n\nお昼過ぎ、ゴローがお腹を空かせていると、ミミが素早く海に潜り、銀色に光る大きな魚を捕まえてきてくれました。\n「これ、あげる。森にはないでしょう？」\n「ありがとう、ミミ。これは最高のご馳走だ」\n\n二人は岩の上に並んで座り、水平線を眺めました。クマとアザラシ、住む世界は全く違うけれど、二人の間には穏やかな友情が流れていました。波の音だけが、二人の会話の合間を埋めていました。\n\nやがて、太陽が西の空へと沈み始め、空がオレンジ色から紫色へと変わり始めました。海風が少し冷たくなり、ゴローの濡れた毛皮を震わせました。\n\n「そろそろ、帰らなきゃいけないな」\n\nゴローが寂しそうに言うと、ミミも静かに頷きました。\n\n「そうね。ゴローは森の子だもの。暗くなると道がわからなくなっちゃう」\n\nゴローは立ち上がり、砂についた砂を払いました。\n「楽しかったよ、ミミ。海がこんなに良いところだなんて知らなかった」\n\n「また暑くなったらおいでよ。あたしはいつもこの辺りにいるから」\n\nミミは海の中から上半身を出し、ゴローに向かってヒレを振りました。ゴローも振り返り、大きく前足を上げました。\n\nゴローは来た道を戻り始めました。背中には心地よい疲れと、微かに残る潮の香りを感じていました。森の入り口に差し掛かると、いつもの土の匂いが彼を迎え入れました。\n\nその夜、自分の巣穴に戻ったゴローは、ぐっすりと眠りました。夢の中では、青い海でミミと一緒に波に揺られていました。森のクマにとって、それは忘れられない、ひと夏の宝物となったのでした。",
