      "model_key": "shisa-v2-405b",
      "model_file": "shisa-ai__shisa-v2-llama3.1-405b.json",
      "model_answer": "ゲーム会社のプランナーとして、新しいアクションゲームのコンセプトを考案します。以下に、ゲームタイトル、世界観、ゲームシステム、ターゲット層などをまとめました。\n\n**ゲームタイトル:**  \n**「クロノス・リベレーター - 時の解放者」**\n\n**ジャンル:**  \nハイスピード・アクションRPG（時間操作要素あり）\n\n---\n\n### **【世界観】**\n未来都市「クロノポリス」は、巨大企業「オメガ・コーポレーション」によって支配され、人々は「時間管理システム（TMS）」によって生活が管理されています。主人公はTMSに反抗するレジスタンスの一員で、「時間操作能力」を得てオメガ社の陰謀を阻止するため戦います。\n\n- **舞台**: 近未来都市（ネオン街・廃墟エリア・企業施設）\n- **テーマ**: 「自由と秩序の対立」「時間という制約からの解放」\n\n---\n\n### **【ゲームシステム】**\n1. **時間操作アクション**  \n   - 「タイムスロー」「タイムリバース」「タイムジャンプ」を戦闘や移動で活用。\n   - 例: 敵弾を遅らせて回避→一気に反撃、崩落した足場を巻き戻して進む。\n\n2. **武器カスタマイズ**  \n   - エネルギー剣・重火器・サイバネティックアームなどを組み合わせ可能。\n   - 敵ドロップやクエスト報酬で強化パーツを入手。\n\n3. **レジスタンス拠点開発**  \n   - ミッションクリアで拠点が拡張され、新装備や仲間が加入。\n   - 拠点防衛ミッションも発生。\n\n4. **ボス戦の多様性**  \n   - 各ボスには弱点タイミングがあり、時間操作を使いこなす必要がある。\n   - 例: ボスの攻撃パターンを巻き戻して隙を作る。\n\n---\n\n### **【ターゲット層】**\n- ハイスピードアクション好き（『ニーア』『ゴッドオブウォー』ファン）\n- SF/サイバーパンク好きなユーザー\n- ストーリー重視でも楽しめる設計\n\n---\n\n### **【売りポイント】**\n✅ 時間操作で戦略性と爽快感両立  \n✅ オープンワールド要素（都市探索）＋リニアストーリー  \n✅ カスタマイズ性が高くリプレイ価値あり  \n\nこのコンセプトなら、アクション好きからSFファンまで幅広く訴求できると思います。開発期間や予算に応じて調整可能です！",
