      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "承知いたしました。ゲーム会社のプランナーとして、市場のトレンドと「手触りの良さ（Game Feel）」を重視した、新規アクションゲームの企画案を提案します。\n\n---\n\n## 新規アクションゲーム企画書案\n\n### 1. タイトル（仮）\n**『VESSL_JACKER』（ヴェッセル・ジャッカー）**\n\n### 2. コンセプト（一言で言うと）\n**「敵こそが武器、敵こそが命。」**\n**超高速・憑依（ボディジャック）アクション**\n\n### 3. ターゲット層\n*   20代〜30代のコアゲーマー\n*   『デビルメイクライ』や『ニーア オートマタ』などのハイスピードアクションを好む層\n*   ローグライク要素によるリプレイ性を好む層\n\n### 4. 世界観・ストーリー設定\n**ジャンル：サイバーパンク × オカルト**\n\n舞台は、人類が肉体を捨て、精神を機械の器（ヴェッセル）に移して永遠の命を得た未来都市「ネオ・アガルタ」。しかし、中央管理AIの暴走により、市民の精神は削除され、器たちは殺戮マシーンと化した。\n\n主人公は、肉体を持たない純粋な「意識体（ゴースト）」。\n自身の記憶と本来の肉体を取り戻すため、暴走する機械の器を次々と**乗っ取り（ジャック）**ながら、都市の最上層を目指す。\n\n### 5. コアゲームメカニクス（USP：独自の売り）\n\nこのゲームの最大の特徴は、**「主人公には固定の肉体（HP）がない」**という点です。\n\n#### ① 憑依システム「ソウル・ダイブ」\n*   プレイヤーは青白い「意識体」としてスタートします。この状態は非常に脆弱で、一撃で死にます。\n*   敵（雑魚から中ボスまで）をスタンさせると、その敵に**「ダイブ」**して肉体を乗っ取ることができます。\n*   乗っ取った瞬間、その敵が持っていた武器、スキル、身体能力がそのままプレイヤーのものになります。\n    *   重装甲ロボに乗れば「パワータイプ」\n    *   ドローンに乗れば「飛行・射撃タイプ」\n    *   忍者型アンドロイドに乗れば「スピードタイプ」\n*   **戦略性：** 状況に合わせて、次々と乗り換えることが攻略の鍵です。\n\n#### ② 「肉体崩壊」と「強制乗り換え」\n*   乗っ取った肉体は、主人公の強力なエネルギーに耐えきれず、時間経過とともに**「崩壊（HP減少）」**していきます。\n*   つまり、**一つの体に留まり続けることはできません。**\n*   肉体が壊れる前に、次の敵を見つけ、倒し、乗り換える必要があります。これが常に攻撃的であることを強いる「攻めのゲームプレイ」を生み出します。\n\n#### ③ 自爆フィニッシュ「オーバーロード」\n*   乗り捨て際のアクションです。現在憑依している肉体のエネルギーを暴走させ、周囲を巻き込んで大爆発（自爆）させます。\n*   爆発の反動で意識体が飛び出し、空中で次の敵へとダイブする。この一連の流れ（コンボ）が最高に気持ちいい瞬間を作ります。\n\n### 6. ゲームサイクル\n1.  **探索＆戦闘：** 敵を倒し、体を奪いながらステージを進む。\n2.  **ビルド構築：** 敵の体にはランダムな「バグ（パッシブスキル）」が付与されている（例：攻撃速度UPだが防御DOWNなど）。どの敵を奪うかで性能が変わるローグライク要素。\n3.  **ボス戦：** 巨大なボスに対し、周囲の雑魚敵を奪って弾丸として特攻させたり、ボスの部位を部分的にハッキングして自傷させたりするパズル的アクション。\n\n### 7. ビジュアル・サウンドの方向性\n*   **ビジュアル：** ネオンカラーとグリッチノイズを多用したスタイリッシュな画面。憑依時には画面が歪むエフェクトを入れる。\n*   **サウンド：** 重厚なシンセウェイヴとインダストリアル・メタル。憑依する敵のタイプによって、BGMのトラック（ドラムやベースライン）がリアルタイムに変化するインタラクティブ・ミュージックを採用。\n\n### 8. プラットフォーム・ビジネスモデル\n*   **プラットフォーム：** PC (Steam), PS5, Xbox Series X|S\n*   **ビジネスモデル：** 買い切り型（パッケージ/DL販売）。後にDLCで追加ステージ・高難易度モードを配信。\n\n---\n\n### 企画の狙い（プランナー視点）\n既存のアクションゲームは「装備を集めて強くなる」のが主流ですが、本作は**「敵そのものが装備であり、消耗品である」**という逆転の発想を取り入れました。\nこれにより、インベントリ管理の煩わしさを排除し、純粋にアクションの快感と、次々と乗り換えていくスピード感に没頭できる体験を提供します。\n\nいかがでしょうか？このコンセプトをベースに、さらに詳細を詰めていくことができます。",
