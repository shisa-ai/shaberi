    "original": "ある男性が、高校時代に好きだった女性に再会した。彼女は結婚して子供もいて幸せそうだった。男性は彼女に告白しようと思っていたが、その機会を逃してしまった。彼は後悔しながら、OOとつぶやいた。\n\nOOにはあることわざが入ります。何でしょう？",
    "translation_en": "**[Purpose: Question]**  \n\nA man reunited with a woman he had liked in high school. She was married with children and seemed happy. The man had intended to confess his feelings to her but missed the opportunity. Regretfully, he muttered, *\"OO.\"*  \n\n*OO* contains a certain proverb. What is it?  \n\n*(Note: The translation preserves the original structure and meaning while ensuring natural English phrasing for evaluation documentation. The proverb remains as \"OO\" since the answer is the question's focus.)*"
