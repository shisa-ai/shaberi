    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "SF（サイエンス・フィクション）はジャンルが幅広いため、古典的な名作から現代のベストセラー、そして日本の傑作まで、バランスよく「今読むべき10冊」を厳選しました。\n\nあなたの好みに刺さりそうなものから手に取ってみてください。\n\n### 1. 『プロジェクト・ヘイル・メアリー』 (アンディ・ウィアー)\n*   **ジャンル:** 宇宙開発 / ハードSF / バディもの\n*   **あらすじ:** 記憶を失った状態で宇宙船で目覚めた男。彼は人類滅亡の危機を救う任務を帯びていた。孤独な宇宙の旅の果てに、彼は「驚くべき相棒」と出会う。\n*   **おすすめ理由:** 『火星の人（オデッセイ）』の著者による最新ヒット作。科学的なディテールが満載でありながら、とにかく熱くて泣けるエンターテインメントです。ページをめくる手が止まらなくなること間違いなしです。\n\n### 2. 『三体』 (劉慈欣)\n*   **ジャンル:** ファーストコンタクト / 中国SF / 壮大なスケール\n*   **あらすじ:** 文化大革命で父を殺された女性科学者が、絶望の中で宇宙に向けて発信したメッセージ。それが数光年離れた異星文明「三体世界」に届き、地球の運命を決定づけることになる。\n*   **おすすめ理由:** 世界中で社会現象を巻き起こした現代SFの金字塔。物理学、歴史、宇宙社会学が絡み合い、想像を絶するスケールで物語が展開します。全3部作ですが、まずは第1部を。\n\n### 3. 『あなたの人生の物語』 (テッド・チャン)\n*   **ジャンル:** 言語SF / 哲学的 / 短編集\n*   **あらすじ:** 地球に飛来した異星人の言語を解読しようとする言語学者の物語。彼らの言語を理解するにつれ、彼女の世界認識（時間の捉え方）が変わっていく。\n*   **おすすめ理由:** 映画『メッセージ』の原作。派手なアクションはありませんが、読んだ後に世界の見え方が変わるような、知的で美しいSFです。\n\n### 4. 『ハーモニー』 (伊藤計劃)\n*   **ジャンル:** 日本SF / ディストピア / 意識\n*   **あらすじ:** 大災厄を経て、高度な医療システムが人々を常時監視し「健康」を強制する優しさごかしの社会。その世界に抵抗し、自殺を試みた少女たちのその後を描く。\n*   **おすすめ理由:** 34歳で夭折した天才作家・伊藤計劃の遺作。「健康」や「意識」というテーマを極限まで突き詰めた、美しくも残酷な物語です。\n\n### 5. 『星を継ぐもの』 (ジェイムズ・P・ホーガン)\n*   **ジャンル:** ハードSF / ミステリー / 古典\n*   **あらすじ:** 月面で発見された宇宙服をまとった死体。調査の結果、その死体はなんと5万年前に死んでいたことが判明する。人類が誕生する前に、月面にいたのは誰なのか？\n*   **おすすめ理由:** 日本で特に人気が高いSFミステリーの傑作。提示された謎が、科学的な論理の積み重ねによって鮮やかに解き明かされるカタルシスは最高です。\n\n### 6. 『ニューロマンサー』 (ウィリアム・ギブスン)\n*   **ジャンル:** サイバーパンク\n*   **あらすじ:** 電脳空間（サイバースペース）にジャックインする能力を奪われた元ハッカーのケイスが、謎の雇い主から危険な依頼を受け、再び電脳の海へダイブする。\n*   **おすすめ理由:** 「サイバーパンク」というジャンルを決定づけた作品。『マトリックス』や『攻殻機動隊』に多大な影響を与えました。独特の文体とガジェット感が魅力です。\n\n### 7. 『幼年期の終り』 (アーサー・C・クラーク)\n*   **ジャンル:** ファーストコンタクト / 進化 / 哲学\n*   **あらすじ:** 突如として地球上空に現れた巨大な宇宙船。異星人「オーバーロード」の管理下で、人類は戦争や飢餓のない理想郷を手に入れるが、それには代償があった。\n*   **おすすめ理由:** SFの巨匠クラークの最高傑作の一つ。人類という種の「進化」と「孤独」を描いたラストシーンは、SF史に残る圧倒的なイメージです。\n\n### 8. 『アンドロイドは電気羊の夢を見るか？』 (フィリップ・K・ディック)\n*   **ジャンル:** ディストピア / AI / 実存主義\n*   **あらすじ:** 核戦争後の荒廃した地球。火星から逃亡したアンドロイドを狩る賞金稼ぎのリックは、彼らを追ううちに「人間とアンドロイドの違いとは何か」という問いに直面する。\n*   **おすすめ理由:** 映画『ブレードランナー』の原作。AIが急速に進化する現代において、「人間性とは何か」を問うこの作品の重要性は増しています。\n\n### 9. 『順列都市』 (グレッグ・イーガン)\n*   **ジャンル:** ハードSF / 仮想現実 / 不死\n*   **あらすじ:** コンピュータの中に人格をコピーし、不死を手に入れる技術が確立された世界。しかし、その仮想世界を維持する計算能力には限界があった。\n*   **おすすめ理由:** 「ハードSFの鬼才」イーガンの代表作。設定は難解ですが、「私という存在は何か」「宇宙とは何か」という概念を根底から揺さぶられる、知的なドラッグのような作品です。\n\n### 10. 『闇の左手』 (アーシュラ・K・ル・グィン)\n*   **ジャンル:** 社会派SF / ジェンダー\n*   **あらすじ:** 性別が存在せず、発情期にのみ男女の性が分化する両性具有の人類が住む惑星「冬」。そこへ派遣された地球人の使節は、性差のない社会における政治や愛に翻弄される。\n*   **おすすめ理由:** SFを通じてジェンダーや社会構造を問い直した名作。ファンタジーのような美しい筆致で、他者を理解することの難しさと尊さを描いています。",
