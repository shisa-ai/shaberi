          "judge_output": "内容は正解例と同等以上に具体的で、哲学・文学・芸術・科学・社会構造・ローマへの影響など、古代ギリシャを学ぶうえでの主要ポイントを網羅しています。  \n具体例（人物名・作品名・建築物名・戦争名など）も豊富で、「独自の文化や哲学…」のような抽象的説明にとどまっていません。\n\n事実関係についても大きな誤りは見られません。「奴隷が大部分を占める『半自由民』社会」という表現はやや不正確ですが（奴隷と半自由民は区別される）、全体の有用性を損なうほどではなく、減点対象の「事実と異なる内容」とするほどのレベルではないと判断できます。\n\n日本語も自然で、構成もわかりやすく、学習者にとって十分「役に立つ」内容ですので、5点評価が妥当です。\n\nFINAL SCORE: 5",
