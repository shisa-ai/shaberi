    "original": "「会場に女性がいた。」という文は「どこに女性がいた？」という疑問文に直すことができます。\nこのとき、 \"会場\" という単語は \"どこ\" という疑問詞タグを持ちます。疑問詞タグには いつ, どこ, だれ, なに, どれくらい があります。\n\nそれでは、「ドライバー」という単語はどのような疑問詞タグを持つでしょうか？ 全て選んでください。対応するものがない場合は\"なし\"と答えてください。",
    "translation_en": "**Translation:**  \n\nThe sentence \"There was a woman in the venue\" can be turned into the question \"Where was the woman?\" In this case, the word \"venue\" carries the question word tag \"where.\" Question word tags include *when, where, who, what, how much/how many*.  \n\nNow, which question word tag(s) would the word \"driver\" have? Select all that apply. If there is no corresponding tag, answer \"none.\"  \n\n---  \n*(Note: The translation maintains the original structure and meaning while ensuring natural English phrasing for evaluation documentation.)*"
  },
