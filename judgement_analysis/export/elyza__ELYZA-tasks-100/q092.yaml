      "model_answer": "「風が強く吹いていた。**木々がうなりを上げ、窓ガラスが軋み、まるで何かを引き裂こうとするかのように、全身を凍りつかせるような冷たい風だった。**」  \n\nこのように、風の影響を具体的に描写することで、風の強さや冷たさ、そして周囲への影響（音や視覚的な変化）を読者に伝えられます。比喩表現（「引き裂こうとする」）も加えることで、より印象的な描写になります。",
