    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "小説家として、「風が強く吹いていた」という事実を、より強烈に、読者の肌に伝わるように描写するためのアプローチをいくつか提案します。\n\n単に「とても」「猛烈に」といった修飾語を足すだけでなく、**五感（聴覚、視覚、触覚）への刺激**や**比喩**を用いることで、風の暴力性や圧倒的な力を表現できます。\n\n以下に、いくつかのパターンに分けて例文を作成しました。\n\n### 1. 聴覚に訴える（音で恐怖を煽る）\n風そのものの音や、風によって物がきしむ音を描写することで、強さを表現します。\n\n*   「**轟音と共に**、風が強く吹いていた。」\n*   「**大気が悲鳴を上げるような唸り声を上げて**、風が吹き荒れていた。」\n*   「**鼓膜を圧迫するような重低音を響かせ**、風が叩きつけられていた。」\n*   「**窓ガラスが割れんばかりにガタガタと震え**、外では風が狂ったように吠えていた。」\n\n### 2. 触覚・身体感覚に訴える（痛みや圧力で表現する）\n風が体に当たった時の感覚を描写することで、抵抗できないほどの強さを表現します。\n\n*   「**呼吸すらままならないほどの**風が、正面から叩きつけてきた。」\n*   「**巨大な平手で殴りつけられたかのような衝撃と共に**、風が吹き抜けた。」\n*   「**立っていることさえ許さない暴力的な**風が、私の体を突き飛ばそうとした。」\n*   「**肌を刃物で切り裂くような鋭さで**、風が強く吹いていた。」\n\n### 3. 視覚・周囲への影響を描写する（物の動きで強さを示す）\n周囲の風景がどう変わったかを描写することで、間接的に風の威力を伝えます。\n\n*   「**太い街路樹が今にもへし折れんばかりに撓（しな）り**、風が強く吹いていた。」\n*   「**重たい看板がまるで紙切れのように宙を舞い**、風が猛威を振るっていた。」\n*   「**視界を遮るほどの砂煙を巻き上げながら**、風が荒れ狂っていた。」\n*   「**世界そのものを押し流そうとするかのように**、風が強く吹いていた。」\n\n### 4. 比喩・擬人化を使う（風を怪物のように扱う）\n風を生き物や凶器に例えることで、その異様さを際立たせます。\n\n*   「**見えざる巨人の拳（こぶし）が振り下ろされたかのように**、風が強く吹いていた。」\n*   「**飢えた獣が獲物に襲いかかるような勢いで**、風が吹き荒れていた。」\n*   「**何者かの激しい怒りを孕（はら）んだように**、風が強く吹いていた。」\n\n### 組み合わせた実例（リライト案）\n\nこれらを組み合わせると、以下のような文章になります。\n\n> **「耳をつんざく咆哮と共に、呼吸すら奪うほどの暴風が叩きつけられた。太い木々が悲鳴を上げて撓り、世界はただ、風の暴力に晒されていた。」**\n\nどの表現を選ぶかは、そのシーンの雰囲気（パニックホラーなのか、台風の夜なのか、荒野の旅なのか）に合わせて調整してみてください。",
