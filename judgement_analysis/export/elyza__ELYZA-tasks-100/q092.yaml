      "model_answer": "小説執筆者として、風の強さをより強く表現するために、以下のような表現を追加することを提案します。  \n\n1. **五感に訴える描写**  \n   - 「風が強く吹いていた。木々がうねり、葉がざわめき、まるで生き物のように揺れる。」  \n   - 「風が強く吹いていた。頬を打つ冷たい空気が肌を刺し、髪が乱れていく。」  \n\n2. **比喩や擬人化**  \n   - 「風が強く吹いていた。まるで怒りの獣のように荒れ狂い、建物の窓ガラスを揺らす。」  \n   - 「風が強く吹いていた。まるで巨大な手が街を掴み、掻き回すように感じられた。」  \n\n3. **具体的な効果の描写**  \n   - 「風が強く吹いていた。旗が逆さまに翻し、小石が飛び散る。」  \n   - 「風が強く吹いていた。電線にぶつかる音とともに、街灯の明かりが揺らめいた。」  \n\n4. **感情や状況との関連付け**  \n   - 「風が強く吹いていた。その勢いに圧倒されながらも、彼は前進した。」（感情的な深み）  \n   - 「風が強く吹いていた。まるで運命の予兆のように、彼の心に不安を植え付けた。」（ドラマチックな展開）  \n\nこれらの表現を組み合わせることで、単なる「強い」という記述ではなく、読者に具体的なイメージと感情を伝えることができます。小説の文脈に合わせて最適な方法を選んでください。",
