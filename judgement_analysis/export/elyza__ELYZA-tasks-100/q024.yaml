      "model_answer": "小学生のみなさん、こんにちは。\n日本の政治（せいじ）を行う「国会」には、**衆議院（しゅうぎいん）**と**参議院（さんぎいん）**という2つのチームがあります。\n\n今日は、そのうちの「衆議院」について、わかりやすく説明しますね。\n\n***\n\n**1. 衆議院ってなに？**\n衆議院は、明治時代（1890年）に作られた、とても歴史のあるチームです。\n世界の国々では、このチームのことを「下院（かいん）」と呼び、もう一つのチーム（日本では参議院）を「上院（じょういん）」と呼ぶことがあります。\n\n**2. 「下」ってことは、弱いの？**\nいいえ、ちがいます！名前に「下」とついていても、力が弱いわけではありません。\nむしろ日本では、**衆議院（下院）の方が、参議院（上院）よりも強い力を持っている**とされています。\n\n**3. どうして衆議院の方が強いの？**\n衆議院のメンバーは、参議院のメンバーよりも、選挙（せんきょ）の回数が多くて、働ける期間（任期）が短いからです。\n「期間が短い」ということは、**「国民のみんなが今どう思っているか」** という新しい意見を、すぐに政治に取り入れやすいということです。だから、国民の代表として強い力を持っているんですね。\n\n**4. 昔はどんな違いがあったの？**\n大昔、世界の国々ではこんな分け方をしていました。\n*   **下院（衆議院）：** 普通の市民の代表が集まる場所\n*   **上院（参議院）：** 貴族（きぞく）や王族のような、特別な身分の人たちが集まる場所\n\nつまり、昔は「誰がメンバーになるか」が全然ちがったのです。\nでも今は、日本を含めて多くの国で貴族だけの政治はなくなったので、昔のような大きな違いはなくなっています。\n\n***\n\n**まとめ**\n衆議院は、「選挙が多くて大変だけど、そのぶん国民の声をすばやく政治に届けることができる、とても大事なチーム」だと覚えておいてくださいね！",
