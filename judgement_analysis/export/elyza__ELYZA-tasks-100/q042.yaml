    "original": "AさんとBさんは同じ会社で働いています。二人はそれぞれ、仕事でコンピューターを使う必要があることがあります。しかし、そのコンピュータはあまり高性能ではありません。二人が同時にログインすると、たいていクラッシュしてしまいます。そこで、会社は午前中はAさんだけ、午後はBさんだけがパソコンを使うことを許可すると宣言しました。翌日、AさんとBさんはどちらも寝坊して13時からコンピュータで仕事を始めました。そしてその日コンピュータはクラッシュしてしまいました。誰がコンピュータをクラッシュさせてしまったのでしょうか？",
    "translation_en": "**[Purpose: Question]**  \n\nA and B work at the same company. Both occasionally need to use a computer for work, but the computer is not very powerful. If they log in at the same time, it usually crashes. To prevent this, the company announced that A would use the computer in the morning, and B in the afternoon. The next day, both A and B overslept and started working on the computer at 1 PM. The computer crashed that day. Who caused the computer to crash?  \n\n*(Note: The translation preserves the original meaning and details while ensuring natural English phrasing for evaluation documentation.)*"
  },
