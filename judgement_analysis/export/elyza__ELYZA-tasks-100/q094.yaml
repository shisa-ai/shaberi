      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "もし私が「生き物デザイナー」であり、倫理的な制約や技術的な限界を超えて自由に生物を創造できるのであれば、私は**地球環境の再生と維持を自律的に行う巨大な飛行生物**をデザインします。\n\n名付けて**「アトモス・マンタ（Atmos Manta）」**です。\n\nこの生き物の詳細なスペック、特徴、能力は以下の通りです。\n\n### 1. 基本コンセプト\n「アトモス・マンタ」は、成層圏から対流圏上部を回遊する、マンタ（オニイトマキエイ）に似た形状の巨大生物です。植物と動物のハイブリッドであり、**「空飛ぶ空気清浄機」**としての役割を果たします。\n\n### 2. 外見と身体的特徴\n*   **サイズ:** 翼開長は50メートルから100メートル。クジラよりも巨大ですが、骨格は中空のカーボンナノチューブ構造（生体生成）で構成されており、極めて軽量です。\n*   **皮膚:** 半透明で、内部の循環系がうっすらと見えます。背中側には高度に改良された葉緑体を持つ細胞が敷き詰められており、太陽光を効率的に吸収します。\n*   **浮遊原理:** 体内に水素ガスを生成・貯蔵する浮袋（ガス嚢）を多数持っており、エネルギーを使わずに浮遊し続けることができます。\n\n### 3. 特殊能力と機能（DNA編集による特性）\n\n#### A. 超効率的光合成と炭素固定\n植物のDNAを組み込むことで、背中の皮膚全体で光合成を行います。しかし、通常の植物とは異なり、**大気中の過剰な二酸化炭素（CO2）やメタンガスを積極的に吸収し、体内で固形の炭素結晶（ダイヤモンドに近い構造）や糖分に変換**してエネルギー源とします。これにより、温室効果ガスの削減に寄与します。\n\n#### B. 有害物質の濾過（フィルタリング）\n口にあたる部分から大量の空気を取り込み、エラのような器官でPM2.5、マイクロプラスチック、硫黄酸化物などの有害物質を濾過します。これらは体内の特殊なバクテリア（共生細菌）によって分解・無毒化され、マンタの成長に必要なミネラルとして再利用されます。\n\n#### C. 気象制御の補助\nアトモス・マンタの群れは、過度な日射がある地域の上空に集まる習性を持ちます。彼らの半透明な体が「日傘」の役割を果たし、地表の温度上昇を緩和したり、海水の蒸発をコントロールして異常気象（スーパー台風など）の発生を抑制したりします。\n\n#### D. 生体発光による情報伝達\n夜間には、体内に蓄積したエネルギーを使って美しく発光します。この光の色は「空気の清浄度」を示しており、空気が汚れている地域では赤く、清浄な地域では青白く光ります。これにより、人間に対して環境状態を可視化する役割も担います。\n\n### 4. 生態系への影響とライフサイクル\n*   **食事:** 基本的に太陽光と大気中の物質だけで生きていけるため、地上の生物を捕食することはありません。\n*   **死後:** 寿命（約100年を想定）が尽きると、体内のガスが抜け、ゆっくりと地上や海に降下します。彼らの体は高密度の炭素とミネラルの塊であるため、分解される過程で森林や海洋プランクトンにとっての極めて栄養価の高い肥料となります。つまり、**「死してなお、大地を豊かにする」**ように設計されています。\n\n### 5. デザイナーとしての意図\n現在の地球において、機械的なアプローチ（巨大な空気清浄プラントの建設など）はエネルギーコストが高く、新たな環境負荷を生む可能性があります。\nそこで、**「自己増殖し、太陽光で稼働し、メンテナンスフリーで環境を修復するシステム」**として、この生物をデザインしました。\n\n空を見上げれば、オーロラのように輝く巨大なマンタが泳いでいて、それが地球をきれいにしている——そんな光景を作り出したいと考えます。",
