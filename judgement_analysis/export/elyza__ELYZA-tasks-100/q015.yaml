  "question": {
    "original": "次のストーリーについての質問に答えてください。\nある日、6人の盲人が象を触ってその正体を突きとめようとしました。\n\n１人目は象の鼻に触り、「象とは蛇のようなものだ」と言いました。\n\n２人目は象の耳に触り、「象とはうちわのようなものだ」と言いました。\n\n３人目は象の足に触り、「象とは木の幹のようなものだ」と言いました。\n\n４人目は象の胴体に触り、「象とは壁のようなものだ」と言いました。\n\n５人目は象のしっぽに触り「象とはロープのようなものだ」と言いました。\n\n６人目は象の牙に触り、「象とは槍のようなものだ」と言いました。\n\nそれから６人の盲人たちは長いこと言い争い、それぞれが自分の意見を譲りませんでした。\n\nQ: この物語の教訓は何ですか？",
    "translation_en": "[Purpose: question]  \n\nAnswer the following question about the story.  \n\nOne day, six blind men attempted to determine the nature of an elephant by touching it.  \n\nThe first touched the elephant's trunk and said, \"An elephant is like a snake.\"  \n\nThe second touched the elephant's ear and said, \"An elephant is like a fan.\"  \n\nThe third touched the elephant's leg and said, \"An elephant is like a tree trunk.\"  \n\nThe fourth touched the elephant's body and said, \"An elephant is like a wall.\"  \n\nThe fifth touched the elephant's tail and said, \"An elephant is like a rope.\"  \n\nThe sixth touched the elephant's tusk and said, \"An elephant is like a spear.\"  \n\nAfterward, the six blind men argued for a long time, each refusing to concede their opinion.  \n\nQ: What is the moral of this story?"
  },
