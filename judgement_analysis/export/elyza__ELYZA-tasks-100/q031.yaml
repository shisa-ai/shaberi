    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "結論から言うと、**ガラス自体が炎を上げて「燃える」ことはありません。**\n\nガラスは不燃性の物質ですので、紙や木のように燃焼することはありません。しかし、使い捨てライターで炙った場合、以下のような現象が起こります。\n\n**1. 黒く汚れる（煤が付く）**\nライターの炎（特にオレンジ色の部分）を当てると、不完全燃焼によって生じた炭素（煤・スス）が付着し、ガラスの表面が真っ黒になります。これはガラスが焦げているのではなく、汚れが付いているだけなので拭き取れば落ちます。\n\n**2. 割れる（熱衝撃）**\nこれが最も起こりやすい危険な反応です。ガラスの一部分だけが急激に熱せられると、熱膨張の差によって「熱衝撃」が起き、パリンと割れたりヒビが入ったりする可能性が高いです。特に耐熱ガラスでない普通のガラスや、分厚いガラスほど温度差に弱く割れやすいです。\n\n**3. 溶ける・変形する（可能性は低い）**\n一般的なガラスが溶け始める温度（軟化点）は種類によりますが、およそ500℃〜700℃以上です。ライターの炎の温度は理論上800℃〜1000℃近くになりますが、使い捨てライターの火力は弱く、風の影響も受けるため、ガラスを溶かすほどの熱量を一点に集中させて維持するのは困難です。非常に薄いガラス細工であれば変形するかもしれませんが、基本的には溶ける前にライター本体が熱くなりすぎて持てなくなります。\n\n**注意点**\n*   **火傷:** ガラスは熱を保ちやすいため、炙った直後に触ると重度の火傷を負います。\n*   **ライターの破裂:** 使い捨てライターを長時間点火し続けると、プラスチック部分が溶けたり、内部のガスが膨張して爆発したりする危険があります。",
