      "model_answer": "ガラスは通常、使い捨てライターで炙っても燃えません。ガラスの融点は非常に高く（約1400～1600℃）、一般的なライターの炎の温度（約800～1000℃）では溶けることもありません。ただし、以下のような注意点があります：\n\n1. **熱膨張**：急激な温度変化によりガラスが割れる可能性があります。\n2. **特殊なガラス**：一部の特殊なガラス（例：石英ガラス）は耐熱性が高く、影響を受けにくいですが、一般的なソーダ石灰ガラスでも燃えることはありません。\n3. **付着物**：ガラス表面に油分や可燃物が付着している場合は、それらが燃える可能性があります。\n\n実験する際は安全に注意し、周囲に可燃物がないことを確認してください。",
