      "model_answer": "チックトック（TikTok）っていうのは、短い動画を撮って共有するアプリです。  \n\n**主な特徴**：  \n- **短い動画**：15～60秒程度の動画が中心で、ダンス、コメディ、チャレンジ企画などが人気。  \n- **音楽やエフェクト**：多くのユーザーがオリジナルの音楽やエフェクトを使ってクリエイティブに動画を作成。  \n- **トレンドの発信地**：新しいダンスやミームが生まれやすく、若い世代を中心に世界中で話題に。  \n\nあなたの娘さんが楽しんでいるなら、きっと面白い動画を見つけていますね！もし興味があれば、一緒に見てみるのも楽しいかもしれませんよ。  \n\n何か具体的な質問があればどうぞ！ 😊",
