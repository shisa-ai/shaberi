      "model_answer": "2つの文字列で連続した最長共通部分文字列の長さを求めるには、動的計画法（Dynamic Programming）を使用するのが一般的です。以下にその手順を示します。\n\n### 手順\n1. **2次元配列（DPテーブル）の作成**  \n   - 文字列1の長さと文字列2の長さに合わせて、(m+1) × (n+1) の配列を作成します。  \n   - `m` と `n` はそれぞれ文字列1と文字列2の長さです。\n\n2. **初期化**  \n   - DPテーブルの最初の行と最初の列を0で初期化します。  \n   - これは、空文字列が共通部分文字列として存在することを意味します。\n\n3. **DPテーブルの更新**  \n   - 2番目の行から最後まで、2番目の列から最後までループ処理を行います。  \n   - 現在の位置 `(i, j)` において、以下の条件を満たす場合のみ、値を更新します：  \n     - 文字列1の `i-1` 番目の文字と文字列2の `j-1` 番目の文字が同じであるか、またはどちらかの文字が空である場合。  \n     - その場合、`dp[i][j] = dp[i-1][j-1] + 1` と更新します。\n\n4. **結果の取得**  \n   - DPテーブルの右下隅（`dp[m][n]`）に最長共通部分文字列の長さが格納されています。\n\n### 実装例（Python）\n```python\ndef longest_common_substring(str1, str2):\n    m, n = len(str1), len(str2)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n\n    max_len = 0\n    end_idx = 0\n\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if str1[i - 1] == str2[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n                if dp[i][j] > max_len:\n                    max_len = dp[i][j]\n                    end_idx = i\n            else:\n                dp[i][j] = 0\n\n    return max_len\n\n# テストケース\nstr1 = \"あえおかささででした\"\nstr2 = \"ばつえおかさでくした\"\nresult = longest_common_substring(str1, str2)\nprint(result)  # 出力: 7\n```\n\n### 解説\n- 最長共通部分文字列は「えおかさで」であり、その長さは7です。\n- この方法では、時間計算量がO(m × n)となりますが、大きな入力に対しても効率的に動作します。",
