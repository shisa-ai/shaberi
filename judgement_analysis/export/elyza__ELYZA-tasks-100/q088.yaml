      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "ITセットアップやドキュメントの準備、研修の予定が整っているのは素晴らしいスタートです。ハード面（環境）と形式的なソフト面（業務知識）の準備はできていると言えます。\n\n新入社員が「早く馴染む（組織社会化）」ために不足している可能性があるのは、**「心理的安全性」の確保**と**「人間関係」の構築**、そして**「暗黙知」の共有**です。\n\n新人は「自分はこの組織に受け入れられているか」「誰に何を聞けばいいか」「ここでやっていけるか」という不安を抱えています。これを解消するための具体的なアクションを提案します。\n\n### 1. 「メンター」または「バディ」制度の導入\n直属の上司や教育係とは別に、**「斜め上の先輩」や「年齢の近い同僚」を相談役（バディ）としてアサイン**してください。\n\n*   **目的:** 業務評価に関わらない相手を作ることで、「こんなこと聞いてもいいのかな？」という些細な質問（トイレの場所、ランチのルール、経費精算の細かい手順など）をしやすくします。\n*   **アクション:** 最初の1週間は毎日15分程度、バディとの雑談タイムを設けるか、初日のランチを一緒に食べてもらうよう依頼します。\n\n### 2. 「期待値」と「短期目標」の明確化（30/60/90日プラン）\n研修があるとはいえ、新人は「いつまでに、どのレベルになればいいのか」が見えないと焦ります。\n\n*   **目的:** 成功の定義を明確にし、早期に「達成感」を味わわせることで自信をつけさせます。\n*   **アクション:**\n    *   **最初の1週間:** チームメンバーの名前を覚える、Slackでスタンプを押す、などハードルの低い目標を設定する。\n    *   **1ヶ月後:** 〇〇の業務を一人で完遂する、など具体的なマイルストーンを提示する。\n\n### 3. 「暗黙のルール（カルチャー）」の言語化\nドキュメントには書かれていない、その会社特有の「空気感」や「作法」を早めに教えることが重要です。\n\n*   **具体例:**\n    *   チャットツールでの言葉遣い（「お疲れ様です」は毎回必要か、スタンプだけでOKか）。\n    *   休憩の取り方（自由に取っていいのか、一言かけるべきか）。\n    *   会議での発言スタイル（新人も発言すべきか、最初は聞くことに徹するべきか）。\n    *   「誰がキーマンか」（この件は〇〇さんに根回しするとスムーズ、など）。\n\n### 4. チーム全体での「歓迎ムード」の演出\n事務的な手続きだけでなく、感情に訴える歓迎が必要です。\n\n*   **ウェルカムメッセージ:** 全体チャットで紹介し、既存社員からスタンプやコメントで歓迎の意を表してもらう（サクラを仕込んででも盛り上げると効果的です）。\n*   **自己紹介の工夫:** 単なる経歴だけでなく、「趣味」や「ハマっていること」など、会話の糸口になる情報を共有する場を作る（「実はサウナ好き」など共通点が見つかると一気に馴染みます）。\n\n### 5. 定期的な1on1（業務進捗確認以外）\n最初の1ヶ月は、業務の進捗確認とは別に、**「感情や適応」にフォーカスした短い面談**を週1回程度行うことをお勧めします。\n\n*   **聞くべきこと:**\n    *   「今週、驚いたことや困ったことはあった？」\n    *   「眠れているか？ 疲れすぎていないか？」\n    *   「もっと知りたい情報はあるか？」\n*   **ポイント:** 「評価されている」と感じさせず、「サポートしようとしている」という姿勢を見せることが重要です。\n\n### まとめ：最初の90日が勝負です\n新入社員が早期離職するか、高いパフォーマンスを発揮するかは、最初の3ヶ月（オンボーディング期間）の体験に大きく左右されます。\n\n**「業務を教える」ことよりも、「居場所を作る（心理的安全性を高める）」ことに最初の数週間はリソースを割いてみてください。** 結果的に、その方が業務の習得も早くなります。",
