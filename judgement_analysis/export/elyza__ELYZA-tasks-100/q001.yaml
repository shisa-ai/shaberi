    {
      "model_key": "shisa-v2-405b",
      "model_file": "shisa-ai__shisa-v2-llama3.1-405b.json",
      "model_answer": "仕事の熱意を取り戻すためのアイデアを5つ挙げます。  \n\n1. **目標の再設定**  \n   - 短期・長期の目標を明確にし、達成感を得られるように分割する。  \n   - 「なぜこの仕事をするのか？」を改めて自問し、価値観と整合性があるか確認する。  \n\n2. **新しい挑戦**  \n   - これまでやったことのないプロジェクトやスキル習得に挑戦する。  \n   - 例：研修受講、異部署との連携、副業などで刺激を求める。  \n\n3. **環境の見直し**  \n   - 仕事スペースの整理（物理的・デジタル）で集中力を高める。  \n   - 同僚や上司とのコミュニケーションを改善し、協力体制を作る。  \n\n4. **自己肯定感の向上**  \n   - 過去の成功事例を振り返り、自信を取り戻す。  \n   - フィードバック（褒め言葉含む）を受け入れ、成長機会と捉える。  \n\n5. **ワークライフバランス**  \n   - 趣味やリフレッシュ時間（運動・読書など）を確保し、心身リフレッシュする。  \n   - 完璧主義から離れ、「80%で十分」という考え方で効率化する。  \n\nさらに、必要に応じて「キャリアカウンセリング」や「メンター探し」も有効です。あなたの状況に合わせて試してみてください！",
