    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "小説の執筆、応援しております。\n母親が「教育熱心（あるいは過干渉）」から「息子の苦しみの理解」へと変化するシーンは、物語のカタルシスとなる重要な場面ですね。\n\n母親の性格や、そのシーンの「静けさ・激しさ」に合わせて使えるよう、いくつか異なるパターンのセリフを提案します。\n\n### パターン1：自分の過ちに気づき、深く後悔して謝罪する\n母親が、自分の不安を息子に押し付けていたことを認め、崩れ落ちるようなパターンです。\n\n*   「ごめんね……。お母さん、あなたの『将来』のことばかり見ていて、『今』のあなたがこんなに傷ついていることに気づかなかった。」\n*   「あなたを守るために勉強させなきゃって、必死だったの。でも、それがあなたを一番追い詰めていたなんて……私、母親失格ね。」\n*   「学校でも辛かったのに、家にも逃げ場所をなくしてごめんなさい。もう頑張らなくていい。もう十分よ。」\n\n### パターン2：成績や大学よりも「息子の命・心」を優先すると宣言する\nこれまで絶対視していた価値観（良い大学）を、息子のために捨て去る決意のパターンです。\n\n*   「勉強なんて、もういいわ。あなたが壊れてしまうくらいなら、いい大学なんて何の意味もない。」\n*   「偏差値が下がってもいい。進路が変わってもいい。お母さんはただ、あなたが笑って生きていてくれれば、それだけでよかったのに……どうして忘れちゃってたんだろう。」\n*   「ペンを置きなさい。今日はもう、何もしなくていいから。……今まで一人で戦わせてごめんね。」\n\n### パターン3：学校での孤独を知り、味方になることを誓う\n学校での人間関係のトラブルを知り、家こそが安全基地であるべきだったと悟るパターンです。\n\n*   「学校でそんなに苦しい思いをしてたなんて……。知らなかったとはいえ、家でまでガミガミ言って、あなたの居場所を奪ってたのね。」\n*   「誰が何と言おうと、お母さんはあなたの味方でいなきゃいけなかったのに。一番の敵になってて、どうするのよ……。」\n*   「学校に行きたくないなら、行かなくていい。勉強も休んでいい。まずは、あなたの心が元気になることだけ考えましょう。」\n\n### パターン4：短く、静かに受け入れる（余韻を残す）\n多くを語らず、行動や短い言葉で変化を示すパターンです。\n\n*   （勉強机に向かう息子の手から参考書を取り上げて）\n    「……今日は、好きなご飯にしようか。何が食べたい？」\n*   「辛かったね。……気づいてあげられなくて、ごめん。」\n*   「もういいの。……もう、いいのよ。」\n\n### 執筆のアドバイス\nこのセリフの前に、**「母親が息子の何を見てハッとしたのか」**という描写を入れると、セリフがより生きてきます。\n\n*   息子が隠していたノートの落書きを見た。\n*   息子が勉強中に静かに涙を流しているのを目撃した。\n*   息子が「もう疲れた」と小さく呟いたのが聞こえてしまった。\n\n文脈に合わせて、上記のセリフを組み合わせたり、語尾を調整したりして使ってみてください。素晴らしいシーンになることを願っています。",
