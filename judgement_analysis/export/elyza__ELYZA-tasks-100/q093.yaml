      "model_answer": "「…ごめんね、〇〇（主人公の名前）。私、ただあなたに良い未来を願っていたから、勉強ばかり強く求めてしまって。でも、それはあなたの気持ちを無視してたんだね。  \n\nあなたが本当にやりたいこと、本当に大切にしたいものは何か、私がちゃんと見てなかった。良い大学に行くことも大事だけど、それ以上に、あなたが幸せでいられる道を見つけることが一番大切だって、今ようやくわかったの。  \n\nこれからは、あなたのペースで、あなたの好きなように進んでいいんだよ。私も、あなたの夢を応援するから」  \n\n（※〇〇は主人公の名前を入れてください）  \n\nこのセリフでは、母親が反省しつつも愛情を伝え、主人公の自主性を尊重する姿勢を示しています。物語の展開や母親のキャラクターに合わせて調整してください。",
