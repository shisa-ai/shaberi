      "model_answer": "ナイジェリア、ロシア、エジプトは地理的・文化的に異なる国ですが、いくつかの共通点があります。主な共通点を以下にまとめます。\n\n### 1. **多民族・多言語国家**\n   - **ナイジェリア**：250以上の民族と500以上の言語が存在し、ハウサ語、ヨルバ語、イボ語などが主要言語。\n   - **ロシア**：100以上の民族が住み、ロシア語以外にもタタール語、バシキール語などが話される。\n   - **エジプト**：アラブ人が大多数だが、コプト人（キリスト教徒）やベドウィン（遊牧民）なども存在。\n\n### 2. **宗教的多様性**\n   - **ナイジェリア**：イスラム教徒とキリスト教徒がほぼ同数で対立もある。\n   - **ロシア**：正教会が主流だがイスラム教徒（特に北カフカス地方）も多い。\n   - **エジプト**：イスラム教（スンニ派）が90%以上だがコプト正教会も古くから存在。\n\n### 3. **資源依存経済**\n   - **ナイジェリア**：原油輸出に依存（OPEC加盟国）。\n   - **ロシア**：石油・天然ガス輸出がGDPの大部分を占める。\n   - **エジプト**：石油・天然ガス産業に加え、スエズ運河の通行料収入も重要。\n\n### 4. **政治体制の類似性**\n   - いずれも強力な指導者による統治傾向があり：\n     - ナイジェリアは民主制だが軍部の影響残る。\n     - ロシアは大統領権限強化型の半大統領制。\n     - エジプトは軍部出身の大統領による長期政権。\n\n### 5. **テロリズム問題**\n   - ナイジェリアではボコ・ハラム、\n   - ロシアではチェチェン分離主義勢力、\n   - エジプトではシナイ半島でのIS系グループ活動など。\n\n### 6. **BRICS/新興国との関連**\n   - ロシアはBRICSメンバー。ナイジェリアとエジプトは「次世代BRICS候補」として議論されることがある。\n\n### 7. **歴史的遺産**\n   - エジプト（ピラミッド）、\n   - ロシア（クレムリンや古都サンクトペテルブルク）、\n   - ナイジェリア（ニジェール川流域の古代王国跡）などユネスコ世界遺産を持つ。\n\nこれらの国々はそれぞれ独自性を持つ一方で、「多様性の中での統一」や「資源経済」といった共通課題を抱えています。",
