    "original": "あなたは古代エジプトの貴族です。冠位によって割り振られた土地について税を納めようとしています。しかし、ある土地についてどの貴族が所有しているかを知りません。以下はその土地の形状と特徴です。\n- 南北に細長い\n- ナイル川から東に離れている\n- 西側は岩山になっている\nこの土地は誰が所有しているのでしょうか？",
