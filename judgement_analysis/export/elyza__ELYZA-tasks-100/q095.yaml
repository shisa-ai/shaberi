  "question": {
    "original": "犬が「ワンワン」ほえるなど、音や声を直接表す言葉を「擬音語」、星が「きらきら」光るなど、ものや人の様子を直接表す言葉を「擬態語」といいます。\n\n下の文を読み、擬音語・擬態語をそれぞれリストアップしてください。\n\n窓辺に座り、ぼんやりと外を見ていると、パラパラと雨が降り始めました。ビシャビシャと音を立てる雨に、私は何でもない場面にワクワクした気持ちを抱きました。",
    "translation_en": "**[Purpose: question]**  \n\nWords that directly represent sounds or voices, such as a dog barking \"wan-wan,\" are called **onomatopoeia (擬音語)**. Words that directly represent the state or appearance of things or people, such as stars twinkling \"kirakira,\" are called **mimetic words (擬態語)**.  \n\nRead the following sentence and list the onomatopoeia and mimetic words separately.  \n\n*\"Sitting by the window and gazing blankly outside, it started to rain in a *parapara* patter. The *bishabisha* sound of the rain filled me with a sense of excitement in an otherwise ordinary scene.\"*  \n\n**Onomatopoeia (擬音語):**  \n- *parapara* (パラパラ) – the sound of light rain  \n- *bishabisha* (ビシャビシャ) – the sound of heavy rain  \n\n**Mimetic Words (擬態語):**  \n- *wakuwaku* (ワクワク) – feeling excited or thrilled (though not strictly mimetic, it describes an emotional state)  \n\n*(Note: \"wakuwaku\" is often categorized as a mimetic word in Japanese, though it describes an internal feeling rather than an external state. If strictly adhering to the definition, it may not be included.)*"
  },
