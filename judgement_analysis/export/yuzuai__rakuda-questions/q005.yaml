      "model_answer": "北海道の主要な都市5つとそれぞれの地理的特徴は以下の通りです。  \n\n1. **札幌市**  \n   - 北海道の中央部に位置し、石狩平野に広がる。  \n   - 豊かな緑と清流（豊平川など）が特徴で、周囲には山々（手稲山、藻岩山）が連なる。  \n   - 冬は雪が多く、雪まつりで有名。  \n\n2. **函館市**  \n   - 南西部に位置し、津軽海峡に面した港湾都市。  \n   - 山地（函館山）と海岸線が迫り合う独特の地形で、夜景が美しい。  \n   - 温暖な気候で、本州との交流拠点として発展。  \n\n3. **旭川市**  \n   - 北海道北部の大雪山国立公園近くに位置する内陸都市。  \n   - 石狩川や忠別川などの河川が流れ、周囲は広大な森林地帯。  \n   - 冬は極寒だが、夏は涼しい気候。  \n\n4. **釧路市**  \n   - 東部に位置し、太平洋に面した港湾都市。  \n   - 釧路湿原（ラムサール条約登録湿地）を抱え、自然豊かな環境。  \n   - 漁業（タラバガニなど）が盛んで、日本有数の漁港を持つ。  \n\n5. **小樽市**  \n   - 札幌近郊の石狩湾沿いに位置する港町。  \n   - 海と山（天狗山など）に囲まれ、運河沿いの倉庫群が観光名所。  \n   - 温暖な気候で、日本海からの影響を受けやすい。  \n\nこれらの都市はそれぞれ異なる自然環境を持ち、それぞれ独自の文化や産業を育んでいます。",
