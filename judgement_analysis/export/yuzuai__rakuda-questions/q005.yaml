      "model_answer": "北海道の主要な都市5つと、それぞれの地理的特徴は以下の通りです。  \n\n1. **札幌市**  \n   - 北海道の州都で、広大な平野に位置する。豊平川や大通公園など、緑豊かな景観が特徴。内陸部にあり、冬は雪が多い。  \n\n2. **函館市**  \n   - 五稜郭や函館山などの山岳地帯に囲まれた港町。津軽海峡に面し、霧が多く、美しい夜景で知られる。  \n\n3. **旭川市**  \n   - 石狩川沿いに位置し、内陸部の盆地にある。夏は涼しく、冬は寒さが厳しい。北海道中央部の玄関口として発展した。  \n\n4. **小樽市**  \n   - 港町として栄え、運河やガラス工芸で有名。丘陵地帯に位置し、海と山を望む景観がある。  \n\n5. **帯広市**  \n   - 十勝平野に広がる農業都市で、「十勝の国」と呼ばれる。広大な農地と温暖な気候が特徴で、小麦や乳製品の生産地として知られる。  \n\nこれらの都市は、それぞれ異なる地理的条件を持ちながら北海道の経済・文化を支えています。",
