      "model_answer": "江戸時代（1603年～1868年）の階級制度は、徳川幕府によって確立された厳格な身分制度であり、社会の安定と統治を目的としていました。この制度は「士農工商」という四つの階級に分かれ、それぞれの役割と義務が明確に定められていました。以下に各階級の特徴と、その社会への影響を詳しく説明します。\n\n---\n\n### **1. 士（侍）**\n- **役割**: 武士階級で、政治・軍事の中核を担いました。特権として刀を帯びることが許され、俸禄（米）を受け取りました。\n- **影響**:  \n  - 社会秩序の維持に貢献しましたが、平和な時代が長く続いたため、武芸よりも学問や行政能力が重視されるようになりました。  \n  - 財政難により下級武士は困窮し、一部は農民や町人への依存を強いられました。\n\n---\n\n### **2. 農（農民）**\n- **役割**: 食料生産を担い、年貢（米）を納める義務がありました。身分的には武士に次ぐ地位でしたが、実際には厳しい支配を受けていました。\n- **影響**:  \n  - 農村では「村請制」により共同体意識が強まり、一方で年貢負担や飢饉により一揆（農民反乱）も頻発しました。  \n  - 土地所有権はなく、幕府や大名の支配下に置かれていました。\n\n---\n\n### **3. 工（職人）**\n- **役割**: 生産物を作り、都市経済を支えました。特に大都市では需要が高く、高度な技術を持つ職人は一定の地位を得ていました。\n- **影響**:  \n  - 経済発展の一翼を担い、新しい技術や文化（例：浮世絵・陶芸）の発展に寄与しました。  \n  - 一方で身分的には低く扱われ、大名や幕府への奉仕も求められました。\n\n---\n\n### **4. 商（商人）**\n- **役割**: 商品流通や金融業を行い、経済活動の中核となりました。しかし身分的には最下位とされ、「士農工商」の末席でした。\n- **影響**:  \n  - 都市化とともに力をつけ、「町人文化」（歌舞伎・浄瑠璃など）の隆盛につながりました。  \n  - 幕府は商人の経済力を抑制しようとしましたが、実際には彼らが経済の大部分を支配していました。\n\n---\n\n### **その他の階層**  \n- **被差別民**（穢多・非人）: 身分制度外で最底辺であり、皮革加工や屠殺などの「穢れた仕事」を強制されていました。差別は深刻でした。  \n- **僧侶・神官**: 宗教的な役割を持つ一方で、一部は政治に関与することもあります。\n\n---\n\n### **社会への総合的な影響**  \n1. **安定と抑圧**：身分制度により社会秩序は保たれましたが、それぞれの階層間での移動はほぼ不可能であり、新しい才能の活用を阻害しました。  \n2. **経済格差**：武士階級の一部没落と町人の台頭により、本来の身分秩序との乖離が生じ、中期以降には社会矛盾が顕在化しました。  \n3. **文化的多様性**：町人文化の発展により文学・芸術など新しい価値観が出現し、これまでの武家道精神とは異なる「庶民文化」が花開きます。\n\n江戸時代後期になると、この制度に対する不満から尊王攘夷運動など政治改革要求が出現し、やがて明治維新へとつながります。このように、江戸時代の階級制度は日本社会に深い痕跡を残し、その後の近代化にも大きな影響を与え続けます。",
