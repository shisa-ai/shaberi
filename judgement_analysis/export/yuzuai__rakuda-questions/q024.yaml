      "model_answer": "応仁の乱は、室町時代後期（1467年～1477年）に起こった内乱であり、室町幕府の権威を失墜させ、日本の政治・社会構造に大きな変化をもたらしました。以下にその概要、結果、影響について詳述します。\n\n---\n\n### **1. 応仁の乱の背景と経過**\n- **原因**  \n  - 幕府将軍家（足利義政）の後継者争い（義尚 vs 義視）  \n  - 守護大名間の対立（特に細川勝元 vs 山名持豊）  \n  - 農民や商人の不満（重税・検地など）  \n\n- **経過**  \n  - 1467年：京都で両派が衝突し、全市が戦場化。  \n  - 幕府権力が弱体化し、大名や国人による私戦が頻発。  \n  - 東軍（細川勝元）と西軍（山名持豊）の対立が長期化。  \n\n---\n\n### **2. 応仁の乱の結果**\n- **政治的混乱**  \n  - 幕府権威崩壊：将軍家は傀儡となり、大名が実権を握る「下克上」の時代へ。  \n  - 守護大名から戦国大名への移行：領国支配を強化する勢力が出現。  \n\n- **社会的変動**  \n  - 農民一揆や商人の台頭：従来の身分秩序が揺らぐ。  \n  - 寺社勢力の武装化：比叡山延暦寺などが自衛組織を形成。  \n\n- **経済的被害**  \n  - 京洛焼き討ち：京都市街の大半が破壊され、文化財や産業に深刻な打撃。  \n\n---\n\n### **3. 応仁の乱の影響**\n#### **(1) 政治構造の変革**\n- 幕府権力低下 → 戦国時代への移行：守護大名から戦国大名へと変質し、中央集権から地方分権へ。  \n- 「下克上」の風潮：有力な国人が主君を倒し、新たな勢力を築く事例増加（例：松永久秀）。  \n\n#### **(2) 社会・文化への影響**\n- 武士階級の台頭と農民反乱：身分制度崩壊の一因となる。  \n- 文化面での停滞と新興宗教勃興：禅宗衰退 vs 浄土真宗などの民衆宗教拡大。  \n\n#### **(3) 経済構造への影響**\n- 商業都市（堺・博多など）の発展：京都衰退により地方都市が繁栄。  \n- 貨幣経済浸透：「楽市楽座」政策で商業活動活性化（例：織田信長）。  \n\n---\n\n### **まとめ**\n応仁の乱は、室町幕府末期における政治的空白を生み出し、「戦国時代」の幕開けを促しました。その混乱は社会全体に波及し、日本の中世から近世への転換点となった出来事です。この内乱後の日本は、大名間抗争や新たな文化・経済システム誕生へと動き出すことになります。\n\nさらに詳しい情報が必要であれば、お知らせください！",
