      "model_answer": "応仁の乱（おういんのらん）は、室町時代中期に発生した内乱であり、1467年から1477年にかけて約10年間にわたって続きました。この乱は、室町幕府の権威を失墜させ、日本の社会と政治に大きな影響を与えました。以下に、その詳細と結果について説明します。\n\n### **応仁の乱の背景**\n1. **幕府の衰退**  \n   室町幕府は、足利義政（第8代将軍）の治世下で財政難や権力闘争が激化していました。特に有力守護大名（地方の武将）たちは、幕府への忠誠心を失い、自らの勢力拡大を目指すようになりました。\n\n2. **後継者問題**  \n   義政には男子がなく、後継者争いが激化しました。有力守護大名たちは、この後継者問題を口実に勢力を争い始めます。\n\n3. **京での対立激化**  \n   1464年に義政が亡くなると、その弟である足利義尚（第9代将軍）が後継者として迎えられました。しかし、義尚は京都で有力守護大名たちとの対立を深め、彼らは義尚を排除しようと動き始めます。\n\n### **乱の発端**\n1467年3月16日、京都で火災が発生し、その後の混乱の中で有力守護大名たちが互いに攻撃し合うようになります。これが「応仁の乱」の直接的なきっかけとなりました。\n\n### **乱の経過**\n- **初期（1467–1469）**：  \n  織田信長（当時はまだ若く無名）の祖父・織田氏長らが東軍（幕府支持派）、山名宗全らが西軍（反幕府派）に分かれて戦闘を開始。京都市内は荒廃し、大規模な戦闘となります。\n- **中期（1469–1473）**：  \n  西軍が優勢となり、東軍は追い詰められます。信長もこの時期から活躍し始めます。\n- **終盤（1473–1477）**：  \n  両軍とも疲弊し、一時的に停戦。しかし完全な解決には至らず、やむなく和睦します。\n\n### **結果と影響**\n1. **幕府権威の崩壊**  \n   乱によって室町幕府は完全に権威を失い、その統制力を失います。これにより、日本各地では守護大名たちが自立し、「戦国時代」の到来を告げることになります。\n\n2. **社会・経済への影響**  \n   - 京都は荒廃し、大規模な人口減少に見舞われます。  \n   - 農村部でも戦火により被害を受け、経済活動も停滞します。  \n\n3. **新たな勢力台頭**  \n   - 織田信長や今川義元など、新しい武将たちが台頭し、やがて戦国大名へと成長します。  \n   - 足利氏も衰退し、その後継者争いはさらに複雑化します。\n\n4. **文化への影響**  \n   - 乱後の混乱の中で、「水墨画」や「能楽」などの文化が発展しました。また、「忍び」のような隠密工作技術もこの時代に確立されました。\n\n### **結論**\n応仁の乱は、日本史上初めて全国規模の大規模内乱であり、その後の日本社会に深刻な影響を与えました。この乱によって室町幕府は崩壊し、それぞれの地域で戦国大名たちによる覇権争いへと移行することになります。この出来事は、日本史における重要な転換点として記憶されています。",
      "judgements": [
