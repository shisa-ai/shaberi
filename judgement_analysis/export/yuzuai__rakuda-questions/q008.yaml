      "model_answer": "日本の都道府県の中で人口が最も少ないのは**鳥取県**です（2024年5月現在）。\n\n鳥取県の人口が少ない理由には、以下のような地理的な特性が挙げられます。\n\n*   **山地が多く、平野が少ない:** 鳥取県は中国山地に囲まれており、県土の約8割を山地が占めています。平野部は限られており、農業や工業に適した土地が少ないため、産業の発展が制限されています。\n*   **交通の便が悪い:** 山間部であるため、鉄道や高速道路などの交通網の整備が遅れており、大都市圏とのアクセスに時間と費用がかかります。これにより、若者の流出や企業誘致が難しくなっています。\n*   **過疎化と高齢化:** 若者の都市部への流出により過疎化と高齢化が進んでおり、労働力不足や医療・福祉サービスの維持など、新たな課題を生んでいます。\n*   **産業構造:** 伝統的に農業（特に米作）や漁業を中心とした産業構造であり、高付加価値な産業への転換が遅れています。\n\nこれらの要因が複合的に絡み合い、鳥取県の人口減少につながっていると考えられます。近年では観光資源（砂丘など）の活用や地域活性化策などに取り組んでいますが、依然として課題は多く残っています。",
