    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "江戸時代の「鎖国」政策と、その例外として交流が許されていた「4つの窓口（四つの口）」について、歴史的な事実に基づき公平かつ詳細に説明します。\n\n### 1. 江戸時代の「鎖国」政策とは\n\n「鎖国」とは、江戸幕府が約200年間にわたって行った、対外関係を厳しく統制・制限する政策のことです。ただし、完全に国を閉ざしていたわけではなく、**「幕府が独占的に管理・制限した貿易・外交体制」**と表現するのが正確です。近年、歴史学の分野では「海禁（かいきん）」という言葉が使われることも増えています。\n\nこの政策が完成したのは、3代将軍・徳川家光の時代（1630年代後半〜1641年）です。\n\n#### 主な目的と理由\n1.  **キリスト教の禁止（禁教）:**\n    スペインやポルトガルが布教を通じて日本を植民地化することを恐れ、またキリスト教の教えが幕府の封建的な支配体制（主君への絶対的忠誠）と相容れないと考えたためです。島原の乱（1637年）が決定打となりました。\n2.  **貿易の利益独占:**\n    海外との貿易は莫大な利益を生みます。これを西国の大名（特に九州）が勝手に行い、力をつけて幕府に反旗を翻すことを防ぐため、幕府が貿易の権限を独占しようとしました。\n\n#### 具体的な措置\n*   日本人の海外渡航および帰国の禁止。\n*   ポルトガル船の来航禁止（1639年）。\n*   オランダ商館を平戸から長崎の出島へ強制移転（1641年）。\n*   「オランダ風説書（ふうせつがき）」の提出義務化（海外情報の収集）。\n\n---\n\n### 2. 外国との交流が許された「4つの窓口」\n\n鎖国体制下でも、幕府は特定の場所と相手に限り、交流を認めていました。これを**「四つの口（よっつのくち）」**と呼びます。\n\n#### ① 長崎口（長崎）\n*   **相手:** **オランダ**、**中国（明・清）**\n*   **管理者:** 長崎奉行（幕府の直轄地）\n*   **詳細:**\n    *   ここが唯一、ヨーロッパ諸国（オランダのみ）との貿易が許された場所です。\n    *   **オランダ:** キリスト教の布教を行わず、貿易のみを目的としたため許可されました。人工島である「出島」に隔離され、そこでのみ活動が許されました。時計、ガラス、医学書（蘭学）、武器などが輸入されました。\n    *   **中国:** 伝統的な貿易相手であり、特定の居住区（唐人屋敷）での滞在が認められました。生糸、絹織物、書物などが輸入されました。\n    *   日本からは主に銀や銅、海産物（俵物）が輸出されました。\n\n#### ② 対馬口（対馬）\n*   **相手:** **朝鮮（李氏朝鮮）**\n*   **管理者:** 対馬藩（宗氏）\n*   **詳細:**\n    *   豊臣秀吉の朝鮮出兵で悪化した関係を修復し、国交を回復しました。\n    *   対馬藩は地理的に朝鮮半島に近く、土地が痩せていて米が取れなかったため、朝鮮との貿易が藩の経済を支えていました。\n    *   将軍の代替わりなどを祝う外交使節団**「朝鮮通信使」**が計12回来日し、江戸まで行列を組んで進みました。これは文化交流の側面も強く持っていました。\n    *   釜山には「倭館（わかん）」という日本人居留地が置かれ、貿易が行われました。\n\n#### ③ 薩摩口（薩摩・現在の鹿児島）\n*   **相手:** **琉球王国（現在の沖縄県）**\n*   **管理者:** 薩摩藩（島津氏）\n*   **詳細:**\n    *   1609年に薩摩藩が琉球へ侵攻し、武力で服属させました。\n    *   琉球王国は、形式上は独立国として中国（清）にも朝貢（貢ぎ物を持って挨拶に行くこと）を行っていました。つまり、**「日本（薩摩）と中国（清）の両方に属する」**という複雑な立場でした。\n    *   薩摩藩は、琉球を通じて中国の産物を間接的に入手し、莫大な利益を上げました。\n    *   将軍の代替わりなどには、琉球からも「慶賀使（けいがし）」や「謝恩使（しゃおんし）」という使節団が江戸へ送られました。\n\n#### ④ 松前口（松前・現在の北海道南部）\n*   **相手:** **アイヌ民族（蝦夷地）**\n*   **管理者:** 松前藩（松前氏）\n*   **詳細:**\n    *   北海道（当時は蝦夷地と呼ばれた）の先住民族であるアイヌとの交易の窓口です。\n    *   松前藩は米が取れないため、アイヌとの交易独占権を幕府から認められていました。\n    *   日本側からは米、酒、鉄製品などが、アイヌ側からは昆布、サケ、毛皮（ラッコなど）が持ち込まれました。\n    *   **注意点:** 松前藩による交易は対等なものではなく、次第にアイヌに対して不利な交換レートを押し付けたり、労働力を搾取したりするようになりました。これに対し、シャクシャインの戦い（1669年）などの蜂起も起きています。\n\n### まとめ\n\n江戸時代の日本は完全に孤立していたわけではなく、これら4つのルートを通じて、世界情勢（ナポレオン戦争やアヘン戦争など）を把握し、必要な物資や文化を取り入れていました。\n\nこの体制は、1853年のペリー来航と、それに続く日米和親条約（1854年）によって終わりを迎えることになります。",
