      "model_answer": "江戸時代の「鎖国」政策は、1639年に始まり、明治維新（1868年）まで続いた日本の外交政策です。この政策は、キリスト教の布教と貿易による政治的・経済的影響を警戒し、海外との交流を厳しく制限することで、日本の社会秩序と文化を守ることを目的としていました。  \n\n### **鎖国政策の主な内容**  \n1. **キリスト教禁止**：1639年に禁教令が出され、キリスト教徒が処刑されたり、隠れキリシタンが迫害されたりしました。  \n2. **貿易制限**：ヨーロッパ諸国との貿易を禁止し、日本人海外渡航や外国人の入国を厳しく制限しました。  \n3. **海禁令**：日本人が海外へ出ることを禁止し、外国船の入港も制限されました。  \n\n### **交流が許された数か所**  \n鎖国下でも完全に外国との交流が断絶されたわけではなく、いくつかの例外がありました。  \n\n1. **長崎の出島（オランダ商館）**  \n   - 1600年にオランダ東インド会社が長崎に商館を開き、限定的な貿易を行いました。  \n   - オランダを通じて西洋の知識や技術（蘭学）が日本に伝わりました。  \n\n2. **対馬・五島・小笠原諸島**  \n   - 対馬（朝鮮との交易）、五島（琉球王国の交易）、小笠原諸島（フランス人捕鯨業者との交流）で限定的な貿易が行われました。  \n\n3. **琉球王国（現在の沖縄）**  \n   - 琉球王国は中国や東南アジアとの交易を行い、日本と中国間の中継地として機能しました。  \n\n4. **漂流民受け入れ**  \n   - 嵐などで漂着した外国人船員や漂流民を受け入れ、一時的に滞在させました（例：サミュエル・ウィリアムズ）。  \n\n### **結論**  \n江戸時代の「鎖国」は完全な閉鎖ではなく、特定の場所や条件下で限定的な交流が許されていました。これらの例外は、日本の国際関係や文化に影響を与え、後の開国へとつながる要因となりました。",
