    "original": "江戸時代の「鎖国」政策について説明し、その中で外国との交流が許された数か所について述べてください。",
    "translation_en": "**[Purpose: Question]**  \n\nExplain the \"sakoku\" (closed country) policy of the Edo period and describe the limited locations where interactions with foreign countries were permitted.  \n\n*(Note: \"Sakoku\" is the standard English term for Japan's isolationist policy, and \"Edo period\" is the conventional translation for 江戸時代. The translation maintains the original meaning and structure while ensuring clarity for evaluation documentation.)*"
