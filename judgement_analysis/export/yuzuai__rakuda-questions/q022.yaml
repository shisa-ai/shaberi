    "original": "平安時代に成立した貴族社会の特徴を述べ、それが日本文化（文学、芸術、宗教など）にどのように影響を与えたかについて論じてください。",
    "translation_en": "**[Purpose: Question]**  \n\nDescribe the characteristics of the aristocratic society that emerged during the Heian period and discuss how it influenced Japanese culture (literature, art, religion, etc.).  \n\n*(Note: The translation maintains the original meaning and structure while ensuring natural English phrasing suitable for evaluation documentation.)*"
