      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "自由民主党（自民党）と立憲民主党（立憲）は、日本の政治においてそれぞれ「与党（保守）」と「野党第一党（リベラル・中道）」の立場にあり、多くの重要政策で対立軸を持っています。\n\n主な政策の違いを分野ごとに整理して解説します。\n\n### 1. 憲法改正\n最も根本的なイデオロギーの違いが現れる分野です。\n\n*   **自由民主党（改憲推進）**\n    *   憲法改正を党是としています。\n    *   特に**憲法9条への自衛隊明記**、緊急事態条項の創設、教育の充実、参議院の合区解消の4項目を掲げています。\n    *   「自衛隊の違憲論争に終止符を打つ」という立場です。\n*   **立憲民主党（慎重・立憲主義の堅持）**\n    *   「論理的整合性のない改憲」には反対の立場です。特に自民党案の9条改憲や緊急事態条項には強く反対しています。\n    *   権力が暴走しないように憲法で縛る「立憲主義」を重視します。\n    *   議論自体は拒否しないものの、現状では優先順位は低いとし、国民生活の向上を優先すべきと主張します。\n\n### 2. 外交・安全保障\n防衛費の増額や敵基地攻撃能力（反撃能力）について意見が分かれます。\n\n*   **自由民主党（防衛力強化・日米同盟深化）**\n    *   **防衛費の大幅増額**（GDP比2%を念頭）を推進。\n    *   他国のミサイル発射拠点などを叩く**「反撃能力」の保有**を決定し、運用を進めています。\n    *   日米同盟を基軸としつつ、抑止力を高める現実的な対応を重視します。\n*   **立憲民主党（専守防衛・対話重視）**\n    *   防衛費の増額には、財源や使途の透明性を求めて慎重姿勢です（増税による防衛費増には反対）。\n    *   「反撃能力」については、先制攻撃とみなされるリスクや専守防衛の逸脱を懸念し、慎重・反対の立場をとることが多いです。\n    *   軍事力よりも外交・対話による平和構築を強調します。\n\n### 3. 経済・税制\n「成長」と「分配」のどちらに重きを置くかで違いがあります。\n\n*   **自由民主党（成長と分配の好循環）**\n    *   アベノミクスの流れを継承しつつ、岸田政権下では「新しい資本主義」を掲げました。\n    *   企業が成長し、賃上げを行うことで経済を回すアプローチです。\n    *   **消費税については、当面は減税しない**（社会保障の財源として維持）という立場です。\n*   **立憲民主党（人への投資・分配重視）**\n    *   アベノミクスは格差を広げたと批判的です。\n    *   「ボトムアップの経済」を掲げ、家計や中間層への支援を最優先します。\n    *   **消費税については、時限的な減税（5%への引き下げなど）**や、インボイス制度の廃止・見直しを主張することがあります。富裕層や大企業への課税強化（金融所得課税など）も訴えています。\n\n### 4. エネルギー・原発\n原子力発電所の扱いについて明確な違いがあります。\n\n*   **自由民主党（原発活用・ベストミックス）**\n    *   脱炭素社会の実現に向け、再生可能エネルギーを増やしつつも、**原発を重要なベースロード電源として活用**します。\n    *   安全性が確認された原発の再稼働を進め、次世代革新炉の開発・建設も視野に入れています。\n*   **立憲民主党（原発ゼロ・再エネシフト）**\n    *   将来的な**「原発ゼロ」**を目指しています。\n    *   原発の新増設には反対し、老朽原発の廃炉を進める立場です。\n    *   省エネと再生可能エネルギーへの投資を飛躍的に高めることを重視します。\n\n### 5. 社会・ジェンダー（多様性）\n個人の権利や家族観に関する問題で対立が鮮明です。\n\n*   **自由民主党（伝統的家族観・慎重）**\n    *   **選択的夫婦別姓**や**同性婚**の法制化には、党内に慎重論や反対論が根強くあります（「家族のあり方が変わる」などの理由）。\n    *   女性活躍は推進しますが、制度的な変更には保守的な姿勢が目立ちます。\n*   **立憲民主党（多様性尊重・推進）**\n    *   **選択的夫婦別姓**の早期導入、**同性婚**の法制化、LGBT理解増進法の制定などに積極的です。\n    *   ジェンダー平等を強く推進し、個人の選択肢を広げることを重視します。\n\n### 6. 政治改革（政治とカネ）\n近年の裏金問題などを受けた対応の違いです。\n\n*   **自由民主党**\n    *   政治資金規正法の改正を行いましたが、企業・団体献金の禁止には消極的です。\n    *   透明性の向上（デジタル化など）や、議員本人の責任を問う「連座制」の強化などで対応しようとしています。\n*   **立憲民主党**\n    *   より抜本的な改革を主張しています。\n    *   **企業・団体献金の全面禁止**や、使途公開義務のない「政策活動費」の廃止を訴えています。\n\n---\n\n### まとめ\n\n| 分野 | 自由民主党 (保守) | 立憲民主党 (リベラル) |\n| :--- | :--- | :--- |\n| **憲法** | 改正推進 (9条明記など) | 慎重・反対 (立憲主義重視) |\n| **防衛** | 防衛費増額・反撃能力保有 | 専守防衛厳守・外交重視 |\n| **経済** | 企業成長・賃上げ促進 | 家計支援・格差是正 |\n| **消費税** | 維持 (社会保障財源) | 減税・給付付き税額控除など |\n| **原発** | 再稼働・活用 | 原発ゼロへ移行 |\n| **ジェンダー** | 夫婦別姓・同性婚に慎重 | 夫婦別姓・同性婚に賛成 |\n\n一言で言えば、**自民党は「現状の体制や伝統を守りつつ、経済成長と強い防衛力で国を維持する」**方向性であり、**立憲民主党は「個人の権利や多様性を重視し、家計支援や再分配によって社会を変える」**方向性であると言えます。",
