    {
      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "日本の「三権分立（さんけんぶんりつ）」について、その仕組みと各機関の役割、そして相互の関係性（抑制と均衡）について詳しく解説します。\n\n### 三権分立とは\n\n三権分立とは、国家権力を**「立法権」「行政権」「司法権」**の3つに分け、それぞれを独立した機関に担当させる仕組みです。\n\n権力が一箇所（一人の独裁者や一つの組織）に集中すると、権力の濫用が起きやすく、国民の権利や自由が脅かされる恐れがあります。そのため、権力を分散させ、互いに監視・抑制し合うことでバランスを保ち、国民の人権を守ることを目的としています。日本国憲法においても、この原則が厳格に採用されています。\n\n---\n\n### 1. 立法権：国会（法律を作る）\n\n国会は「国権の最高機関」であり、「国の唯一の立法機関」とされています。\n\n*   **主な役割:**\n    *   **法律の制定:** 社会のルールである法律を作ったり、改正したりします。\n    *   **予算の議決:** 国のお金の使い道（予算）を審議し、決定します。\n    *   **内閣総理大臣の指名:** 国会議員の中から内閣総理大臣（首相）を指名します。\n    *   **条約の承認:** 内閣が外国と結んだ条約を承認します。\n*   **構成:**\n    *   衆議院と参議院の二院制をとっています。\n\n### 2. 行政権：内閣（政治を行う）\n\n内閣は、国会で決められた法律や予算に基づいて、実際の政治（行政）を行います。\n\n*   **主な役割:**\n    *   **法律の執行:** 法律に基づいて政策を実施します。\n    *   **外交関係の処理:** 外国との交渉や条約の締結を行います。\n    *   **予算の作成:** 国の予算案を作成し、国会に提出します。\n    *   **政令の制定:** 法律を実施するための細かいルール（政令）を定めます。\n    *   **公務員の事務掌理:** 公務員の業務を管理・監督します。\n*   **構成:**\n    *   内閣総理大臣と、その内閣総理大臣によって任命された国務大臣で構成されます。\n    *   **議院内閣制:** 日本では、内閣は国会の信任に基づいて成立し、国会に対して連帯して責任を負う「議院内閣制」を採用しています。\n\n### 3. 司法権：裁判所（法に基づいて争いを解決する）\n\n裁判所は、法律に基づいて具体的な争いごとを解決し、法秩序を維持します。\n\n*   **主な役割:**\n    *   **裁判:** 民事裁判（個人間の争い）、刑事裁判（犯罪の有無）、行政裁判（国や自治体に対する訴え）を行います。\n    *   **違憲立法審査権:** 法律、命令、規則、処分などが憲法に違反していないかを審査する権限です。このため、最高裁判所は「憲法の番人」と呼ばれます。\n*   **構成:**\n    *   最高裁判所と、その下にある下級裁判所（高等裁判所、地方裁判所、家庭裁判所、簡易裁判所）で構成されます。\n    *   裁判官は、良心に従い独立して職権を行い、憲法と法律のみに拘束されます（司法権の独立）。\n\n---\n\n### 三権の相互関係（抑制と均衡：チェック・アンド・バランス）\n\nこれら3つの機関は、互いに監視し合うことで権力の行き過ぎを防いでいます。\n\n#### A. 国会（立法）と内閣（行政）の関係\n*   **国会 → 内閣:**\n    *   **内閣不信任決議:** 衆議院は、内閣のやり方が信頼できない場合、「不信任決議」を行うことができます。可決された場合、内閣は総辞職するか、衆議院を解散しなければなりません。\n*   **内閣 → 国会:**\n    *   **衆議院の解散:** 内閣は、衆議院を解散させ、総選挙を行わせることができます。\n\n#### B. 国会（立法）と裁判所（司法）の関係\n*   **国会 → 裁判所:**\n    *   **弾劾裁判（だんがいさいばん）:** 重大な非行があった裁判官を辞めさせるかどうかを判断するため、国会議員による弾劾裁判所を設置します。\n*   **裁判所 → 国会:**\n    *   **違憲審査:** 国会が作った法律が憲法に違反していないか審査し、違反していれば無効と判断します。\n\n#### C. 内閣（行政）と裁判所（司法）の関係\n*   **内閣 → 裁判所:**\n    *   **最高裁判所長官の指名・裁判官の任命:** 内閣は最高裁判所長官を指名（任命は天皇）し、その他の裁判官を任命します。\n*   **裁判所 → 内閣:**\n    *   **違憲審査・行政処分の審査:** 内閣の命令や行った処分が憲法や法律に違反していないか審査します。\n\n### まとめ\n\n日本の三権分立は、**国会がルールを作り、内閣がそのルールに基づいて政治を行い、裁判所がルール通りに行われているかチェックする**という構造です。さらに、国民は選挙や最高裁判所裁判官の国民審査を通じて、これら三権に対して主権者としてのコントロールを行っています。",
