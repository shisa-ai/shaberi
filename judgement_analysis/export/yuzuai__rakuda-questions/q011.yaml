      "model_answer": "日本の三権分立は、国家権力を立法・行政・司法の三つに分割し、それぞれが独立して機能することで、権力の集中を防ぎ、国民の自由と権利を保障する仕組みです。以下にそれぞれの権力とその機能について説明します。\n\n**1. 立法権（国会）**\n\n*   **役割:** 法律を制定すること。国民の代表である議員が集まり、法律案を審議し、可決することで法律が成立します。\n*   **構成:** 衆議院と参議院の二院制。\n    *   **衆議院:** 国民によって直接選挙で選ばれた議員で構成され、解散があります。\n    *   **参議院:** 国民によって直接選挙で選ばれた議員で構成され、解散はありません。\n*   **主な機能:**\n    *   法律案の審議・可決\n    *   予算の承認\n    *   条約の承認\n    *   内閣総理大臣指名\n    *   内閣不信任決議\n\n**2. 行政権（内閣）**\n\n*   **役割:** 法律に基づいて国の政治を行うこと。法律を実行し、国の運営を行います。\n*   **構成:** 内閣総理大臣と国務大臣で構成される内閣。\n*   **主な機能:**\n    *   法律の執行\n    *   予算の執行\n    *   外交交渉\n    *   国家安全保障\n    *   政策決定\n\n**3. 司法権（裁判所）**\n\n*   **役割:** 法律に基づいて紛争を解決し、正義を実現すること。法律違反や契約上の問題などについて判断します。\n*   **構成:** 最高裁判所、その下に高等裁判所、地方裁判所などが設置されています。\n*   **主な機能:**\n    *   民事訴訟・刑事訴訟などの裁判を行う\n    *   憲法違反に関する判断（違憲立法審査権）\n    *   判例を作り出す\n\n**相互牽制**\n\n三権はそれぞれ独立しているだけでなく、お互いに牽制し合う関係にもあります。\n\n*   国会は内閣不信任決議によって内閣を倒すことができます。\n* 裁判所は法律や行政処分が憲法に適合するかどうかを判断し、違憲であれば無効とすることができます。\n* 内閣は国会に対して法律案を提出することができます。\n\nこのように、三権分立によって、それぞれの権力が過度に強くならないようにバランスが取られており、日本における民主主義社会の基盤となっています。",
