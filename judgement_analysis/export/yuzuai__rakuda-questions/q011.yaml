      "model_answer": "日本の三権分立は、憲法によって定められた政府の権力分担システムで、立法・行政・司法の3つの権限が互いに独立し、相互に牽制し合うことで国民の自由と権利を守る仕組みです。以下にそれぞれの権力と機能を説明します。\n\n### 1. **立法権（国会）**\n   - **機能**: 法律を制定する権限を持ちます。衆議院と参議院からなる国会がその役割を担います。\n   - **構成**: 衆議院（465名、4年ごとに解散）と参議院（248名、6年ごとに選挙）で構成されます。\n   - **特徴**: 国民の直接選挙によって選ばれた議員が参加し、法律の審議・可決を行います。内閣不信任決議権や予算審査権なども持っています。\n\n### 2. **行政権（内閣）**\n   - **機能**: 法律を執行し、外交・防衛などの政策を担当します。内閣総理大臣が行政の長として指揮を執ります。\n   - **構成**: 内閣総理大臣（国会で選出）と国務大臣（内閣総理大臣が任命）で構成されます。\n   - **特徴**: 内閣は法律に基づいて行政を行い、国民へのサービス提供や政策実施を行います。また、予算編成や条約締結なども行います。\n\n### 3. **司法権（裁判所）**\n   - **機能**: 法律に基づいて紛争を解決し、司法判断を行います。裁判所がその役割を担います。\n   - **構成**: 最高裁判所、大阪高等裁判所などからなる裁判所制度があります。\n   - **特徴**: 裁判官は独立した地位で活動し、中立的な立場から判断を行います。また、違憲審査権も持っており、法律や行政処分が憲法に適合するかどうかを判断します。\n\n### 三権間の牽制\n- 立法府（国会）は内閣不信任決議や予算審査で行政府（内閣）を牽制します。\n- 行政府は法律執行や条約締結で司法府（裁判所）の判断を受け入れます。\n- 司法府は違憲審査権や刑事訴訟で両方の府に対してチェック機能を行います。\n\nこのように、日本の三権分立は相互にバランスを取りながら機能しており、それぞれの役割が明確化されています。しかし実際には政治状況や社会情勢によって影響を受けることもあります。",
