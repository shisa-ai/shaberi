      "model_answer": "戦後の高度経済成長時代（1955年～1973年頃）は、日本が世界有数の経済大国へと躍進した画期的な時期です。この時期の特徴と現代社会への影響を以下に説明します。\n\n**高度経済成長時代の特徴**\n\n1. **急速な経済成長**: 戦後の復興からわずか10年で、日本は世界有数の工業国へと変貌しました。GDPは倍増し、国民所得も飛躍的に向上しました。\n2. **輸出主導型経済**: 輸出を拡大することで外貨を獲得し、国内産業を育成しました。特に鉄鋼、自動車、家電などの製造業が成長しました。\n3. **技術革新と生産性向上**: アメリカの技術導入や独自の改良により、生産性が向上しました。品質管理（QCサークルなど）やリーン生産方式（トヨタ生産方式）などの革新的な手法が生まれました。\n4. **政府主導の経済政策**: 経済企画庁（現・内閣府）が中心となり、重点産業への投資やインフラ整備を推進しました。企業と政府の密接な連携が特徴的でした。\n5. **労働力人口の増加**: 戦後のベビーブームや地方からの人口流入により、大量の労働力が供給されました。\n\n**現代社会への影響**\n\n1. **豊かな生活水準**: 高度経済成長によって、日本人は高い生活水準を享受できるようになりました。住宅、自動車、家電などの消費財が普及し、中間層が拡大しました。\n2. **企業文化と労働慣行**: 終身雇用制度や年功序列制度など、日本独自の企業文化が形成されました。これらの慣行は現代社会にも影響を与え続けています。\n3. **都市化と地方衰退**: 人口集中による都市部への過密化や、地方における過疎化が進みました。これは現代社会における課題の一つとなっています。\n4. **環境問題**: 工業化に伴い、大気汚染や水質汚染などの環境問題が深刻化しました。これらの問題は現代社会においても重要な課題となっています。\n5. **格差拡大**: 高度経済成長によって富裕層と貧困層との格差が拡大しました。この格差は現代社会においても問題となっており、社会保障制度改革などが議論されています。\n\n**結論**\n\n高度経済成長時代は、日本にとって重要な転換期であり、その影響は現代社会にも深く根付いています。その成功要因として技術革新や政府主導の政策などがありますが、一方で都市化や環境問題といった課題も残しています。これらの課題を克服し持続可能な社会を築くことが、今後の日本にとって重要な課題となるでしょう。",
