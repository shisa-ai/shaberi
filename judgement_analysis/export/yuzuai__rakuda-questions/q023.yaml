      "model_answer": "鎌倉幕府の成立は、日本の歴史において重要な転換点となりました。その背景と影響を以下に説明します。\n\n### **鎌倉幕府成立の背景**\n1. **源平合戦（1180–1185年）**  \n   - 平安時代末期、源氏と平氏が覇権を争う内乱が激化。源頼朝が勝利し、武士による政治体制への移行を促しました。\n   - 平氏の没落後、武士階級が台頭し、朝廷の権威が低下。\n\n2. **武士の台頭**  \n   - 地方で力をつけた武士団（御家人）が存在し、朝廷への忠誠よりも自らの領地や勢力拡大を優先。頼朝はこれらの武士を統率する必要性を感じました。\n\n3. **朝廷との関係**  \n   - 源頼朝は1192年に征夷大将軍に任命され、公家（貴族）からも一定の承認を受けました。しかし、実質的には武士による新たな政治体制を確立しました。\n\n### **日本の歴史への影響**\n1. **封建制度の確立**  \n   - 鎌倉幕府は「守護・地頭」制度を導入し、地方統治を行いました。これにより中央集権的な支配から地方分権的な支配へと移行しました。\n\n2. **武家政権の始まり**  \n   - これまで貴族中心だった政治から武士による支配へと移行。後の室町幕府や江戸幕府へと続く武家政権の基礎となりました。\n\n3. **社会構造の変化**  \n   - 武士階級が社会の中核となり、農民や商人との関係も変化。経済的にも貨幣経済が発達し、新たな文化（禅宗など）も広まりました。\n\n4. **国際関係への影響**  \n   - 鎌倉時代にはモンゴル帝国（元）の侵攻がありますが、これにより日本は鎖国政策へと傾きます。この経験は後の江戸時代における鎖国政策にも影響を与えました。\n\n### **まとめ**\n鎌倉幕府は、日本史上初めて武士によって統治された政権であり、その成立は封建制度や社会構造の大きな変革をもたらしました。この時期に確立された政治・社会システムは、その後の日本の歴史に深く根付き続けています。",
      "judgements": [
        {
          "judge_id": "judge_gpt-5.1-2025-11-13",
          "score": 6,
          "judge_output": "有用性：  \n質問は「鎌倉幕府成立の背景」と「日本史への影響」を求めていますが、回答は両方の点を一応カバーしており、概略としては役に立つ内容です。源平合戦、武士の台頭、征夷大将軍任官といった基本事項に触れており、また封建制度・武家政権の始まり・社会構造の変化など、影響面も整理されています。その意味で一定の有用性はあります。ただし、いくつかの重要な点が抜けていたり誤りが含まれているため、学習用の回答としては注意が必要です。\n\n関連性：  \n全体として質問に対しては概ね関連した内容になっています。鎌倉幕府成立の背景として源平合戦や武士の台頭、朝廷との関係を挙げており、影響として封建制度や武家政権の始まりなどを説明しているため、テーマから大きく外れてはいません。ただし、「元寇と鎖国政策」を直接結びつける記述は、鎌倉時代の影響としては不正確かつ飛躍が大きく、関連性の面でもやや不適切です。\n\n正確性：  \nここが最も問題のある点です。\n\n良い点：  \n- 源平合戦（1180–1185年）を背景として挙げている点は妥当。  \n- 源頼朝が1192年に征夷大将軍に任命されたという記述も一般的な理解としては正しい（近年は「実質的な幕府成立は1185年」とする見解もありますが、教科書レベルでは1192年説も多い）。  \n- 武士政権の成立、守護・地頭制による地方支配、武家政権が室町・江戸へ続くという流れも概ね正しい。\n\n問題点：  \n- 「鎌倉時代にはモンゴル帝国（元）の侵攻がありますが、これにより日本は鎖国政策へと傾きます。この経験は後の江戸時代における鎖国政策にも影響を与えました。」  \n  ここは歴史的因果関係としてかなり不正確です。  \n  - 鎌倉時代に「鎖国政策」そのものがとられたわけではありません。  \n  - 元寇の経験が直接的に江戸時代の鎖国政策に結びついたとするのは、教科書レベルでも一般的な説明ではなく、かなり飛躍があります。  \n- 「貨幣経済が発達し、新たな文化（禅宗など）も広まりました。」  \n  鎌倉時代に禅宗が広まったことや、宋銭流通などによる貨幣経済の進展は概ね正しいものの、説明が非常に大雑把で、鎌倉幕府成立の「影響」としてどこまで直接的に結びつけられるかの整理が甘いです。  \n- 成立の背景として、院政期の政治的混乱、荘園制の進展と武士の自立、以仁王の令旨など、重要な要素が抜けており、歴史的背景の説明としてはやや単純化されすぎています。\n\n総じて、致命的な誤り（元寇→鎖国）が含まれているため、正確性の評価は下がります。\n\n詳細度：  \n- 構成は「背景」「影響」「まとめ」と整理されており、見出しもあり読みやすいです。  \n- しかし、各項目の中身はかなり概略的で、背景についても「なぜ武士が台頭したのか」「なぜ朝廷の権威が低下したのか」といった因果関係の掘り下げが不足しています。  \n- 影響についても、守護・地頭制の具体的な役割や、御恩と奉公の関係、二重政権構造（朝廷と幕府）など、鎌倉幕府の特徴的な制度・構",
