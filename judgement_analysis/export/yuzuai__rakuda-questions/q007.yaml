      "model_answer": "日本の三大都市圏とその中心都市、構成都道府県は以下の通りです。\n\n1. **首都圏 (Greater Tokyo Area)**\n   - **中心都市:** 東京都\n   - **構成都道府県:** 東京都、神奈川県、埼玉県、千葉県\n   - **補足:** 首都圏は日本最大の都市圏であり、経済・文化の中心地です。周辺地域（茨城県、栃木県など）も広域通勤圏として含まれることがあります。\n\n2. **近畿圏 (Keihanshin Area)**\n   - **中心都市:** 大阪市（大阪府）\n   - **構成都道府県:** 大阪府、兵庫県、京都府\n   - **補足:** 近畿圏は歴史的にも重要な地域で、大阪・京都・神戸を中心とした経済・文化の拠点です。奈良県や和歌山県も広域通勤圏として関連しています。\n\n3. **中部圏 (Chubu Area)**\n   - **中心都市:** 名古屋市（愛知県）\n   - **構成都道府県:** 愛知県、三重県、岐阜県\n   - **補足:** 中部圏は製造業が盛んな地域で、名古屋を中心に工業地帯が発展しています。静岡県も広域通勤圏として関連しています。\n\nこれらの都市圏は、日本の人口と経済活動の大部分を占めており、それぞれ独自の特徴を持っています。",
