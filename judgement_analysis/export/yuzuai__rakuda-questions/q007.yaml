      "model_key": "gemini3-pro",
      "model_file": "gemini-3-pro-preview.json",
      "model_answer": "日本の三大都市圏（首都圏、近畿圏、中部圏）の各中心都市と、それらを構成する主要な都道府県は以下の通りです。\n\n※都市圏の定義には「法律上の定義（整備法）」や「実質的な経済・通勤圏（国勢調査など）」によって範囲が異なりますが、ここでは一般的かつ主要な構成自治体を挙げます。\n\n### 1. 首都圏（東京圏）\n日本最大の都市圏であり、政治・経済の中心です。\n\n*   **中心都市:** **東京都区部（東京23区）**\n    *   ※横浜市、さいたま市、千葉市なども副次的な核都市として機能しています。\n*   **主要な都道府県:**\n    *   **東京都**\n    *   **神奈川県**\n    *   **埼玉県**\n    *   **千葉県**\n    *   （※いわゆる「一都三県」が中核ですが、法律上の「首都圏」には茨城県、栃木県、群馬県、山梨県も含まれます）\n\n### 2. 近畿圏（大阪圏・関西圏）\n西日本の経済・文化の中心です。大阪・京都・神戸の三都市（京阪神）が強い結びつきを持っています。\n\n*   **中心都市:** **大阪市**\n    *   ※京都市、神戸市も極めて重要な中心都市です。\n*   **主要な都道府県:**\n    *   **大阪府**\n    *   **京都府**\n    *   **兵庫県**\n    *   **奈良県**\n    *   **滋賀県**\n    *   **和歌山県**\n    *   （※一般的に「二府四県」と呼ばれます。法律上の「近畿圏」には三重県、福井県、徳島県が含まれることもあります）\n\n### 3. 中部圏（名古屋圏・中京圏）\n日本の製造業（特に自動車産業）の中心地です。三大都市圏の文脈では、一般的に名古屋を中心とした「中京圏」を指します。\n\n*   **中心都市:** **名古屋市**\n*   **主要な都道府県:**\n    *   **愛知県**\n    *   **岐阜県**\n    *   **三重県**\n    *   （※「東海3県」と呼ばれる範囲が中核です。法律上の「中部圏」は非常に広く、静岡県、長野県、滋賀県、福井県、石川県、富山県まで含む場合がありますが、都市圏としては上記3県がメインです）",
